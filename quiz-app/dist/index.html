",text:"Giảm chi phí"},{key:"C",text:"Cải tiến nhỏ làm tăng giá trị cho khách hàng"},{key:"D",text:"Đột phá công nghệ"}]},{id:"q10-06",quiz:10,number:6,type:"single",prompt:"Đa nhiệm ảnh hưởng đến hiệu suất như thế nào?",options:[{key:"A",text:"Giúp nâng cao hiệu suất do tận dụng tối đa thời gian"},{key:"B",text:"Có xu hướng làm giảm hiệu suất do khó tập trung vào từng nhiệm vụ"},{key:"C",text:"Không ảnh hưởng đáng kể"},{key:"D",text:"Luôn giúp hoàn thành công việc nhanh hơn"}]},{id:"q10-07",quiz:10,number:7,type:"single",prompt:"Yếu tố nào kìm hãm sáng tạo?",options:[{key:"A",text:"Thử nghiệm"},{key:"B",text:"Đổi mới"},{key:"C",text:"Văn hóa sợ thất bại"},{key:"D",text:"Lưu lại ý tưởng"}]},{id:"q10-08",quiz:10,number:8,type:"single",prompt:"Just-in-time giúp:",options:[{key:"A",text:"Giảm tồn kho"},{key:"B",text:"Giảm sản xuất"},{key:"C",text:"Tăng chi phí bắt buộc"},{key:"D",text:"Tăng tồn kho"}]},{id:"q10-09",quiz:10,number:9,type:"single",prompt:"Lãnh đạo là gì?",options:[{key:"A",text:"Quá trình lập kế hoạch, thực hiện và kiểm soát"},{key:"B",text:"Khả năng gây ảnh hưởng để đạt mục tiêu"},{key:"C",text:"Ra lệnh cho người khác thực hiện công việc"},{key:"D",text:"Xây dựng quy trình và điều phối nguồn lực"}]},{id:"q10-10",quiz:10,number:10,type:"single",prompt:"Quản lý thời gian là:",options:[{key:"A",text:"Làm đúng việc và đúng cách"},{key:"B",text:"Làm liên tục"},{key:"C",text:"Làm nhiều việc"},{key:"D",text:"Làm nhanh"}]},{id:"q10-11",quiz:10,number:11,type:"single",prompt:"Ma trận Covey giúp:",options:[{key:"A",text:"Tăng sản xuất"},{key:"B",text:"Giảm nhân sự"},{key:"C",text:"Tăng doanh thu"},{key:"D",text:"Phân loại công việc theo mức độ quan trọng và khẩn cấp"}]},{id:"q10-12",quiz:10,number:12,type:"single",prompt:"Độ dự trữ tổ chức (organizational slack) là:",options:[{key:"A",text:"Lợi nhuận chưa phân phối"},{key:"B",text:"Chi phí phát sinh ngoài kế hoạch"},{key:"C",text:"Năng lực dư thừa mà tổ chức duy trì"},{key:"D",text:"Nguồn lực bị thiếu hụt"}]},{id:"q10-13",quiz:10,number:13,type:"single",prompt:"Nếu chỉ tập trung vào hiệu quả mà bỏ qua hiệu suất thì:",options:[{key:"A",text:"Tối ưu nguồn lực"},{key:"B",text:"Giảm chi phí"},{key:"C",text:"Tốn chi phí không cần thiết"},{key:"D",text:"Tăng lợi nhuận"}]},{id:"q10-14",quiz:10,number:14,type:"single",prompt:"Nhà lãnh đạo hiệu quả trong kỷ nguyên AI là người:",options:[{key:"A",text:"Tập trung phát triển con người và kỹ năng mềm"},{key:"B",text:"Am hiểu công nghệ để tối ưu hóa quy trình"},{key:"C",text:"Ưu tiên tự động hóa"},{key:"D",text:"Kết hợp năng lực công nghệ với khả năng lãnh đạo con người và tư duy hệ thống"}]},{id:"q10-15",quiz:10,number:15,type:"single",prompt:"Hiệu quả là:",options:[{key:"A",text:"Làm nhiều việc"},{key:"B",text:"Làm đúng việc"},{key:"C",text:"Làm nhanh"},{key:"D",text:"Làm đúng cách"}]},{id:"q11-01",quiz:11,number:1,type:"single",prompt:"Nếu doanh nghiệp nhập dữ liệu sai và không có cơ chế kiểm soát dữ liệu chặt chẽ, hậu quả nghiêm trọng nhất đối với quản trị là gì?",options:[{key:"A",text:"Thiệt hại tài chính"},{key:"B",text:"Ảnh hưởng nghiêm trọng đến uy tín thương hiệu"},{key:"C",text:"Hệ thống bị tấn công mạng"},{key:"D",text:"Báo cáo sai dẫn đến quyết định quản trị sai"}]},{id:"q11-02",quiz:11,number:2,type:"single",prompt:"Kiểm toán nội bộ vừa kiểm toán vừa thiết kế hệ thống kiểm soát sẽ dẫn đến:",options:[{key:"A",text:"Giảm chi phí vận hành hệ thống kiểm soát"},{key:"B",text:"Tăng hiệu quả kiểm soát do tập trung quyền lực"},{key:"C",text:"Mất tính độc lập của tuyến phòng thủ thứ ba (kiểm toán nội bộ)"},{key:"D",text:"Tăng khả năng phát hiện sai sót ngay từ đầu"}]},{id:"q11-03",quiz:11,number:3,type:"single",prompt:"Mô hình 3 tuyến giúp:",options:[{key:"A",text:"Tăng số cấp quản lý"},{key:"B",text:"Phân định rõ trách nhiệm quản lý rủi ro và kiểm soát"},{key:"C",text:"Tập trung toàn bộ quyền kiểm soát vào kiểm toán nội bộ"},{key:"D",text:"Giảm sự tham gia của bộ phận vận hành"}]},{id:"q11-04",quiz:11,number:4,type:"single",prompt:"KPI là gì?",options:[{key:"A",text:"Chỉ số đo lường hiệu suất cốt yếu"},{key:"B",text:"Chỉ số thanh khoản"},{key:"C",text:"Chỉ số tài chính"},{key:"D",text:"Chỉ số nợ"}]},{id:"q11-05",quiz:11,number:5,type:"single",prompt:"Rủi ro được hiểu là:",options:[{key:"A",text:"Những sự cố gây thiệt hại đã xảy ra trong quá khứ"},{key:"B",text:"Các chi phí phát sinh ngoài kế hoạch"},{key:"C",text:"Những yếu tố không chắc chắn có thể ảnh hưởng đến việc đạt mục tiêu"},{key:"D",text:"Những sai sót trong quá trình thực hiện công việc"}]},{id:"q11-06",quiz:11,number:6,type:"single",prompt:"Tuyến 1 không thực hiện tốt vai trò kiểm soát thì hệ quả là:",options:[{key:"A",text:"Tuyến phòng thủ thứ hai có thể thay thế hoàn toàn vai trò của tuyến một"},{key:"B",text:"Các rủi ro phát sinh không được nhận diện và xử lý kịp thời"},{key:"C",text:"Hệ thống kiểm soát nội bộ trở nên linh hoạt và giảm bớt thủ tục"},{key:"D",text:"Hiệu quả hoạt động được cải thiện do giảm bớt các bước kiểm soát"}]},{id:"q11-07",quiz:11,number:7,type:"single",prompt:"Chỉ số nào sau đây là KPI kết quả?",options:[{key:"A",text:"Số cuộc gọi chăm sóc khách hàng mỗi ngày"},{key:"B",text:"Số buổi đào tạo nhân viên đã tổ chức"},{key:"C",text:"Tỷ lệ chuyển đổi từ khách hàng tiềm năng sang đơn hàng"},{key:"D",text:"Tổng doanh thu đạt được trong quý"}]},{id:"q11-08",quiz:11,number:8,type:"single",prompt:"Trong mô hình 3 tuyến (Three Lines Model), điểm khác biệt quan trọng nhất của tuyến 3 (kiểm toán nội bộ) so với tuyến 1 (quản lý vận hành) và tuyến 2 (giám sát và kiểm soát) là gì?",options:[{key:"A",text:"Có quyền ban hành chính sách"},{key:"B",text:"Thực hiện kiểm soát hằng ngày"},{key:"C",text:"Chịu trách nhiệm quản trị rủi ro trực tiếp"},{key:"D",text:"Độc lập và báo cáo trực tiếp cho ban quản trị hoặc hội đồng quản trị"}]},{id:"q11-09",quiz:11,number:9,type:"single",prompt:"Vai trò chính của KPI tác nghiệp trong doanh nghiệp là gì?",options:[{key:"A",text:"Hỗ trợ theo dõi và điều chỉnh các hoạt động hằng ngày nhằm góp phần đạt mục tiêu chiến lược"},{key:"B",text:"Phản ánh trực tiếp kết quả tài chính cuối cùng của doanh nghiệp"},{key:"C",text:"Thay thế hoàn toàn các KPI chiến lược trong việc đo lường hiệu quả"},{key:"D",text:"Dùng để đánh giá hiệu suất của từng cá nhân riêng lẻ"}]},{id:"q11-10",quiz:11,number:10,type:"single",prompt:"KPI dẫn dắt có vai trò:",options:[{key:"A",text:"Chỉ dùng để báo cáo tài chính định kỳ"},{key:"B",text:"Đánh giá kết quả đã đạt được sau cùng"},{key:"C",text:"Dự báo và tác động đến khả năng đạt mục tiêu trong tương lai"},{key:"D",text:"Ghi nhận chi phí phát sinh trong quá trình vận hành"}]},{id:"q11-11",quiz:11,number:11,type:"multi",prompt:"Chỉ số nào sau đây là KPI dẫn dắt?",options:[{key:"A",text:"Số khách hàng mới/tháng"},{key:"B",text:"Tỷ lệ nghỉ việc 10%"},{key:"C",text:"Số cuộc gọi chăm sóc khách hàng mỗi ngày"},{key:"D",text:"Lợi nhuận quý đạt 1 tỷ"}]},{id:"q11-12",quiz:11,number:12,type:"multi",prompt:"Có những cách phân loại KPI nào?",options:[{key:"A",text:"Theo chiến lược"},{key:"B",text:"Theo cấp độ quản trị"},{key:"C",text:"Theo tính chất đo lường"},{key:"D",text:"Theo lĩnh vực"}]},{id:"q11-13",quiz:11,number:13,type:"single",prompt:"Doanh nghiệp chỉ dùng KPI kết quả mà không có KPI dẫn dắt sẽ:",options:[{key:"A",text:"Vẫn theo dõi được kết quả nhưng thiếu cơ sở để điều chỉnh kịp thời trong quá trình thực hiện"},{key:"B",text:"Tăng khả năng dự báo và kiểm soát hiệu suất trong suốt quá trình"},{key:"C",text:"Nâng cao tính chủ động trong việc đạt mục tiêu"},{key:"D",text:"Giảm sự phụ thuộc vào các chỉ số định lượng trong quản trị"}]},{id:"q11-14",quiz:11,number:14,type:"single",prompt:"Quy trình xác định rủi ro gồm:",options:[{key:"A",text:"Nhận diện rủi ro → Kiểm soát rủi ro"},{key:"B",text:"Nhận diện rủi ro → Đánh giá rủi ro"},{key:"C",text:"Nhận diện rủi ro → Xác định mức độ ảnh hưởng"},{key:"D",text:"Nhận diện rủi ro → Giảm thiểu rủi ro"}]},{id:"q11-15",quiz:11,number:15,type:"single",prompt:"Ma trận rủi ro trong quản trị dự án được sử dụng nhằm:",options:[{key:"A",text:"Phân bổ nguồn lực nhân sự cho từng hạng mục"},{key:"B",text:"Ghi nhận toàn bộ chi phí phát sinh trong dự án"},{key:"C",text:"Theo dõi tiến độ thực hiện các công việc chính"},{key:"D",text:"Xác định và phân loại rủi ro theo mức độ ảnh hưởng và khả năng xảy ra"}]}],Jd={"q06-01":{answer:["C"],hints:["Câu hỏi về vai trò cốt lõi của quản trị nhân sự trong Bài 6: QTNS phục vụ điều gì cho chiến lược của doanh nghiệp?","QTNS gắn kết con người với mục tiêu và chiến lược: chiến lược đúng mà thiếu con người thích hợp thì vẫn thất bại.","Tăng doanh thu hay tăng sản lượng là mục tiêu của bán hàng/sản xuất; giảm chi phí marketing không phải trọng tâm của bộ phận nhân sự."],explanation:"Vai trò đầu tiên của QTNS là đảm bảo doanh nghiệp có đủ nhân lực phù hợp để thực hiện mục tiêu và chiến lược.",notes:["Là mục tiêu của bán hàng/kinh doanh, không phải mục tiêu chính của QTNS.","Là mục tiêu của sản xuất/vận hành.","Đúng bản chất: đúng người, đúng việc, đúng thời điểm để thực hiện chiến lược.","Chi phí marketing không phải mục tiêu của QTNS."],knowledgeIds:["b06-vai-tro"],tags:["Vai trò QTNS","qtns"]},"q06-02":{answer:["C"],hints:["Năng suất lao động liên quan đến kết quả tạo ra trên mỗi đơn vị nguồn lực — hãy nghĩ tới tác động lên kết quả kinh doanh.","Bài 6: nhân sự hiệu quả giúp giảm chi phí nhưng vẫn tăng kết quả, góp phần vào hiệu quả hoạt động và năng lực cạnh tranh.","Hai phương án nói về giảm chất lượng/giảm hiệu quả và một phương án nói về tăng chi phí đều là hệ quả tiêu cực — ngược với mục đích nâng năng suất."],explanation:"Nâng năng suất → làm ra nhiều kết quả hơn với cùng nguồn lực → hiệu quả hoạt động tăng → lợi nhuận tăng.",notes:["Nâng năng suất không nhằm giảm chất lượng.","Năng suất cao giúp giảm chi phí trên mỗi đơn vị sản phẩm, không làm tăng chi phí.","Đúng: năng suất cao → hiệu quả → tăng lợi nhuận.","Ngược lại: năng suất cao làm tăng hiệu quả kinh doanh."],knowledgeIds:["b06-nang-suat","b06-vai-tro"],tags:["Năng suất","năng suất lao động"]},"q06-03":{answer:["C"],hints:["Hãy nhớ bước 3 trong quy trình tuyển dụng 6 bước — tên bước là gì và nó diễn ra trước hay sau phỏng vấn?","Mục tiêu bước này là chọn ra ứng viên tiềm năng nhất để chuyển sang vòng phỏng vấn dựa trên tiêu chí ở bước 1.","Sàng lọc là thu hẹp, không phải mở rộng; và nó không nhằm tăng chi phí hay giảm giờ làm."],explanation:"Sàng lọc hồ sơ theo tiêu chí đã đặt ra, hồ sơ không đáp ứng yêu cầu cơ bản bị loại để tiết kiệm thời gian, chi phí.",notes:["Sàng lọc làm giảm chứ không tăng số lượng ứng viên.","Mục đích là tiết kiệm chứ không phải tăng chi phí.","Đúng: loại hồ sơ/ứng viên không đáp ứng yêu cầu.","Không liên quan tới giờ làm việc."],knowledgeIds:["b06-sang-loc","b06-tuyen-dung-6-buoc"],tags:["Tuyển dụng","sàng lọc hồ sơ"]},"q06-04":{answer:["B"],hints:["Phân biệt hai nguồn động lực: một nguồn xuất phát từ chính cá nhân, một nguồn đến từ phía tổ chức và người quản lý.","Động lực bên ngoài gồm lương thưởng, phúc lợi, phong cách lãnh đạo và điều kiện mà tổ chức tạo ra cho nhân viên.","Suy nghĩ cá nhân, mục tiêu cá nhân và tư duy đều là yếu tố nội tại của mỗi người nên thuộc về động lực bên trong."],explanation:"Động lực bên ngoài đến từ tổ chức và người quản lý, trong đó có môi trường làm việc; còn suy nghĩ, mục tiêu, tư duy là động lực bên trong.",notes:["Suy nghĩ cá nhân thuộc động lực bên trong.","Đúng: môi trường làm việc do tổ chức tạo ra.","Mục tiêu cá nhân là động lực bên trong.","Tư duy là yếu tố bên trong mỗi người."],knowledgeIds:["b06-dong-luc"],tags:["Động lực","động lực bên ngoài"]},"q06-05":{answer:["D"],hints:["Herzberg chia hai nhóm: nhóm gắn với cảm giác thỏa mãn và nhóm khi làm không tốt sẽ gây ra cảm giác ngược lại.","Nhân tố duy trì (bên ngoài): chính sách, lương, điều kiện làm việc, quan hệ với cấp trên – đáp ứng chỉ giúp “không bất mãn”.","Sự thỏa mãn, cơ hội phát triển và ý nghĩa công việc đều thuộc nhóm nhân tố động viên (bên trong)."],explanation:"Nhân tố duy trì nếu không tốt sẽ gây bất mãn; khi tốt chỉ giúp nhân viên không bất mãn chứ chưa chắc tạo động lực mạnh.",notes:["Sự thỏa mãn gắn với nhân tố động viên.","Cơ hội phát triển là nhân tố động viên.","Ý nghĩa công việc là nhân tố động viên.","Đúng: nhân tố duy trì liên quan đến sự bất mãn."],knowledgeIds:["b06-herzberg"],tags:["Động lực","herzberg"]},"q06-06":{answer:["D"],hints:["Phỏng vấn là bước 4 – đánh giá toàn diện chứ không chỉ chuyên môn.","Ngoài kiến thức – kinh nghiệm, nhà tuyển dụng còn tìm hiểu thái độ, động cơ, cam kết và sự phù hợp lâu dài với văn hóa DN.","Doanh thu, KPI dự kiến và mức độ hiểu biết về doanh nghiệp không phải nội dung đánh giá chính; chỉ trình độ chuyên môn thì chưa đủ toàn diện."],explanation:"Phỏng vấn đánh giá toàn diện: không chỉ năng lực mà còn thái độ và mức độ phù hợp với công việc/văn hóa tổ chức.",notes:["Chuyên môn – kinh nghiệm chỉ là một phần, chưa bao quát thái độ, động cơ, phù hợp.","Chưa vào làm nên không đánh giá KPI/doanh thu dự kiến.","Hiểu biết về doanh nghiệp không phải mục tiêu chính của phỏng vấn.","Đúng: kỹ năng, thái độ và sự phù hợp công việc."],knowledgeIds:["b06-phong-van"],tags:["Tuyển dụng","phỏng vấn"]},"q06-07":{answer:["B"],hints:["Đối chiếu hai nhóm của Herzberg: nhóm động viên liên quan tới điều gì, nhóm duy trì liên quan tới điều gì?","Nhân tố động viên (bên trong): được công nhận, trách nhiệm, thành tích, thăng tiến → hứng thú, chủ động hơn.","Chi phí và kỷ luật không phải khái niệm trong thuyết này; và “bất mãn” là phía của nhóm còn lại."],explanation:"Nhân tố động viên tạo ra sự thỏa mãn và hài lòng thực sự trong công việc; nhân tố duy trì mới liên quan đến sự bất mãn.",notes:["Chi phí không phải nhân tố trong thuyết hai nhân tố.","Đúng: nhân tố động viên → sự thỏa mãn.","Kỷ luật không phải trọng tâm của nhân tố động viên.","Sự bất mãn liên quan đến nhân tố duy trì."],knowledgeIds:["b06-herzberg"],tags:["Động lực","herzberg"]},"q06-08":{answer:["B"],confidence:"verify",hints:["Nguyên nhân gốc là “thiếu cơ hội phát triển” – hãy tìm giải pháp đánh thẳng vào nguyên nhân đó.","Trong nhóm nhân tố động viên có “sự tiến bộ trong nghề nghiệp – cơ hội học hỏi, thăng tiến giúp nhân viên nhìn thấy tương lai lâu dài”; biện pháp giữ chân cũng nhắc “mở ra con đường phát triển rõ ràng”.","Đãi ngộ – phúc lợi và môi trường – văn hóa là nhân tố duy trì, không giải quyết đúng nguyên nhân “thiếu phát triển”."],explanation:"Giải pháp trúng nguyên nhân là cho nhân viên thấy tương lai nghề nghiệp bằng lộ trình phát triển rõ ràng; các lựa chọn còn lại giải quyết vấn đề khác (đãi ngộ, kỹ năng, môi trường).",notes:["Đãi ngộ/phúc lợi là nhân tố duy trì, không giải quyết thiếu cơ hội phát triển.","Đúng: lộ trình nghề nghiệp rõ ràng đáp ứng trực tiếp nhu cầu tiến bộ.","Đào tạo kỹ năng hữu ích nhưng chưa tạo con đường thăng tiến rõ ràng.","Môi trường/văn hóa là nhân tố duy trì, không đánh vào nguyên nhân gốc."],knowledgeIds:["b06-giu-chan","b06-herzberg"],tags:["Giữ chân","lộ trình phát triển"]},"q06-09":{answer:["D"],confidence:"verify",hints:["Câu hỏi hỏi hậu quả “chủ yếu” – tìm hậu quả cuối cùng, ảnh hưởng trực tiếp tới kết quả công việc, thay vì hệ quả trung gian.","Thiếu động lực → nhân viên không làm việc tích cực, chủ động → kết quả công việc đi xuống.","Nghỉ việc, giảm gắn kết, giảm hài lòng đều là biểu hiện/hệ quả trung gian của việc thiếu động lực."],explanation:"Thiếu động lực thì nhân viên thiếu hứng thú, chủ động nên hiệu quả và năng suất làm việc giảm – hậu quả chủ yếu; các phương án còn lại là biểu hiện trung gian (nghỉ việc, giảm gắn kết, giảm hài lòng).",notes:["Có thể xảy ra nhưng là hệ quả gián tiếp, không phải hậu quả chủ yếu.","Là biểu hiện trung gian của thiếu động lực.","Là biểu hiện tâm lý, chưa phải kết quả trực tiếp lên công việc.","Đúng: tác động trực tiếp nhất tới kết quả công việc."],knowledgeIds:["b06-dong-luc","b06-herzberg"],tags:["Động lực","tạo động lực"]},"q06-10":{answer:["A"],confidence:"verify",hints:["Hai ràng buộc: tăng năng suất NHANH và chi phí HẠN CHẾ. Hãy nhớ phần “biện pháp tăng năng suất lao động” trong bài giảng.","Bài giảng nói để tăng năng suất cần tận dụng hiệu quả công nghệ: email, đặt hàng online, khai thuế điện tử, thiết bị thông minh, phần mềm ghi chú, họp online.","Đào tạo nâng cao và giám sát thêm thường tốn thời gian hoặc chi phí/áp lực; giám sát quá chặt còn là nhân tố duy trì gây bất mãn."],explanation:"Theo bài giảng, công cụ/công nghệ hỗ trợ (email, phần mềm, thiết bị thông minh, làm việc từ xa) tiết kiệm thời gian, giảm sai sót với chi phí thấp. Tái phân bổ công việc/tối ưu quy trình không được nêu thành biện pháp trong bài.",notes:["Đúng theo bài giảng: ứng dụng công nghệ/công cụ để tăng năng suất nhanh, chi phí thấp.","Đào tạo nâng cao kỹ năng mất thời gian và tốn chi phí hơn, không “nhanh”.","Không được nêu thành biện pháp tăng năng suất trong bài giảng.","Giám sát chặt gây áp lực, thuộc nhân tố duy trì có thể gây bất mãn."],knowledgeIds:["b06-nang-suat"],tags:["Năng suất","công nghệ"]},"q06-11":{answer:["A"],hints:["Ba dữ kiện: đào tạo NHANH, nội dung là quy trình bán hàng + văn hóa DN, ngân sách HẠN CHẾ. Hình thức nào sát nội dung và rẻ nhất?","Hình thức do chính doanh nghiệp tổ chức thường chi phí thấp, linh hoạt, sát công việc thực tế và hợp nhân viên mới.","Khóa dài hạn, khóa quốc tế hay chuyên gia ngoài đều chuyên sâu nhưng chi phí cao và ít linh hoạt."],explanation:"Quy trình bán hàng và văn hóa DN là nội dung của đào tạo nội bộ: chi phí thấp, linh hoạt, sát thực tế, phù hợp nhân viên mới.",notes:["Đúng: đào tạo nội bộ phù hợp nhân viên mới, nội dung quy trình/văn hóa, ngân sách thấp.","Khóa chuyên sâu dài hạn tốn kém và dành cho nhân sự chủ chốt.","Khóa quốc tế/xu hướng thị trường không phải nhu cầu đào tạo quy trình bán hàng và văn hóa.","Chuyên gia bên ngoài chi phí cao, ít linh hoạt."],knowledgeIds:["b06-dao-tao"],tags:["Đào tạo","đào tạo nội bộ"]},"q06-12":{answer:["B"],hints:["Chữ KHÔNG: tìm hoạt động gắn trực tiếp với lợi thế cạnh tranh nên cần giữ lại nội bộ.","Thuê ngoài phù hợp với việc chuyên môn cao nhưng không phải chức năng chính (kế toán, pháp lý, marketing…).","Ba trong bốn phương án là hoạt động hỗ trợ thường được thuê ngoài; chỉ một hoạt động cần đội nội bộ hiểu sản phẩm và khách hàng."],explanation:"Bán hàng cần đội ngũ nội bộ để hiểu rõ sản phẩm và khách hàng, gắn với lợi thế cạnh tranh nên không nên thuê ngoài. Kế toán, marketing, pháp lý có thể thuê ngoài.",notes:["Kế toán, ghi sổ thường được thuê ngoài.","Đúng: bán hàng gắn lợi thế cạnh tranh, cần đội nội bộ.","Marketing thường được thuê ngoài để giảm chi phí cố định.","Dịch vụ pháp lý nằm trong nhóm nên thuê ngoài."],knowledgeIds:["b06-nen-khong-nen-thue-ngoai"],tags:["Thuê ngoài","không nên thuê ngoài"]},"q06-13":{answer:["C"],hints:["Nhớ định nghĩa: doanh nghiệp giao cho đơn vị nào thực hiện những việc trước đây chính mình làm?","Từ khóa trong bài: “đơn vị bên ngoài”, “trong nước hoặc nước ngoài”, “trước đây do chính doanh nghiệp đảm nhiệm”.","Nhân sự nội bộ và hợp tác giữa các phòng ban đều là ‘bên trong’ doanh nghiệp, loại ngay."],explanation:"Thuê ngoài là sử dụng các đơn vị bên ngoài (dịch vụ từ bên thứ ba) để thực hiện công việc trước đây do chính DN đảm nhiệm.",notes:["Dùng nhân sự nội bộ thì không phải thuê ngoài.","Hợp tác giữa các phòng ban là nội bộ.","Đúng: dịch vụ từ bên thứ ba bên ngoài doanh nghiệp.","Định nghĩa nhấn vào đơn vị/tổ chức bên ngoài, không phải cá nhân ngắn hạn."],knowledgeIds:["b06-thue-ngoai"],tags:["Thuê ngoài","outsourcing"]},"q06-14":{answer:["A"],hints:["Hai biểu hiện: quy định đổi liên tục không thông báo rõ + giám sát quá chặt. Chúng thuộc nhóm nào của Herzberg?","Chế độ chính sách – quy chế không rõ ràng và sự giám sát không phù hợp là hai ví dụ điển hình của nhóm nhân tố bên ngoài.","Không có dữ kiện nào nói về thiếu đào tạo hay lợi ích cá nhân; vấn đề nằm ở chính sách và cách giám sát."],explanation:"Chính sách/quy chế không rõ ràng và giám sát không phù hợp là nhân tố duy trì; làm không tốt sẽ gây bất mãn mạnh mẽ.",notes:["Đúng: nhân tố duy trì làm không tốt → bất mãn.","Các nhân tố động viên (ghi nhận, thăng tiến…) không phải vấn đề được mô tả.","Tình huống không nói gì về đào tạo chuyên môn.","Quá rộng; điểm mấu chốt là nhân tố duy trì gây bất mãn."],knowledgeIds:["b06-herzberg"],tags:["Động lực","nhân tố duy trì"]},"q06-15":{answer:["B"],hints:["Động lực bên trong xuất phát từ chính bản thân mỗi người, không do tổ chức cung cấp.","Bài giảng nêu: cách nghĩ theo hướng tích cực, thái độ sống và việc có mục đích rõ ràng trong cuộc sống, công việc.","Lương, điều kiện làm việc và chính sách công ty đều do tổ chức quyết định — đó là động lực bên ngoài."],explanation:"Động lực bên trong đến từ suy nghĩ tích cực, thái độ sống, mục đích sống của mỗi người; lương, điều kiện, chính sách là động lực bên ngoài.",notes:["Lương do tổ chức chi trả → động lực bên ngoài.","Đúng: suy nghĩ tích cực là yếu tố nội tại.","Điều kiện làm việc do tổ chức cung cấp.","Chính sách công ty là yếu tố bên ngoài."],knowledgeIds:["b06-dong-luc"],tags:["Động lực","động lực bên trong"]}},Zd={"q07-01":{answer:["B"],calc:"vcsh",hints:["Nhớ đẳng thức nền của báo cáo tình hình tài chính: tài sản = nguồn vốn, và nguồn vốn gồm hai phần.","Nguồn vốn = nợ phải trả + vốn chủ sở hữu. Từ đó tách ra phần của chủ sở hữu.","Phép cộng ở phương án đầu và phép trừ ngược thứ tự ở phương án cuối đều cho kết quả vô lý; doanh thu – chi phí là lợi nhuận, không phải vốn."],explanation:"VCSH là phần còn lại của tổng tài sản sau khi trừ toàn bộ nợ phải trả.",notes:["Cộng nợ vào tài sản là sai logic cân đối.","Đúng: VCSH = Tổng tài sản − Tổng nợ phải trả.","Doanh thu − chi phí là lợi nhuận.","Đảo ngược phép trừ sẽ ra giá trị âm."],knowledgeIds:["b07-no-vcsh","b07-bcthtc"],tags:["Báo cáo tình hình tài chính","vcsh"]},"q07-02":{answer:["B"],hints:["Đi từ trên xuống báo cáo kết quả kinh doanh: LN gộp → LN thuần từ HĐKD → thêm phần ‘ngoài hoạt động chính’ → LN trước thuế.","LN kế toán trước thuế bao gồm kết quả hoạt động khác (thu nhập khác − chi phí khác).","Cộng thuế TNDN vào là bước ngược chiều (từ sau thuế về trước thuế), và lợi nhuận gộp chưa trừ các chi phí bán hàng, QLDN."],explanation:"LN trước thuế = LN thuần từ hoạt động kinh doanh + kết quả từ hoạt động khác (thu nhập khác − chi phí khác).",notes:["Chung chung và sai: không đúng cấu trúc báo cáo.","Đúng: LN thuần HĐKD + kết quả hoạt động khác.","LN gộp chưa trừ chi phí bán hàng và QLDN.","Thiếu nhiều khoản (chi phí bán hàng, QLDN, thu nhập/chi phí khác)."],knowledgeIds:["b07-loi-nhuan"],tags:["Lợi nhuận","lợi nhuận trước thuế"]},"q07-03":{answer:["A","B","C","D"],calc:"dtthuan",hints:["Doanh thu ghi nhận ban đầu chưa phải số DN thực sự được hưởng; hãy nhớ danh sách các khoản trừ ra.","Có 4 nhóm: chiết khấu cho khách mua nhiều, giảm giá vì hàng kém chất lượng, hàng khách trả lại, và một số loại thuế không được hoàn lại.","Câu này nhiều đáp án: đừng loại phương án nào chỉ vì nó là ‘thuế’ – thuế tiêu thụ đặc biệt, xuất khẩu nằm trong danh sách."],explanation:"Các khoản giảm trừ doanh thu gồm chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại và các loại thuế không được hoàn lại (TTĐB, xuất khẩu).",notes:["Đúng: hàng bán bị trả lại.","Đúng: chiết khấu thương mại cho khách mua số lượng lớn.","Đúng: giảm giá hàng bán (hàng kém chất lượng).","Đúng: thuế TTĐB, thuế xuất khẩu không được hoàn lại."],knowledgeIds:["b07-doanh-thu"],tags:["Doanh thu","giảm trừ doanh thu"]},"q07-04":{answer:["D"],hints:["Ghép công thức lợi nhuận = doanh thu − chi phí với hai tốc độ tăng khác nhau.","Ví dụ trong bài: doanh thu tăng nhưng lợi nhuận đi xuống khi không kiểm soát chi phí bán hàng, quản lý.","Chi phí tăng nhanh hơn doanh thu thì phần chênh lệch thu hẹp: không thể là ‘tăng’ hay ‘không đổi’; và ‘tài sản’ không phải lợi nhuận."],explanation:"Lợi nhuận = doanh thu − chi phí. Chi phí tăng nhanh hơn doanh thu thì chênh lệch (lợi nhuận) giảm.",notes:["Chi phí tăng nhanh hơn thì lợi nhuận không thể tăng.","Tài sản không phải chỉ tiêu được hỏi.","Hai đại lượng tăng với tốc độ khác nhau nên lợi nhuận phải thay đổi.","Đúng: lợi nhuận giảm."],knowledgeIds:["b07-loi-nhuan","b07-vai-tro-ke-toan"],tags:["Lợi nhuận","lãi lỗ"]},"q07-05":{answer:["D"],hints:["Thuế TNDN đánh vào thu nhập chịu thuế của DN – tức phần lợi nhuận còn lại sau khi trừ chi phí hợp lý.","Công thức trong bài: thuế phải nộp = lợi nhuận kế toán ... × thuế suất. Chỗ trống là mốc lợi nhuận TRƯỚC khi nộp thuế.","Lợi nhuận sau thuế là kết quả SAU khi đã nộp thuế nên không thể dùng làm cơ sở tính thuế; gộp và thuần là các mốc trung gian."],explanation:"Thuế TNDN phải nộp = lợi nhuận kế toán trước thuế × thuế suất; ví dụ 500 triệu × 20% = 100 triệu.",notes:["LN gộp chưa trừ chi phí bán hàng, QLDN.","LN thuần là mốc trung gian, chưa gồm kết quả hoạt động khác.","LN sau thuế đã trừ thuế rồi.","Đúng: lợi nhuận kế toán trước thuế."],knowledgeIds:["b07-thue-tndn"],tags:["Thuế TNDN","thuế suất"]},"q07-06":{answer:["A","B","C","D"],confidence:"verify",hints:["Hệ thống kế toán là nguồn thông tin đầu vào cho quản trị; thiếu nó thì ảnh hưởng ở nhiều mặt.","Bài giảng nêu các vai trò: kiểm soát dòng tiền – chi phí, tuân thủ pháp luật thuế, minh bạch – tạo niềm tin, hỗ trợ ra quyết định.","Hãy thử đảo ngược từng vai trò: nếu mất đi vai trò đó thì hậu quả có đúng phương án không? Cả bốn đều khớp."],explanation:"Kế toán không hoàn thiện làm mất khả năng kiểm soát tài chính, khó tuân thủ pháp luật thuế, thiếu minh bạch – tin cậy và khó ra quyết định quản trị.",notes:["Đúng: giảm khả năng kiểm soát, theo dõi tài chính.","Đúng: khó tuân thủ quy định thuế, dễ bị xử phạt/truy thu.","Đúng: thiếu minh bạch, mất niềm tin với ngân hàng/đối tác.","Đúng: thiếu thông tin đầu vào cho quyết định quản lý – kinh doanh."],knowledgeIds:["b07-vai-tro-ke-toan"],tags:["Vai trò kế toán","hệ thống kế toán"]},"q07-07":{answer:["B","C","D"],confidence:"verify",hints:["Hãy phân biệt: kế toán ghi nhận – cung cấp thông tin để quản lý, còn việc điều hành sản xuất thuộc bộ phận khác.","Vai trò đã học: cung cấp thông tin ra quyết định, ghi nhận phản ánh giao dịch, kiểm soát chi phí, hỗ trợ lập kế hoạch tài chính.","Một phương án gán cho kế toán quyền ‘quản lý trực tiếp’ hoạt động của bộ phận khác – kế toán chỉ cung cấp thông tin, không điều hành."],explanation:"Kế toán cung cấp thông tin tài chính, ghi nhận giao dịch và hỗ trợ kiểm soát chi phí; nó không trực tiếp quản lý hoạt động sản xuất.",notes:["Sai: kế toán không điều hành sản xuất.","Đúng: cung cấp thông tin tài chính phục vụ ra quyết định.","Đúng: kiểm soát, quản lý chi phí.","Đúng: ghi nhận, phản ánh các giao dịch tài chính phát sinh."],knowledgeIds:["b07-vai-tro-ke-toan"],tags:["Vai trò kế toán","hệ thống kế toán"]},"q07-08":{answer:["A"],confidence:"verify",hints:["Từ khóa ‘ngắn hạn’: tập trung vào tiền – thanh toán – chi trả tới hạn, không phải chiến lược dài hơi.","Bài 7: kế toán giúp kiểm soát dòng tiền, tránh thiếu hụt tiền mặt, theo dõi các khoản chi thường xuyên.","Đầu tư mở rộng và tái cấu trúc nợ là các quyết định tốn thời gian/dài hạn, khó cải thiện nhanh tình hình tiền mặt."],explanation:"Muốn cải thiện tài chính ngắn hạn thì kiểm soát dòng tiền, tối ưu các khoản thu – chi để tránh thiếu tiền mặt.",notes:["Đúng: kiểm soát dòng tiền, tối ưu thu chi cải thiện nhanh thanh khoản.","Tái cấu trúc nợ là giải pháp dài hơi, không trực tiếp cải thiện tiền ngắn hạn.","Mở rộng đầu tư thường làm tăng chi, tăng áp lực tiền mặt.","Kiểm soát chi phí có ích nhưng chưa bao quát dòng tiền thu – chi."],knowledgeIds:["b07-luu-chuyen-tien-te","b07-vai-tro-ke-toan"],tags:["Dòng tiền","lãi nhưng thiếu tiền"]},"q07-09":{answer:["B"],hints:["Chi phí bán hàng = chi phí để đưa sản phẩm đến tay khách hàng.","Ví dụ trong bài: quảng cáo Facebook, hoa hồng đại lý, quay clip giới thiệu, hội nghị khách hàng.","Lương bộ phận quản lý là chi phí QLDN; bồi thường là chi phí khác; góp vốn liên doanh thuộc nhóm tài chính."],explanation:"Chi phí bán hàng gồm quảng cáo, xúc tiến, hoa hồng đại lý…; lương bộ phận quản lý thuộc chi phí quản lý doanh nghiệp.",notes:["Bồi thường thuộc chi phí khác.","Đúng: quảng cáo và xúc tiến bán hàng.","Góp vốn liên doanh thuộc chi phí tài chính.","Lương bộ phận quản lý là chi phí quản lý doanh nghiệp."],knowledgeIds:["b07-chi-phi"],tags:["Chi phí","chi phí bán hàng"]},"q07-10":{answer:["B"],hints:["Hãy nhớ định nghĩa mở đầu phần báo cáo kết quả hoạt động kinh doanh.","Doanh thu phản ánh giá trị tiền thu được hoặc sẽ thu được từ bán hàng, sản phẩm, dịch vụ trong kỳ (= số lượng × giá bán).","Tổng chi phí là chi phí, phần chênh lệch doanh thu – chi phí là lợi nhuận, tổng nguồn vốn thuộc báo cáo tình hình tài chính."],explanation:"Doanh thu là toàn bộ giá trị tiền thu được hoặc sẽ thu được từ việc bán hàng hóa, cung cấp dịch vụ trong kỳ.",notes:["Đó là chi phí.","Đúng: giá trị tiền thu từ bán hàng và cung cấp dịch vụ.","Chênh lệch doanh thu – chi phí là lợi nhuận.","Tổng nguồn vốn thuộc báo cáo tình hình tài chính."],knowledgeIds:["b07-doanh-thu"],tags:["Doanh thu","định nghĩa doanh thu"]},"q07-11":{answer:["C"],calc:"dtthuan",hints:["Doanh thu thuần là số tiền DN thực sự được hưởng sau khi điều chỉnh các khoản.","Công thức trong bài: doanh thu bán hàng và cung cấp dịch vụ trừ đi ... (các khoản giảm trừ).","Nhân với giá bán hay chia cho chi phí hay cộng chi phí đều không phản ánh việc ‘thực hưởng’."],explanation:"Doanh thu thuần = Doanh thu − Các khoản giảm trừ doanh thu (ví dụ 200tr − 10 − 5 − 15 = 170tr).",notes:["Doanh thu đã bằng số lượng × giá, nhân thêm giá bán là sai.","Chia cho chi phí là một tỷ số, không phải doanh thu thuần.","Đúng: Doanh thu − các khoản giảm trừ.","Cộng chi phí không có ý nghĩa."],knowledgeIds:["b07-doanh-thu"],tags:["Doanh thu","doanh thu thuần"]},"q07-12":{answer:["A"],calc:"lngop",hints:["Lợi nhuận gộp là mốc đầu tiên: cho biết bán ra có đủ bù đắp chi phí sản xuất hay không.","Chỉ trừ một loại chi phí gắn trực tiếp với sản phẩm đã bán: giá vốn hàng bán.","Chi phí bán hàng và chi phí QLDN chỉ được trừ ở bước tính lợi nhuận thuần; tài chính là một nhóm khác."],explanation:"Lợi nhuận gộp = Doanh thu thuần − Giá vốn hàng bán.",notes:["Đúng: doanh thu thuần trừ giá vốn.","Đó là kết quả hoạt động tài chính, không phải lợi nhuận gộp.","Chi phí QLDN được trừ ở bước sau (LN thuần HĐKD).","Chi phí bán hàng được trừ ở bước sau."],knowledgeIds:["b07-loi-nhuan"],tags:["Lợi nhuận","lợi nhuận gộp"]},"q07-13":{answer:["D"],hints:["Báo cáo tình hình tài chính là ‘ảnh chụp’ tại một thời điểm, không phải dòng chảy trong kỳ.","Hai phần lớn của báo cáo: một bên cho biết DN đang có gì, bên kia cho biết hình thành từ đâu.","Doanh thu, chi phí, lợi nhuận thuộc báo cáo kết quả hoạt động kinh doanh."],explanation:"Báo cáo tình hình tài chính phản ánh tài sản và nguồn vốn của DN tại một thời điểm nhất định.",notes:["Thuộc báo cáo kết quả hoạt động kinh doanh.","Lợi nhuận thuộc báo cáo kết quả kinh doanh.","Doanh thu, chi phí thuộc báo cáo kết quả kinh doanh.","Đúng: tài sản và nguồn vốn."],knowledgeIds:["b07-bcthtc"],tags:["Báo cáo tình hình tài chính","tài sản và nguồn vốn"]},"q07-14":{answer:["C"],hints:["Hãy nghĩ tới 4 báo cáo B01, B02, B03, B09 – chúng cùng nói về điều gì tổng thể?","Hệ thống BCTC cho cái nhìn tổng thể về tình hình tài chính, kết quả kinh doanh và dòng tiền.","Nhân sự, marketing, điều hành sản xuất là việc của các bộ phận khác, không phải mục đích của BCTC."],explanation:"BCTC dùng để phản ánh tình hình tài chính và kết quả hoạt động của doanh nghiệp, phục vụ ra quyết định.",notes:["Quản lý nhân sự không phải mục đích của BCTC.","Marketing – bán hàng không dùng BCTC làm mục đích chính.","Đúng: phản ánh tình hình tài chính, kết quả hoạt động.","Điều hành sản xuất do bộ phận vận hành thực hiện."],knowledgeIds:["b07-4-bctc"],tags:["Báo cáo tài chính","bctc"]},"q07-15":{answer:["A","D"],hints:["Câu nói then chốt của cô: học kế toán không phải để làm kế toán mà để quản trị tốt hơn.","Nhà quản trị cần ‘nhìn vào những yếu tố cốt lõi’ – doanh thu, chi phí, lợi nhuận, dòng tiền – để hiểu DN hoạt động hiệu quả hay không.","Thiết kế phần mềm kế toán và tự thực hiện toàn bộ kiểm toán thuế là việc của chuyên gia – cô nói rõ không ai kỳ vọng nhà quản trị làm điều đó."],explanation:"Nhà quản trị học kế toán để hiểu tình hình hoạt động – tài chính và đọc, diễn giải được các thông tin cốt lõi, không phải để trở thành kế toán viên hay chuyên gia thuế.",notes:["Đúng: hiểu tình hình hoạt động và tài chính.","Thiết kế phần mềm không phải việc của nhà quản trị.","Không ai kỳ vọng nhà quản trị tự thực hiện kiểm toán thuế.","Đúng: diễn giải thông tin cốt lõi từ hệ thống kế toán."],knowledgeIds:["b07-vai-tro-ke-toan"],tags:["Vai trò kế toán","ngôn ngữ kinh doanh"]}},np={"q08-01":{answer:["D"],hints:["Biên lợi nhuận là chỉ số sinh lời: ‘cứ 100 đồng doanh thu thuần thì tạo ra bao nhiêu đồng lợi nhuận’.","Có 3 loại biên (gộp – hoạt động – ròng); biên ròng còn gọi là biên lợi nhuận sau thuế, tính trên doanh thu thuần.","Tỷ lệ tài sản/nguồn vốn, chi phí/doanh thu, doanh thu/tổng tài sản không phải biên lợi nhuận; hai phương án đầu tử số không phải lợi nhuận."],explanation:"Biên lợi nhuận ròng = Lợi nhuận sau thuế / Doanh thu thuần × 100 (ví dụ 70tr / 1,2 tỷ ≈ 5,8%).",notes:["Đó không phải chỉ số sinh lời.","Tử số là chi phí, không phải lợi nhuận.","Doanh thu/tổng tài sản là vòng quay tài sản (hiệu suất).","Đúng: LN sau thuế chia cho doanh thu."],knowledgeIds:["b08-sinh-loi"],tags:["Chỉ số sinh lời","biên lợi nhuận ròng"]},"q08-02":{answer:["D"],hints:["Phân loại chi phí theo mối quan hệ với sản lượng: cố định – biến đổi – hỗn hợp.","Chi phí biến đổi thay đổi tỷ lệ thuận với mức độ hoạt động: sản lượng tăng thì chi phí tăng, giảm thì giảm.","Phương án nói ‘không thay đổi’ hoặc ‘phân bổ cố định’ mô tả định phí; phương án ‘không liên quan trực tiếp SXKD’ là khái niệm khác."],explanation:"Chi phí biến đổi (biến phí) thay đổi theo mức độ hoạt động hay sản lượng, ví dụ nguyên vật liệu trực tiếp, hoa hồng bán hàng.",notes:["Mô tả chi phí cố định.","Không liên quan tới sản lượng; không phải định nghĩa biến phí.","Phân bổ cố định mỗi kỳ là đặc điểm của định phí.","Đúng: thay đổi theo mức độ hoạt động/sản lượng."],knowledgeIds:["b08-dinh-phi-bien-phi"],tags:["Phân loại chi phí","biến phí"]},"q08-03":{answer:["A"],calc:"tyleno",hints:["Tỷ lệ nợ thuộc nhóm chỉ số đòn bẩy tài chính.","Công thức: tổng nợ chia tổng tài sản – cho biết trong một đồng tài sản có bao nhiêu đồng hình thành từ nợ.","Kiểm soát chi phí, khả năng sinh lời và quy mô doanh thu thuộc các nhóm chỉ số khác (sinh lời, hiệu suất)."],explanation:"Tỷ lệ nợ = Tổng nợ / Tổng tài sản → mức độ tài sản được tài trợ bằng nợ, tức mức sử dụng nợ trong cơ cấu nguồn vốn.",notes:["Đúng: mức độ sử dụng nợ trong cơ cấu nguồn vốn.","Kiểm soát chi phí không do tỷ lệ nợ đo.","Khả năng sinh lời đo bằng biên lợi nhuận, ROA, ROE.","Quy mô doanh thu không liên quan tới tỷ lệ nợ."],knowledgeIds:["b08-don-bay"],tags:["Đòn bẩy tài chính","tỷ lệ nợ"]},"q08-04":{answer:["C","D"],confidence:"verify",hints:["Quản trị chi phí xoay quanh việc kiểm soát chi và dùng nguồn lực hiệu quả để hỗ trợ quyết định.","Vai trò đã học: kiểm soát và cắt giảm chi không cần thiết; sử dụng hiệu quả nhân lực – vốn – vật lực; thông tin chi phí là cơ sở ra quyết định.","‘Tăng cường đầu tư mở rộng’ là một quyết định chiến lược, không phải vai trò của quản trị chi phí; đánh giá hiệu quả riêng bộ phận nhân sự cũng không phải."],explanation:"Quản trị chi phí giúp kiểm soát – tối ưu chi phí và cung cấp cơ sở lập kế hoạch, phân bổ nguồn lực tài chính; không phải công cụ để tăng đầu tư hay đánh giá riêng bộ phận nhân sự.",notes:["Đầu tư mở rộng là quyết định kinh doanh; chi phí chỉ là cơ sở tham khảo, không phải vai trò.","Không được nêu như vai trò của quản trị chi phí.","Đúng: thông tin chi phí hỗ trợ lập kế hoạch, sử dụng hiệu quả nguồn lực.","Đúng: kiểm soát và tối ưu hóa chi phí."],knowledgeIds:["b08-vai-tro-qtcp"],tags:["Quản trị chi phí","vai trò"]},"q08-05":{answer:["D"],hints:["SDĐP = doanh thu − tổng biến phí; nó đo mức đóng góp của doanh thu vào việc bù đắp định phí và tạo lợi nhuận.","Ứng dụng: phân tích hòa vốn, đánh giá hiệu quả sản phẩm, quyết định giá bán – sản lượng – cơ cấu sản phẩm.","Tổng tài sản, tăng trưởng doanh thu và chi phí tài chính không dùng SDĐP để xác định."],explanation:"SDĐP giúp đánh giá khả năng sinh lời và hỗ trợ ra quyết định về giá bán, sản lượng, cơ cấu sản phẩm.",notes:["Tổng tài sản lấy từ báo cáo tình hình tài chính.","Tăng trưởng doanh thu so sánh các kỳ, không phải SDĐP.","Chi phí tài chính không thuộc biến phí – định phí sản xuất kinh doanh.","Đúng: đánh giá sinh lời và ra quyết định kinh doanh."],knowledgeIds:["b08-sddp"],tags:["Số dư đảm phí","sddp"],calc:"sddp"},"q08-06":{answer:["C"],hints:["Biên lợi nhuận gộp = lợi nhuận gộp / doanh thu thuần, và LN gộp = doanh thu thuần − giá vốn.","Biên gộp giảm nghĩa là phần giá vốn chiếm tỷ trọng lớn hơn trong doanh thu.","Chi phí QLDN và cơ cấu nguồn vốn không nằm trong công thức biên gộp; doanh thu tăng nhanh hơn giá vốn lại làm biên gộp tăng."],explanation:"Giá vốn tăng nhanh hơn doanh thu → lợi nhuận gộp bị co lại so với doanh thu → biên lợi nhuận gộp giảm.",notes:["Chi phí QLDN không nằm trong lợi nhuận gộp.","Cơ cấu nguồn vốn không ảnh hưởng đến biên gộp.","Đúng: giá vốn tăng nhanh hơn doanh thu.","Ngược lại: làm biên gộp tăng."],knowledgeIds:["b08-sinh-loi"],tags:["Chỉ số sinh lời","biên lợi nhuận gộp"]},"q08-07":{answer:["C"],calc:"nhanh",hints:["Chỉ số thanh toán nhanh nghiêm ngặt hơn thanh toán hiện hành vì bớt đi một khoản trong tài sản ngắn hạn.","Khoản bị loại là khoản cần thời gian chuyển thành tiền và có rủi ro giảm giá.","Tiền mặt là tài sản thanh khoản nhất nên không bị loại; doanh thu và nợ phải trả không nằm trong tử số của chỉ số."],explanation:"Thanh toán nhanh = (TSNH − Hàng tồn kho) / Nợ ngắn hạn: loại trừ hàng tồn kho vì khó chuyển nhanh thành tiền.",notes:["Tiền mặt là thanh khoản cao nhất, giữ lại.","Doanh thu không nằm trong công thức.","Đúng: loại trừ hàng tồn kho.","Nợ phải trả là mẫu số, không bị ‘loại trừ’."],knowledgeIds:["b08-thanh-khoan"],tags:["Thanh khoản","thanh toán nhanh"]},"q08-08":{answer:["B"],hints:["Biến phí thay đổi tỷ lệ thuận với sản lượng. Hãy đối chiếu ví dụ trong bài.","Ví dụ biến phí: vật tư đầu vào trực tiếp, nhân công trực tiếp, hoa hồng bán hàng, điện nước phục vụ sản xuất.","Thuê nhà, khấu hao và bảo hiểm đều là định phí điển hình trong bài."],explanation:"Nguyên vật liệu (trực tiếp) tăng giảm theo sản lượng → chi phí biến đổi. Thuê nhà, khấu hao, bảo hiểm là chi phí cố định.",notes:["Thuê nhà là định phí.","Đúng: nguyên vật liệu là biến phí.","Khấu hao TSCĐ là định phí.","Bảo hiểm là định phí."],knowledgeIds:["b08-dinh-phi-bien-phi"],tags:["Phân loại chi phí","biến phí"]},"q08-09":{answer:["D"],hints:["Theo định nghĩa, SDĐP được dùng cho hai mục đích nối tiếp nhau.","Trước hết bù đắp chi phí cố định, phần còn lại mới là lợi nhuận.","Tăng trưởng doanh thu, tổng tài sản và chi phí tài chính không phải mục đích sử dụng SDĐP."],explanation:"SDĐP dùng để bù đắp chi phí cố định rồi tạo ra lợi nhuận cho doanh nghiệp.",notes:["Không dùng để đo tăng trưởng doanh thu.","Tổng tài sản không do SDĐP xác định.","Chi phí tài chính không phải mục đích của SDĐP.","Đúng: trang trải chi phí cố định và tạo lợi nhuận."],knowledgeIds:["b08-sddp"],tags:["Số dư đảm phí","sddp"],calc:"sddp"},"q08-10":{answer:["D"],calc:"sddp",hints:["So sánh SDĐP với chi phí cố định: SDĐP đang bù đắp định phí.","SDĐP vượt định phí nghĩa là sau khi bù đắp xong định phí vẫn còn dư.","Phần dư sau khi bù đắp định phí chính là lợi nhuận, nên không thể là hòa vốn hay lỗ."],explanation:"SDĐP > chi phí cố định thì phần dư là lợi nhuận → doanh nghiệp có lãi; SDĐP < định phí thì lỗ; bằng nhau thì hòa vốn.",notes:["Lỗ khi SDĐP < định phí.","Hòa vốn khi SDĐP = định phí.","Mệnh đề này xác định được dựa trên so sánh hai đại lượng.","Đúng: lãi."],knowledgeIds:["b08-sddp","b08-hoa-von"],tags:["Số dư đảm phí","hòa vốn"]},"q08-11":{answer:["D"],hints:["Hãy nhớ định nghĩa mở đầu phần ‘phân loại chi phí’.","Chi phí là biểu hiện bằng tiền của hao phí về lao động sống, lao động vật hóa và các nguồn lực khác.","Tài sản, doanh thu và chênh lệch doanh thu – chi phí đều không phải ‘hao phí’."],explanation:"Chi phí là giá trị các nguồn lực bị hao phí được biểu hiện bằng tiền để thực hiện hoạt động SXKD trong kỳ.",notes:["Tài sản nắm giữ khác với hao phí.","Đó là doanh thu.","Đó là lợi nhuận.","Đúng: nguồn lực hao phí biểu hiện bằng tiền."],knowledgeIds:["b08-phan-loai-chi-phi"],tags:["Phân loại chi phí","khái niệm chi phí"]},"q08-12":{answer:["D"],calc:"trailai",hints:["Khả năng thanh toán lãi vay = EBIT / chi phí lãi vay.","Tử số tăng, mẫu số giữ nguyên thì tỷ số thay đổi theo hướng nào?","Không thể ‘bằng 0’ hay ‘giảm’ khi tử số tăng và mẫu số không đổi."],explanation:"EBIT tăng, lãi vay không đổi → EBIT/lãi vay tăng → khả năng trả lãi tốt hơn.",notes:["Tỷ số phải thay đổi vì tử số tăng.","Tử số tăng nên tỷ số không thể giảm.","Không có cơ sở để bằng 0 khi EBIT dương.","Đúng: khả năng trả lãi tăng."],knowledgeIds:["b08-don-bay"],tags:["Đòn bẩy tài chính","ebit"]},"q08-13":{answer:["A"],calc:"sddp",hints:["Công thức SDĐP viết gọn là R − VC.","R là tổng doanh thu, VC là tổng chi phí biến đổi.","Các phương án nói ‘lợi nhuận sau khi trừ toàn bộ chi phí’, ‘tổng doanh thu’ hoặc ‘tổng chi phí’ đều không trừ riêng biến phí."],explanation:"SDĐP = Doanh thu − Tổng chi phí biến đổi. Ví dụ: 91tr − 52tr = 39tr.",notes:["Đúng: doanh thu trừ tổng biến phí.","Đó là lợi nhuận, phải trừ cả định phí.","Đó chỉ là doanh thu.","Đó là tổng chi phí (định phí + biến phí)."],knowledgeIds:["b08-sddp"],tags:["Số dư đảm phí","r trừ vc"]},"q08-14":{answer:["D"],hints:["Chỉ số nhanh = (TSNH − HTK)/Nợ NH. Muốn tăng nó thì tăng tử số hoặc giảm mẫu số một cách lành mạnh.","Tử số gồm tiền và các tài sản chuyển nhanh thành tiền như phải thu.","Tăng vay ngắn hạn làm tăng mẫu số, tăng tồn kho không nằm trong tử số, mở rộng chi phí làm hao tiền."],explanation:"Tăng tiền mặt và tài sản có tính thanh khoản cao làm tăng tử số của chỉ số thanh toán nhanh.",notes:["Mở rộng chi phí làm hao tiền, thường giảm chỉ số.","Vay ngắn hạn làm tăng nợ ngắn hạn (mẫu số).","Hàng tồn kho bị loại khỏi chỉ số nhanh.","Đúng: tăng tiền và tài sản thanh khoản cao."],knowledgeIds:["b08-thanh-khoan"],tags:["Thanh khoản","thanh toán nhanh"]},"q08-15":{answer:["A"],hints:["Chi phí cố định không đổi theo sản lượng; hãy đối chiếu từng phương án với ví dụ ở bài.","Ví dụ định phí: khấu hao tài sản cố định, thuê nhà, bảo hiểm, đào tạo.","Tiền điện là chi phí hỗn hợp, nguyên vật liệu và hoa hồng bán hàng là biến phí."],explanation:"Chi phí thuê tài sản không đổi theo sản lượng → chi phí cố định.",notes:["Đúng: thuê tài sản là định phí.","Điện là chi phí hỗn hợp.","Nguyên vật liệu là biến phí.","Hoa hồng bán hàng là biến phí."],knowledgeIds:["b08-dinh-phi-bien-phi"],tags:["Phân loại chi phí","định phí"]}},tp={"q09-01":{answer:["A"],hints:["Trong ba dòng chảy, dòng gắn trực tiếp với hàng hóa mà khách hàng nhận là dòng vật chất.","Hình minh họa: nhà cung cấp nguyên liệu thô → nhà sản xuất → nhà phân phối → bán lẻ → khách hàng.","Dòng thông tin mới hai chiều; dòng tài chính ngược chiều hàng hóa – đừng nhầm với dòng vật chất."],explanation:"Dòng vật chất đi từ trái sang phải: từ khai thác nguyên liệu thô → sản xuất → lưu kho, phân phối → bán lẻ → người tiêu dùng.",notes:["Đúng: từ trái sang phải, từ khai thác đến bán lẻ.","Hai chiều là dòng thông tin.","Dòng chảy có hướng xác định.","Ngược chiều là dòng tài chính."],knowledgeIds:["b09-3-dong-chay"],tags:["Dòng chảy","dòng vật chất"]},"q09-02":{answer:["B"],hints:["Deming nhấn mạnh điều ngược với việc chỉ chọn nhà cung cấp theo giá thấp.","Quản trị hiện đại hướng tới tư duy win–win dựa trên niềm tin và hợp tác dài hạn với nhà cung cấp chiến lược.","Giá thấp nhất, khoảng cách gần, số lượng nhiều đều là tiêu chí ngắn hạn/đơn lẻ."],explanation:"Deming: không chọn nhà cung cấp chỉ theo giá thấp mà xây quan hệ lâu dài, trung thành, tin cậy để tối thiểu hóa tổng chi phí.",notes:["Chính là điều Deming khuyên không nên dựa vào.","Đúng: quan hệ dài hạn, tin cậy.","Khoảng cách địa lý không phải tiêu chí Deming nhấn mạnh.","Số lượng nhiều không đảm bảo chất lượng, tin cậy."],knowledgeIds:["b09-deming-srm"],tags:["Mua sắm","deming"]},"q09-03":{answer:["C"],hints:["Logistics chỉ là một phần của chuỗi cung ứng, tập trung vào hoạt động tác nghiệp hằng ngày.","Định nghĩa: lập kế hoạch, thực hiện, kiểm soát việc lưu chuyển và lưu trữ hiệu quả hàng hóa, dịch vụ, thông tin.","Nghiên cứu nhu cầu, đưa sản phẩm ra thị trường và tìm nhà cung cấp nguyên liệu thuộc marketing/mua sắm."],explanation:"Logistics tập trung vào vận chuyển, lưu kho, giao hàng – tức lưu chuyển và lưu trữ hàng hóa.",notes:["Nghiên cứu nhu cầu thuộc marketing/dự báo.","Đưa sản phẩm ra thị trường thuộc marketing.","Đúng: lưu chuyển và lưu trữ hàng hóa.","Tìm nhà cung cấp thuộc mua sắm."],knowledgeIds:["b09-logistics"],tags:["Logistics","lưu kho vận chuyển"]},"q09-04":{answer:["D"],hints:["Chuỗi cung ứng là một mạng lưới, rộng hơn nhiều so với một bộ phận.","Nó bao gồm nhiều tổ chức: cung cấp, sản xuất, phân phối, bán lẻ, phối hợp để đưa sản phẩm hoàn chỉnh đến khách hàng.","Quản lý tài chính, vận chuyển nội bộ hay bán hàng trực tiếp đều chỉ là một mảng hẹp."],explanation:"Chuỗi cung ứng là mạng lưới các hoạt động từ cung ứng, sản xuất đến phân phối nhằm đưa sản phẩm hoàn chỉnh đến khách hàng hiệu quả.",notes:["Đây không phải hệ thống quản lý tài chính.","Vận chuyển nội bộ chỉ là một phần nhỏ (logistics).","Bán hàng trực tiếp chỉ là một khâu.","Đúng: mạng lưới hoạt động từ cung ứng – sản xuất – phân phối."],knowledgeIds:["b09-chuoi-cung-ung"],tags:["Chuỗi cung ứng","định nghĩa chuỗi cung ứng"]},"q09-05":{answer:["A"],hints:["Lead time (thời gian dẫn) ngắn nghĩa là phản ứng nhanh hơn.","Giải pháp chống hiệu ứng roi da gồm rút ngắn thời gian dẫn ở từng cấp: phản ứng càng nhanh, dao động tồn kho càng giảm.","Phương án dùng từ tuyệt đối như ‘loại bỏ’, ‘không còn’, ‘hoàn toàn’ thường sai."],explanation:"Lead time ngắn giúp phản ứng nhanh với biến động nhu cầu thị trường và giảm dao động tồn kho.",notes:["Đúng: tăng khả năng phản ứng với biến động nhu cầu.","Vẫn cần dự báo nhu cầu.","Không thể đảm bảo ‘không còn thiếu hàng’.","Không giảm hoàn toàn chi phí vận hành trong mọi trường hợp."],knowledgeIds:["b09-tich-hop-bullwhip"],tags:["Tích hợp","lead time"]},"q09-06":{answer:["D"],hints:["Dự báo sai nhu cầu sẽ lan truyền dọc theo chuỗi.","Mỗi cấp dự báo, đặt hàng, giữ tồn kho dựa trên dự báo → sai lệch khuếch đại.","Các phương án nói ‘tối ưu hoàn toàn’, ‘loại bỏ hoàn toàn rủi ro’ không thể là hệ quả của dự báo sai."],explanation:"Dự báo nhu cầu không chính xác gây mất cân đối cung – cầu (thừa hoặc thiếu hàng) tại các cấp trong chuỗi.",notes:["Dự báo sai không thể tối ưu hóa tồn kho.","Nhu cầu thị trường không trở nên ổn định vì dự báo sai.","Dự báo sai làm tăng, không loại bỏ, rủi ro thiếu/thừa hàng.","Đúng: mất cân đối cung – cầu giữa các cấp."],knowledgeIds:["b09-tich-hop-bullwhip"],tags:["Dự báo nhu cầu","tích hợp"]},"q09-07":{answer:["D"],hints:["Ghi nhớ: vật chất đi một chiều, thông tin đi theo chiều nào?","Đơn đặt hàng đi ngược từ khách hàng lên nhà cung cấp, trong khi dự báo – tồn kho – kế hoạch sản xuất chia sẻ giữa các bên.","Dòng thông tin không phải ‘không tồn tại’ hay ‘ngẫu nhiên’ — nó có hướng rõ ràng."],explanation:"Dòng thông tin trong chuỗi cung ứng lưu chuyển hai chiều (từ đầu vào đến người tiêu dùng và ngược lại).",notes:["Một chiều là dòng vật chất.","Dòng thông tin luôn tồn tại.","Không ngẫu nhiên.","Đúng: hai chiều."],knowledgeIds:["b09-3-dong-chay"],tags:["Dòng chảy","dòng thông tin"]},"q09-08":{answer:["C"],hints:["Nghĩ tới hiệu ứng roi da: mỗi cấp tự dự báo và giữ tồn kho an toàn.","Chính sách dự báo riêng rẽ và tâm lý phòng thủ khiến biến động nhu cầu càng lên cấp cao càng lớn.","Ổn định, giảm tồn kho và tăng hiệu quả là kết quả của dự báo chung và chia sẻ thông tin, không phải dự báo riêng."],explanation:"Mỗi cấp tự dự báo riêng → sai lệch nhu cầu khuếch đại dần (hiệu ứng roi da), tồn kho tăng, chuỗi kém hiệu quả.",notes:["Ngược lại: dự báo riêng làm nhu cầu biến động.","Tồn kho tăng chứ không giảm.","Đúng: sai lệch nhu cầu tăng dần.","Chuỗi kém hiệu quả."],knowledgeIds:["b09-tich-hop-bullwhip"],tags:["Bullwhip","hiệu ứng roi da"]},"q09-09":{answer:["A"],hints:["Tối ưu từng mắt xích riêng lẻ chưa chắc tối ưu toàn chuỗi.","Bài giảng: thiếu tích hợp thì chuỗi sẽ gián đoạn, chi phí tăng và giá trị bị suy giảm.","Các phương án khẳng định hiệu quả tổng thể tăng/chi phí chuỗi tối ưu là ngược với cảnh báo của bài."],explanation:"Chỉ tối ưu nội bộ mà không phối hợp đối tác gây mất đồng bộ giữa các mắt xích, làm giảm hiệu quả chung.",notes:["Đúng: mất đồng bộ, giảm hiệu quả chung.","Kiểm soát nội bộ tốt không đảm bảo dòng chảy toàn chuỗi ổn định.","Giảm phụ thuộc đối tác không làm tăng hiệu quả tổng thể.","Hiệu quả nội bộ cao không đồng nghĩa tối ưu chi phí toàn chuỗi."],knowledgeIds:["b09-tich-hop-bullwhip"],tags:["Tích hợp","bullwhip"]},"q09-10":{answer:["A"],confidence:"verify",hints:["Hãy nhớ lại nội dung từng yếu tố cốt lõi: yếu tố nào có câu ‘mỗi cấp đều dự báo nhu cầu và xác định mức tồn kho’?","Nội dung đó nằm trong phần nói về toàn bộ các cấp từ bán lẻ, bán buôn, phân phối đến nhà sản xuất và hiệu ứng roi da.","Phân phối nói về vận chuyển và CRM; mua sắm nói về nhà cung cấp và ‘4 đúng’."],explanation:"Câu ‘ở mỗi cấp, các bên đều phải dự báo nhu cầu và xác định mức tồn kho phù hợp’ nằm trong phần Tích hợp (cùng hiệu ứng roi da). Lưu ý: yếu tố Vận hành có ‘quản lý nhu cầu, kiểm soát tồn kho’ nên câu này dễ gây nhầm — đáp án đang được đối chiếu.",notes:["Đúng theo cách diễn đạt của bài: dự báo nhu cầu và xác định mức tồn kho ở mỗi cấp thuộc Tích hợp.","Vận hành có ‘quản lý nhu cầu, kiểm soát tồn kho (MRP, JIT)’ — dễ nhầm, nhưng cụm ‘dự báo nhu cầu & mức tồn kho từng cấp’ gắn với Tích hợp.","Mua sắm nói về lựa chọn nhà cung cấp, 4 đúng.","Phân phối nói về vận chuyển và quản trị quan hệ khách hàng."],knowledgeIds:["b09-tich-hop-bullwhip","b09-van-hanh"],tags:["4 yếu tố cốt lõi","tích hợp"]},"q09-11":{answer:["D"],hints:["Chữ KHÔNG: tìm yếu tố nằm ngoài danh sách 4 yếu tố cốt lõi quanh giá trị khách hàng.","Bốn yếu tố gồm: mua sắm, vận hành, phân phối và tích hợp.","Ba phương án đầu đều xuất hiện trong danh sách; một phương án thuộc hoạt động marketing."],explanation:"Bốn yếu tố cốt lõi là mua sắm, vận hành, phân phối, tích hợp; quảng cáo không nằm trong đó.",notes:["Phân phối là yếu tố cốt lõi.","Vận hành là yếu tố cốt lõi.","Mua sắm là yếu tố cốt lõi.","Đúng: quảng cáo không phải yếu tố cốt lõi."],knowledgeIds:["b09-4-yeu-to-cot-loi"],tags:["4 yếu tố cốt lõi"]},"q09-12":{answer:["B","C","D"],hints:["Chuỗi cung ứng có đúng ba dòng chảy; thử nhớ tên cả ba.","Vật chất (hàng hóa), thông tin (đơn hàng, dự báo) và tài chính (thanh toán).","Có một phương án không nằm trong ba dòng chảy chính của chuỗi cung ứng — liên quan tới ‘tri thức’."],explanation:"Ba dòng chảy: vật chất, thông tin, tài chính. Không có ‘dòng chảy tri thức’.",notes:["Sai: không có dòng chảy tri thức trong ba dòng chảy.","Đúng: dòng vật chất.","Đúng: dòng tài chính.","Đúng: dòng thông tin."],knowledgeIds:["b09-3-dong-chay"],tags:["Dòng chảy","3 dòng chảy"]},"q09-13":{answer:["A"],hints:["Giao hàng đúng hạn đo mức độ tin cậy trong phục vụ khách hàng.","Trong các chỉ số đo chuỗi: tổng chi phí, chu kỳ tiền mặt, giao hàng đúng hạn, tính linh hoạt.","Chi phí, marketing và lợi nhuận được đo bằng các chỉ số khác."],explanation:"Tỷ lệ giao hàng đúng hạn thể hiện độ tin cậy – tức chất lượng dịch vụ khách hàng.",notes:["Đúng: chất lượng dịch vụ.","Chi phí có chỉ số tổng chi phí chuỗi cung ứng riêng.","Không liên quan tới marketing.","Lợi nhuận đo bằng chỉ số tài chính."],knowledgeIds:["b09-chi-so-scor"],tags:["Chỉ số chuỗi cung ứng","giao hàng đúng hạn"]},"q09-14":{answer:["A"],hints:["Roi da (bullwhip): biến động nhỏ ở cuối chuỗi được khuếch đại khi đi ngược lên các cấp cao hơn.","Nguyên nhân là mỗi cấp dự báo riêng rẽ và giữ tồn kho an toàn.","Giảm chi phí sản xuất, giảm tồn kho và tăng lợi nhuận là những điều hiệu ứng này KHÔNG mang lại."],explanation:"Hiệu ứng roi da là sai lệch/biến động nhu cầu được khuếch đại dần khi lên các cấp cao hơn do dự báo riêng rẽ.",notes:["Đúng: sai lệch dự báo nhu cầu được khuếch đại.","Ngược lại, chi phí tăng.","Tồn kho tăng chứ không giảm.","Lợi nhuận bị suy giảm."],knowledgeIds:["b09-tich-hop-bullwhip"],tags:["Bullwhip","hiệu ứng roi da"]},"q09-15":{answer:["B"],hints:["Ba dòng chảy: vật chất →, thông tin ↔, tài chính ?","Người tiêu dùng trả tiền cho nhà bán lẻ, nhà bán lẻ trả nhà sản xuất, nhà sản xuất trả nhà cung cấp.","Dòng tài chính có hướng xác định, không phải ‘không xác định’ và không phải hai chiều."],explanation:"Dòng tài chính đi ngược chiều với hàng hóa (từ khách hàng → bán lẻ → sản xuất → nhà cung cấp).",notes:["Có hướng xác định.","Đúng: ngược chiều với hàng hóa.","Hai chiều là dòng thông tin.","Cùng chiều là dòng vật chất."],knowledgeIds:["b09-3-dong-chay"],tags:["Dòng chảy","dòng tài chính"]}},ep={"q10-01":{answer:["B"],hints:["Kaizen là kỹ thuật Nhật Bản xuất hiện trong phần tư duy tinh gọn.","Bài giảng mô tả Kaizen ‘với sự tham gia của toàn bộ nhân viên’, ví dụ đề xuất bố trí lại dụng cụ để giảm 20% thời gian di chuyển.","Giảm chất lượng, tăng chi phí đều trái với mục tiêu; ‘đổi mới lớn’ là bước nhảy vọt, khác với những thay đổi nhỏ liên tục."],explanation:"Kaizen = cải tiến liên tục, từng bước nhỏ, có sự tham gia của toàn bộ nhân viên.",notes:["Kaizen nhằm nâng chất lượng.","Đúng: cải tiến liên tục.","Kaizen là cải tiến nhỏ liên tục, không phải đổi mới lớn.","Mục tiêu là giảm lãng phí, không tăng chi phí."],knowledgeIds:["b10-tinh-gon-lean"],tags:["Lean","kaizen"]},"q10-02":{answer:["D"],hints:["Đạt được mục tiêu đồng nghĩa với tiêu chí nào? Tốn nhiều thời gian đồng nghĩa với tiêu chí nào?","Hiệu quả = làm đúng việc (đạt mục tiêu). Hiệu suất = làm đúng cách (chi phí thấp nhất về thời gian, tiền, nguồn lực).","Phương án có chữ ‘cả hai cao’ hoặc ‘không đạt cả hai’ không khớp với dữ kiện vừa đạt mục tiêu vừa tốn thời gian."],explanation:"Đạt mục tiêu → hiệu quả; nhưng tốn nhiều thời gian → hiệu suất chưa tối ưu.",notes:["Tốn nhiều thời gian nên hiệu suất không cao.","Đã đạt mục tiêu nên có hiệu quả.","Ngược lại: đã đạt mục tiêu nên có hiệu quả.","Đúng: hiệu quả cao, hiệu suất chưa tối ưu."],knowledgeIds:["b10-hieu-qua-hieu-suat"],tags:["Hiệu quả - hiệu suất","drucker"]},"q10-03":{answer:["B"],hints:["Theo Drucker, hai khái niệm này là ‘đúng việc’ và ‘đúng cách’ – hiệu suất ứng với cái nào?","Hiệu suất (efficiency) là đạt kết quả với chi phí thấp nhất về thời gian, tiền bạc, nguồn lực – nghĩa là làm theo cách tối ưu.","‘Làm nhiều việc’, ‘làm nhanh’ chưa chắc là tối ưu; ‘làm đúng việc’ là khái niệm còn lại (hiệu quả)."],explanation:"Hiệu suất là làm đúng cách; hiệu quả là làm đúng việc.",notes:["Làm nhiều việc không phải hiệu suất.","Đúng: hiệu suất là làm đúng cách.","Nhanh chưa chắc là tối ưu nguồn lực.","Đó là định nghĩa của hiệu quả."],knowledgeIds:["b10-hieu-qua-hieu-suat"],tags:["Hiệu quả - hiệu suất","hiệu suất"]},"q10-04":{answer:["C"],hints:["Lean (tinh gọn) là phong trào quản trị bắt nguồn từ hệ thống sản xuất Toyota.","Cốt lõi là tối đa hóa giá trị cho khách hàng bằng cách loại bỏ hoạt động không tạo giá trị.","Tăng tồn kho, tăng nhân sự, giảm khách hàng đều trái ngược tinh thần tinh gọn."],explanation:"Tư duy tinh gọn tập trung loại bỏ lãng phí (7 loại lãng phí) để tối ưu dòng giá trị cho khách hàng.",notes:["Tồn kho là một loại lãng phí.","Tăng nhân sự không phải mục tiêu của Lean.","Đúng: loại bỏ lãng phí.","Lean hướng tới giá trị cho khách hàng."],knowledgeIds:["b10-tinh-gon-lean"],tags:["Lean","tinh gọn"]},"q10-05":{answer:["C"],hints:["Ba chiến lược đổi mới: định hướng theo nhu cầu, theo dõi thị trường, định hướng công nghệ.","‘Theo dõi thị trường’ là duy trì quan hệ chặt chẽ với khách hàng và tạo giá trị thông qua cải tiến.","Phương án nói đột phá công nghệ thuộc chiến lược công nghệ; phương án đáp ứng nhu cầu mới thuộc chiến lược nhu cầu."],explanation:"Theo dõi thị trường: duy trì quan hệ chặt chẽ với khách hàng và mang lại giá trị qua những cải tiến nhỏ nhưng có ý nghĩa.",notes:["Đó là mô tả của chiến lược định hướng theo nhu cầu.","Giảm chi phí không phải một chiến lược đổi mới được nêu.","Đúng: cải tiến nhỏ tăng giá trị cho khách hàng.","Đó là định hướng công nghệ (R&D)."],knowledgeIds:["b10-sang-tao"],tags:["Sáng tạo","chiến lược đổi mới"]},"q10-06":{answer:["B"],hints:["Bài giảng có phần ‘hạn chế đa nhiệm’ khi nói về nâng cao hiệu suất quản lý thời gian.","Ví dụ: vừa trả lời email vừa soạn báo cáo khiến cả hai việc kéo dài, dễ sai sót.","Các phương án khẳng định đa nhiệm ‘luôn’ giúp nhanh hơn hay nâng hiệu suất đều trái với ví dụ."],explanation:"Đa nhiệm khó tập trung nên có xu hướng làm giảm hiệu suất; nên hoàn thành từng việc một.",notes:["Trái với ví dụ trong bài.","Đúng: thường giảm hiệu suất do khó tập trung.","Có ảnh hưởng đáng kể (kéo dài và dễ sai sót).","Dùng từ tuyệt đối ‘luôn’ — sai."],knowledgeIds:["b10-viec-nen-lam"],tags:["Quản lý thời gian","đa nhiệm"]},"q10-07":{answer:["C"],hints:["Phần yếu tố kìm hãm sáng tạo nhắc tới cả cá nhân lẫn tổ chức.","Cuối danh sách: văn hóa tổ chức phạt thất bại và tư duy bầy đàn khiến nhân viên ngại thử nghiệm.","Thử nghiệm, đổi mới và ghi lại ý tưởng là những yếu tố THÚC ĐẨY sáng tạo."],explanation:"Văn hóa sợ thất bại làm nhân viên ngại thử nghiệm nên kìm hãm sáng tạo.",notes:["Thử nghiệm thúc đẩy sáng tạo.","Đổi mới là mục tiêu của sáng tạo.","Đúng: văn hóa sợ thất bại kìm hãm sáng tạo.","Ghi lại ý tưởng giúp giữ ý tưởng, thúc đẩy sáng tạo."],knowledgeIds:["b10-kim-ham-sang-tao"],tags:["Sáng tạo","kìm hãm sáng tạo"]},"q10-08":{answer:["A"],hints:["JIT là viết tắt của ‘sản xuất/nhập hàng đúng lúc’, một nguyên tắc ‘hệ thống kéo’ trong Lean.","Chỉ nhập hoặc sản xuất khi gần thời điểm cần dùng → tránh hư hỏng và tồn kho lớn (ví dụ cửa hàng bánh).","Giảm sản xuất và tăng chi phí không phải mục tiêu; ‘tăng tồn kho’ là điều JIT muốn tránh."],explanation:"Just-in-time giúp giảm tồn kho và chi phí lưu kho vì chỉ sản xuất/nhập hàng khi có nhu cầu.",notes:["Đúng: giảm tồn kho.","JIT không nhằm giảm sản xuất nói chung mà sản xuất đúng nhu cầu.","JIT giúp giảm chi phí.","Ngược với mục tiêu của JIT."],knowledgeIds:["b10-tinh-gon-lean","b09-van-hanh"],tags:["Lean","jit"]},"q10-09":{answer:["B"],hints:["Phân biệt lãnh đạo và quản trị: một bên là ảnh hưởng, truyền cảm hứng; bên kia là kế hoạch – tổ chức – kiểm soát.","Theo Robbins & Judge: lãnh đạo là khả năng gây ảnh hưởng đến một nhóm nhằm đạt được mục tiêu.","Lập kế hoạch – thực hiện – kiểm soát và xây dựng quy trình, điều phối nguồn lực mô tả quản trị; ‘ra lệnh’ không phải bản chất lãnh đạo."],explanation:"Lãnh đạo là khả năng gây ảnh hưởng đến nhóm để đạt mục tiêu; quản trị mới là lập kế hoạch, tổ chức, kiểm soát nguồn lực.",notes:["Đó là mô tả quản trị.","Đúng: khả năng gây ảnh hưởng để đạt mục tiêu.","Lãnh đạo giỏi không chỉ ra lệnh mà khiến người khác tự nguyện hành động.","Xây dựng quy trình, điều phối nguồn lực là quản trị."],knowledgeIds:["b10-lanh-dao-quan-tri"],tags:["Lãnh đạo","robbins"]},"q10-10":{answer:["A"],hints:["Câu định nghĩa của Stephen Covey về quản lý thời gian.","Covey ghép hai ý: ‘làm đúng việc’ (hiệu quả) và ‘làm việc đó theo cách tốt nhất’ (hiệu suất).","‘Làm nhiều’, ‘làm nhanh’, ‘làm liên tục’ đều chỉ nói về lượng hay tốc độ, chưa nói về đúng việc, đúng cách."],explanation:"Quản lý thời gian là làm đúng việc (hiệu quả) và làm việc đó theo cách tốt nhất (hiệu suất).",notes:["Đúng: làm đúng việc và đúng cách.","Làm liên tục dễ dẫn tới bận rộn mà không hiệu quả.","Làm nhiều việc chưa chắc đúng việc.","Nhanh chưa chắc đúng việc."],knowledgeIds:["b10-quan-ly-thoi-gian"],tags:["Quản lý thời gian","covey"]},"q10-11":{answer:["D"],hints:["Ma trận Covey 2×2 dựa trên hai tiêu chí.","Hai trục: mức độ quan trọng và mức độ khẩn cấp, chia 4 góc phần tư.","Tăng sản xuất, giảm nhân sự, tăng doanh thu là mục tiêu kinh doanh chứ không phải công dụng của ma trận."],explanation:"Ma trận Covey giúp phân loại công việc theo mức độ quan trọng và khẩn cấp để ưu tiên đúng việc.",notes:["Không phải công cụ tăng sản xuất.","Không liên quan đến giảm nhân sự.","Không trực tiếp tăng doanh thu.","Đúng: phân loại theo quan trọng – khẩn cấp."],knowledgeIds:["b10-ma-tran-covey"],tags:["Quản lý thời gian","ma trận covey"]},"q10-12":{answer:["C"],hints:["‘Slack’ có nghĩa ‘độ chùng, phần dư’.","Slack là phần dư so với mức tối thiểu cần thiết để vận hành: tiền mặt, nhân sự, thời gian, máy móc chưa dùng hết.","Lợi nhuận chưa phân phối và chi phí ngoài kế hoạch là chỉ tiêu kế toán; ‘nguồn lực bị thiếu hụt’ là điều ngược lại."],explanation:"Độ dự trữ tổ chức là năng lực dư thừa tổ chức duy trì như một vùng đệm an toàn.",notes:["Lợi nhuận chưa phân phối là khái niệm kế toán.","Chi phí ngoài kế hoạch không phải slack.","Đúng: năng lực dư thừa duy trì.","Slack là dư thừa, không phải thiếu hụt."],knowledgeIds:["b10-slack"],tags:["Hiệu quả - hiệu suất","slack"]},"q10-13":{answer:["C"],hints:["Hiệu quả = đạt mục tiêu; hiệu suất = dùng nguồn lực tiết kiệm nhất. Bỏ qua hiệu suất nghĩa là bỏ qua điều gì?","Ví dụ trong bài: đạt 1.000 sản phẩm nhưng giảm giá sâu và quảng cáo quá cao nên lợi nhuận thấp.","Tối ưu nguồn lực, giảm chi phí, tăng lợi nhuận là kết quả của việc đạt CẢ hiệu quả lẫn hiệu suất."],explanation:"Chỉ chú trọng hiệu quả mà bỏ qua hiệu suất thì dù đạt mục tiêu vẫn tốn chi phí, thời gian, nguồn lực không cần thiết.",notes:["Tối ưu nguồn lực là hiệu suất — bị bỏ qua.","Giảm chi phí là kết quả của hiệu suất.","Đúng: tốn chi phí không cần thiết.","Lợi nhuận bị ảnh hưởng chứ không tăng."],knowledgeIds:["b10-hieu-qua-hieu-suat"],tags:["Hiệu quả - hiệu suất"]},"q10-14":{answer:["D"],hints:["Phần cuối bài: trong kỷ nguyên AI, nhà quản trị không chỉ điều hành công việc.","Cô nhấn mạnh phải kết hợp giữa công nghệ – dữ liệu và năng lực lãnh đạo con người.","Mỗi phương án đầu chỉ nói một mặt (con người, công nghệ hoặc tự động hóa); đáp án đúng là tổng hợp nhiều mặt."],explanation:"Nhà quản trị thời AI phải kết hợp năng lực công nghệ với lãnh đạo con người và tư duy hệ thống (thiết kế hệ thống, khai thác dữ liệu, phát triển con người).",notes:["Chỉ một mặt (con người), chưa đủ.","Chỉ một mặt (công nghệ), chưa đủ.","Ưu tiên tự động hóa mà quên yếu tố con người là phiến diện.","Đúng: kết hợp công nghệ, lãnh đạo con người và tư duy hệ thống."],knowledgeIds:["b10-quan-tri-thoi-ai"],tags:["Quản trị thời AI","chuyển đổi số"]},"q10-15":{answer:["B"],hints:["Theo Drucker: effectiveness (hiệu quả) và efficiency (hiệu suất).","Hiệu quả là đạt được mục tiêu đề ra – tức là chọn đúng mục tiêu trước khi lo cách làm.","‘Làm đúng cách’ là định nghĩa của hiệu suất; ‘làm nhiều’ và ‘làm nhanh’ không phải định nghĩa."],explanation:"Hiệu quả là làm đúng việc (đạt mục tiêu đề ra).",notes:["Làm nhiều việc không đảm bảo đúng việc.","Đúng: làm đúng việc.","Nhanh chưa chắc đúng việc.","Đó là hiệu suất."],knowledgeIds:["b10-hieu-qua-hieu-suat"],tags:["Hiệu quả - hiệu suất","hiệu quả"]}},ip={"q11-01":{answer:["D"],hints:["Chuỗi tác động: dữ liệu → báo cáo → quyết định.","Bài giảng, phần kiểm soát dữ liệu: dữ liệu là cơ sở để nhà quản lý ra quyết định.","Các phương án khác đều là hậu quả có thể xảy ra, nhưng câu hỏi hỏi hậu quả nghiêm trọng nhất ĐỐI VỚI QUẢN TRỊ."],explanation:"Dữ liệu sai → báo cáo sai → quyết định quản trị sai: hậu quả nghiêm trọng nhất đối với quản trị.",notes:["Thiệt hại tài chính là hệ quả phía sau, không phải hậu quả trực tiếp lên quản trị.","Uy tín thương hiệu gắn với an ninh thông tin hơn.","Tấn công mạng thuộc an ninh thông tin, không phải hậu quả của nhập sai dữ liệu.","Đúng: báo cáo sai dẫn đến quyết định quản trị sai."],knowledgeIds:["b11-kiem-soat-cntt"],tags:["Kiểm soát CNTT","kiểm soát dữ liệu"]},"q11-02":{answer:["C"],hints:["Tuyến 3 có đặc điểm riêng so với hai tuyến còn lại.","Điểm cốt lõi của tuyến 3 (kiểm toán nội bộ) là độc lập: đánh giá toàn bộ hệ thống và báo cáo ban quản trị/HĐQT.","Nếu cùng một bộ phận vừa thiết kế hệ thống vừa kiểm toán chính nó thì còn ‘độc lập’ nữa không?"],explanation:"Kiểm toán nội bộ vừa kiểm toán vừa thiết kế hệ thống kiểm soát sẽ mất tính độc lập của tuyến phòng thủ thứ ba.",notes:["Không đúng bản chất vấn đề độc lập.","Tập trung quyền lực làm yếu cơ chế kiểm soát chéo.","Đúng: mất tính độc lập của tuyến 3.","Khó phát hiện sai sót khách quan khi tự kiểm tra việc mình thiết kế."],knowledgeIds:["b11-ba-tuyen"],tags:["Mô hình 3 tuyến","độc lập"]},"q11-03":{answer:["B"],hints:["Mục tiêu của mô hình 3 tuyến được nêu trong bài.","Làm rõ ai chịu trách nhiệm quản lý rủi ro, tránh chồng chéo chức năng, tăng minh bạch và độc lập giám sát.","Bài nhấn mạnh mô hình KHÔNG tạo thêm cấp bậc; và không tập trung quyền vào một bộ phận."],explanation:"Mô hình 3 tuyến giúp phân định rõ trách nhiệm quản lý rủi ro và kiểm soát nội bộ, tạo ba lớp bảo vệ.",notes:["Mô hình không tạo thêm cấp bậc.","Đúng: phân định rõ trách nhiệm.","Không tập trung quyền vào kiểm toán nội bộ.","Tuyến 1 vận hành vẫn chịu trách nhiệm trực tiếp."],knowledgeIds:["b11-ba-tuyen"],tags:["Mô hình 3 tuyến"]},"q11-04":{answer:["A"],hints:["KPI là viết tắt của Key Performance Indicator.","Dịch từng chữ: Key = then chốt, Performance = hiệu suất, Indicator = chỉ số; dùng để phản ánh mức hoàn thành mục tiêu.","Thanh khoản, tài chính, nợ là các nhóm chỉ số khác trong Bài 8."],explanation:"KPI = chỉ số đo lường hiệu suất cốt yếu, phản ánh mức độ hoàn thành mục tiêu của cá nhân, bộ phận hoặc tổ chức.",notes:["Đúng: chỉ số đo lường hiệu suất cốt yếu.","Chỉ số thanh khoản thuộc nhóm chỉ số tài chính (Bài 8).","KPI không chỉ là chỉ số tài chính.","Chỉ số nợ là chỉ số đòn bẩy."],knowledgeIds:["b11-kpi-smart"],tags:["KPI","chỉ số hiệu suất cốt yếu"]},"q11-05":{answer:["C"],hints:["Rủi ro luôn gắn với tương lai và tính không chắc chắn.","Định nghĩa: sự kiện không chắc chắn trong tương lai, nếu xảy ra có thể ảnh hưởng tiêu cực đến việc đạt mục tiêu.","Sự cố đã xảy ra, chi phí phát sinh hay sai sót đã có không còn ‘không chắc chắn’."],explanation:"Rủi ro là những yếu tố/sự kiện không chắc chắn có thể ảnh hưởng đến việc đạt mục tiêu của doanh nghiệp.",notes:["Sự cố quá khứ đã xảy ra, không còn không chắc chắn (nhưng là nguồn rút kinh nghiệm).","Chi phí ngoài kế hoạch là hệ quả, không phải định nghĩa rủi ro.","Đúng: yếu tố không chắc chắn ảnh hưởng mục tiêu.","Sai sót đã xảy ra không phải rủi ro."],knowledgeIds:["b11-rui-ro"],tags:["Rủi ro","sự kiện không chắc chắn"]},"q11-06":{answer:["B"],hints:["Tuyến 1 là các bộ phận vận hành (kinh doanh, mua hàng, kế toán, sản xuất).","Họ là người ‘quản lý rủi ro tại chỗ’, chịu trách nhiệm đầu tiên nếu có sai sót.","Tuyến 2 chỉ giám sát, không thay thế tuyến 1; giảm kiểm soát không làm hệ thống linh hoạt hay hiệu quả hơn."],explanation:"Tuyến 1 yếu thì rủi ro phát sinh hằng ngày không được nhận diện và xử lý kịp thời.",notes:["Tuyến 2 không thể thay thế hoàn toàn tuyến 1.","Đúng: rủi ro không được nhận diện, xử lý kịp thời.","Hệ thống không trở nên ‘linh hoạt’ mà trở nên lỏng lẻo.","Giảm kiểm soát làm tăng rủi ro."],knowledgeIds:["b11-ba-tuyen"],tags:["Mô hình 3 tuyến","tuyến 1"]},"q11-07":{answer:["D"],hints:["KPI kết quả đo thành quả cuối cùng, mang tính quá khứ – nó cho biết ‘doanh nghiệp đang ở đâu’.","Ví dụ trong bài: doanh thu tháng đạt 2 tỷ, lợi nhuận quý 500 triệu, tỷ lệ nghỉ việc 5%.","Số cuộc gọi mỗi ngày, số buổi đào tạo đã tổ chức là hành động/đầu vào; tỷ lệ chuyển đổi là chỉ số quá trình."],explanation:"Tổng doanh thu đạt được trong quý là thành quả cuối cùng → KPI kết quả. Các chỉ số còn lại là hoạt động/quá trình.",notes:["Số cuộc gọi mỗi ngày là KPI dẫn dắt/tác nghiệp.","Số buổi đào tạo là hoạt động đầu vào.","Tỷ lệ chuyển đổi là chỉ số quá trình dẫn tới đơn hàng.","Đúng: doanh thu quý là thành quả cuối cùng."],knowledgeIds:["b11-kpi-tinh-chat"],tags:["KPI","kpi kết quả"]},"q11-08":{answer:["D"],hints:["Tuyến 1 vận hành và tuyến 2 giám sát; tuyến 3 là kiểm toán nội bộ — khác ở chỗ nào?","Bài giảng: ‘tuyến độc lập với hai tuyến trên’, đánh giá toàn bộ hệ thống và báo cáo trực tiếp cho ban quản trị.","Ban hành chính sách là của tuyến 2; kiểm soát hằng ngày và trực tiếp quản trị rủi ro là của tuyến 1."],explanation:"Điểm khác biệt then chốt của tuyến 3 là độc lập và báo cáo trực tiếp cho ban quản trị/HĐQT.",notes:["Ban hành chính sách là vai trò của tuyến 2.","Kiểm soát hằng ngày là của tuyến 1.","Quản trị rủi ro trực tiếp là của tuyến 1.","Đúng: độc lập, báo cáo trực tiếp cho HĐQT."],knowledgeIds:["b11-ba-tuyen"],tags:["Mô hình 3 tuyến","tuyến 3"]},"q11-09":{answer:["A"],hints:["KPI tác nghiệp thuộc phân loại theo cấp độ quản trị (chiến lược – tác nghiệp).","Đo hiệu quả hoạt động hằng ngày của phòng ban, nhân viên; KPI tác nghiệp tốt góp phần đạt KPI chiến lược.","Phản ánh kết quả tài chính cuối cùng là KPI kết quả/chiến lược; thay thế hoàn toàn KPI chiến lược thì không thể."],explanation:"KPI tác nghiệp giúp theo dõi, điều chỉnh hoạt động hằng ngày để góp phần đạt mục tiêu chiến lược (liên kết dọc).",notes:["Đúng: hỗ trợ theo dõi, điều chỉnh hoạt động hằng ngày để góp phần đạt mục tiêu chiến lược.","Đó là vai trò của KPI kết quả/chiến lược.","Không thay thế được KPI chiến lược.","Không chỉ để đánh giá cá nhân riêng lẻ."],knowledgeIds:["b11-kpi-cap-do"],tags:["KPI","kpi tác nghiệp"]},"q11-10":{answer:["C"],hints:["KPI dẫn dắt (leading) khác KPI kết quả (lagging) ở hướng thời gian.","KPI dẫn dắt đo các yếu tố đầu vào hoặc quá trình có khả năng dự báo kết quả tương lai.","Báo cáo tài chính định kỳ, kết quả đã đạt và chi phí phát sinh đều là thông tin về quá khứ."],explanation:"KPI dẫn dắt dự báo và tác động đến khả năng đạt mục tiêu trong tương lai.",notes:["Không chỉ dùng cho báo cáo tài chính định kỳ.","Đó là vai trò của KPI kết quả.","Đúng: dự báo và tác động đến mục tiêu tương lai.","Ghi nhận chi phí là việc của kế toán."],knowledgeIds:["b11-kpi-tinh-chat"],tags:["KPI","kpi dẫn dắt"]},"q11-11":{answer:["A","C"],confidence:"verify",hints:["Với từng chỉ số hãy hỏi: đây là hành động/đầu vào có thể tác động tới kết quả, hay là kết quả đã xảy ra?","Ví dụ KPI dẫn dắt: số cuộc gọi bán hàng mỗi ngày, số khách hàng tiềm năng mới mỗi tháng/tuần, số giờ đào tạo mỗi quý.","Tỷ lệ nghỉ việc 10% và lợi nhuận quý đạt 1 tỷ là những con số kết quả đã xảy ra."],explanation:"Số khách hàng mới/tháng và số cuộc gọi chăm sóc khách hàng mỗi ngày là các hành động/đầu vào dự báo kết quả → KPI dẫn dắt; tỷ lệ nghỉ việc và lợi nhuận quý là KPI kết quả.",notes:["Đúng: số khách hàng mới/tháng là đầu vào dự báo doanh thu.","Tỷ lệ nghỉ việc là KPI kết quả (đã xảy ra).","Đúng: số cuộc gọi mỗi ngày là hành động có thể tác động kết quả.","Lợi nhuận quý là KPI kết quả."],knowledgeIds:["b11-kpi-tinh-chat"],tags:["KPI","kpi dẫn dắt"]},"q11-12":{answer:["B","C","D"],hints:["Bài giảng chia KPI thành ba cách tiếp cận.","Hãy tự hỏi ba câu: KPI thuộc tầng quản lý nào (chiến lược – tác nghiệp)? Đo cái đã xảy ra hay cái dự báo (kết quả – dẫn dắt)? Thuộc mảng hoạt động nào (tài chính, nhân sự, quy trình, học tập)?","Có một phương án nghe hợp lý nhưng không nằm trong ba cách đó — thử đối chiếu từng phương án với danh sách."],explanation:"Ba cách phân loại KPI: theo cấp độ quản trị, tính chất đo lường và lĩnh vực. ‘Theo chiến lược’ không phải một cách phân loại riêng.",notes:["Không phải một cách phân loại; ‘chiến lược’ chỉ là một loại trong cấp độ quản trị.","Đúng: cấp độ quản trị.","Đúng: tính chất đo lường.","Đúng: lĩnh vực."],knowledgeIds:["b11-kpi-linh-vuc","b11-kpi-cap-do","b11-kpi-tinh-chat"],tags:["KPI","phân loại kpi"]},"q11-13":{answer:["A"],hints:["KPI kết quả cho biết ‘đã xảy ra gì’; KPI dẫn dắt giúp thấy sớm điều sắp xảy ra.","Kết quả chỉ có sau khi hoàn thành nên mang tính quá khứ — khó can thiệp khi đang thực hiện.","Các phương án khẳng định tăng khả năng dự báo, tính chủ động hay giảm phụ thuộc chỉ số định lượng là ngược với tình huống thiếu KPI dẫn dắt."],explanation:"Chỉ dùng KPI kết quả thì vẫn theo dõi được kết quả cuối nhưng thiếu cơ sở để điều chỉnh kịp thời trong quá trình thực hiện.",notes:["Đúng: thiếu cơ sở điều chỉnh kịp thời.","Khả năng dự báo giảm chứ không tăng.","Thiếu KPI dẫn dắt làm giảm tính chủ động.","Không liên quan đến việc giảm phụ thuộc chỉ số định lượng."],knowledgeIds:["b11-kpi-tinh-chat"],tags:["KPI","kpi dẫn dắt"]},"q11-14":{answer:["C"],hints:["Bài giảng nói quy trình xác định rủi ro ‘bắt đầu bằng hai bước cơ bản’.","Bước 1 là nhận diện rủi ro; bước 2 là xác định mức độ ảnh hưởng nếu rủi ro phát sinh.","Kiểm soát, đánh giá và giảm thiểu rủi ro thuộc phần quản trị rủi ro rộng hơn/các bước sau."],explanation:"Quy trình xác định rủi ro: nhận diện rủi ro → xác định mức độ ảnh hưởng.",notes:["Kiểm soát rủi ro là bước sau khi xác định.","Đánh giá rủi ro (khả năng × ảnh hưởng) là phần mở rộng, không phải tên bước 2 trong quy trình xác định.","Đúng: nhận diện → xác định mức độ ảnh hưởng.","Giảm thiểu là biện pháp ứng phó, không phải xác định."],knowledgeIds:["b11-nhan-dien-rui-ro"],tags:["Rủi ro","quy trình xác định rủi ro"]},"q11-15":{answer:["D"],hints:["Ma trận đánh giá rủi ro dùng hai yếu tố làm hai trục.","Hai yếu tố: khả năng xảy ra và mức độ ảnh hưởng; kèm tín hiệu cảnh báo, người phụ trách, kế hoạch ứng phó.","Phân bổ nhân sự, ghi nhận chi phí và theo dõi tiến độ là các công cụ quản trị dự án khác."],explanation:"Ma trận rủi ro dùng để xác định và phân loại rủi ro theo mức độ ảnh hưởng và khả năng xảy ra.",notes:["Phân bổ nhân sự là công việc khác.","Ghi nhận chi phí là việc của kế toán.","Theo dõi tiến độ dùng công cụ lập tiến độ.","Đúng: phân loại rủi ro theo ảnh hưởng và khả năng xảy ra."],knowledgeIds:["b11-ma-tran-rui-ro"],tags:["Rủi ro","ma trận rủi ro"]}},hp={...Jd,...Zd,...np,...tp,...ep,...ip},Ph=Yd.map(n=>{const t=hp[n.id];if(!t)throw new Error(`Thiếu metadata cho ${n.id}`);return{id:n.id,quiz:n.quiz,number:n.number,type:n.type,prompt:n.prompt,options:n.options,answer:t.answer,confidence:t.confidence??"high",hints:t.hints,explanation:t.e
