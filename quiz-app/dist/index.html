- Gắn với **chiến lược** (tuyển dụng, đào tạo, sử dụng đúng thời điểm, đúng năng lực), **tài chính** (kiểm soát chi phí nhân sự, nâng năng suất), **marketing – bán hàng** (thái độ nhân viên là bộ mặt DN), **sản xuất – vận hành** (kỷ luật, chất lượng) và **giảm rủi ro** nhân sự – pháp lý.
- Mục tiêu cuối: đúng người, đúng việc, đúng thời điểm.`,example:"DN định hướng mở rộng thị trường → nhân sự phải chuẩn bị đội ngũ bán hàng và quản lý phù hợp.",keywords:["qtns","quản trị nhân sự","hrm","nhân lực","mục tiêu chiến lược","đúng người đúng việc"],related:["b06-tuyen-dung-6-buoc","b06-nang-suat"]},{id:"b06-tuyen-dung-6-buoc",lesson:dn,title:"Quy trình tuyển dụng 6 bước",source:"Bài 6 · Phần 1",summary:"Xác định yêu cầu → nguồn ứng viên → xem hồ sơ → phỏng vấn → kiểm tra năng lực & xác minh → lựa chọn & thương lượng.",body:`1. **Xác định yêu cầu tuyển dụng** (vị trí, năng lực).
2. **Lựa chọn nguồn ứng viên** (nội bộ/bên ngoài).
3. **Xem xét hồ sơ và lý lịch** – sàng lọc.
4. **Phỏng vấn ứng viên**.
5. **Kiểm tra năng lực và xác minh thông tin**.
6. **Lựa chọn ứng viên và thương lượng đề nghị tuyển dụng**, ký hợp đồng lao động.

Tuyển sai người ngay từ đầu thì đào tạo, đánh giá phía sau khó hiệu quả.`,keywords:["tuyển dụng","quy trình tuyển dụng","6 bước","recruitment"],related:["b06-bon-dung","b06-sang-loc","b06-phong-van","b06-kiem-tra-lua-chon"]},{id:"b06-bon-dung",lesson:dn,title:"Bước 1: Nguyên tắc “4 đúng” & bản mô tả công việc",source:"Bài 6 · Phần 1",summary:"Xác định yêu cầu tuyển dụng theo 4 đúng: số lượng, kỹ năng, vị trí, thời điểm; kèm bản mô tả công việc linh hoạt.",body:`- **4 đúng**: đúng số lượng, đúng kỹ năng, đúng vị trí, đúng thời điểm.
- **Bản mô tả công việc**: chức danh, nhiệm vụ, người quản lý trực tiếp, điều kiện làm việc, trách nhiệm, công cụ – thiết bị. Nên **linh hoạt, tránh cứng nhắc** để nhân viên thử nghiệm cái mới.
- **Thông báo tuyển dụng**: số lượng, mô tả, địa điểm, yêu cầu, quyền lợi, hồ sơ, liên hệ, thời gian nhận hồ sơ.`,example:"Mở chi nhánh mới: cần bao nhiêu nhân viên, kỹ năng gì, bộ phận nào, tuyển trước ngày khai trương bao lâu.",keywords:["4 đúng","bốn đúng","mô tả công việc","jd","thông báo tuyển dụng","yêu cầu tuyển dụng"],related:["b06-tuyen-dung-6-buoc"]},{id:"b06-nguon-ung-vien",lesson:dn,title:"Bước 2: 6 nguồn ứng viên",source:"Bài 6 · Phần 1",summary:"Internet, trường học, giới thiệu nội bộ, thăng tiến nội bộ, quảng cáo tuyển dụng, công ty săn đầu người.",body:`Nên **kết hợp nhiều nguồn** vì khó biết trước nguồn nào hiệu quả nhất.
1. **Internet** (VietnamWorks, CareerBuilder, TopCV, Facebook, website DN).
2. **Trường đại học** (dịch vụ hỗ trợ việc làm).
3. **Giới thiệu nội bộ** – rút ngắn thời gian tìm kiếm.
4. **Thăng tiến nội bộ** – dễ đánh giá, tăng lòng trung thành; nhưng có thể gây mâu thuẫn và thiếu ý tưởng mới.
5. **Quảng cáo tuyển dụng** (báo chí, hiệp hội, trung tâm hướng nghiệp).
6. **Công ty săn đầu người** – cho quản lý cấp cao, chuyên gia.`,keywords:["nguồn ứng viên","headhunter","săn đầu người","giới thiệu nội bộ","thăng tiến nội bộ","topcv"],related:["b06-tuyen-dung-6-buoc"]},{id:"b06-sang-loc",lesson:dn,title:"Bước 3: Xem xét hồ sơ – sàng lọc",source:"Bài 6 · Phần 1",summary:"Sàng lọc hồ sơ theo tiêu chí đã xác định, loại ứng viên không phù hợp để chọn người vào vòng phỏng vấn.",body:`- Mục tiêu: **sàng lọc và chọn ứng viên tiềm năng nhất** để chuyển sang phỏng vấn.
- Sàng lọc theo tiêu chí ở bước 1: học vấn, kinh nghiệm, kỹ năng chuyên môn (qua CV, thư xin việc, hồ sơ năng lực).
- **Hồ sơ không đáp ứng yêu cầu cơ bản sẽ bị loại** → tiết kiệm thời gian, chi phí.
- Xem lý lịch, thông tin cá nhân để đảm bảo độ tin cậy; lập danh sách ứng viên đạt để mời phỏng vấn.`,example:"Vị trí kế toán yêu cầu tối thiểu 2 năm kinh nghiệm → hồ sơ chưa đáp ứng bị loại.",keywords:["sàng lọc hồ sơ","xem xét hồ sơ","loại hồ sơ","cv","lý lịch"],related:["b06-tuyen-dung-6-buoc","b06-phong-van"]},{id:"b06-phong-van",lesson:dn,title:"Bước 4: Phỏng vấn ứng viên",source:"Bài 6 · Phần 1",summary:"Đánh giá toàn diện: kiến thức, kỹ năng, kinh nghiệm, thái độ, động cơ và sự phù hợp văn hóa doanh nghiệp.",body:`Phỏng vấn đánh giá **không chỉ năng lực mà còn thái độ và sự phù hợp lâu dài**:
- Xác nhận lại thông tin hồ sơ.
- Đánh giá **kiến thức, kỹ năng, kinh nghiệm** (câu hỏi chuyên môn/tình huống giả định).
- Tìm hiểu **thái độ, động cơ, mức độ cam kết**.
- Đánh giá **phù hợp văn hóa DN** (phong cách làm việc, hợp tác, kỷ luật).
- Quan sát giao tiếp, ứng xử, xử lý tình huống; trao đổi kỳ vọng, lương, thời gian; giải đáp thắc mắc.`,keywords:["phỏng vấn","interview","thái độ","động cơ","văn hóa doanh nghiệp","phù hợp công việc"],related:["b06-kiem-tra-lua-chon"]},{id:"b06-kiem-tra-lua-chon",lesson:dn,title:"Bước 5–6: Kiểm tra năng lực, xác minh & lựa chọn",source:"Bài 6 · Phần 1",summary:"Kiểm tra chuyên môn/kỹ năng, xác minh học vấn – kinh nghiệm, rồi so sánh ứng viên, thương lượng và ký hợp đồng.",body:`- **Bước 5**: bài kiểm tra chuyên môn (kế toán làm bài test hạch toán; bán hàng xử lý tình huống tư vấn), kỹ năng mềm; **xác minh** học vấn, kinh nghiệm, tham khảo người quản lý cũ.
- **Bước 6**: tổng hợp kết quả, so sánh theo tiêu chí, xây dựng **đề nghị tuyển dụng** (lương, phúc lợi, vị trí, thời gian), thương lượng, thống nhất ngày bắt đầu, **ký hợp đồng lao động**.`,keywords:["kiểm tra năng lực","xác minh thông tin","thương lượng","hợp đồng lao động","đề nghị tuyển dụng"],related:["b06-tuyen-dung-6-buoc"]},{id:"b06-dao-tao",lesson:dn,title:"Đào tạo nội bộ vs đào tạo bên ngoài",source:"Bài 6 · Phần 1",summary:"Nội bộ: chi phí thấp, linh hoạt, sát thực tế, hợp nhân viên mới. Bên ngoài: chuyên sâu, cập nhật, chi phí cao hơn.",body:`**Đào tạo nội bộ** – do chính DN tổ chức: quy trình làm việc, nghiệp vụ, kỹ năng bán hàng, văn hóa DN. Ưu điểm: **chi phí thấp, linh hoạt, sát công việc thực tế**; đặc biệt phù hợp **nhân viên mới** và khi cần chuẩn hóa cách làm việc.

**Đào tạo bên ngoài** – đơn vị chuyên nghiệp/chuyên gia: chuyên sâu, cập nhật xu hướng; hợp với nhân sự chủ chốt, quản lý. **Chi phí cao hơn, ít linh hoạt** nhưng nâng năng lực cạnh tranh.

DN hiệu quả **kết hợp linh hoạt cả hai**.`,keywords:["đào tạo nội bộ","đào tạo bên ngoài","đào tạo và phát triển","training"],related:["b06-giu-chan"]},{id:"b06-giu-chan",lesson:dn,title:"Biện pháp giữ chân nhân viên",source:"Bài 6 · Phần 2",summary:"Đào tạo – định hướng ngay từ đầu, chương trình khuyến khích, ghi nhận kịp thời, lộ trình phát triển rõ ràng, phúc lợi.",body:`Tỷ lệ giữ chân cao giúp **giảm chi phí tuyển dụng, đào tạo**; tỷ lệ nghỉ việc cao gây tốn kém, xáo trộn hoạt động, ảnh hưởng chất lượng dịch vụ.
- Đào tạo & định hướng hiệu quả từ đầu → nhanh hòa nhập.
- Chương trình khuyến khích: linh hoạt công việc, tinh thần đồng đội/cộng đồng.
- Trao cơ hội lãnh đạo, **ghi nhận kịp thời**, mở **con đường phát triển rõ ràng**.
- **Phúc lợi** – hiệu quả khi DN không đủ ngân sách tăng lương nhiều.`,keywords:["giữ chân","nghỉ việc","turnover","phúc lợi","lộ trình phát triển","lộ trình nghề nghiệp"],related:["b06-herzberg","b06-dong-luc"]},{id:"b06-dong-luc",lesson:dn,title:"Động lực bên trong & động lực bên ngoài",source:"Bài 6 · Phần 2",summary:"Bên trong: suy nghĩ tích cực, thái độ sống, mục đích. Bên ngoài: tổ chức, quản lý, lương thưởng, môi trường.",body:`- **Động lực bên trong**: xuất phát từ chính bản thân – **suy nghĩ tích cực, thái độ sống, mục đích rõ ràng** trong cuộc sống và công việc.
- **Động lực bên ngoài**: đến từ **tổ chức và người quản lý** – lương, thưởng, phúc lợi, công việc phù hợp năng lực, phong cách lãnh đạo, **môi trường làm việc** tích cực.
- Nhà quản trị cần kết hợp cả hai: khơi gợi bên trong + tạo điều kiện bên ngoài.`,keywords:["động lực bên trong","động lực bên ngoài","tạo động lực","motivation","intrinsic","extrinsic"],related:["b06-herzberg"]},{id:"b06-herzberg",lesson:dn,title:"Thuyết hai nhân tố của Herzberg",source:"Bài 6 · Phần 2",summary:"Nhân tố động viên → sự thỏa mãn; nhân tố duy trì → nếu không tốt gây bất mãn.",body:`**Nhân tố động viên** (bên trong) → liên quan **sự thỏa mãn**: đạt kết quả mong muốn, được thừa nhận, được tôn trọng – tin tưởng – giao trách nhiệm, sự tiến bộ nghề nghiệp (cơ hội học hỏi, thăng tiến), sự tăng trưởng.

**Nhân tố duy trì** (bên ngoài) → **nếu không tốt sẽ gây bất mãn**: chế độ chính sách – quy chế không rõ ràng, **giám sát không phù hợp**, điều kiện làm việc, lương thưởng không công bằng, quan hệ với đồng nghiệp/cấp trên.

Đáp ứng nhân tố duy trì chỉ giúp **không bất mãn**, chưa chắc tạo động lực mạnh.`,example:"Tăng lương giúp bớt khó chịu, nhưng để làm việc say mê hơn cần nhân tố động viên.",keywords:["herzberg","hai nhân tố","nhân tố động viên","nhân tố duy trì","bất mãn","thỏa mãn","two factor"],related:["b06-dong-luc","b06-maslow"]},{id:"b06-maslow",lesson:dn,title:"Tháp nhu cầu 5 bậc của Maslow",source:"Bài 6 · Phần 2",summary:"Sinh lý → an toàn → hòa hợp (xã hội) → được tôn trọng → thể hiện bản thân; thỏa mãn từ thấp lên cao.",body:`1. **Sinh lý**: hít thở, ăn uống, ngủ…
2. **An toàn**: thân thể, việc làm, gia đình, sức khỏe, tài sản.
3. **Hòa hợp** (xã hội): bạn bè, yêu thương, tham gia nhóm.
4. **Được tôn trọng**: kính mến, tin tưởng.
5. **Thể hiện bản thân**: sáng tạo, thể hiện khả năng, được công nhận thành đạt.

Nhu cầu **không xuất hiện đồng thời** mà được thỏa mãn từ bậc thấp lên cao.`,keywords:["maslow","tháp nhu cầu","5 bậc","nhu cầu","masow"],related:["b06-herzberg"]},{id:"b06-cham-dut-hdld",lesson:dn,title:"Chấm dứt hợp đồng lao động (Điều 34 BLLĐ)",source:"Bài 6 · Phần 2",summary:"Không chỉ sa thải/nghỉ việc: hết hạn, hoàn thành công việc, thỏa thuận, đơn phương chấm dứt đúng luật, thử việc không đạt…",body:`Theo **Điều 34 Bộ luật Lao động**, HĐLĐ chấm dứt khi:
- Hết hạn hợp đồng hoặc đã hoàn thành công việc theo thỏa thuận.
- Hai bên thỏa thuận chấm dứt.
- Người lao động bị cấm làm công việc theo bản án; lao động nước ngoài bị trục xuất / hết hiệu lực giấy phép.
- Người lao động hoặc người sử dụng lao động chết, mất năng lực hành vi dân sự.
- Kỷ luật sa thải; đơn phương chấm dứt đúng quy định; cho thôi việc.
- Thử việc không đạt hoặc một bên hủy thỏa thuận thử việc.`,keywords:["chấm dứt hợp đồng","điều 34","bộ luật lao động","sa thải","thôi việc","hđlđ"],related:["b06-giu-chan"]},{id:"b06-thue-ngoai",lesson:dn,title:"Thuê ngoài (outsourcing): khái niệm & lợi ích",source:"Bài 6 · Phần 2",summary:"Dùng đơn vị bên ngoài (trong/ngoài nước) thực hiện công việc trước đây DN tự làm; mục tiêu tối ưu nguồn lực.",body:`**Thuê ngoài** là hình thức DN sử dụng các **đơn vị bên ngoài** (trong nước hoặc nước ngoài) để thực hiện những công việc **trước đây do chính DN đảm nhiệm**.

**Lợi ích**: giảm chi phí (nhân sự, đào tạo, trang thiết bị); nâng hiệu quả nhờ chuyên môn cao; triển khai dự án mới nhanh; **tập trung hoạt động cốt lõi** (bán hàng, phát triển sản phẩm, chăm sóc khách hàng); giảm rủi ro vận hành – pháp lý nếu chọn đối tác phù hợp.`,keywords:["thuê ngoài","outsourcing","bên thứ ba","lợi ích thuê ngoài"],related:["b06-nen-khong-nen-thue-ngoai"]},{id:"b06-nen-khong-nen-thue-ngoai",lesson:dn,title:"Hoạt động nên / không nên thuê ngoài",source:"Bài 6 · Phần 2",summary:"Nên: kế toán, pháp lý, marketing, trợ lý ảo… Không nên: bán hàng, phát triển công nghệ (gắn lợi thế cạnh tranh).",body:`**Nên thuê ngoài**: công việc chuyên môn cao nhưng không phải chức năng chính – **kế toán, ghi sổ, dịch vụ pháp lý**, xây dựng gói phúc lợi, hỗ trợ chuyên gia, IT, **marketing**, trợ lý ảo.

**Không nên thuê ngoài**: việc gắn trực tiếp lợi thế cạnh tranh:
- **Bán hàng** – cần đội nội bộ hiểu sản phẩm và khách hàng.
- **Phát triển công nghệ** – liên quan bí quyết, dữ liệu quan trọng.
- Thuê chuyên gia chi phí quá cao hoặc công ty nước ngoài → tăng rủi ro chi phí, bảo mật, kiểm soát.`,example:"DN nhỏ thuê công ty kế toán làm báo cáo thuế thay vì nhân viên kế toán toàn thời gian.",keywords:["không nên thuê ngoài","nên thuê ngoài","bán hàng","kế toán","phát triển công nghệ","cốt lõi"],related:["b06-thue-ngoai"]},{id:"b06-nang-suat",lesson:dn,title:"Tăng năng suất lao động bằng công nghệ & làm việc từ xa",source:"Bài 6 · Phần 2",summary:"Ứng dụng công nghệ văn phòng/sản xuất, thiết bị thông minh, phần mềm, hợp tác trực tuyến, làm việc từ xa.",body:`Làm việc chăm chỉ chưa đủ, phải **hiệu quả**. Để tăng năng suất, DN tận dụng **công nghệ và phương thức làm việc hiện đại**:
- Công nghệ văn phòng/sản xuất: email thay giấy, đặt hàng online, khai thuế điện tử.
- Thiết bị thông minh (smartphone, iPad) ghi chú, bán hàng, quản lý công việc mọi lúc mọi nơi.
- Phần mềm nâng năng suất (Evernote…), công cụ giao tiếp nội bộ.
- Hội nghị online, chia sẻ dữ liệu, **làm việc từ xa** → giảm chi phí đi lại, rút ngắn ra quyết định.
Cần hạ tầng công nghệ, chính sách bảo mật, cơ chế quản lý hiệu suất.`,keywords:["năng suất lao động","tăng năng suất","công nghệ","làm việc từ xa","remote","evernote"],related:["b06-vai-tro"]}],Qn=7,Gp=[{id:"b07-vai-tro-ke-toan",lesson:Qn,title:"Vai trò hệ thống kế toán – “ngôn ngữ của kinh doanh”",source:"Bài 7 · Phần 1",summary:"Kế toán là nguồn thông tin đầu vào cho mọi quyết định quản trị; học kế toán để quản trị tốt hơn, không phải để làm kế toán.",body:`- Hệ thống kế toán cung cấp thông tin để **ra quyết định** (đầu tư, vay vốn, mở rộng/thu hẹp), phản ánh tài sản, nguồn vốn, doanh thu, chi phí, lợi nhuận.
- **Kiểm soát dòng tiền**, lập kế hoạch tài chính, dự toán; **kiểm soát chi phí**, phát hiện khoản chi không hợp lý.
- Đảm bảo **minh bạch, tuân thủ pháp luật thuế**, tạo niềm tin với ngân hàng/đối tác.
- Buffett: kế toán là **ngôn ngữ của kinh doanh**. Chủ DN không hiểu kế toán như người xem bóng chày không biết luật chơi.
- Nhà quản trị cần **đọc, diễn giải được doanh thu, chi phí, lợi nhuận, dòng tiền** – “học kế toán không phải để làm kế toán mà để quản trị tốt hơn”.`,example:"DN báo cáo có lãi nhưng không đủ tiền trả lương và nhà cung cấp: do hàng tồn kho lớn hoặc khách chưa thanh toán.",keywords:["vai trò kế toán","hệ thống kế toán","ngôn ngữ kinh doanh","buffett","warren buffett","kế toán không hoàn thiện","ra quyết định"],related:["b07-4-bctc","b07-luu-chuyen-tien-te"]},{id:"b07-4-bctc",lesson:Qn,title:"Hệ thống 4 báo cáo tài chính (TT 99/2025/TT-BTC)",source:"Bài 7 · Phần 1",summary:"B01 Tình hình tài chính, B02 Kết quả hoạt động kinh doanh, B03 Lưu chuyển tiền tệ, B09 Thuyết minh BCTC.",body:`Điều 17 Thông tư 99/2025/TT-BTC:
- **B01-DN** Báo cáo tình hình tài chính: tại một thời điểm, DN có bao nhiêu tài sản, nợ phải trả, vốn chủ sở hữu.
- **B02-DN** Báo cáo kết quả hoạt động kinh doanh: doanh thu, chi phí, lợi nhuận trong một kỳ.
- **B03-DN** Báo cáo lưu chuyển tiền tệ: dòng tiền vào – ra, đủ tiền duy trì hoạt động hay không.
- **B09-DN** Thuyết minh BCTC: giải thích chi tiết số liệu.
BCTC phản ánh **tình hình tài chính và kết quả hoạt động** của doanh nghiệp.`,keywords:["báo cáo tài chính","bctc","b01","b02","b03","b09","thông tư 99","4 báo cáo"],related:["b07-bcthtc","b07-doanh-thu","b07-luu-chuyen-tien-te","b07-thuyet-minh"]},{id:"b07-bcthtc",lesson:Qn,title:"Báo cáo tình hình tài chính: Tài sản = Nguồn vốn",source:"Bài 7 · Phần 1",summary:"“Ảnh chụp” tài chính tại một thời điểm: tài sản (có gì) = nguồn vốn (hình thành từ đâu).",body:`- Phản ánh toàn bộ **tài sản và nguồn vốn tại một thời điểm** (cuối quý/cuối năm) – không phải dòng chảy cả năm.
- Nguyên tắc cốt lõi: **Tổng tài sản = Tổng nguồn vốn**; nguồn vốn gồm **nợ phải trả + vốn chủ sở hữu**.
- Giúp đánh giá quy mô, mức độ sử dụng vốn, mức độ phụ thuộc vốn vay, an toàn tài chính.`,formula:"Tổng tài sản = Nợ phải trả + Vốn chủ sở hữu",example:"Mua máy 1 tỷ: vay ngân hàng 600 triệu + vốn chủ 400 triệu → tài sản tăng 1 tỷ, nguồn vốn tăng 1 tỷ.",keywords:["báo cáo tình hình tài chính","bảng cân đối kế toán","tài sản bằng nguồn vốn","một thời điểm","ảnh chụp tài chính"],related:["b07-tai-san","b07-no-vcsh"]},{id:"b07-tai-san",lesson:Qn,title:"Tài sản ngắn hạn & tài sản dài hạn",source:"Bài 7 · Phần 1",summary:"Ngắn hạn: luân chuyển < 1 năm (tiền, phải thu, hàng tồn kho…). Dài hạn: > 1 năm (TSCĐ, BĐS đầu tư…).",body:`**Tài sản ngắn hạn** (luân chuyển dưới 1 năm/1 chu kỳ kinh doanh): tiền & tương đương tiền, đầu tư tài chính ngắn hạn, **phải thu ngắn hạn**, **hàng tồn kho**, tài sản ngắn hạn khác. Phải thu quá lớn → khó khăn dòng tiền; tồn kho lớn → ứ đọng vốn.

**Tài sản dài hạn** (chu kỳ > 1 năm): phải thu dài hạn, **tài sản cố định** (nguyên giá ≥ 30 triệu, phân bổ qua khấu hao), bất động sản đầu tư, đầu tư tài chính dài hạn.`,keywords:["tài sản ngắn hạn","tài sản dài hạn","tsnh","tscđ","hàng tồn kho","khấu hao","phải thu"],related:["b07-bcthtc"]},{id:"b07-no-vcsh",lesson:Qn,title:"Nợ phải trả & vốn chủ sở hữu",source:"Bài 7 · Phần 1",summary:"Vốn chủ sở hữu = Tổng tài sản − Tổng nợ phải trả: phần thực sự thuộc về chủ doanh nghiệp.",body:`- **Nợ phải trả**: nghĩa vụ tài chính với các bên – phải trả người bán, người lao động, thuế và các khoản nộp nhà nước, vay nợ tài chính…
- **Vốn chủ sở hữu (VCSH)**: vốn góp, lợi nhuận sau thuế chưa phân phối, các quỹ… Đánh giá mức tự chủ tài chính, khả năng chịu rủi ro.`,formula:"VCSH = Tổng tài sản − Tổng nợ phải trả",keywords:["vốn chủ sở hữu","vcsh","nợ phải trả","equity","tổng tài sản trừ nợ"],related:["b07-bcthtc","b08-don-bay"]},{id:"b07-doanh-thu",lesson:Qn,title:"Doanh thu, giảm trừ doanh thu, doanh thu thuần",source:"Bài 7 · Phần 2",summary:"Doanh thu thuần = Doanh thu − các khoản giảm trừ (chiết khấu thương mại, giảm giá, hàng bán bị trả lại, thuế không hoàn lại).",body:`- **Doanh thu**: toàn bộ giá trị tiền **thu được hoặc sẽ thu được** từ bán hàng hóa, sản phẩm, cung cấp dịch vụ trong kỳ = số lượng × giá bán.
- **Các khoản giảm trừ**: **chiết khấu thương mại**, **giảm giá hàng bán**, **hàng bán bị trả lại**, **các loại thuế không được hoàn lại** (tiêu thụ đặc biệt, xuất khẩu).
- **Doanh thu thuần** là số tiền thực tế DN được hưởng, cơ sở tính lợi nhuận.
- Ngoài ra: **doanh thu hoạt động tài chính** (lãi tiền gửi, cổ tức…) và **thu nhập khác** (bán TSCĐ, bồi thường…).`,formula:"Doanh thu thuần = Doanh thu − Các khoản giảm trừ doanh thu",example:"Bán 1.000 SP × 200.000đ = 200 triệu; giảm giá 10tr, trả lại 5tr, thuế TTĐB 15tr → doanh thu thuần 170 triệu.",keywords:["doanh thu","doanh thu thuần","giảm trừ doanh thu","chiết khấu thương mại","hàng bán bị trả lại","giảm giá hàng bán","thuế tiêu thụ đặc biệt"],related:["b07-loi-nhuan","b07-chi-phi"]},{id:"b07-chi-phi",lesson:Qn,title:"5 loại chi phí trong báo cáo kết quả kinh doanh",source:"Bài 7 · Phần 2",summary:"Giá vốn hàng bán, chi phí bán hàng, chi phí quản lý doanh nghiệp, chi phí tài chính, chi phí khác.",body:`1. **Giá vốn hàng bán**: chi phí trực tiếp gắn với sản phẩm đã bán (nguyên vật liệu, nhân công, sản xuất chung).
2. **Chi phí bán hàng**: đưa sản phẩm đến khách – **quảng cáo, hoa hồng đại lý**, clip giới thiệu, hội nghị khách hàng.
3. **Chi phí quản lý doanh nghiệp**: lương nhân viên quản lý, bảo vệ, văn phòng phẩm, điện nước, tiếp khách, thuế & phí.
4. **Chi phí tài chính**: lãi vay, lỗ đầu tư chứng khoán, góp vốn liên doanh.
5. **Chi phí khác**: không thường xuyên – tiền phạt, bồi thường hợp đồng, thanh lý TSCĐ.`,keywords:["chi phí bán hàng","chi phí quản lý doanh nghiệp","giá vốn hàng bán","chi phí tài chính","chi phí khác","quảng cáo","hoa hồng đại lý"],related:["b07-loi-nhuan"]},{id:"b07-loi-nhuan",lesson:Qn,title:"Các loại lợi nhuận",source:"Bài 7 · Phần 2",summary:"LN gộp → LN thuần từ HĐKD → (+ kết quả hoạt động khác) → LN kế toán trước thuế → LN sau thuế.",body:`- **Lợi nhuận gộp** = Doanh thu thuần − Giá vốn hàng bán.
- **LN thuần từ HĐKD** = LN gộp ± doanh thu/chi phí tài chính − chi phí bán hàng − chi phí QLDN.
- **Kết quả hoạt động khác** = Thu nhập khác − Chi phí khác.
- **LN kế toán trước thuế** = LN thuần từ HĐKD + kết quả hoạt động khác.
- **LN sau thuế** = LN trước thuế − chi phí thuế TNDN.
Doanh thu tăng nhưng chi phí tăng nhanh hơn → **lợi nhuận giảm**.`,formula:"LN trước thuế = LN thuần từ HĐKD + Kết quả hoạt động khác",example:"LN gộp 200tr, CP bán hàng + QL 80tr, thu nhập tài chính 10tr, thu nhập khác 5tr → LN trước thuế 135tr.",keywords:["lợi nhuận gộp","lợi nhuận thuần","lợi nhuận trước thuế","lợi nhuận sau thuế","kết quả hoạt động khác","lãi lỗ"],related:["b07-doanh-thu","b07-thue-tndn","b08-sinh-loi"]},{id:"b07-thue-tndn",lesson:Qn,title:"Thuế thu nhập doanh nghiệp (TNDN) & thuế suất",source:"Bài 7 · Phần 2",summary:"Thuế TNDN phải nộp = Lợi nhuận kế toán trước thuế × thuế suất; chỉ nộp khi có lãi.",body:`Thuế TNDN là thuế trực thu đánh vào thu nhập chịu thuế; **lỗ thì không phát sinh thuế**.

**Thuế suất**: phổ biến **20%**; DN doanh thu ≤ 3 tỷ/năm: **15%**; từ 3 đến 50 tỷ: **17%**; ngành đặc thù (dầu khí, tài nguyên quý hiếm): **25–50%**; một số trường hợp đến 40%.`,formula:"Thuế TNDN = Lợi nhuận kế toán trước thuế × Thuế suất",example:"LN trước thuế 500tr × 20% = 100tr thuế → LN sau thuế 400tr.",keywords:["thuế tndn","thuế thu nhập doanh nghiệp","thuế suất","20%","15%","17%"],related:["b07-loi-nhuan"]},{id:"b07-luu-chuyen-tien-te",lesson:Qn,title:"Báo cáo lưu chuyển tiền tệ – “lãi nhưng thiếu tiền”",source:"Bài 7 · Phần 2",summary:"Dòng tiền thực thu – thực chi theo 3 hoạt động: kinh doanh, đầu tư, tài chính.",body:`- Khác BCKQKD (lãi/lỗ), báo cáo này tập trung **dòng tiền thực thu, thực chi** → đánh giá khả năng thanh toán và duy trì hoạt động.
- 3 nhóm: **hoạt động kinh doanh**, **hoạt động đầu tư** (mua bán TSCĐ, góp vốn, chứng khoán), **hoạt động tài chính** (vay, trả nợ, góp vốn, trả cổ tức).
- DN có thể **lãi kế toán cao nhưng dòng tiền kinh doanh âm** → rủi ro thanh toán.`,formula:"Tiền cuối kỳ = Tiền đầu kỳ + Tiền thu trong kỳ − Tiền chi trong kỳ",example:"Đầu kỳ 200tr, thu 800tr, chi 700tr → cuối kỳ 300tr.",keywords:["lưu chuyển tiền tệ","dòng tiền","cash flow","lãi nhưng thiếu tiền","tiền cuối kỳ","b03"],related:["b07-4-bctc"]},{id:"b07-thuyet-minh",lesson:Qn,title:"Thuyết minh báo cáo tài chính",source:"Bài 7 · Phần 2",summary:"Bộ phận không tách rời của BCTC: giải thích, làm rõ, bổ sung thông tin các báo cáo chính chưa trình bày đủ.",body:"Kết cấu thường gồm: thông tin chung về DN, kỳ kế toán, đơn vị tiền tệ; chuẩn mực và chế độ kế toán áp dụng, chính sách kế toán chủ yếu; thông tin bổ sung. Giúp người đọc hiểu bối cảnh, cách ghi nhận và ý nghĩa các con số.",keywords:["thuyết minh","b09","chuẩn mực kế toán","chính sách kế toán"],related:["b07-4-bctc"]}],tt=8,Wp=[{id:"b08-vai-tro-qtcp",lesson:tt,title:"Vai trò của quản trị chi phí",source:"Bài 8 · Phần 1",summary:"Kiểm soát & cắt giảm chi không cần thiết, dùng hiệu quả nguồn lực, hạ giá thành, cung cấp cơ sở ra quyết định.",body:`- **Kiểm soát và cắt giảm** khoản chi không cần thiết → tăng lợi nhuận mà không nhất thiết tăng doanh thu.
- Sử dụng **hiệu quả nguồn lực** (nhân lực, vốn, vật lực), tránh lãng phí.
- **Hạ giá thành** → giá cạnh tranh hơn.
- Thông tin chi phí chính xác là **cơ sở ra quyết định** (định giá, chọn phương án đầu tư, mở rộng quy mô).
- Ổn định tài chính, giảm rủi ro, phát triển bền vững.`,keywords:["quản trị chi phí","vai trò chi phí","kiểm soát chi phí","tối ưu chi phí","hạ giá thành","qtcp"],related:["b08-phan-loai-chi-phi"]},{id:"b08-phan-loai-chi-phi",lesson:tt,title:"Khái niệm & 4 cách phân loại chi phí",source:"Bài 8 · Phần 1",summary:"Chi phí = biểu hiện bằng tiền của hao phí nguồn lực. Phân loại theo chức năng, mối quan hệ với sản lượng, nội dung kinh tế, khả năng kiểm soát.",body:`**Chi phí** là **biểu hiện bằng tiền của toàn bộ hao phí** về lao động sống, lao động vật hóa và các nguồn lực khác DN bỏ ra để hoạt động SXKD trong một kỳ.

4 cách phân loại:
1. **Theo chức năng**: sản xuất, bán hàng, quản lý DN (lập BCTC).
2. **Theo mối quan hệ với sản lượng**: cố định, biến đổi, hỗn hợp (phân tích CVP, hòa vốn, SDĐP).
3. **Theo nội dung kinh tế**: nguyên vật liệu, nhân công, khấu hao, dịch vụ mua ngoài… (dự toán).
4. **Theo khả năng kiểm soát**: kiểm soát được / không kiểm soát được (đánh giá trách nhiệm).`,keywords:["chi phí là gì","phân loại chi phí","hao phí nguồn lực","khái niệm chi phí","biểu hiện bằng tiền"],related:["b08-dinh-phi-bien-phi"]},{id:"b08-dinh-phi-bien-phi",lesson:tt,title:"Định phí, biến phí, chi phí hỗn hợp",source:"Bài 8 · Phần 1",summary:"Định phí không đổi theo sản lượng (thuê nhà, khấu hao); biến phí tỷ lệ thuận với sản lượng (NVL trực tiếp); hỗn hợp có cả hai.",body:`- **Chi phí cố định (định phí)**: không đổi theo sản lượng trong một phạm vi công suất – khấu hao TSCĐ, **thuê nhà/thuê tài sản**, bảo hiểm, đào tạo.
- **Chi phí biến đổi (biến phí)**: thay đổi theo mức độ hoạt động/sản lượng – **nguyên vật liệu trực tiếp**, nhân công trực tiếp, hoa hồng bán hàng, điện nước phục vụ sản xuất.
- **Chi phí hỗn hợp**: gồm phần cố định + phần biến đổi – điện, nước, điện thoại (vượt mức cơ bản thì tăng theo sản lượng).`,keywords:["định phí","biến phí","chi phí cố định","chi phí biến đổi","chi phí hỗn hợp","fixed cost","variable cost","thuê nhà","nguyên vật liệu"],related:["b08-sddp"]},{id:"b08-sddp",lesson:tt,title:"Số dư đảm phí (SDĐP)",source:"Bài 8 · Phần 1",formula:"SDĐP = R − VC = (Giá bán − Biến phí đơn vị) × Sản lượng",summary:"Phần chênh lệch giữa doanh thu và tổng biến phí; dùng bù đắp định phí rồi tạo lợi nhuận.",body:`SDĐP = **R − VC** (R: tổng doanh thu, VC: tổng chi phí biến đổi). Dùng để **bù đắp chi phí cố định và sau đó tạo lợi nhuận**.

Ý nghĩa: **SDĐP > định phí → lãi; SDĐP < định phí → lỗ**. Dùng trong phân tích hòa vốn, đánh giá hiệu quả sản phẩm, hỗ trợ quyết định **giá bán, sản lượng, cơ cấu sản phẩm** → giúp đánh giá khả năng sinh lời và ra quyết định kinh doanh.`,example:"Bán 13.000 SP, giá 7.000đ, biến phí 4.000đ/SP, định phí 100 triệu: R = 91tr, VC = 52tr → SDĐP = 39tr < 100tr → lỗ.",keywords:["số dư đảm phí","sddp","contribution margin","r trừ vc","bù đắp chi phí cố định"],related:["b08-hoa-von","b08-dinh-phi-bien-phi"]},{id:"b08-hoa-von",lesson:tt,title:"Điểm hòa vốn",source:"Bài 8 · Phần 1",formula:"R = TC ⇔ P×Q = FC + v×Q ⇒ Q = FC / (P − v)",summary:"Mức sản lượng/doanh thu mà tại đó doanh thu vừa đủ bù đắp toàn bộ chi phí: lợi nhuận bằng 0.",body:`Tại điểm hòa vốn DN **không lãi không lỗ**. Vượt qua điểm này bắt đầu có lợi nhuận; thấp hơn thì lỗ. Giải R = TC.

Hòa vốn giúp xác định mục tiêu sản lượng, đánh giá mức độ rủi ro và quyết định giá bán, chi phí, quy mô. (Bài 9 dùng thêm cho quyết định *make or buy*.)`,example:"P = 7.000; v = 4.000; FC = 100 triệu: 7.000Q = 100.000.000 + 4.000Q → Q ≈ 33.334 sản phẩm.",keywords:["điểm hòa vốn","hòa vốn","break even","bep","không lãi không lỗ"],related:["b08-sddp","b09-make-or-buy"]},{id:"b08-5-nhom-chi-so",lesson:tt,title:"5 nhóm chỉ số tài chính",source:"Bài 8 · Phần 1",summary:"Thanh khoản, đòn bẩy tài chính, sinh lời, quản lý tài sản (hiệu suất hoạt động), giá trị thị trường.",body:`1. **Thanh khoản**: đáp ứng nghĩa vụ nợ ngắn hạn.
2. **Đòn bẩy tài chính**: mức sử dụng nợ và rủi ro tài chính.
3. **Sinh lời**: lợi nhuận từ doanh thu, tài sản, vốn chủ.
4. **Quản lý tài sản / hiệu suất hoạt động**: sử dụng tài sản có hiệu quả không.
5. **Giá trị thị trường**: cách thị trường định giá DN (ít vai trò với DN nhỏ không niêm yết).`,keywords:["chỉ số tài chính","5 nhóm chỉ số","ratio","năm nhóm"],related:["b08-thanh-khoan","b08-don-bay","b08-sinh-loi","b08-hieu-suat-tai-san"]},{id:"b08-thanh-khoan",lesson:tt,title:"Chỉ số thanh khoản: hiện hành, nhanh, tức thời",source:"Bài 8 · Phần 1",summary:"Thanh toán nhanh = (Tài sản ngắn hạn − Hàng tồn kho) / Nợ ngắn hạn; muốn cải thiện thì tăng tiền & tài sản thanh khoản cao.",body:`- **Hiện hành** = Tài sản ngắn hạn / Nợ ngắn hạn (=1: vừa đủ; <1: không đủ trả nợ).
- **Nhanh** = (Tài sản ngắn hạn − **Hàng tồn kho**) / Nợ ngắn hạn – loại trừ hàng tồn kho vì khó chuyển thành tiền, có rủi ro giảm giá. >1: nền tảng tốt; <1: có thể khó khăn dòng tiền.
- **Tức thời** = Tiền và tương đương tiền / Nợ ngắn hạn.
Để cải thiện thanh toán nhanh: **tăng tiền mặt và tài sản có tính thanh khoản cao**, đẩy nhanh thu hồi công nợ, quản lý tồn kho (không tăng vay ngắn hạn hay tồn kho).`,formula:"Thanh toán nhanh = (TSNH − Hàng tồn kho) / Nợ ngắn hạn",keywords:["thanh toán nhanh","quick ratio","thanh toán hiện hành","thanh toán tức thời","thanh khoản","loại trừ hàng tồn kho"],related:["b08-5-nhom-chi-so","b07-tai-san"]},{id:"b08-don-bay",lesson:tt,title:"Đòn bẩy tài chính: tỷ lệ nợ, nợ/VCSH, khả năng trả lãi",source:"Bài 8 · Phần 1",summary:"Tỷ lệ nợ = Tổng nợ / Tổng tài sản (mức sử dụng nợ); Khả năng trả lãi = EBIT / Lãi vay.",body:`- **Tỷ lệ nợ** = Tổng nợ / Tổng tài sản (×100): phản ánh **mức độ sử dụng nợ trong cơ cấu nguồn vốn**. Cao → đòn bẩy lớn, rủi ro cao hơn.
- **Nợ / VCSH** = Tổng nợ / Vốn chủ sở hữu.
- **Khả năng thanh toán lãi vay** = EBIT / Chi phí lãi vay; EBIT = LN thuần từ HĐKD + lãi vay. >1: đủ trả lãi; **EBIT tăng, lãi vay không đổi → chỉ số tăng**.`,formula:"Tỷ lệ nợ = Tổng nợ / Tổng tài sản;  Khả năng trả lãi = EBIT / Lãi vay",example:"Nợ 21.800 / Tài sản 64.900 = 33,59%. EBIT 500tr / lãi vay 100tr = 5 lần.",keywords:["tỷ lệ nợ","đòn bẩy tài chính","đoàn bẩy","ebit","khả năng trả lãi","lãi vay","nợ trên vốn chủ"],related:["b08-5-nhom-chi-so","b07-no-vcsh"]},{id:"b08-sinh-loi",lesson:tt,title:"Chỉ số sinh lời: biên lợi nhuận gộp, hoạt động, ròng",source:"Bài 8 · Phần 2",summary:"Biên LN gộp = LN gộp/DT thuần; biên LN ròng = LN sau thuế/DT thuần. Giá vốn tăng nhanh hơn DT thuần → biên gộp giảm.",body:`- **Biên lợi nhuận gộp** = LN gộp / DT thuần ×100: hiệu quả hoạt động cốt lõi, kiểm soát chi phí sản xuất. **Giá vốn hàng bán tăng nhanh hơn doanh thu thuần → biên gộp giảm**.
- **Biên lợi nhuận hoạt động** = LN thuần từ HĐKD / DT thuần: hiệu quả quản lý chi phí bán hàng, QLDN.
- **Biên lợi nhuận ròng** (sau thuế) = **LN sau thuế / DT thuần**: chỉ tiêu tổng hợp nhất.`,formula:"Biên LN ròng = LN sau thuế / Doanh thu thuần × 100",example:"DT thuần 1,2 tỷ; LN gộp 300tr → 25%; LN hoạt động 100tr → ~8%; LN ròng 70tr → 5,8%.",keywords:["biên lợi nhuận","biên lợi nhuận gộp","biên lợi nhuận ròng","biên lợi nhuận hoạt động","gross margin","net margin","sinh lời"],related:["b07-loi-nhuan","b08-5-nhom-chi-so"]},{id:"b08-hieu-suat-tai-san",lesson:tt,title:"Chỉ số hiệu suất: tồn kho, TSCĐ, số ngày phải thu",source:"Bài 8 · Phần 2",summary:"Doanh thu/hàng tồn kho, doanh thu/TSCĐ, số ngày phải thu bình quân – đo mức sử dụng tài sản hiệu quả.",body:`- **Doanh thu / Hàng tồn kho bình quân**: càng cao → bán nhanh, ít vốn ứ đọng (2 tỷ / 500tr = 4 lần).
- **Doanh thu / TSCĐ bình quân**: khai thác máy móc nhà xưởng (3 tỷ / 1,2 tỷ = 2,5 lần).
- **Số ngày phải thu bình quân** = Phải thu bình quân / (Doanh thu năm / 365): càng thấp càng thu tiền nhanh (180tr / 10tr = 18 ngày).`,keywords:["hiệu suất hoạt động","vòng quay hàng tồn kho","số ngày phải thu","quản lý tài sản"],related:["b08-5-nhom-chi-so"]}],Dn=9,Xp=[{id:"b09-chuoi-cung-ung",lesson:Dn,title:"Chuỗi cung ứng & quản trị chuỗi cung ứng",source:"Bài 9 · Phần 1",summary:"Mạng lưới các tổ chức & hoạt động từ cung ứng, sản xuất đến phân phối, bán lẻ nhằm đưa sản phẩm hoàn chỉnh đến khách hàng hiệu quả.",body:`**Chuỗi cung ứng**: mạng lưới nhiều tổ chức và quá trình (cung cấp, sản xuất, phân phối, bán lẻ) hợp tác, điều phối toàn chuỗi giá trị để thu nguyên vật liệu thô, chuyển hóa thành sản phẩm cuối rồi phân phối đến khách hàng. Mục tiêu: **đúng sản phẩm, đúng số lượng, đúng địa điểm, chi phí tối ưu**.

**Quản trị chuỗi cung ứng**: lập kế hoạch, quản lý tìm nguồn, thu mua, sản xuất, phân phối; là sự **tích hợp giữa quản trị cung và quản trị cầu**.`,example:"Công ty sữa: dự báo nhu cầu, đặt nguyên liệu từ trang trại, lên kế hoạch sản xuất, thuê vận chuyển, phân phối đến siêu thị.",keywords:["chuỗi cung ứng","supply chain","scm","quản trị chuỗi cung ứng","định nghĩa chuỗi cung ứng"],related:["b09-logistics","b09-3-dong-chay"]},{id:"b09-logistics",lesson:Dn,title:"Logistics và sự khác biệt với chuỗi cung ứng",source:"Bài 9 · Phần 1",summary:"Logistics tập trung vận chuyển, lưu kho (lưu chuyển & lưu trữ hàng hóa) – chỉ là một phần của chuỗi cung ứng, mang tính tác nghiệp.",body:`**Logistics** = quá trình lập kế hoạch, thực hiện, kiểm soát việc **lưu chuyển và lưu trữ** hiệu quả hàng hóa, dịch vụ, thông tin từ điểm xuất phát đến điểm tiêu dùng (đúng hàng, nơi, thời điểm, tối ưu chi phí).

| | Logistics | Chuỗi cung ứng |
|---|---|---|
| Phạm vi | Hẹp (vận chuyển, lưu kho, giao hàng) | Rộng (mua nguyên liệu → sản xuất → phân phối → bán lẻ) |
| Mục tiêu | Giao đúng hàng, nơi, thời điểm | Tối ưu chi phí & hiệu quả tổng thể |
| Tính chất | Tác nghiệp hằng ngày | Chiến lược dài hạn |`,example:"Đặt hàng Shopee: lấy từ kho, đóng gói, vận chuyển, giao = logistics.",keywords:["logistics","logistic","lưu kho","vận chuyển","lưu chuyển và lưu trữ","tác nghiệp"],related:["b09-chuoi-cung-ung","b09-phan-phoi"]},{id:"b09-vai-tro",lesson:Dn,title:"Vai trò của quản trị chuỗi cung ứng",source:"Bài 9 · Phần 1",summary:"Giảm chi phí, đảm bảo nguồn cung liên tục, nâng chất lượng dịch vụ, linh hoạt trước biến động nhu cầu, cải thiện dòng tiền.",body:`- Tối ưu **chi phí** tồn kho, vận chuyển, mua sắm, sản xuất; hạn chế đứt gãy nguyên liệu/thiếu hàng.
- Nâng **chất lượng dịch vụ khách hàng** (đúng thời điểm, số lượng, chất lượng).
- **Linh hoạt**, phản ứng nhanh với biến động nhu cầu; rút ngắn chu kỳ tiền mặt.
- Hợp tác chiến lược lâu dài; dữ liệu tích hợp hỗ trợ ra quyết định.
- Ví dụ Walmart: kiểm soát từng kho theo thời gian thực, duy trì giá bán thấp.`,keywords:["vai trò chuỗi cung ứng","lợi thế cạnh tranh","walmart","chu kỳ tiền mặt"],related:["b09-chuoi-cung-ung"]},{id:"b09-3-dong-chay",lesson:Dn,title:"3 dòng chảy: vật chất, thông tin, tài chính",source:"Bài 9 · Phần 1",summary:"Vật chất: trái → phải (khai thác → bán lẻ). Thông tin: hai chiều. Tài chính: ngược chiều hàng hóa.",body:`1. **Dòng vật chất**: từ khai thác nguyên liệu thô → sản xuất → lưu kho, phân phối → bán lẻ → người tiêu dùng (**từ trái sang phải**).
2. **Dòng thông tin**: **hai chiều** – đơn đặt hàng đi ngược lên; dự báo nhu cầu, tồn kho, kế hoạch sản xuất chia sẻ giữa các bên.
3. **Dòng tài chính**: **ngược chiều với hàng hóa** – người tiêu dùng trả nhà bán lẻ → nhà sản xuất → nhà cung cấp.
Một mắt xích gián đoạn thì cả hệ thống bị ảnh hưởng.`,keywords:["dòng chảy vật chất","dòng thông tin","dòng tài chính","3 dòng chảy","ba dòng chảy","dòng tri thức"],related:["b09-chuoi-cung-ung"]},{id:"b09-4-yeu-to-cot-loi",lesson:Dn,title:"4 yếu tố cốt lõi quanh giá trị khách hàng",source:"Bài 9 · Phần 1",summary:"Mua sắm, vận hành, phân phối, tích hợp – trung tâm là giá trị khách hàng. Quảng cáo không phải yếu tố cốt lõi.",body:`Ở trung tâm là **giá trị khách hàng**. Bốn yếu tố:
1. **Mua sắm**: chọn nhà cung cấp, liên minh chiến lược.
2. **Vận hành**: sản xuất tinh gọn, kiểm soát tồn kho, đảm bảo chất lượng, quản lý nhu cầu.
3. **Phân phối**: vận chuyển, quản lý quan hệ khách hàng, phối hợp logistics.
4. **Tích hợp**: phối hợp, đo lường, kiểm soát toàn chuỗi để đồng bộ.
(Không có “quảng cáo/marketing”.)`,keywords:["4 yếu tố cốt lõi","bốn yếu tố","mua sắm vận hành phân phối tích hợp","giá trị khách hàng","yếu tố cốt lõi"],related:["b09-mua-sam","b09-van-hanh","b09-phan-phoi","b09-tich-hop-bullwhip"]},{id:"b09-mua-sam",lesson:Dn,title:"Mua sắm: “4 đúng” & chọn nhà cung cấp",source:"Bài 9 · Phần 1",summary:"Mua đúng số lượng, địa điểm, lịch trình với chi phí tối thiểu; chọn nhà cung cấp không chỉ theo giá thấp.",body:`Mua sắm = tìm kiếm, lựa chọn, thu mua nguyên vật liệu/linh kiện/dịch vụ. Bốn yêu cầu: **đúng số lượng, đúng địa điểm, đúng lịch trình, chi phí tối thiểu**. Mua thiếu → gián đoạn sản xuất; mua dư → tăng chi phí tồn kho.

Chọn nhà cung cấp xét chất lượng, năng lực giao hàng, uy tín, khả năng đáp ứng lâu dài, phù hợp chiến lược – **không chỉ giá thấp**; kiểm soát bằng hợp đồng rõ ràng và đánh giá hiệu suất.`,keywords:["mua sắm","procurement","nhà cung cấp","4 đúng mua sắm","lựa chọn nhà cung cấp"],related:["b09-make-or-buy","b09-deming-srm"]},{id:"b09-make-or-buy",lesson:Dn,title:"Tự làm hay mua ngoài (make or buy)",source:"Bài 9 · Phần 1",summary:"Tự sản xuất: kiểm soát công nghệ, định phí cao. Thuê ngoài: tiết kiệm chi phí trước mắt nhưng phụ thuộc đối tác. Dùng hòa vốn để so sánh.",body:`- **Tự sản xuất**: kiểm soát chất lượng, công nghệ, bí quyết; cần vốn đầu tư lớn.
- **Mua/thuê ngoài**: giảm chi phí đầu tư ban đầu, tận dụng chuyên môn, linh hoạt; rủi ro phụ thuộc và khó kiểm soát chất lượng.
- So sánh bằng **phân tích hòa vốn**: tự làm 40.000 + 17,5Q; thuê ngoài 4.000 + 19,3Q → bằng nhau khi **Q = 20.000**. Q < 20.000 → thuê ngoài rẻ hơn; Q > 20.000 → tự sản xuất có lợi hơn.`,keywords:["make or buy","tự sản xuất","mua ngoài","thuê ngoài chuỗi cung ứng"],related:["b08-hoa-von","b06-thue-ngoai"]},{id:"b09-deming-srm",lesson:Dn,title:"Quan hệ win–win, Deming & SRM",source:"Bài 9 · Phần 1 & 2",summary:"Deming: đừng chọn nhà cung cấp chỉ theo giá thấp – xây quan hệ lâu dài, trung thành, tin cậy với nhà cung cấp chiến lược.",body:`Tư duy cũ **win–lose** (ép giá, cắt giảm chất lượng) → **lose–lose**. Quản trị hiện đại hướng **win–win** dựa trên niềm tin, hợp tác dài hạn.

**W. E. Deming**: không nên chọn nhà cung cấp chỉ dựa vào giá thấp; nên xây quan hệ lâu dài với một nhà cung cấp chiến lược dựa trên **trung thành và tin cậy** để tối thiểu tổng chi phí.

**SRM** (quản trị quan hệ nhà cung cấp): chọn nhà cung cấp tiềm năng (chứng nhận, năng lực), đánh giá định kỳ (giao đúng hạn, đúng số lượng…), phát triển hợp tác chiến lược. Điều kiện: cam kết lãnh đạo cấp cao, mục tiêu & chỉ số chung, giao tiếp thường xuyên, chia sẻ tầm nhìn.`,keywords:["deming","srm","win win","nhà cung cấp chiến lược","quan hệ dài hạn","tin cậy","giá thấp nhất"],related:["b09-mua-sam"]},{id:"b09-van-hanh",lesson:Dn,title:"Vận hành: quản lý nhu cầu, kiểm soát tồn kho, tinh gọn",source:"Bài 9 · Phần 2",summary:"Cân đối nhu cầu thị trường và năng lực; kiểm soát tồn kho bằng MRP, JIT; loại bỏ lãng phí (lean).",body:`- **Quản lý nhu cầu**: cân đối nhu cầu thị trường & năng lực (lịch sản xuất, lịch hẹn dịch vụ).
- **Kiểm soát tồn kho**: hoạch định nhu cầu nguyên vật liệu (**MRP**) và sản xuất đúng lúc (**JIT**) – giảm tồn dư nhưng không thiếu hàng.
- **Phương pháp tinh gọn (lean)**: loại bỏ mọi lãng phí – thời gian chờ, sản phẩm lỗi.
Ví dụ: nhà máy áp dụng JIT chỉ nhập nguyên liệu khi gần thời điểm sản xuất.`,keywords:["vận hành","mrp","jit","just in time","quản lý nhu cầu","kiểm soát tồn kho","tinh gọn"],related:["b10-tinh-gon-lean","b09-4-yeu-to-cot-loi"]},{id:"b09-phan-phoi",lesson:Dn,title:"Phân phối: logistics bên thứ 1–4 & CRM",source:"Bài 9 · Phần 2",summary:"Vận chuyển (3PL, 4PL…) và quản trị quan hệ khách hàng (CRM).",body:`- **Logistics bên thứ nhất**: DN tự thực hiện. **Bên thứ hai**: thuê đối tác vận chuyển. **Bên thứ ba (3PL)**: thuê đơn vị logistics chuyên nghiệp tích hợp nhiều dịch vụ. **Bên thứ tư (4PL)**: một đơn vị điều phối toàn bộ mạng lưới logistics.
- **CRM**: duy trì quan hệ khách hàng hiện tại, khai thác khách tiềm năng, tự động hóa bán hàng, theo dõi lịch sử mua, cá nhân hóa dịch vụ.`,keywords:["phân phối","3pl","4pl","logistics bên thứ ba","crm","quản trị quan hệ khách hàng"],related:["b09-logistics"]},{id:"b09-tich-hop-bullwhip",lesson:Dn,title:"Tích hợp & hiệu ứng roi da (Bullwhip)",source:"Bài 9 · Phần 2",summary:"Mỗi cấp tự dự báo nhu cầu & giữ tồn kho an toàn → sai lệch nhu cầu khuếch đại dần lên các cấp trên. Giải pháp: dự báo chung, rút ngắn lead time, chia sẻ thông tin, ERP.",body:`Ở **tích hợp**, mỗi cấp (bán lẻ → bán buôn → phân phối → sản xuất) **dự báo nhu cầu và xác định mức tồn kho**; vì tâm lý phòng thủ, mỗi cấp giữ tồn kho an toàn → **hiệu ứng roi da**: lên các cấp cao hơn, biến động nhu cầu càng lớn → tồn kho tăng, chuỗi kém hiệu quả.

**Giải pháp**: (1) dự báo nhu cầu chung cho toàn chuỗi, (2) **rút ngắn thời gian dẫn (lead time)** → dao động tồn kho giảm, (3) tích hợp & chia sẻ thông tin, (4) **ERP** tích hợp dữ liệu kế toán – tài chính – bán hàng – vận hành. Thiếu tích hợp/tối ưu cục bộ → mất đồng bộ giữa các mắt xích, chi phí tăng.`,keywords:["bullwhip","roi da","hiệu ứng roi da","lead time","thời gian dẫn","erp","tích hợp","dự báo nhu cầu","tồn kho an toàn"],related:["b09-4-yeu-to-cot-loi","b09-chi-so-scor"]},{id:"b09-chi-so-scor",lesson:Dn,title:"Chỉ số đo hiệu quả chuỗi cung ứng (SCOR)",source:"Bài 9 · Phần 2",summary:"Tổng chi phí chuỗi, chu kỳ tiền mặt, tỷ lệ giao hàng đúng hạn (độ tin cậy/chất lượng dịch vụ), tính linh hoạt.",body:`- **Tổng chi phí chuỗi cung ứng**: mua hàng, sản xuất, lưu kho, vận chuyển, xử lý đơn hàng.
- **Chu kỳ tiền mặt**: từ lúc chi tiền mua nguyên vật liệu đến khi thu tiền khách.
- **Tỷ lệ giao hàng đúng hạn**: mức độ tin cậy trong phục vụ khách hàng (chất lượng dịch vụ).
- **Tính linh hoạt**: phản ứng nhanh khi nhu cầu đổi.
Mô hình **SCOR** chuẩn hóa so sánh hiệu suất.`,keywords:["giao hàng đúng hạn","scor","chu kỳ tiền mặt","chỉ số chuỗi cung ứng","chất lượng dịch vụ"],related:["b09-vai-tro"]},{id:"b09-loi-ich-rui-ro",lesson:Dn,title:"Lợi ích & rủi ro khi tham gia chuỗi cung ứng",source:"Bài 9 · Phần 2",summary:"Lợi ích: phá rào cản nội bộ, quan hệ đối tác, giảm phế phẩm, tối ưu tồn kho & dòng tiền. Rủi ro: kỹ thuật – quản trị, quyền lực nhà cung cấp, phụ thuộc khách hàng lớn.",body:`**Lợi ích**: cải thiện giao tiếp giữa mua hàng – sản xuất – bán hàng – logistics; tăng hợp tác với nhà cung cấp/khách hàng; giảm sai sót, phế phẩm; giảm chi phí lưu kho, tăng vòng quay; tối ưu logistics, thu hồi công nợ → tăng dòng tiền.

**Rủi ro**: kỹ thuật & quản trị (đầu tư lớn, hệ thống không đồng bộ); **quyền lực nhà cung cấp** (mô hình 5 áp lực cạnh tranh của Porter); **phụ thuộc khách hàng lớn**.`,keywords:["lợi ích chuỗi cung ứng","rủi ro chuỗi cung ứng","porter","phụ thuộc khách hàng lớn"],related:["b09-vai-tro"]}],_n=10,Yp=[{id:"b10-lanh-dao-quan-tri",lesson:_n,title:"Lãnh đạo vs quản trị",source:"Bài 10 · Phần 1",summary:"Lãnh đạo (Robbins & Judge): khả năng gây ảnh hưởng đến nhóm để đạt mục tiêu. Quản trị: lập kế hoạch, tổ chức, lãnh đạo, kiểm soát nguồn lực.",body:`- **Lãnh đạo** là khả năng **gây ảnh hưởng** đến một nhóm nhằm đạt mục tiêu – tập trung tầm nhìn, truyền cảm hứng, tạo động lực; trả lời “chúng ta sẽ **đi đâu**”.
- **Quản trị** (Griffin) là quá trình **lập kế hoạch, tổ chức, lãnh đạo và kiểm soát** các nguồn lực để đạt mục tiêu hiệu quả – xây dựng quy trình, điều phối nguồn lực; trả lời “**đi như thế nào**”.
- Lãnh đạo tạo hướng đi, quản trị đảm bảo đi đúng hướng.`,keywords:["lãnh đạo","quản trị","robbins","gây ảnh hưởng","leadership","management","tầm nhìn"],related:["b10-phong-cach-lanh-dao"]},{id:"b10-phong-cach-lanh-dao",lesson:_n,title:"3 phong cách lãnh đạo (Lewin 1939)",source:"Bài 10 · Phần 1",summary:"Độc đoán, dân chủ, tự do – lãnh đạo giỏi linh hoạt theo tình huống.",body:`- **Độc đoán**: tự quyết, chỉ định việc và cách làm; hợp khi thời gian gấp, thông tin đủ; hạn chế: bất mãn cao nếu dùng thường xuyên.
- **Dân chủ**: cấp dưới tham gia, lãnh đạo giữ quyền quyết định cuối; hợp khi cần đồng thuận, cam kết; mất thời gian.
- **Tự do**: giảm can thiệp, nhân viên tự quyết; chỉ hợp khi nhân viên năng lực cao, tự chủ; dễ thiếu định hướng.
Lãnh đạo yếu thường chỉ bám một phong cách.`,keywords:["phong cách lãnh đạo","độc đoán","dân chủ","tự do","lewin"],related:["b10-lanh-dao-quan-tri"]},{id:"b10-hieu-qua-hieu-suat",lesson:_n,title:"Hiệu quả vs hiệu suất (Drucker)",source:"Bài 10 · Phần 1",summary:"Hiệu quả = làm đúng việc (đạt mục tiêu). Hiệu suất = làm đúng cách (chi phí thấp nhất về thời gian, tiền, nguồn lực).",body:`Peter Drucker: *Effectiveness is doing the right thing; efficiency is doing things right.*
- **Hiệu quả (effectiveness) = làm đúng việc** – đạt mục tiêu đề ra.
- **Hiệu suất (efficiency) = làm đúng cách** – đạt kết quả với chi phí thấp nhất.
Có thể hiệu quả nhưng chưa hiệu suất và ngược lại; DN cần cả hai.`,example:"Mục tiêu bán 1.000 SP: đạt 1.000 nhưng giảm giá sâu, quảng cáo quá cao → hiệu quả nhưng chưa hiệu suất. Chỉ bán 600 SP dù chi phí rất tốt → hiệu suất nhưng chưa hiệu quả. Chỉ chú trọng hiệu quả bỏ qua hiệu suất → tốn chi phí không cần thiết.",keywords:["hiệu quả","hiệu suất","effectiveness","efficiency","drucker","làm đúng việc","làm đúng cách"],related:["b10-slack","b10-quan-ly-thoi-gian"]},{id:"b10-slack",lesson:_n,title:"Độ dự trữ tổ chức (organizational slack)",source:"Bài 10 · Phần 1",summary:"Phần năng lực dư thừa tổ chức duy trì so với mức tối thiểu để vận hành (tiền mặt, nhân sự, thời gian, máy móc).",body:"Slack giúp đổi mới và tạo vùng đệm an toàn khi thị trường đổi hoặc doanh thu giảm tạm thời; nhưng xét hiệu suất, slack nghĩa là chưa tối ưu nguồn lực (máy nhàn rỗi, nhân sự dư làm tăng chi phí). DN nhỏ nguồn lực hạn chế → khó duy trì slack, buộc tối ưu cả hiệu quả lẫn hiệu suất.",keywords:["slack","độ dự trữ tổ chức","organizational slack","năng lực dư thừa","vùng đệm"],related:["b10-hieu-qua-hieu-suat"]},{id:"b10-sang-tao",lesson:_n,title:"Sáng tạo & 3 chiến lược đổi mới",source:"Bài 10 · Phần 1",summary:"Định hướng theo nhu cầu, theo dõi thị trường (cải tiến nhỏ), định hướng công nghệ (R&D đột phá).",body:`Ý tưởng có thể đến từ bất kỳ ai; đổi mới ở mọi bộ phận. Ba hướng:
1. **Định hướng theo nhu cầu**: chủ động lắng nghe khách hàng để dẫn đầu thị trường.
2. **Theo dõi thị trường**: duy trì quan hệ chặt chẽ với khách hàng, mang lại giá trị qua **cải tiến nhỏ nhưng có ý nghĩa**.
3. **Định hướng công nghệ**: đầu tư mạnh R&D để tạo đột phá.
Không chiến lược nào vượt trội tuyệt đối – chọn/kết hợp theo nguồn lực, năng lực, thị trường.`,keywords:["đổi mới sáng tạo","theo dõi thị trường","định hướng nhu cầu","định hướng công nghệ","3 chiến lược đổi mới","cải tiến nhỏ"],related:["b10-kim-ham-sang-tao"]},{id:"b10-kim-ham-sang-tao",lesson:_n,title:"Yếu tố kìm hãm sáng tạo & công cụ thúc đẩy",source:"Bài 10 · Phần 1",summary:"Kìm hãm: tin mình không sáng tạo, chấp nhận hiện trạng, tự kiểm duyệt, bỏ cuộc sớm, không ghi ý tưởng, văn hóa sợ thất bại/tư duy bầy đàn. Công cụ: động não, sơ đồ tư duy.",body:`**Kìm hãm**: (1) tin bản thân không sáng tạo; (2) chấp nhận hiện trạng; (3) tự kiểm duyệt; (4) để ý tưởng chết yểu; (5) không ghi lại ý tưởng; (6) **văn hóa tổ chức sợ thất bại** và tư duy bầy đàn – trừng phạt thất bại khiến nhân viên ngại thử nghiệm.

**Công cụ**: **động não** (nhiều ý tưởng trong thời gian ngắn, không phê phán giai đoạn đầu, sau đó sàng lọc theo chi phí, tính khả thi…) và **sơ đồ tư duy** (phát triển ý tưởng từ chủ đề trung tâm).`,keywords:["kìm hãm sáng tạo","sợ thất bại","tư duy bầy đàn","động não","brainstorming","sơ đồ tư duy","mind map","thử nghiệm"],related:["b10-sang-tao"]},{id:"b10-quan-ly-thoi-gian",lesson:_n,title:"Quản lý thời gian & 4 thế hệ",source:"Bài 10 · Phần 1",summary:"Covey: quản lý thời gian là làm đúng việc (hiệu quả) và làm theo cách tốt nhất (hiệu suất). 4 thế hệ: danh sách → deadline → ưu tiên → ma trận Covey.",body:`Thời gian là nguồn lực quý nhất, không thể mua hay lấy lại. **Stephen Covey**: quản lý thời gian là **làm đúng việc (hiệu quả) và làm việc đó theo cách tốt nhất (hiệu suất)**.
4 thế hệ: (1) danh sách việc (to-do list); (2) thêm **deadline**; (3) thêm **ưu tiên**; (4) **ma trận Covey** phân loại theo khẩn cấp & quan trọng.`,keywords:["quản lý thời gian","covey","stephen covey","to do list","4 thế hệ","time management"],related:["b10-ma-tran-covey","b10-viec-nen-lam"]},{id:"b10-ma-tran-covey",lesson:_n,title:"Ma trận Covey 2×2",source:"Bài 10 · Phần 1",summary:"Phân loại công việc theo mức độ quan trọng và mức độ khẩn cấp thành 4 góc phần tư.",body:`1. **Quan trọng & khẩn cấp** – góc của sự cần thiết (khủng hoảng, sự cố, dự án đến hạn).
2. **Quan trọng nhưng không khẩn cấp** – góc của chất lượng (lập kế hoạch, phòng ngừa rủi ro, phát triển bản thân) → nên dành nhiều thời gian nhất.
3. **Không quan trọng nhưng khẩn cấp** – góc của sự đánh lừa (cuộc gọi, họp hình thức).
4. **Không quan trọng, không khẩn cấp** – góc của lãng phí (lướt mạng vô mục đích).`,keywords:["ma trận covey","ma trận thời gian","quan trọng khẩn cấp","covid 2x2","eisenhower","góc phần tư"],related:["b10-quan-ly-thoi-gian"]},{id:"b10-viec-nen-lam",lesson:_n,title:"Việc nên làm để tăng hiệu suất; hạn chế đa nhiệm",source:"Bài 10 · Phần 1",summary:"Gom nhóm công việc, ủy quyền, học nói không, không trì hoãn, quản lý email, thời gian suy nghĩ chiến lược; đa nhiệm làm giảm hiệu suất.",body:"Nên: gom nhóm công việc, **ủy quyền**, học cách nói không, không trì hoãn, mỗi email xử lý một lần, dành thời gian riêng suy nghĩ chiến lược. Lưu ý: chọn **một hệ thống duy nhất**; đừng nhầm bận rộn với hiệu quả; **hạn chế đa nhiệm** – vừa trả lời email vừa soạn báo cáo khiến cả hai việc kéo dài, dễ sai sót → **giảm hiệu suất**; mục tiêu là quản lý bản thân.",keywords:["đa nhiệm","multitasking","ủy quyền","gom nhóm","nói không","trì hoãn"],related:["b10-quan-ly-thoi-gian"]},{id:"b10-chat-luong",lesson:_n,title:"Quản lý chất lượng: 8 chiều, SERVQUAL & công cụ",source:"Bài 10 · Phần 2",summary:"Chất lượng là kết quả của quá trình có chủ đích; sản phẩm có 8 chiều, dịch vụ có 5 yếu tố (SERVQUAL); công cụ: SPC, PDCA, Juran, TQM, Six Sigma.",body:`- Chất lượng không phải may mắn: ý định đúng đắn (lấy khách hàng làm trung tâm), nỗ lực bền bỉ, thực hiện khéo léo.
- **Garvin – 8 khía cạnh** sản phẩm: hiệu năng, tính năng, độ tin cậy, phù hợp tiêu chuẩn, độ bền, khả năng bảo dưỡng, thẩm mỹ, chất lượng cảm nhận.
- **SERVQUAL – 5 yếu tố dịch vụ**: hữu hình, tin cậy, đáp ứng, đảm bảo, đồng cảm.
- **Công cụ**: kiểm soát quá trình bằng thống kê (SPC), chu trình **PDCA**, bộ ba Juran (hoạch định – kiểm soát – cải tiến), **TQM** của Crosby, **Six Sigma** (DMAIC).
- Điểm chung: quản lý bằng dữ liệu và cải tiến liên tục.`,keywords:["quản lý chất lượng","servqual","pdca","six sigma","tqm","garvin","juran","deming chất lượng","spc"],related:["b10-tinh-gon-lean"]},{id:"b10-tinh-gon-lean",lesson:_n,title:"Tư duy tinh gọn (Lean), JIT & Kaizen",source:"Bài 10 · Phần 2",summary:"Lean tập trung loại bỏ lãng phí để tối đa giá trị khách hàng. JIT giảm tồn kho. Kaizen là cải tiến liên tục.",body:`Lean (từ hệ thống sản xuất Toyota, Ohno): **loại bỏ lãng phí**, tối đa hóa giá trị cho khách hàng. **5 nguyên tắc**: xác định giá trị theo khách hàng; lập dòng giá trị; tạo dòng chảy liên tục; **hệ thống kéo** (sản xuất đúng lúc – JIT); liên tục cải tiến hướng đến hoàn hảo.

**7 loại lãng phí**: vận chuyển, tồn kho, thao tác thừa, chờ đợi, xử lý thừa, sản xuất thừa, sai lỗi.

**Kỹ thuật**: sơ đồ dòng giá trị; **JIT** (nhập/sản xuất đúng thời điểm cần dùng → **giảm tồn kho**); thay đổi nhanh (SMED); **Kaizen – cải tiến liên tục** với sự tham gia toàn bộ nhân viên; quản lý trực quan; **5S**.`,keywords:["lean","tinh gọn","tư duy tinh gọn","jit","just in time","kaizen","5s","7 lãng phí","toyota","loại bỏ lãng phí"],related:["b09-van-hanh","b10-chat-luong"]},{id:"b10-quan-tri-thoi-ai",lesson:_n,title:"Quản trị trong kỷ nguyên AI",source:"Bài 10 · Phần 2",summary:"Quản trị dựa trên dữ liệu, tự động hóa & tinh gọn quy trình, quản trị linh hoạt, lãnh đạo nhân văn, đạo đức & rủi ro công nghệ.",body:`- **Dữ liệu thời gian thực** thay kinh nghiệm cảm tính.
- **Tự động hóa**: AI xử lý việc lặp lại; nhà quản trị thiết kế hệ thống vận hành.
- **Linh hoạt**: thử nghiệm nhanh, điều chỉnh liên tục.
- **Lãnh đạo nhân văn**: AI không thay được truyền cảm hứng, quản trị cảm xúc.
- **Đạo đức & rủi ro công nghệ**: bảo mật dữ liệu, trách nhiệm khi dùng AI.
Nhà lãnh đạo hiệu quả **kết hợp năng lực công nghệ với khả năng lãnh đạo con người và tư duy hệ thống**.`,keywords:["ai","kỷ nguyên ai","chuyển đổi số","quản trị dựa trên dữ liệu","lãnh đạo nhân văn","tự động hóa"],related:["b10-lanh-dao-quan-tri"]}],bn=11,Jp=[{id:"b11-vai-tro-kiem-soat",lesson:bn,title:"Vai trò của kiểm soát (vòng phản hồi)",source:"Bài 11 · Phần 1",summary:"Kiểm soát là chức năng cuối của chu trình quản trị nhưng tạo vòng phản hồi: so sánh thực tế với kế hoạch và điều chỉnh kịp thời.",body:"Chu trình: kế hoạch → tổ chức → lãnh đạo → **kiểm soát**. Kiểm soát không nhằm bắt lỗi cá nhân mà đảm bảo tổ chức **đi đúng hướng**, dùng nguồn lực hiệu quả, đạt mục tiêu chiến lược.",example:"Mục tiêu doanh thu quý 10 tỷ; sau 2 tháng đạt 5 tỷ trong khi kế hoạch phải là 7 tỷ → phát hiện chênh lệch, phân tích nguyên nhân, điều chỉnh (khuyến mại, đào tạo lại, mở kênh phân phối).",keywords:["kiểm soát","vòng phản hồi","control","chu trình quản trị","sai lệch"],related:["b11-giam-sat-kiem-soat-danh-gia"]},{id:"b11-giam-sat-kiem-soat-danh-gia",lesson:bn,title:"Giám sát vs kiểm soát vs đánh giá",source:"Bài 11 · Phần 1",summary:"Giám sát = theo dõi; kiểm soát = so sánh thực tế với mục tiêu để điều chỉnh; đánh giá = tổng kết cuối kỳ để cải tiến.",body:`- **Giám sát**: theo dõi thường xuyên, liên tục (họp tiến độ hàng tuần).
- **Kiểm soát**: so sánh kết quả thực tế với mục tiêu/kế hoạch → phát hiện sai lệch → điều chỉnh (trong hoặc sau quá trình).
- **Đánh giá**: cuối kỳ/giai đoạn, xem mức độ đạt mục tiêu, rút kinh nghiệm.`,keywords:["giám sát","đánh giá","phân biệt kiểm soát","monitoring","evaluation"],related:["b11-vai-tro-kiem-soat"]},{id:"b11-kpi-smart",lesson:bn,title:"KPI là gì & nguyên tắc SMART",source:"Bài 11 · Phần 1",summary:"KPI = chỉ số đo lường hiệu suất cốt yếu, phản ánh mức hoàn thành mục tiêu của cá nhân/bộ phận/tổ chức trong khoảng thời gian xác định.",body:"KPI (Key Performance Indicator) trả lời “có đang đạt mục tiêu không?”. Nguyên tắc **SMART**: gắn với mục tiêu cụ thể; đo lường được (“tăng 15% khách hàng mới”, không phải “làm việc tốt hơn”); có thời hạn rõ ràng; có ý nghĩa quản trị (giúp ra quyết định điều chỉnh). KPI là công cụ định hướng hành động và cải thiện hiệu suất.",keywords:["kpi","chỉ số hiệu suất cốt yếu","smart","key performance indicator","đo lường hiệu suất","kbi"],related:["b11-kpi-cap-do","b11-kpi-tinh-chat","b11-kpi-linh-vuc"]},{id:"b11-kpi-cap-do",lesson:bn,title:"Phân loại KPI theo cấp độ quản trị",source:"Bài 11 · Phần 1",summary:"KPI chiến lược (mục tiêu dài hạn 3–5 năm) và KPI tác nghiệp (hoạt động hằng ngày, góp phần đạt KPI chiến lược).",body:`- **KPI chiến lược**: gắn tầm nhìn dài hạn (tăng trưởng doanh thu 15%/năm, thị phần 25% trong 3 năm); do ban giám đốc/quản trị cấp cao theo dõi.
- **KPI tác nghiệp**: hiệu quả hoạt động hằng ngày của phòng ban/nhân viên (số đơn xử lý/ngày, giao hàng đúng hạn 98%, phản hồi ≤ 2 giờ). **KPI tác nghiệp tốt góp phần đạt KPI chiến lược** – liên kết dọc.`,keywords:["kpi chiến lược","kpi tác nghiệp","cấp độ quản trị","liên kết dọc"],related:["b11-kpi-smart"]},{id:"b11-kpi-tinh-chat",lesson:bn,title:"KPI kết quả vs KPI dẫn dắt",source:"Bài 11 · Phần 1",summary:"KPI kết quả đo thành quả cuối cùng (đã xảy ra); KPI dẫn dắt đo yếu tố đầu vào/quá trình, dự báo và tác động kết quả tương lai.",body:`- **KPI kết quả**: thành quả cuối cùng, mang tính quá khứ – doanh thu tháng 2 tỷ, **lợi nhuận quý 500 triệu**, **tỷ lệ nghỉ việc 5%**, tổng doanh thu trong quý.
- **KPI dẫn dắt**: đầu vào/quá trình, **dự báo và tác động đến kết quả tương lai** – **số cuộc gọi bán hàng/ngày**, **số khách hàng tiềm năng mới/tháng (tuần)**, số giờ đào tạo/quý.
Chỉ dùng KPI kết quả mà thiếu KPI dẫn dắt → vẫn theo dõi được kết quả nhưng thiếu cơ sở điều chỉnh kịp thời.`,keywords:["kpi dẫn dắt","kpi kết quả","leading","lagging","tính chất đo lường","chỉ số dẫn dắt"],related:["b11-kpi-smart"]},{id:"b11-kpi-linh-vuc",lesson:bn,title:"Phân loại KPI theo lĩnh vực",source:"Bài 11 · Phần 1",summary:"Tài chính, nhân sự, quy trình nội bộ, học tập & phát triển.",body:`Ba cách phân loại KPI: **theo cấp độ quản trị**, **theo tính chất đo lường**, **theo lĩnh vực** (không có “theo chiến lược” như một cách phân loại riêng).
- **Tài chính**: doanh thu, chi phí, biên lợi nhuận.
- **Nhân sự**: tỷ lệ nghỉ việc, mức hài lòng nhân viên.
- **Quy trình nội bộ**: thời gian xử lý đơn hàng, tỷ lệ lỗi sản phẩm.
- **Học tập & phát triển**: số giờ đào tạo, tỷ lệ nhân viên đạt chứng chỉ.`,keywords:["kpi theo lĩnh vực","3 cách phân loại kpi","kpi tài chính","kpi nhân sự","bsc","học tập và phát triển"],related:["b11-kpi-smart"]},{id:"b11-rui-ro",lesson:bn,title:"Rủi ro là gì",source:"Bài 11 · Phần 1",summary:"Sự kiện không chắc chắn trong tương lai, nếu xảy ra có thể ảnh hưởng tiêu cực đến việc đạt mục tiêu.",body:"Điểm quan trọng là **tính không chắc chắn**: rủi ro có thể xảy ra hoặc không, nhưng nhà quản trị phải chủ động nhận diện và chuẩn bị phương án. Quản trị rủi ro **không loại bỏ hoàn toàn** rủi ro mà nhận diện sớm và đánh giá đúng mức tác động.",keywords:["rủi ro","risk","sự kiện không chắc chắn","ảnh hưởng mục tiêu"],related:["b11-nhan-dien-rui-ro"]},{id:"b11-nhan-dien-rui-ro",lesson:bn,title:"Quy trình xác định rủi ro & 3 cách nhận diện",source:"Bài 11 · Phần 1",summary:"Hai bước: nhận diện rủi ro → xác định mức độ ảnh hưởng. Nhận diện bằng brainstorming, lập danh mục phân loại, rút kinh nghiệm quá khứ.",body:`**Quy trình xác định rủi ro**: (1) **nhận diện rủi ro** – điều gì có thể xảy ra và cản trở mục tiêu; (2) **xác định mức độ ảnh hưởng** nếu rủi ro phát sinh.

**3 cách nhận diện**: **brainstorming** (động não tập thể với các trưởng bộ phận); **lập danh mục** phân loại theo nhóm (tài chính, thị trường, vận hành, pháp lý, công nghệ); **rút kinh nghiệm từ quá khứ** (sự cố đã xảy ra).`,keywords:["nhận diện rủi ro","xác định rủi ro","quy trình xác định rủi ro","mức độ ảnh hưởng","brainstorming rủi ro"],related:["b11-ma-tran-rui-ro","b11-rui-ro"]},{id:"b11-ma-tran-rui-ro",lesson:bn,title:"Ma trận rủi ro (khả năng xảy ra × mức độ ảnh hưởng)",source:"Bài 11 · Phần 1",summary:"Công cụ xác định và phân loại rủi ro theo khả năng xảy ra và mức độ ảnh hưởng; kèm tín hiệu cảnh báo, người phụ trách, kế hoạch ứng phó.",body:`Hai yếu tố: **khả năng xảy ra** (xác suất) và **mức độ ảnh hưởng** (tài chính, uy tín, vận hành, pháp lý). Thang: cao/trung bình/thấp, hoặc 1–10, hoặc %. Có thể nhân hai yếu tố ra mức độ rủi ro tổng hợp.
Các cột: rủi ro, ảnh hưởng, khả năng, mức độ, **tín hiệu cảnh báo**, **người phụ trách**, **kế hoạch ứng phó**.`,example:"Mất khách hàng lớn (20–30% doanh thu): xác suất trung bình (6/10), ảnh hưởng cao (9/10). Cảnh báo: giảm tần suất đặt hàng, chậm thanh toán.",keywords:["ma trận rủi ro","risk matrix","khả năng xảy ra","tín hiệu cảnh báo","kế hoạch ứng phó","người phụ trách"],related:["b11-nhan-dien-rui-ro","b11-erm"]},{id:"b11-erm",lesson:bn,title:"Quản trị rủi ro doanh nghiệp (ERM)",source:"Bài 11 · Phần 1",summary:"Phương pháp tổng thể nhận diện, đánh giá, kiểm soát rủi ro trên toàn tổ chức và gắn chặt với chiến lược.",body:"Không xử lý rủi ro riêng lẻ mà xem xét trên **toàn bộ tổ chức**, gắn với chiến lược kinh doanh. Ví dụ mở rộng thị trường mới: đánh giá rủi ro pháp lý, biến động tỷ giá, nhu cầu thị trường → chủ động thay vì bị động.",keywords:["erm","quản trị rủi ro doanh nghiệp","enterprise risk management"],related:["b11-ma-tran-rui-ro"]},{id:"b11-kiem-soat-noi-bo",lesson:bn,title:"Kiểm soát nội bộ theo COSO",source:"Bài 11 · Phần 2",summary:"Quá trình xuyên suốt do HĐQT, ban điều hành và toàn thể nhân viên thiết kế – vận hành, đảm bảo hợp lý đạt 3 nhóm mục tiêu.",body:`Theo **COSO**: 3 nhóm mục tiêu – **hiệu quả hoạt động, độ tin cậy của báo cáo, tuân thủ pháp luật**. “**Đảm bảo hợp lý**” = không loại bỏ hoàn toàn rủi ro nhưng kiểm soát ở mức chấp nhận được.
Ví dụ **phân tách nhiệm vụ**: người lập hóa đơn ≠ người thu tiền ≠ người ghi sổ.`,keywords:["kiểm soát nội bộ","coso","đảm bảo hợp lý","phân tách nhiệm vụ","internal control"],related:["b11-ba-tuyen"]},{id:"b11-ba-tuyen",lesson:bn,title:"Mô hình 3 tuyến (Three Lines Model)",source:"Bài 11 · Phần 2",summary:"Phân định rõ trách nhiệm quản lý rủi ro & kiểm soát: Tuyến 1 vận hành, Tuyến 2 giám sát/hỗ trợ kiểm soát, Tuyến 3 kiểm toán nội bộ độc lập.",body:`Mô hình (chuẩn hóa bởi IIA) **không tạo thêm cấp bậc** mà tạo **3 lớp bảo vệ**, làm rõ ai chịu trách nhiệm, tránh chồng chéo, tăng minh bạch & độc lập.
- **Tuyến 1** – quản lý vận hành (kinh doanh, mua hàng, kế toán, sản xuất): tự thiết kế và thực hiện kiểm soát hằng ngày; nếu yếu → **rủi ro không được nhận diện, xử lý kịp thời**.
- **Tuyến 2** – giám sát & kiểm soát (pháp chế, tuân thủ, quản lý rủi ro, tài chính): ban hành chính sách, kiểm tra tuân thủ.
- **Tuyến 3** – **kiểm toán nội bộ**: đánh giá **độc lập** toàn hệ thống, **báo cáo trực tiếp cho ban quản trị/HĐQT**. Vừa kiểm toán vừa thiết kế hệ thống kiểm soát → **mất tính độc lập**.`,keywords:["3 tuyến","ba tuyến","three lines","three lines of defense","kiểm toán nội bộ","độc lập","tuyến 1","tuyến 2","tuyến 3","iia"],related:["b11-ba-tuyen-sme","b11-kiem-soat-noi-bo"]},{id:"b11-ba-tuyen-sme",lesson:bn,title:"Áp dụng mô hình 3 tuyến cho DN vừa và nhỏ",source:"Bài 11 · Phần 2",summary:"Triển khai linh hoạt: tuyến 1 vẫn là trọng tâm; tuyến 2 do chủ DN/giám đốc/kế toán trưởng kiêm nhiệm; tuyến 3 có thể thuê kiểm toán bên ngoài.",body:"Hoàn toàn có thể áp dụng cho SME Việt Nam nhưng linh hoạt hơn do hạn chế nguồn lực: tuyến 1 luôn tồn tại; tuyến 2 thường do chủ DN, giám đốc điều hành, kế toán trưởng hoặc người kiêm nhiệm; tuyến 3 thuê kiểm toán bên ngoài định kỳ hoặc tư vấn kiểm soát độc lập.",keywords:["sme","doanh nghiệp vừa và nhỏ","thuê kiểm toán bên ngoài"],related:["b11-ba-tuyen"]},{id:"b11-kiem-soat-cntt",lesson:bn,title:"Kiểm soát công nghệ thông tin: an ninh, dữ liệu, rủi ro hệ thống",source:"Bài 11 · Phần 2",summary:"3 nội dung: an ninh thông tin (bảo mật – toàn vẹn – sẵn sàng), kiểm soát dữ liệu (dữ liệu sai → báo cáo sai → quyết định sai), rủi ro hệ thống.",body:`- **An ninh thông tin**: bảo mật, toàn vẹn, sẵn sàng; phân quyền, mật khẩu & xác thực đa yếu tố, tường lửa, giám sát đăng nhập.
- **Kiểm soát dữ liệu**: dữ liệu đầy đủ, chính xác, an toàn; phân quyền nhập/sửa/xóa, log hệ thống, sao lưu định kỳ, đối chiếu. **Dữ liệu sai → báo cáo sai → quyết định quản trị sai.**
