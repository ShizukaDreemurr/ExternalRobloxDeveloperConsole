hu từ Jmax."},{"l":8,"p":"Phần 2","t":"Điều này cho thấy một điểm rất quan trọng là Jmax không chỉ đo lường click mua hàng mà đo lường tác động tổng thể của quảng cáo tới doanh thu. Vì vậy khi chạy JX chúng ta không nên chỉ nhìn vào chỉ số click mà nhìn vào tổng team vi và hiệu quả của toàn chiến dịch nhé. Tiếp theo là các cái trạng thái của video khi mà chúng ta đưa và chiến dịch à Jmax."},{"l":8,"p":"Phần 2","t":"Trong Jmax ấ việc theo dõi trạng thái của video là một cái công việc cực kỳ quan trọng mà người chạy quảng cáo cần phải thực hiện thường xuyên. Chúng ta gọi là kare quảng cáo. Khi chạy Jmax, hệ thống sẽ tự động lấy video để phân phối quảng cáo."},{"l":8,"p":"Phần 2","t":"Nhưng không phải video nào cũng được chạy giống nhau. Mỗi video sẽ có một cái trạng thái khác nhau thể hiện mức độ ưu tiên và hiệu quả của video đó. Thông thường sẽ có các trạng thái được tính như sau."},{"l":8,"p":"Phần 2","t":"Trạng thái đầu tiên là đang chờ hoặc đang học, tức là video mới được đưa vào chiến dịch và hệ thống đang thử nghiệm. Để xem video có khả năng đang tạo ra đơn hàng hay không."},{"l":8,"p":"Phần 2","t":"Trạng thái tiếp theo nó đang phân phối. Đây là trạng thái tốt nhất, nghĩa là video đang hoạt động ổn định và được hệ thống phân phối quảng cáo thường xuyên. Những video này thường là video mang lại doanh thu tốt, ngoài ra sẽ có trạng thái không phân phối."},{"l":8,"p":"Phần 2","t":"Nghĩa là hệ thống đánh giá video không hiệu quả nên sẽ giảm hiển thị. Những video này thường cần được thay thế bằng nội dung mới. Một video có thể rơi vào trạng thái không hoạt động thường là do video quá cũ hoặc không còn tạo ra các tín hiệu liên quan đến đơn hàng trong một thời gian dài."},{"l":8,"p":"Phần 2","t":"Vì vậy khi chạy J Max nhiệm vụ quan trọng nhất của người bán không phải là chỉnh quá trình quá nhiều set setting mà là liên tục à bổ sung video mới theo dõi trạng thái video. Nguyên tắc rất đơn giản, video nào mà được phân phối thì giữ lại và nhân rộng, video nào không phân phối thì thay thế. Đây chính là cách tối ưu JX hiệu quả nhất trong thực tế."},{"l":8,"p":"Phần 2","t":"Trong JMAX thì mỗi video sẽ đi qua một cái chu trình phân phối khá rõ ràng và hiểu được chu trình phân phối này thì sẽ giúp chúng ta tối ưu quảng cáo một cách có hiệu quả hơn. Khi một video mới được đưa vào chiến dịch, video sẽ bắt đầu ở trạng thái đang chờ, sau đó chuyển sang trạng thái đang học. Giai đoạn học này là giai đoạn thường kéo dài trong khoảng 3 ngày nhá."},{"l":8,"p":"Phần 2","t":"Trong đó hệ thống sẽ thử phân phối video để thu thập dữ liệu. Trong thời gian này thì hệ thống sẽ kiểm tra xem video đó có khả năng tạo ra đơn hàng hay không. Nếu video tiêu được ngân sách và có tín hiệu tốt, ví dụ như tiêu được trên 1 đô mỗi ngày thì video sẽ chuyển sang trạng thái đang phân phối."},{"l":8,"p":"Phần 2","t":"Khi video trạng thái đang phân phối thì nghĩa là hệ thống đã xác định được đây là video có khả năng tạo ra mã đơn hàng và sẽ ưu tiên hiển thị nhiều hơn."},{"l":8,"p":"Phần 2","t":"Tuy nhiên, nếu sau một cái thời gian hiệu quả bắt đầu giảm xuống vì à ví dụ như tỉ lệ chuyển đổi thấp hoặc là không tạo ra đơn, video có thể chuyển sang trạng thái không phân phối. Khi đó hệ thống sẽ à ngừng ưu tiên cho video này. Vì vậy J max chúng ta cần hiểu rằng video cần trải qua một cái quá trình đánh giá của nền tảng và từ đó nền tảng sẽ tự động à phân phối hoặc là không phân phối."},{"l":8,"p":"Phần 2","t":"Nếu như video kém hiệu quả thì à ờ video đó sẽ không được chi tiêu nữa. Còn ngược lại nếu như video đang phân phối tốt và có khả năng ra đơn hàng thì video đó sẽ được phân phối thêm tiền thêm ngân sách để chạy quảng cáo. Tiếp theo chúng ta sẽ giải đáp một số câu hỏi thường gặp về trạng thái video trong để hiểu rõ cách hệ thống hoạt động."},{"l":8,"p":"Phần 2","t":"Câu hỏi đầu tiên là tại sao một video lại ở trạng thái đang chờ? Trong JMAX hệ thống ưu tiên mục tiêu Roy trước, R trước. Vì vậy hệ thống sẽ khám phá video một cách từ để tránh à làm giảm hiệu hiệu quả chung của cả chiến dịch."},{"l":8,"p":"Phần 2","t":"Nếu ngăn sách không lớn hoặc số lượng video nhiều thì video sẽ phải xếp hàng chờ hệ thống khám phá nên trạng thái sẽ là đang chờ. Đây một điều hết sức bình thường nhé. Câu thứ hai đó là video nào?"},{"l":8,"p":"Phần 2","t":"Video nào sẽ ở trạng thái đang học? Thông thường các video mới được đưa vào chiến dịch sẽ ở trạng thái đang học trong khoảng dưới 3 ngày để hệ thống có thể thu thập dữ liệu mới à của người dùng và đánh giá hiệu quả. Câu hỏi thứ ba là khi nào video chuyển sang phân phối hoặc không phân phối."},{"l":8,"p":"Phần 2","t":"Nếu trong giai đoạn học video có thể tiêu được ngân sách và vẫn đạt được các cái mục tiêu roy thì hệ sống hệ thống chuyển sang là đang phân phối. Và nếu như một video được chuyển sang trạng thái không phân phối thì nhà bán hiểu rằng là video đấy không còn hiệu quả nữa hoặc là JMAP không còn nhận được tín hiệu của sự hiệu quả. À hiệu su rất kém."},{"l":8,"p":"Phần 2","t":"Thì nếu như mà chúng ta tự tin là video bị gắn thẻ không phân phối, chúng ta có thể dùng một cái tính năng Đó là boot để chúng ta thử nghiệm video với ngân sách nhỏ. Nhưng cần lưu ý là ngân sách này không đảm bảo về roy tức là có thể đánh giá cảm quan nếu tự tin là video kệ tốt nhưng mà nó vẫn bị rơi vào trạng thái không phân phối thì TikTok Shop người ta cung cấp một cái tính năng được gọi là creative boot tức là à bút tiền ưu tiên cho cái video đó để thử nghiệm và từ đó thì chúng ta sẽ trả lời được chính xác là cái trạng thái không phân phối này là đúng hay là chưa đúng."},{"l":8,"p":"Phần 2","t":"Tiếp theo nữa là À một điểm rất quan trọng đó là chúng ta cần hiểu là Jmax là một hệ thống quảng cáo không chỉ học à không chỉ học từ những cái quảng cáo trả phí mà nó còn học từ tất cả các tín hiệu trên hệ sinh thái TikTok Shop."},{"l":8,"p":"Phần 2","t":"Cụ thể thì Jmax sẽ thu thập dữ liệu từ nhiều nguồn khác nhau bao gồm như những tín hiệu quảng cáo, tín hiệu từ offet, tín hiệu từ organic tức là những cái đơn hàng tự nhiên hoặc nhấn chữ tương tác tự nhiên không cần thông qua quảng cáo. Như vậy việc tổng hợp tín hiệu này thì hệ thống có thể hiểu được nhóm khách hàng nào có thể mua hàng một cách cao nhất, video nào hiệu quả nhất và sản phẩm nào có tiềm năng chuyển đổi tốt nhất."},{"l":8,"p":"Phần 2","t":"Từ đó thì Jmax sẽ tự động phân phối quảng cáo đến đúng tệp khách hàng phù hợp thay vì người bán phải tự tối ưu một cách thủ công giống như trước đây. Điều này cũng giải thích vì sao khi chạy quảng cáo Jmax không chỉ quảng cáo tốt mới giúp chiến dịch hiệu quả mà cả hệ sinh thái bán hàng của bạn cũng sẽ bị ảnh hưởng trực tiếp đến kết quả quảng cáo nhé. Vậy nên là TikTok sẽ dựa vào tín hiệu của sản phẩm để tiếp cận khách hàng một cách cách chính xác nhất. Đồng thời quyết định là đồng thời quyết định tới điểm chất lượng của quảng cáo."},{"l":8,"p":"Phần 2","t":"Đó cũng chính là lý do tại sao sản phẩm mới thì luôn tiêu chậm và tại sao bắt đầu chúng ta có những content win à đề xuất quảng cáo lại tiêu tiền thuận lợi và chi tiêu một cách tốt hơn. Khi chạy quảng cáo JX thì hệ thống của TikTok sẽ có hai chế độ vận hành chính. À và khi bật chế độ này thì chế độ kia sẽ bị hạn chế."},{"l":8,"p":"Phần 2","t":"Vì vậy trước khi chạy quảng cáo thì nhà bán xác định mục tiêu thực sự của mình là gì? Đầu tiên là chế độ tập trung vào GV. Ở chế độ này, hệ thống sẽ ưu tiên tăng doanh số một cách tối đa cho anh em, miễn là quảng cáo đang mang lại kết quả tốt."},{"l":8,"p":"Phần 2","t":"TikTok nhận thấy chiến dịch của bạn có khả năng ra nhiều đơn, hệ thống sẽ đẩy nhanh phân phối và tiêu ngân sách một cách nhanh hơn, thậm chí là không cần tối ưu quá chặt về Roy. Chế độ thứ hai đó là họ tập trung vào bảo vệ Roy. Ở chế độ này thì hệ thống sẽ chi tiêu một cách chi tiêu ưu tiên về hiệu quả, lợi nhuận hơn. Nghĩa là quảng cáo chỉ được phân phối khi mà à khi mà có khả năng đạt mức roi mục tiêu."},{"l":8,"p":"Phần 2","t":"Nếu hiệu quả giảm xuống, hệ thống sẽ giảm phân phối hoặc là tiêu chậm lại để bảo vệ về hiệu suất. Và điều quan trọng là bạn không thể tối đa hóa Zimv và tối đa hóa Roy cùng một lúc. Tức là chọn một chế độ thì đồng nghĩa với việc chế độ khác bạn sẽ bị hạn chế."},{"l":8,"p":"Phần 2","t":"Nhà bán chỉ tập trung vào một trong hai mục tiêu. Một là bạn muốn gia tăng về doanh thu thì bạn à và chọn chế độ là giảm roi xuống. Còn nếu như bạn muốn bản bảo bạn muốn bảo vệ lợi nhuận của mình thì bạn phải tăng cái roi của bạn lên."},{"l":8,"p":"Phần 2","t":"Trong quảng cáo TikTok thì hiện nay đặc biệt với Jmax ấy thì có một cái khái niệm rất là quan trọng đó là định giá theo giá trị khách hàng. Người ta gọi là value based optimization. Trước đây quảng cáo thường là tối ưu theo số lượng chuyển đổi, nghĩa là hệ thống sẽ cố gắng à tìm càng nhiều người mua hàng càng tốt."},{"l":8,"p":"Phần 2","t":"À ai có khả năng quả quảng cáo sẽ hiển thị cho người đó. Ai có ai có khả năng mua thì quảng cáo sẽ hiển thị cho người đó."},{"l":8,"p":"Phần 2","t":"Nhưng hiện nay TikTok đã chuyển sang một cách tối ưu thông minh hơn, đó là tối ưu theo giá trị. Điều này có nghĩa là hệ thống sẽ không chỉ tìm người có khả năng mua hàng mà cần tìm những cái người có khả năng mua với giá trị cao hơn thì người ta gọi đó là giá trị liên quan đến value base. Giả sử như một người một tháng chi được 10 triệu tiền mua hàng sẽ khác so với một người một tháng chỉ chi được khoảng 500.000."},{"l":8,"p":"Phần 2","t":"mua hàng trên TikTok Shop và vì vậy là TikTok sẽ phân các khách hàng thành các cái tệp à khác nhau chứ không phải là cào bằng tất cả các cái tệp đối tượng khách hàng nhé. À theo xu hướng mới, khái niệm này cũng được Google công bố. Chúng ta có thể xem đây như một cái tài liệu tham khảo để hiểu rõ là xu hướng thuật toán của các nền tảng đang sử dụng như thế nào."},{"l":8,"p":"Phần 2","t":"Bây giờ chúng ta cùng nhau thảo luận một câu hỏi rất quan trọng. Điều gì thực sự quyết định một chiến dịch quảng cáo TikTok thành công?"},{"l":8,"p":"Phần 2","t":"Có rất nhiều nhà bà án chúng ta chỉ cần sản phẩm tốt hoặc chỉ cần nội dung hay TikTok chỉ cần kỹ thuật quảng cáo giỏi là chúng ta có thể chạy quảng cáo một cách hiệu quả. Nhưng thực tế thì TikTok vận hành theo một logic khác so với những cái gì mà chúng ta nghĩ nhé. Đó là giá trị khách hàng mà chiến dịch tạo ra cho nền tảng."},{"l":8,"p":"Phần 2","t":"Vì vậy chúng ta cũng sẽ phân tích một số câu hỏi như sau. Chúng ta nên đặt target rust là cao có thực sự là một cái phương án tốt hay không? Bởi vì theo một cái lẽ thông thường khi mà RC thì đồng nghĩa với việc là chúng ta có một cái mức lợi nhuận lớn mà phần lớn người bán chúng ta thì thích lợi nhuận cao đúng không ạ?"},{"l":8,"p":"Phần 2","t":"Thứ hai đó là ép CPC xuống thấp có phải là một cái phương án tốt hay không? Khi chiến dịch chạy tốt, TikTok sẽ phản ứng như thế nào và khi chiến dịch chạy kém, TikTok sẽ xử lý ra sao? Thông qua phần thảo luận này, chúng ta có thể hiểu rõ hơn cách TikTok thực sự nhìn nhận một chiến dịch quảng cáo chứ không phải là cách các nhà bán hàng thường nghĩ."},{"l":8,"p":"Phần 2","t":"Vậy thì chúng ta cùng nhau tìm câu trả lời cho những phần này. Đầu tiên chúng ta sẽ nhìn vào cách TikTok đánh giá một chiến dịch quảng cáo là tốt hay không tốt. Một chiến dịch quảng cáo hiệu quả thường phụ thuộc vào ba yếu tố."},{"l":8,"p":"Phần 2","t":"Thứ nhất là chất lượng và cái hiệu suất sản phẩm mà chúng ta đang bán. Sản phẩm phải có khả năng bán được thật nhiều. Nếu sản phẩm không có sức bán thì dù quảng cáo có tốt đến đâu cũng rất khó để chúng ta có thể scale doanh thu."},{"l":8,"p":"Phần 2","t":"Thứ hai đó là số lượng và chất lượng video win để đáp ứng. TikTok là một cái nền tảng dựa vào nội dung nên nếu chỉ có vài video thì hệ thống cũng sẽ rất là khó học. Càng có nhiều video tốt, thuật toán càng dễ tìm được những khách hàng phù hợp cho bạn."},{"l":8,"p":"Phần 2","t":"Thứ ba là bidding và target rức là cái giá thầu của chúng ta đấy. Tức là chúng ta có thể thiết lập mục tiêu cho hệ thống. Nếu như chúng ta đặt mục tiêu hợp lý thì quảng cáo cũng sẽ có cơ hội phân phối rộng hơn."},{"l":8,"p":"Phần 2","t":"Nếu ba yếu tố này đang tốt, TikTok sẽ hiểu rằng chiến dịch này này của chúng ta đang có hiệu quả. Khi đó quảng cáo sẽ được tăng khả năng tiếp cận và cơ hội chúng ta tiếp cận những cái giá trị khách hàng tốt giống như là cái value dựa trên mà hôm bên trên chúng ta đã nói đấy thì sẽ tiếp cận được những cái thệp đối tượng ngon. Và ngược lại nếu như cả ba yếu tố trên mà chúng ta không làm tốt, không hiệu quả thì quảng cáo sẽ giới hạn cái khả năng tiếp cận của chúng ta và chúng ta chỉ tiếp cận được những cái nhóm đối tượng à chuyển đổi trung bình thôi, không được tốt cho lắm."},{"l":8,"p":"Phần 2","t":"Tiếp theo nữa là cách tính Roy à tính Roy mục tiêu sẽ như nào? Roy chính là return on impact, tức là khi chúng ta chạy quảng cáo hay chúng ta đầu tư kinh doanh thì chúng ta đều phải suy nghĩ đến một cái việc đó là cái tỉ suất hồi vốn của nó như thế nào. Ở phần này chúng ta sẽ tìm hiểu cách tính roy mục tiêu. Đây là một khái niệm cực kỳ quan trọng khi mà các bạn chạy quảng cáo nhé."},{"l":8,"p":"Phần 2","t":"Đặc biệt là với Jmax TikTok hoặc là target rust. Thực tế là chi phí quảng cáo cho một đơn hàng à không phải là một con số cố định mà nó nằm trong một khoảng có có thể chấp nhận được. Thế nên là những người nào mà chúng ta cần một con số chính xác cho Rust Roy ấy thì có lẽ là chúng ta sẽ không tìm đến được cái sự phù hợp đâu."},{"l":8,"p":"Phần 2","t":"Chúng ta sẽ không có điểm dừng cho việc này đâu. Tức là chúng ta cần biết chi phí quảng cáo tối ưu có thể chịu được là bao nhiêu và chi phí quảng cáo tối ưu để có lợi nhuận là khoảng bao nhiêu? Ví dụ ở đây một cái sản phẩm có giá bán là 200.000 sau khi trừ hết đi toàn bộ các cái chi phí thì phần còn lại để dành cho quảng cáo bao gồm là lợi nhuận và chi phí quảng cáo là khoảng 20.000."},{"l":8,"p":"Phần 2","t":"Như vậy Roy của các bạn sẽ chạy từ 10 cho đến 20. Công thức này cũng áp dụng với chiến dịch Shopee VV Max nhá. Tức là Shopee cũng có một cái cơ chế tính Roy dợ tương tự như với TikTok. Và ở salide này chúng ta sẽ trả lời một câu hỏi rất thực tế. Nên đặt target draft như nào là hợp lý?"},{"l":8,"p":"Phần 2","t":"Thường xu hướng đặt target Draft là thật cao. Ví dụ chúng ta có thể đặt lên tới 18, 20 thậm chí là 30. Vì nghĩ rằng là Rust càng cao thì chúng ta càng có lãi."},{"l":8,"p":"Phần 2","t":"Nhưng thực tế thì Thì RC thường làm cho quảng cáo của chúng ta không chạy được. Bởi vì cái cơ chế công tắc ban nãy chúng ta đã nói với nhau, nếu như bạn muốn gia tăng doanh thu thì buộc bạn phải giảm rot xuống. Còn nếu bạn muốn bảo vệ lợi nhuận của bạn đấy thì bạn phải tăng cái cái Rust của bạn lên đúng không ạ?"},{"l":8,"p":"Phần 2","t":"Thế nên là chúng ta thấy Rust ở đây sẽ chạy từ 5 cho đến 20. Vùng bên trái là Rust thấp là vùng để chúng ta chạy quảng cáo và hệ thống có thể tiếp cận rất nhiều cách khách hàng nhưng nhược điểm là đó là lợi nhuận thì thấp và thậm chí là có thể lộ vùng bên phải à đây là vụng lợi nhuận tốt nhưng quảng cáo sẽ khó phân phố traffic sẽ bị à bó hẹp còn vùng màu xanh, vùng màu giữa chính là khoảng rust hợp lý để chúng ta có thể vận hành."},{"l":8,"p":"Phần 2","t":"Ở slide trước chúng ta đã tính ra là roy mục tiêu trong khoảng 10 đến 20 và trên thực tế Rust sẽ nằm ở trong khoảng này. Vì vậy nguyên tắc đặt Rust sẽ là đặt RAS trong một khoảng Tại khoảng đó chúng ta chấp nhận được, tại khoảng đó chúng ta có lợi nhuận và tại khoảng đó cân bằng giữa việc là có lợi nhuận và quảng cáo của chúng ta phân phối tốt. Ở phần này chúng ta sẽ chuyển sang thực hành quảng cáo và bước đầu là chuẩn bị."},{"l":8,"p":"Phần 2","t":"Trước khi chạy quảng cáo TikTok thì chúng ta cần hiểu là quảng cáo có thể được triển khai ở hai nơi khác nhau. Thứ nhất, chạy trực tiếp trong TikTok Shop, tức là trong trung tâm người bán Seller Center. Đây là cách phổ biến nhất đối với những nhà bán hàng mới vì thao tác đơn giản."},{"l":8,"p":"Phần 2","t":"và gắn trực tiếp với sản phẩm. Thứ hai là chạy trong trình quảng cáo thuộc Business Center, tức là tài khoản quảng cáo chuyên nghiệp. Trong mô hình bên phải chúng ta thấy là TikTok Shop sẽ kết nối với ba thành phần chính."},{"l":8,"p":"Phần 2","t":"Thành phần thứ nhất là Business Center BC là nơi quản lý tài sản quảng cáo như tài khoản quảng cáo này, tài khoản TikTok này, pixel và quyền truy cập. Thứ hai là tài khoản quảng cáo. Đây là nơi trực tiếp tạo chiến dịch và tiêu tiền quảng cáo."},{"l":8,"p":"Phần 2","t":"Và thứ ba đó là kênh TikTok, tức là tài khoản TikTok đang đang đăng video và chạy quảng cáo. Ba thành phần được liên kết với nhau thông qua TikTok Shop. Tiếp theo là bước kết nối tài khoản."},{"l":8,"p":"Phần 2","t":"Đây là bước bắt buộc trước khi chạy chọc vào Jmax. Để chạy được quảng cáo TikTok Shop, chúng ta cần kết nối TikTok seller và các tài nguyên quảng cáo cần thiết. Cụ thể, chúng ta có ba phần chính kết nối."},{"l":8,"p":"Phần 2","t":"Thứ nhất là Business Center. Chúng ta có thể kết nối Business Center đã có sẵn hoặc tạo mới nếu chưa có. Business Center sẽ là nơi quản lý toàn bộ tài sản quảng cáo của doanh nghiệp."},{"l":8,"p":"Phần 2","t":"Thứ hai là tài khoản quảng cáo. Tài khoản quảng cáo cần được liên kết với tài khoản TikTok thường, tức là tài khoản đăng video và đồng thời phải liên kết với tài khoản Jmax."},{"l":8,"p":"Phần 2","t":"Có thể dùng tài khoản cũ hoặc tạo tài khoản mới tùy vào hệ thống của mỗi doanh nghiệp. Thứ ba là kết nối TikTok. Ở đây chúng ta cần liên kết à ở đây chúng ta cần liên kết chính và cả liên kết vệ tinh để Jmax có thể lấy video từ nhiều nguồn khác nhau để chạy quảng cáo."},{"l":8,"p":"Phần 2","t":"Như trong hình minh họa chúng ta vào trung tâm nhà bán, marketing, quảng cáo cửa hàng, tài khoản thì sẽ thấy quản lý tài khoản để thực hiện các kết nối này. Nếu chưa kết nối đúng các tài nguyên này thì Jmax sẽ không thể chạy được hoặc chạy nhưng không tận dụng hết hệ thống của video và dữ liệu. Tiếp theo đó là hướng dẫn kết nối hoặc share quyền tài khoản doanh nghiệp để chạy Jmax."},{"l":8,"p":"Phần 2","t":"Trong thực tế rất nhiều trường hợp tài khoản quảng cáo không nằm trong business center của mình, ví dụ như tài khoản agency của đối tác hoặc là công ty mẹ. Khi đó chúng ta cần thực hiện các bước share truy cập. Bước đầu tiên là chúng ta truy cập vào businessittiktok.com tức là trang quản lý business center của tích Tốc."},{"l":8,"p":"Phần 2","t":"Bước thứ hai là vào tab tài khoản, sau đó thêm tài khoản quảng cáo. Ở đây có thể chọn thêm tài khoản đã có sẵn hoặc tạo tài khoản mới tùy theo nhu cầu. Bước thứ ba, nếu tài khoản quảng cáo phụ thuộc vào đơn vị khác, chúng ta chọn yêu cầu truy cập, sau đó nhập tài khoản quảng cáo."},{"l":8,"p":"Phần 2","t":"ID này sẽ được đối tác cung cấp và chúng ta cần copy lại. Sau khi gửi yêu cầu, chủ tài khoản quảng cáo sẽ phê duyệt. Khi được phê duyệt thì Business Center của chúng ta có quyền sử dụng tài khoản quảng cáo đó để chạy Gmax."},{"l":8,"p":"Phần 2","t":"Đây là bước rất quan trọng. Nếu không có quyền truy cập tài khoản thì chúng ta không thể tạo chiến dịch. Và hoặc quản lý quảng cáo được."},{"l":8,"p":"Phần 2","t":"Tiếp theo là bước thứ tư trong slide trong quá trình kết nối tài khoản đó là kết nối kênh TikTok có thể phân phối quảng cáo. Trong tab tài khoản chúng ta chọn thêm tài khoản TikTok sau đó mục yêu cầu quyền phân phối quảng cáo. Bước này cho phép tài khoản quảng cáo của chúng ta được sử dụng video từ kênh TikTok đó để chạy quảng cáo."},{"l":8,"p":"Phần 2","t":"Đặc biệt là Jmax vì Jmax sẽ tự động lấy video có gắn link sản phẩm để phân phối. Có thể hiểu đơn giản là tài khoản quảng cáo là nơi tiêu tiền còn kênh TikTok là nơi cung cấp nội dung video. Và hai phần này phải được kết nối với nhau thì quảng cáo mới chạy được."},{"l":8,"p":"Phần 2","t":"Sau khi gửi yêu cầu chủ kênh TikTok sẽ phê duyệt. Khi được duyệt xong thì các video của kênh có thể sử dụng trong quảng cáo JX hoặc là Spark. Đây là bước quan trọng vì nếu không có quyền phân phối quảng cáo thì hệ thống sẽ không lấy được video để chạy Max dù sản phẩm và tài khoản quảng cáo đã có đầy đủ kết nối."},{"l":8,"p":"Phần 2","t":"Bước số năm đó là thêm cửa hàng TikTok Shop vào tài khoản Business Center. Chúng ta vẫn đang ở trong tab tài khoản nhưng chuyển sang mục cửa hàng sau đó chọn thêm cửa hàng và kết nối TikTok Shop vào Business Center. Bước này sẽ giúp kết liên kết giữa tài khoản quảng cáo và TikTok shop để hệ thống có thể lấy sản phẩm từ shop và đưa vào chiến dịch max."},{"l":8,"p":"Phần 2","t":"Nếu phiếu bước này thì dù chúng ta có kết nối tài khoản quảng cáo và kênh TikTok, hệ thống vẫn không thể chạy quảng cáo sản phẩm vì chưa nhận diện được shop. Tiếp theo chúng ta sẽ đi vào phần thiết lập chiến dịch quảng cáo Jmax. Đây là giao diện chúng ta sẽ tạo một chiến dịch quảng cáo trong TikTok Ad Manager và lựa chọn loại chiến dịch là promo product, tức là quảng cáo sản phẩm."},{"l":8,"p":"Phần 2","t":"Ở phần này chúng ta sẽ lựa chọn các sản phẩm cần quảng cáo. Có thể chọn sản phẩm quảng cáo, có thể chọn quảng cáo toàn bộ shop hoặc là chọn từng sản phẩm cụ thể. Tuy nhiên, trong thực tế nên chọn từng sản phẩm riêng để dễ kiểm tất hiệu quả."},{"l":8,"p":"Phần 2","t":"Bên dưới là phần optimization and and budget tức là mục tiêu tối hưu và ngân sách. Quan trọng nhất ở đây tức là product roy target tức là RAS mục tiêu. Đây là chỉ số mà chúng ta học ở phần trước. Hệ thống TikTok sẽ cố gắng phân phối quảng cáo sao cho đạt mức Rust này."},{"l":8,"p":"Phần 2","t":"Có thể hiểu đơn giản, nếu Rust target đặt thấp, quảng cáo sẽ dễ phân phối hơn nhưng lợi nhuận có thể thấp. Nếu R target đặt cao, quảng cáo sẽ phân phối chậm hơn vì sẽ cố gắng bảo vệ lợi nhuận. Vì vậy khi thiết lập rast chính là biến số quan trọng nhất vì nó quyết định cách TikTok phân phối quảng cáo."},{"l":8,"p":"Phần 2","t":"Tiếp theo chúng ta sẽ nói về tính năng mới trong phần quản lý nội dung sáng tạo của Jmax. Ở giao diện này, TikTok cho phép chọn video để chạy quảng cáo. Thay vì trước đây chúng ta chọn thủ công từng video một, hệ thống có thể tự động lấy video từ nhiều nguồn khác nhau."},{"l":8,"p":"Phần 2","t":"Ví dụ như video từ tài khoản TikTok Shop, video up đã được cấp quyền, video có gắn link sản phẩm. hoặc các nội dung được ủy quyền trước đó. Điều này có nghĩa là chỉ cần chúng ta có hệ thống video đủ tốt, TikTok có thể tự động chọn ra những video hiệu quả nhất để phân phối quảng cáo."},{"l":8,"p":"Phần 2","t":"Ngoài ra, bên dưới có một số tùy chọn nâng cao, ví dụ như loại trừ một số video nếu không muốn chạy video, chạy quảng cáo vào đó hoặc tăng tóc thử nghiệm video mới giúp hệ thống ưu tiên test các video mới đăng. Điểm quan trọng ở đây là Jmax ngày càng chuyển sang hướng automation hoàn toàn, tức là nhà quảng cáo sẽ ít can thiệp vào chi tiết mà tập trung nhiều hơn vào sản phẩm và nội dung."},{"l":8,"p":"Phần 2","t":"Có thể nói trong Jmax, video chính là nguyên liệu đầu vào quan trọng nhất. Cô quảng cáo. Tiếp theo là một số câu hỏi tình huống đó là khi nào chúng ta nên để tự động chọn video?"},{"l":8,"p":"Phần 2","t":"Thực tế thì không phải lúc nào chọn video thủ công cũng tốt. Có nhiều trường hợp để hệ thống tự động chọn video lại mang lại hiệu quả cao hơn. Trường hợp đầu tiên là khi ban đầu chúng ta chưa có đủ dữ liệu về video."},{"l":8,"p":"Phần 2","t":"Lúc này chúng ta cứ để hệ thống chạy tự động để TikTok khám phá xem video nào tốt, video nào kém. Sau một thời gian chúng ta sẽ có dữ liệu rõ ràng hơn để tối ưu."},{"l":8,"p":"Phần 2","t":"Trường hợp thứ hai là khi sản phẩm thuộc dạng phổ thông đơn giản có nhiều người có thể làm nội dung được. Ví dụ thời trang, mỹ phẩm, đồ giao dụng thì hệ thống có nhiều video để lựa chọn và thường sẽ tự tìm ra những video hiệu quả. Một dấu hiệu rất quan trọng nữa đó là những video tiêu tiền nhiều nhất thường là những video tốt nhất vì thuật toán chỉ đẩy mạnh những video vừa hiệu quả về chuyển đổi, vừa phù hợp về nội dung và hình ảnh."},{"l":8,"p":"Phần 2","t":"Và tất nhiên dùng để tự động thì chúng ta sẽ có quyền loại trừ những video không muốn phân phối. Ví dụ video nội dung kém, hình ảnh không đúng định vị thương hiệu hoặc thông tin sai. Tóm lại, auto video phù hợp nhất khi chúng ta muốn mở rộng nhanh và tận dụng sức mạnh của thuật toán TikTok."},{"l":8,"p":"Phần 2","t":"Tiếp theo câu hỏi ngược lại là khi nào chúng ta nên chọn thủ công? Việc chọn thủ công phù hợp với nhà quảng cáo đã có đủ dữ liệu và hiểu rõ video nào thực sự hiệu quả. Lúc này chúng ta không cần hệ thống thử nghiệm nữa mà chủ động dồn ngân sách vào những video tốt nhất."},{"l":8,"p":"Phần 2","t":"Trường hợp đầu tiên là khi bắt đầu thấy ngân sách bị phân phối vào những video không mong muốn, ví dụ những video nội dung chưa tốt hoặc không đúng định vị thương hiệu nhưng lại được hệ thống đẩy tiền thì lúc đó nên chuyển sang chọn thủ công để dễ kiểm soát. Trường hợp thứ hai là các video bắt cũ bắt đầu kém hiệu quả theo thời gian. Video quảng cáo có vòng đời khi CTR giảm hoặc chi phí tăng lên thì có thể coi là video đã hết tuổi thọ hiệu quả và cần thay thế bằng video mới."},{"l":8,"p":"Phần 2","t":"Một trường hợp nữa là những video cần test nhưng không được hệ thống phân phối. Nếu chúng ta tin rằng video đó có tiềm năng thì chọn thủ công là một cách ép hệ thống thử nghiệm. Ngoài ra khi nhà quảng cáo đã biết chắc chắn nên dồn tiền vào video nào thì việc chọn thủ công sẽ giúp tăng tốc hiệu quả thay vì hệ thống phân tán ngân sách."},{"l":8,"p":"Phần 2","t":"Đặc biệt là những ngành có nhiều video do người dùng sáng tạo, chất lượng không đồng đều thì việc chọn thủ công giúp tránh phân phối vào những video chất nhận kém."},{"l":8,"p":"Phần 2","t":"Tóm lại auto video phù hợp cho giai đoạn khám phá, còn chọn video thủ công phù hợp cho giai đoạn tối ưu và tuyển cắt hiệu quả. Tiếp theo một tính năng khá mới trong Jmax đó là tính năng à tăng cường nội dung sáng tạo Creative Boot. Tính năng cho phép này hệ thống tự động dồn thêm ngân sách vào những video có tiềm năng có chuyển đổi nhé."},{"l":8,"p":"Phần 2","t":"Đây là giao diện các cái chiến dịch đang chạy và chúng ta cùng tìm hiểu cách đọc chỉ số này nhá. Sau khi mà chúng ta chạy quảng cáo một thời gian thì các chiến dịch của chúng ta bắt đầu có các cái chỉ số đem lại những cái sự hiệu quả. Và bây giờ Chúng ta cùng nhau học cách đọc chỉ số."},{"l":8,"p":"Phần 2","t":"Chúng ta phân thành ba nhóm chỉ số quan trọng. Đó, nhóm chỉ số thứ nhất đó là nhóm chỉ số chính. Đây là nhóm quan trọng bao gồm những cái chỉ số liên quan trực tiếp đến hiệu quả kinh doanh như doanh thu, chi phí last. Thứ hai đấy là nhóm chỉ số phụ."},{"l":8,"p":"Phần 2","t":"Đây là những nhóm chỉ số giúp chúng ta hiểu rõ hơn về chất lượng nội dung ví dụ như CTR, CPC, thời gian xem hoặc tỉ lệ thêm vào rỏ. Và cuối cùng đấy là đánh giá chủ qua, tức là các góc nhìn của nhà bán về nội dung video. Video có đúng hình ảnh thương hiệu."},{"l":8,"p":"Phần 2","t":"hay không, có truyền tải đúng thông điệp hay không và có phù hợp với khách hàng của chúng ta hay không. Đầu tiên là các nhóm chỉ số chính à liên quan trực tiếp đến hoạt động kinh doanh của chúng ta. Đây là nhóm chỉ số quan trọng khi mà chúng ta đánh giá hiệu quả."},{"l":8,"p":"Phần 2","t":"Và cuối cùng mục tiêu của nhà quảng cáo không phải là nhiều view hay nhiều like mà phải tạo ra đơn hàng và có lợi nhuận. Các chỉ số chính bao gồm là chi phí quảng cáo, Roy hoặc Rust và số lượng đơn hàng. Những con số này của chúng ta được cho biết là rất rõ đó là chiến dịch có lợi nhuận hay không."},{"l":8,"p":"Phần 2","t":"Ví dụ một video có rất nhiều lượt xem hoặc lượng tương tác nhưng không tạo ra đơn hàng, không tạo ra chi phí quảng cáo à không tạo ra à hoặ là chi phí chạy nó quá cao thì về bản chất đó vẫn là một video kém hiệu quả. Ngược lại có những video mà mình không quá nổi bật nhưng đều đặn tạo ra đơn hàng và RAS tốt thì đó mới là những cái dạng video hiệu quả. Vì vậy khi đọc báo cáo quảng cáo hãy luôn nhìn vào chỉ số kinh doanh trước tiên."},{"l":8,"p":"Phần 2","t":"đó rồi mới phân tích đến các cái chỉ số khác nhé. Đây là biểu đồ hướng dẫn xem thông tin chi tiết. Các bạn có thể kích vào phần xem thông tin chi tiết để nắm rõ thông tin hơn."},{"l":8,"p":"Phần 2","t":"Tiếp theo là nhóm chỉ số phụ. Ở đây chúng ta nói đến tỉ lệ nhấp vào quảng cáo tức là CTR. CTR cho chúng ta biết quảng cáo hoặc video đã đủ hấp dẫn để khiến khách hàng bấm vào hay không hoặc video đang thu hút được sự chú ý của khách hàng thông qua ảnh, thông qua tiêu đề hay không. Ngược lại nếu CTR thấp thì thường vấn đề nằm ở hình ảnh."},{"l":8,"p":"Phần 2","t":"hình ảnh của sản phẩm chưa nổi bật, video chưa thu hút hoặc là thông điệp chưa đúng nhu cầu khách hàng. Tuy nhiên cần nhớ là CTR chỉ là chỉ số cụ, nó chỉ phản ánh khả năng thu hút click chứ chưa nói nên hiệu quả kinh doanh. Có những video CTR rất cao nhưng mà khách hàng xem rồi người ta không mua thì quảng cáo cũng không hiệu quả."},{"l":8,"p":"Phần 2","t":"Nhưng nếu CTR quá thấp thì quảng cáo cũng sẽ khó để chạy được. Vì vậy nền tảng sẽ đánh giá nội dung thông qua việc là nó đánh giá là không hấp dẫn. Đấy và thông qua CR thì chúng ta có thể thể chẩn đoán vấn đề về nội dung, còn quyết định giữ lại hay tắt quảng cáo thì vẫn phải dựa trên Roy và đơn hàng."},{"l":8,"p":"Phần 2","t":"Tiếp theo là nhóm chỉ số phụ liên quan đến tỉ lệ xem video, đặc biệt là tỉ lệ xem trong vài giây đầu như 3 giây hoặc 6 giây đầu. Chỉ số này phản ánh mức độ giữ chân người xem của video quảng cáo. Nói cách khác, nó là giúp chúng ta biết video có đủ điều kiện để người xem dừng lại xem tiếp hay không."},{"l":8,"p":"Phần 2","t":"Nếu tỉ lệ xem video là cao, điều đó thường cho thấy húc đầu video tốt, nội dung dễ hiểu, hình ảnh thu hút, Và chúng ta cùng nhau thảo luận một câu hỏi quan trọng trong a khi đồ chạy bao nhiêu quảng cáo rồi mới đánh giá được chỉ số trước đó nhá. Có thực sự hiệu quả hay không. Cuối cùng một cái tiêu chí mà nhiều người thường bỏ qua đấy là đánh giá chủ quan, tức là cảm quan của nhà bán."},{"l":8,"p":"Phần 2","t":"Nghe có vẻ cảm tính nhưng thực ra đây là một chỉ tiêu rất là quan trọng bởi à không phải lúc nào dữ liệu cũng nói lên toàn bộ cái sự thật nhé. Có những chỉ số rất đẹp, CG rất tốt, chi tiêu rất tốt, thậm chí ra đơn. Nhưng mình xem lại thấy nội dung không đúng với định hướng thương hiệu hoặc thu hút sai tệp khách hàng."},{"l":8,"p":"Phần 2","t":"Những video này thường chưa chắc đã nên giữ lâu dài. Ngược lại có những video số liệu chưa quá nổi bật nhưng nội dung rất là tốt. Đúng inside khách hàng, hình ảnh thương hiệu. Những video này thì thường chính là những cái key content trong tương lai và đăng để tiếp tục nuôi."},{"l":8,"p":"Phần 2","t":"Vì vậy một cái nhà quảng cáo giỏi là người biết kết hợp cả dữ liệu và cả kinh nghiệm của mình nhá. Không phải chạy quảng cáo hoàn toàn theo cảm tính nhưng cũng không phụ thuộc tuyệt đối và các con số. Và đây chính là phần nội dung cuối cùng trong phần bài học số 8 liên quan đến quảng cáo trả phí. Xin chào và hẹn gặp lại các bạn trong bài tiếp theo."},{"l":9,"p":"Phần 1","t":"Xin chào các bạn. Ngày hôm nay chúng ta cùng nhau đến với bài 9 trong môn kinh doanh trên sàn thương mại điện tử. Và chủ đề của bài 9 ngày hôm nay là tổng quan về mô hình livestream trong thương mại điện tử."},{"l":9,"p":"Phần 1","t":"Ngày hôm nay chúng ta sẽ có ba mục tiêu quan trọng như sau. Đầu tiên là chúng ta sẽ cùng nhau hiểu được tổng quan về mô hình livestream trong thương mại điện tử. Thứ hai là chúng ta nắm rõ được quy trình tổ chức một phiên bán hàng livestream."},{"l":9,"p":"Phần 1","t":"Và thứ ba đó là chúng ta biết cách thực hành livestream thu hút khách hàng. Tương ứng với ba mục tiêu đó thì nội dung bài học của ngày hôm nay à cũng sẽ là tổng quan về mô hình livestream trong thương mại điện tử, các cái quy trình để chúng ta có thể tổ chức livestream bán hàng và chúng ta cùng thực hành livestream để thu hút khách hàng. Chúng ta cùng bắt đầu với phần đầu tiên đó là à các bài học liên quan đến tổng quan mô hình livestream trong thương mại điện tử."},{"l":9,"p":"Phần 1","t":"Nếu nhìn lại các cách bán hàng truyền thống trước đây, à doanh nghiệp thường bán hàng thông qua việc chúng ta có cửa hàng vật lý hoặc là Chúng ta có một website, chúng ta có các cái sàn thương mại điện tử, người mua sẽ chủ động tìm kiếm sản phẩm, xem thông tin và đọc các cái đánh giá trước khi quyết định mua. Tuy nhiên, trong vài năm gần đây, với sự xuất hiện của một hình thức bán hàng mới, đó chính là livestream bán hàng."},{"l":9,"p":"Phần 1","t":"Livestream bán hàng thì là một cái hình thức à người bán phát video trực tiếp trên nền tảng, vừa giới thiệu về sản phẩm mà lại vừa tương tác với khách hàng theo thời gian thực. Người xem có thể đặt câu hỏi, nhận tư vấn và mua hàng ngay trong lúc livestream đang diễn ra. Vậy thì à chúng ta cùng nhau tìm hiểu những cái thông tin đầu tiên."},{"l":9,"p":"Phần 1","t":"Để hiểu vì sao livestream lại à trở thành một cái xu hướng à mạnh mẽ như hiện nay. Chúng ta cần nhìn vào tiềm năng của mô hình này tại thị trường quốc tế, đặc biệt là tại thị trường Trung Quốc."},{"l":9,"p":"Phần 1","t":"Trung Quốc được xem là một cái nôi của mô hình livestream thương mại điện tử mà à nơi mà các cái nhà bán à chúng ta phát triển sớm và đạt những cái quy mô rất là lớn. Theo báo cáo của thị trường quy mô doanh thu về livestream commerce tại Trung Quốc đã tăng trưởng cực kỳ nhanh. Năm 2019 thì thị trường này mới chỉ khoảng 420 tỷ đô nhưng đến giai đoạn 2023 2024 á thì con số này đã tăng lên từ 690 đến 700 tỷ đô."},{"l":9,"p":"Phần 1","t":"Điều là đáng chú ý là sự tăng trưởng này chỉ diễn ra trong khoảng 4 đến 5 năm thôi cho thấy tốc độ phát triển của mô hình livestream rất là mạnh và và cực kỳ bùng nổ. Điều này chứng minh một điều đó là livestream không chỉ là một cái hình thức marketing hay giải trí mà đã trở thành một cái hình thức bán hàng quy mô lớn trong thương mại điện tử rồi. Và bên cạnh mô hình doanh thu rất lớn đó, một cái điều thú vị khác của mô hình livestream thương mại điện tử nó tạo ra một cái hệ sinh thái à nghề nghiệp hoàn toàn mới."},{"l":9,"p":"Phần 1","t":"Theo các cái thống kê của Trung Quốc thì tính đến cuối năm 2023 đã có khoảng 15 triệu người làm việc liên quan đến livestream chuyên nghiệp. Con số này chiếm đâu đó khoảng 1% dân số của Trung Quốc. Một cái tỉ lệ rất đáng chú ý."},{"l":9,"p":"Phần 1","t":"Điều này cho thấy là livestream không chỉ đơn thuần là việc một người đứng trước camera để bán hàng mà à phía sau của một cái buổi livestream ấ thường là cả một cái đội ngũ vận hành. Ví dụ như là trong một hệ thống livestream chuyên nghiệp có thể là hot livestream là người trực tiếp giới thiệu sản phẩm, đội ngũ vận hành livestream, kiểm soát chương trình quản lý à bình luận rồi là nhân sự marketing và quảng cáo, nhân sự kho bãi và vận hành."},{"l":9,"p":"Phần 1","t":"Như vậy livestream đã trở thành một cái ngành nghề và một cái ngành công nghiệp thực sự chính thống và tạo ra công ăn việc làm cho một cái bộ phận dân số thực tế. À một yếu tố rất là quan trọng khác cho thấy là tiềm năng của livestream trong thương mại điện tử chính là quy mô xem."},{"l":9,"p":"Phần 1","t":"Theo các thống kê của Trung Quốc thì hơn 750 triệu người đã từng xem livestream trên tính đến năm 2023. Con số này tương đương với một nửa dân số của Trung Quốc. Điều này cho thấy là livestream đã trở thành một cái hành vi tiêu dùng hết sức phổ biến rồi."},{"l":9,"p":"Phần 1","t":"Giống như việc chúng ta lên mạng xã hội hay là xem video mỗi ngày. Đối với các doanh nghiệp và nhà bán thì điều này mang lại một cái lợi thế rất lớn. Thay vì tìm kiếm à khách hàng một cách riêng lẻ, livestream cho phép người bán tiếp cận cùng lúc hàng nghìn thậm chí hàng chục nghìn người xem à trong một thời điểm."},{"l":9,"p":"Phần 1","t":"Chính vì vậy nhiều Thương hiệu hiện nay à coin livestream không chỉ là một cái hoạt động marketing mà còn là một cái mô hình bán hàng trực tiếp có khả năng tạo ra doanh thu ngay trong những cái thời điểm bán hàng. Một yếu tố đặc biệt trong mô hình livestream thương mại điện tử đó là vai trò của các streamer và các hot livestream."},{"l":9,"p":"Phần 1","t":"Trong nhiều trường hợp sức ảnh hưởng của những streamer hàng đầu có thể so sánh với các cái thương hiệu hoặc là tập đoàn bán lẻ lớn. Ví dụ nổi tiếng nhất đó là một cái bạn bên Trung Quốc tên là Tân Ba hay chúng ta còn gọi là SINBA. Đấy, một trong những cái livestream bán hàng rất là nổi tiếng À bên Khoai Sầu trong một cái phiên livestream tháng năm 2021, chỉ trong 12 tiếng phát sóng, anh ta đã bán được một lượng hàng trị giá hơn 300 triệu đô tương đương với 2 tỷ nhân dân tệ."},{"l":9,"p":"Phần 1","t":"Để có thể hình dung quy mô của con số này thì doanh thu của một buổi livestream 12 tiếng của anh ta thậm chí còn cao bằng cả một doanh nghiệp à cả năm à của một cái trung tâm thương mại nổi tiếng nhất ở Hồng Kông. Điều này cho thấy là livestream bán hàng có thể tạo ra sức mạnh cực kỳ lớn trong thời gian ngắn, đặc biệt là kết hợp giữa người bán có sức ảnh hưởng và sản phẩm phù hợp à lượng người xem đông đảo. Một cái ví dụ nổi tiếng khác đó là anh Lý Giai Kỳ hay còn gọi là vua son môi của Trung Quốc."},{"l":9,"p":"Phần 1","t":"À anh ta là một trong những cái streamer có sức ảnh hưởng rất lớn trong ngành mỹ phẩm. À trong một cái lần hợp tác với Jackma đầu năm 2018 à anh ta đã bán hết 15.000 thỏi son chỉ trong vòng 5 phút livestream thôi. Con số này cho thấy một điều rất đặc biệt của livestream thương mại điện tử đó là quyết định mua hàng của khách hàng có thể diễn ra gần như là ngay lập tức."},{"l":9,"p":"Phần 1","t":"Khi một người xem theo dõi livestream, họ không chỉ nhìn thấy sản phẩm mà họ còn được nghe tư vấn xem thử sản phẩm, trực tiếp nhận khuyến mãi và tương tác với người bán. Tất cả những cái yếu tố này kết hợp sẽ kích thích cái hành vi mua sắm. Chính vì vậy, livestream thường có tỉ lệ chuyển đổi cao hơn so với nhiều hình thức bán hàng online khác, đặc biệt là khi người livestream có uy tín và có sức ảnh hưởng đối với người xem. Không chỉ tại Trung Quốc, mô hình livestream bán hàng hiện nay cũng đang phát triển rất là nhanh."},{"l":9,"p":"Phần 1","t":"Tại Việt Nam, một số ví dụ là Võ Hà Linh, một trong những nổi tiếng trong lĩnh vực review và bán hàng online. Trong một phiên livestream vào ngày 15 tháng 0 năm 2024, cô đã có một phiên bán được 5000 hộp phấn chỉ trong vòng 1 phút. Và trong suốt phiên livestream đó, tổng số đơn hàng cô bán ra là khoảng 42.000 đơn, tương đương với 420.000 sản phẩm được bán ra."},{"l":9,"p":"Phần 1","t":"Và bên cạnh doanh thu, lượng người xem livestream của Võ Hà Linh cũng rất ấn tượng. Trong nhiều phiên livestream, số lượng người xem dao động từ 110.000 cho đến 130.000 người cùng lúc. Nếu So sánh với một số K khác, lượng người xem cao hơn rất nhiều."},{"l":9,"p":"Phần 1","t":"Điều đó cho thấy một cái sức mạnh ảnh hưởng của người dẫn livestream có thể quyết định rất lớn đến cái hiệu quả bán hàng. Một điểm thú vị khác là trong cách là làm của Võ Hà Linh là không công khai doanh thu trong các viên livestream. Cái điều này nó làm tăng sự uy tín và sự tò mò của công chúng về cô."},{"l":9,"p":"Phần 1","t":"Sau khi chúng ta nhìn đến con số ấn tượng đó thì chúng ta cùng nhau đặt một câu hỏi lớn hơn là vì sao livestream lại có cái sức hút mạnh mẽ như vậy trong thương mại điện tử? Thực ra thì livestream bán hàng là một mô hình rất đặc biệt. Việt à nó không chỉ đơn thuần là bán hàng online mà là một mô hình bán lẻ đồng bộ, nơi mà khá nhiều những cái hoạt động diễn ra trong cùng một lúc trong thời gian thực."},{"l":9,"p":"Phần 1","t":"Trong buột buổi livestream, người bán có thể giới thiệu sản phẩm, tư vấn cho khách hàng, trả lời một số câu hỏi và chốt đơn ngay lập tức. Tất cả những cái diễn ra trực tiếp và liên tục trong một cái khoảng thời gian livestream. Điều này khiến cho trải nghiệm khách hàng trở nên sống động hơn rất là nhiều so với chỉ xem hình ảnh hay là đọc mô tả sản phẩm trên sàn thương mại điện tử nhé."},{"l":9,"p":"Phần 1","t":"Một cái lý do quan trọng khác khiến livestream thành công đó chính chính là nó kết hợp ba yếu tố. Thứ nhất là yếu tố liên quan đến giải trí à có thể nâng cao được cái cảm xúc của khách hàng."},{"l":9,"p":"Phần 1","t":"Thứ hai là khách hàng được tương tác với cái người bán một cách rất thực tế. Và thứ ba là khách hàng được mua những cái sản phẩm với những cái vouer, những cái khuyến mãi rất là tốt. Nó tạo ra một trải nghiệm mua sắm rất nhất quán và liền mạch."},{"l":9,"p":"Phần 1","t":"Dưới góc độ kinh tế học à thì khác với kinh tế học truyền thống, nơi người ta giả định khách hàng tiêu dùng đưa ra quyết định một cách đầy lý trí thì kinh tế học hành vi lại cho rằng quyết định mua hàng của con người thường bị ảnh hưởng nhiều bởi yếu tố về cảm xúc, tâm lý cũng như là bối cảnh. Livestream bán hàng chính là một cái môi trường rất là đặc biệt để kích hoạt những cái yếu tố âm lý đó."},{"l":9,"p":"Phần 1","t":"Trước hết là livestream là một phần của kinh tế trải nghiệm. Người xem không chỉ đơn thuần mua sản phẩm mà họ đang trải nghiệm một cái buổi trình diễn trực tiếp nơi người bán giới thiệu à thử sản phẩm và tạo ra một cái cảm xúc cho người xem."},{"l":9,"p":"Phần 1","t":"Bên cạnh đó, livestream còn thuộc nền kinh tế của sự chú ý nữa trong môi trường internet ngày nay thì à cái thứ khan hiếm không phải là sản phẩm mà chính là phải lấy được những cái sự chú ý của người tiêu dùng. Và livestream vô hình chung là trong những cái phiên livestream thì chúng ta thường thấy là có những cái hoạt động để gia tăng sự tương tác, gia tăng sự chú ý từ khách hàng và từ đó vừa là yếu tố liên quan đến trải nghiệm, vừa là yếu tố liên quan đến sự chú ý thì một phiên livestream nó đem lại được những cái điều thần kỳ đó mà thương mại điện tử truyền thống thì lại không làm được điều tương tự."},{"l":9,"p":"Phần 1","t":"À ngoài ngoài góc nhìn về kinh tế học hành vi thì chúng ta cũng có thể đánh giá sức hút của livestream theo à lý thuyết truyền thông. À theo lý thuyết truyền thông ấy mỗi một kênh truyền thông có mức độ truyền thông truyền thông tin khác nhau."},{"l":9,"p":"Phần 1","t":"Có những kênh thông tin truyền thông khá đơn giản ví dụ như là văn bản hoặc hình ảnh nơi người mua chỉ đọc và mô tả sản phẩm xem ảnh minh họa thôi. Tuy nhiên những cái kênh này thường có một cái hạn chế là người mua khó hình dung chính xác sản phẩm và đôi khi vẫn còn nhiều sự không chắc chắn trước khi đưa ra quyết định. Livestream thì lại khác."},{"l":9,"p":"Phần 1","t":"Đây được xem là một cái hành kênh truyền thông rất là rất là giàu thông tin. hay còn gọi là Rich Media Channel. Một trong những cái buổi livestream người xem có thể à đồng thời truyền tải rất nhiều những cái thông tin quan trọng."},{"l":9,"p":"Phần 1","t":"Ví dụ như hình ảnh trực tiếp về sản phẩm, âm thanh à giải thích chi tiết, ngôn ngữ cơ thể, cảm xúc của người bán và phản hồi ngay lập tức với người xem. Ngoài yếu tố về công nghệ công nghệ tâm lý người xem, livestream còn là một cái yếu tố được giải thích dưới góc độ xã hội học. Một trong những lý thuyết quan trọng trong livestream ấy đó là lý thuyết của sự hiện diện xã hội."},{"l":9,"p":"Phần 1","t":"À lý thuyết này cho rằng con người giao tiếp với nhau trong một cái môi trường trực tuyến à nhưng vẫn cảm nhận được sự hiện diện của những người khác. Họ có xu hướng tương tác và phản ứng giống như trong đời thực. Trong một buổi livestream thì người xem thường không chỉ nhìn thấy người bán mà còn nhìn thấy rất nhiều người khác đang cùng xem, cùng bình luận và cùng mua sản phẩm giống mình."},{"l":9,"p":"Phần 1","t":"Điều này tạo ra một cái cảm giác rằng là người xem đang tham gia vào một cuộc một cộng đồng mua sắm trực tuyến chứ không phải là một cái đang mua hàng một mình nhé. Bên cạnh đó livestream còn hình thành các cái cộng đồng à nơi những cái người mà cùng sở thích hoặc là cùng quan tâm đến sản phẩm, cùng tham gia và tương tác với nhau. Sau khi phân tích nhiều góc độ khác nhau, chúng ta có thể thấy rằng là sự bùng nổ của à livestream thương mại không chỉ là một cái hiện tượng ngẫu nhiên, nó xuất hiện từ sự hội tụ của nhiều yếu tố à trong nền kinh tế hiện nay."},{"l":9,"p":"Phần 1","t":"Thứ nhất là sự thay đổi trong kinh tế hành vi của người tiêu dùng. Người tiêu dùng ngày nay không còn muốn đọc mô tả sản phẩm một cách vô hồn nữa mà họ cần được tư vấn trực tiếp. được tương tác và được giải trí trong một cái môi trường."},{"l":9,"p":"Phần 1","t":"Nói cách khác, mua nhu cầu mua sắm được giải trí hóa và livestream chính là một cái hình thức phù hợp với xu hướng này. Thứ hai đó là yếu tố liên quan đến niềm tin và tính thác thực. Thông thường trong thương mại điện tử truyền thống nhiều khách hàng vẫn cảm thấy không chắc chắn về sản phẩm vì chỉ nhìn thấy hình ảnh và thông tin do người bán cung cấp thôi."},{"l":9,"p":"Phần 1","t":"Livestream giúp cho giải quyết được vấn đề này bằng cách cho khách hàng thấy trực tiếp sản phẩm và cách sử dụng, nghe tư vấn trực tiếp, từ đó tăng cảm giác tin tưởng hơn. Thứ ba nữa đó là các yếu tố liên quan đến hạ tầng về công nghệ. Hiện nay để chúng ta có thể livestream, chúng ta chỉ cần một cái điện thoại di động là có thể bắt đầu livestream rồi."},{"l":9,"p":"Phần 1","t":"Và với tốc độ internet hiện nay thì bất cứ ai, bất cứ người nào cũng có thể trở thành một streamer. Qua toàn bộ phần vừa rồi, chúng ta có thể thấy rằng livestream bán hàng không chỉ đơn thuần là một cái phương thức bán hàng mới. Thực chất livestream là một cái sự tái cấu trúc toàn bộ trải nghiệm mua sắm trong thương mại điện tử."},{"l":9,"p":"Phần 1","t":"Nếu như trước đây việc mua sắm online chủ yếu là dựa vào hình ảnh, mô tả sản phẩm và đánh giá của người mua trước thì livestream đã mang được một cái trải nghiệm gần như giống với việc mua sắm trực tiếp tại cửa hàng. Người tiêu dùng có thể nhìn thấy sản phẩm thật, nghe tư vấn trực tiếp và tương tác với người bán. Điều quan trọng hơn đó là livestream thì đánh trúng vào ba nhu cầu rất cơ bản của con người."},{"l":9,"p":"Phần 1","t":"Nhu cầu được kết nối, nhu cầu được giải trí và nhu cầu được tin tưởng. Sau khi chúng ta hiểu tiềm năng của mô hình livestream trong thương mại điện tử, chúng ta sẽ cùng tiếp tục với một câu hỏi rất quan trọng."},{"l":9,"p":"Phần 1","t":"Đó là livestream thực sự giúp doanh nghiệp gia tăng doanh thu như thế nào? Để trả lời câu hỏi này, chúng ta cần nhìn vào hành trình khách hàng trong marketing. À thường được mô tả dưới mô hình IDA, tức là bao gồm bốn pha: Awen là nhận biết, quan tâm, interest, mong muốn, design và hành động action."},{"l":9,"p":"Phần 1","t":"Trong hình thức truyền thống thì khách hàng thường sẽ phải đi qua ba giai đoạn này theo một cái chu trình rất giải. Ví dụ như khách hàng thấy quảng cáo sau đó tìm hiểu thêm về sản phẩm, cân nhắc tới rồi mà quyết định mua hàng. Tuy nhiên trong livestream thì nó lại đốt cháy toàn bộ những cái giai đoạn giai đoạn này."},{"l":9,"p":"Phần 1","t":"Chỉ trong một cái phiên livestream thôi, toàn bộ những cái pha từ xây dựng những cái sự nhận thức cho đến kích thích những cái nhu cầu mong muốn và cuối cùng khuyến khích khách hàng trỏ vào dỏ hàng để mua hàng. Tất cả nó đều dồn lại trong một cái phiên livestream."},{"l":9,"p":"Phần 1","t":"Và vai trò của livestream chính là đốt cháy được toàn bộ những cái giai đoạn này thay vì giống như môi trường thương mại điện tử truyền thống. Một cách đơn giản, dễ hiểu vai trò của livestream trong thương mại điện tử. Livestream giống như một cái trung tâm tích hợp nhiều chức năng cùng một lúc."},{"l":9,"p":"Phần 1","t":"Trong một thiết bị livestream, doanh nghiệp không chỉ thực hiện một hoạt động duy nhất mà có thể kết hợp nhiều hoạt động marketing và bán hàng trong cùng một không gian. Một vai trò rõ ràng của livestream trong thương mại điện tử đó là trở thành một kênh bán hàng trực tiếp với tốc độ rất là cao. Khác với hình thức bán hàng online truyền thống nơi khách hàng tìm kiếm sản phẩm và đọc thông tin so sánh rồi mà ra quyết định thì livestream rút ngắn thời gian này hơn."},{"l":9,"p":"Phần 1","t":"Trong một buổi livestream khách hàng có thể xem sản phẩm nghe tư vấn đặt hàng ngay lập tức. Điều này tạo ra một cái tác động rất lớn với doanh thu."},{"l":9,"p":"Phần 1","t":"Hàng ngàn hàng hóa tồn kho có thể được chuyển thành tiền mặt chỉ trong một vài giờ livestream thôi. Một yếu tố quan trọng hơn khác nữa đó là yếu tố cộng hưởng ở số đông. Trong những cái buổi livestream sẽ có hàng chục ngàn người cùng xem và khi nhiều người cùng xem quan tâm tới một sản phẩm và cùng một thời điểm sức mua cũng sẽ được khuếch đại một cách hiệu quả hơn."},{"l":9,"p":"Phần 1","t":"Chính vì vậy doanh thu tạo ra trong một phiên livestream đôi khi có thể tương đương với doanh số mà nhiều nhà bán hàng bán lẻ truyền thống. phải mất đến vài tháng chúng ta mới đạt được các cái doanh thu như vậy. Và một vai trò quan trọng khác của livestream trong thương mại điện tử đó là trở thành một cái công cụ ra mắt sản phẩm rất mạnh hay còn gọi là lun lunchpad."},{"l":9,"p":"Phần 1","t":"Trước đây khi doanh nghiệp ra mắt sản phẩm mới, họ thường phải tổ chức những cái sự kiện giới thiệu sản phẩm quảng bá, họp báo để thu hút chú ý của khách hàng."},{"l":9,"p":"Phần 1","t":"Nhưng với livestream doanh nghiệp à có thể giới thiệu sản phẩm tới hàng chục nghìn người xem trong cùng một thời điểm. Trong một buổi livestream, những cái người streamer hoặc người bán có thể demo trực tiếp các cái tính năng của sản phẩm, so sánh các cái sản phẩm khác trên thị trường. Điều này giúp khách hàng hiểu rõ sản phẩm và giảm bớt sự do dự trong khi mua hàng."},{"l":9,"p":"Phần 1","t":"Ngoài ra, việc khách hàng nhìn thấy sản phẩm một cách rất là thực tế và nghe giải thích trực tiếp cũng giúp cho cái độ tin cậy đối với sản phẩm mới, từ đó giảm tỉ lệ khách hàng trả hàng hoặc là tăng khả năng chuyển đồ của đơn hàng lên. Và livestream cũng là một cái công cụ phá giá và xả hàng tồn kho."},{"l":9,"p":"Phần 1","t":"Trong thương mại điện tử thì một trong những nỗi đau lớn nhất đối với người bán chính là họ làm sao có thể bán được hết lượng hàng tồn kho và tạo ra những cái cú hít trong một cái thời gian ngắn thì tác động lớn nhất của livestream có lẽ là giải phóng hàng tồn kho và thu hồi vốn rất là nhanh thông qua các phiên flash sale với giá không thưởng tạo ra những cái cơn sốt mua sắm và giúp thanh lý khối lượng hàng hóa lớn trong một cái thời gian ngắn và livestream cũng là một cái kênh xây dựng thương hiệu cực kỳ tốt biến khách hàng vãng lai thành những cái fan ruột trong quá trình chúng ta giới thiệu sản phẩm đầu tiên thì trong livestream ấy thì nó có một cái tính chất cá nhân hóa rất là lớn."},{"l":9,"p":"Phần 1","t":"Đó là trong những cái viên live chúng ta hoàn toàn chúng ta có thể gọi tên khách hàng à có những cái tương tác cá nhân trò chuyện với người xem khiến cho người xem có một cái cảm giác được trân trọng được à tương tác."},{"l":9,"p":"Phần 1","t":"Họ không chỉ mua hàng từ một shop mà họ được mua hàng từ một người bạn, một người mà họ thực sự yêu mến và họ được trân trọng trong những phiên lai đó. Và đây cũng là một cái phòng thí nghiệm để chúng ta nghiên cứu thị trường real time. À thông thường khi mà chúng ta muốn lắng nghe các cái nhu cầu của khách hàng thì chúng ta sẽ sẽ có một cái khoảng thời gian nhất định à khách hàng có hài lòng hay là chưa hài lòng về sản phẩm thì thông thường là chúng ta cũng sẽ phải mất một cái thời gian rất là lâu để biết được điều đó."},{"l":9,"p":"Phần 1","t":"Ít thì cũng vài tuần, nhiều thì có khi đến vài tháng thì chúng ta mới có thể đánh giá và điều chỉnh sản phẩm của mình được. Nhưng ở livestream ấy thì nó có một cái đặc điểm rất là hay đó là cái bình luận của khách hàng giống như một cái cuộc khảo sát."},{"l":9,"p":"Phần 1","t":"Streamer có thể biết ngay được mọi người thích màu gì, ghét điểm gì, muốn mua giá bao nhiêu, à phản hồi được những cái điều này để có thể gửi ngược lên những cái nhà sản xuất để để có thể cải tiến và phát triển sản phẩm một cách tốt hơn. Và kết luận kết luận là gì? Là livestream không chỉ là một cái kênh bán hàng mà còn là một cuộc cách mạng trong hành vi mua sắm."},{"l":9,"p":"Phần 1","t":"Nó là điểm giao thoa hoàn hảo giữa ba yếu tố. Đầu tiên đó là phải kể đến sức mạnh của công nghệ bao gồm là thời tran gian thực và gần như không có giới hạn về biên giới. Thứ hai là về yếu tố về tâm lý học."},{"l":9,"p":"Phần 1","t":"Bản chất con người là muốn kết nối, muốn giải trí, muốn tạo ra sự tin tưởng. Thứ ba là quy luật về kinh tế. Nó tạo ra những cái hiệu suất vượt trội, tính thanh khoản siêu nhanh."},{"l":9,"p":"Phần 1","t":"Thành công của các cái Chiến thần đến từ Trung Quốc à đến Việt Nam đã chứng minh là người chiến thắng trong thời đại mới không phải là người có nhiều hàng nhất mà là người chiếm được nhiều sự chú ý và niềm tin của khách hàng nhất."},{"l":9,"p":"Phần 2","t":"Chúng ta cùng nhau sang phần số hai đó là cùng nhau chia sẻ một cái quy trình để chúng ta có thể tổ chức những cái phiên live. Đầu tiên thì à trong một cái phiên live của chúng ta thì thường sẽ phải tuân thủ một cái nguyên tắc mang tên là nguyên tắc 5P. 5P này là gì?"},{"l":9,"p":"Phần 2","t":"Đầu tiên đó chính là treine. Một cái hoạt động mà chiếm nhiều thời gian nhất chính là hoạt động chuẩn bị trước khi mà livestream. Thứ hai là production tức là các cái hoạt động liên quan đến sản xuất và dàn dựng nội dung."},{"l":9,"p":"Phần 2","t":"Thứ ba đó là performance tức là các cái kịch bản và tương tác trong quá trình trong quá trình làm. Process tức là các cái khâu liên quan đến xử lý đơn hàng và hậu cần. Và cuối cùng đó là post line tức là các cái hoạt động phân tích và tối ưu các cái chỉ số sau những cái phiên line này."},{"l":9,"p":"Phần 2","t":"Đầu tiên thì mô hình 5P được xây dựng dựa trên ba cơ sở chính. À thứ nhất là lý thuyết liên quan đến quản trị dự án. Mỗi một livestream thì nó giống như một cái dự án độc lập và nó đều cần những cái quy trình chuẩn."},{"l":9,"p":"Phần 2","t":"Thứ hai đấy là vòng vòng tròn. PDCA à bao gồm plan, do, check hay action liên tục cải tiến sau mỗi một cái tuyên lai. Thứ ba là các cái nguyên lý liên quan đến hệ thống bao gồm các cái giai đoạn tác động qua lại ảnh hưởng đến kết quả cuối cùng."},{"l":9,"p":"Phần 2","t":"Và nguyên tắc vàng của à chuỗi này đó chính là 80 thành công thành công của một viên lai nó đến từ khâu chuẩn bị, chỉ có 20% đến từ khâu lên hình thôi. Trong mô hình 5P, một trong những cái giai đoạn quan trọng nhất đấy chính là giai đoạn pre preline tức là giai đoạn chuẩn bị. Ở giai đoạn này chúng Chúng ta sẽ phải trả lời một cái câu hỏi 5W1H."},{"l":9,"p":"Phần 2","t":"Đầu tiên chúng ta sẽ hỏi là chúng ta sẽ đặt một câu hỏi why. Tại sao trước khi mọi việc bắt đầu sẽ diễn ra à chủ shop chúng ta cần trả lời một câu hỏi then chốt đó là cái mục tiêu của buổi livestream này là gì? Tại sao tôi phải đạt được những cái mục tiêu đó? Tôi để tăng doanh thu ra mất sản phẩm mới hay là sả hàng tồn kho?"},{"l":9,"p":"Phần 2","t":"Tôi muốn xây dựng thương hiệu gia tăng độ nhận biết và kết nối với khách hàng mục tiêu? Hay là tôi muốn thu hút những khách hàng mới tiếp cận những người tưa chưa dùng chưa từng mua sản phẩm? Mục tiêu càng cụ thể để chúng ta càng dễ đo lường và các bước tiếp theo càng dễ triển khai."},{"l":9,"p":"Phần 2","t":"Thứ hai đó là chúng ta xác định xem tệp đối tượng khách hàng mục tiêu hoặc là tệp đối tượng à nhân sự của chúng ta ai sẽ là người những cái người làm việc này đầu tiên ai là người xem chúng ta cần xác định rõ chân dung khách hàng lý tưởng sẽ xem và mua hàng trong phiên live ai sẽ là người bán đội ngũ thực hiện trong một phiên livestream chuyên nghiệp cần ít nhất có à ba vai trò thứ nhất là streamer chính tức là người đứng trước ống kính dẫn dắt chương trình và giới thiệu sản phẩm và tương tác với khách."},{"l":9,"p":"Phần 2","t":"Thứ hai là các bạn trợ lý là người theo dõi bình luận, nhắc streamer những câu hỏi quan trọng, xử lý các cái vấn đề về kỹ thuật phát sinh, ghim link, thả link hay chặn spam."},{"l":9,"p":"Phần 2","t":"Người hỗ trợ hậu cần chuẩn bị sản phẩm và lấy hàng mẫu. Tiếp theo đó là chúng ta trả lời câu hỏi là what cái gì? Chúng ta cần xác định xem sản phẩm của chúng ta à bao gồm những cái thông tin nào."},{"l":9,"p":"Phần 2","t":"Chúng ta có thể sử dụng một cái mô hình được gọi là mô hình thang đo lợi ích. Mô hình được rủ sử dụng rất nhiều và phổ biến trong marketing bao gồm là đầu tiên chúng ta cần phải mô tả th khách hàng và vấn đề của họ là gì. Thứ hai là cái tính năng của sản phẩm và từ tính năng này đem lại những cái lợi ích như thế nào cho khách hàng."},{"l":9,"p":"Phần 2","t":"Và khi mà chúng ta tính toán được những yếu tố này thì chúng ta sẽ phải setup các yếu tố về mặt à chiến lược cho sản phẩm. Đầu tiên là những cái sản phẩm mồi có một cái mức giá hấp dẫn để khách hàng có thể mua, để thu hút viên la, để thuật toán có thể nhận diện đây là một cái phiên la tốt, tạo ra nhiệt lượng và thường bán được những cái đơn hàng đầu tiên."},{"l":9,"p":"Phần 2","t":"Thứ hai là những cái sản phẩm chủ lực là những cái sản phẩm chính mang lại doanh thu lớn có thể mạnh về chất lượng hoặc là thương hiệu, dành nhiều thời gian để giới thiệu. Thứ ba là những cái sản phẩm bán kèm để tăng giá trị đơn bao gồm những cái sản phẩm bổ trợ, những cái sản phẩm phiên bản cao cấp hơn dành cho những cái nhu cầu tốt hơn để tăng được AOV cho mỗi một đơn hàng. Tiếp theo nữa là where ở đâu chúng ta cần live trên nền tảng nào?"},{"l":9,"p":"Phần 2","t":"Nền tảng TikTok hay là nền tảng Shopee? TikTok thì phù hợp với những nhóm đối tượng à khách hàng trẻ. À Facebook thì phù hợp với nhóm đối tượng khách hàng trung niên gắn bó."},{"l":9,"p":"Phần 2","t":"Shopee thì nhóm là những cái nhóm đã có sẵn ý định mua hàng có tỉ lệ chuyển đổi cao nhưng mà cạnh tranh lớn. Có thể chọn một nền tảng chính hoặc là live đa nền tảng nếu như mà chúng ta đủ nguồn lực nhé. Tiếp theo nữa là thời gian live khi nào? Thông thường là các viên live thì nó có cũng có những cái giờ vàng."},{"l":9,"p":"Phần 2","t":"Ví dụ là từ buổi sáng từ 9:00 đến 11:00 phù hợp với những người nội trợ bỉm sữa. Từ buổi trưa 12:00 đến 13:00 là thời điểm của nhân văn phòng nghỉ. Buổi tối là từ 20 đến 22 gi."},{"l":9,"p":"Phần 2","t":"Đây là khung giờ mà mọi người rảnh rỗi. Thường cái lượng mắt xem sẽ cao nhất. Cuối tuần là thời gian rảnh nhiều hơn nhưng cũng dễ bị cạnh tranh bởi các hoạt động giải trí khác."},{"l":9,"p":"Phần 2","t":"Và trong những cái phiên megalite thì cũng phải tránh những cái phiên megalite của những chiến thần bởi vì là trong những cái phiên la đó thì lượng traffic sẽ được hút về các chiến thần rất là nhiều cũng sẽ ảnh hưởng đến phiên laine của những cái nhà bán hàng nhỏ. Tiếp theo nữa là how như thế nào đó là chúng ta xác định cách thức và kế hoạch truyền thông. Kịch bản sơ bộ ra sao?"},{"l":9,"p":"Phần 2","t":"Dù chưa phải kịch bản chi tiết trong từng câu chữ nhưng cần có một dàn ý sơ bộ bao gồm là mở đầu như thế nào ấy. Làm sao để giữ chân được người xem."},{"l":9,"p":"Phần 2","t":"trình tự giới thiệu sản phẩm ra làm sao và sản phẩm nào trước, sản phẩm nào sau sẽ có những cái minig game tương tác gì ở giữa các phần và kết thúc ra sao để tạo ra ấn tượng và hẹn gặp lại những cái lần sau. Tiếp theo ở giai đoạn số hai chính là giai đoạn production sản xuất và dàn dựng. Tùy vào ngân sách đầu tư."},{"l":9,"p":"Phần 2","t":"Ngân sách các anh chị các bạn có thể là đầu tư vào mục tiêu xây kênh của mình có thể chọn những thiết bị phù hợp với nhu cầu nhé. Tuy nhiên với người mới thì khuyến khích sử dụng điện thoại di động smartphone nếu hiểu một chút về quay chụp cài đặt thông số sẽ chọn ra những cái chất lượng tốt nhất. Hóm lại là tùy vào cái khả năng đầu tư của mỗi người và thiết bị tốt nhất là thiết bị chúng ta đang có chứ không phải là cứ thiết bị đắt tiền sẽ là thiết bị tốt trong hoạt động livestream đâu."},{"l":9,"p":"Phần 2","t":"Một số mẹo để cải thiện chất lượng video chúng ta có thể quay ở chế độ 4K khung hình là FPS30 luôn ưu tiên quay bằng camera thường để chế độ 1X."},{"l":9,"p":"Phần 2","t":"Với những cái người mới bắt đầu thì chúng ta có thể sử dụng những cái mic à bình dân thôi. Những cái mic đâu đó của hãng Goeck thì cũng chỉ đâu đó khoảng 7 800.000 là chúng ta đã có một cái mic để chúng ta ta làm livestream cho tốt. Rồi à có hai cái nguồn sáng trong việc chúng ta làm livestream hay là quay video."},{"l":9,"p":"Phần 2","t":"Thông thường là khi mà chúng ta làm livestream sẽ là nguồn sáng trong studio. Tuy nhiên là cái nguồn sáng trong studio nên là những cái nguồn sáng nó có sự ổn định cao. Bởi vì cứ thay đổi góc nhìn một cái, thay đổi một cái thông số trong đèn một cái là cũng sẽ ảnh hưởng rất lớn đến việc là à cái âm thanh ánh sáng nó không được ổn định."},{"l":9,"p":"Phần 2","t":"Còn những cái phiên laine ngoài trời ấ thì nó cũng rất là đặc thù bởi vì là thông thường là gì ạ? Chúng ta phải có một ekip để chúng ta làm. Thế nên là trong phiên live thường là studio và thông thường là ánh sáng sẽ là ánh sáng mặt trời sẽ là ánh sáng gần như là tốt nhất trong việc chúng ta quay dựng."},{"l":9,"p":"Phần 2","t":"Thế nên là mọi cái hình ảnh, mọi cái đèn đóm để chúng ta setup trong một studio ấy thì vẫn chỉ là mô phỏng cả ánh sáng của mặt trời thôi để chúng ta làm tốt thôi. Các cái nguồn sáng hiện nay thì anh chị có thể nghĩ các bạn có thể nghĩ đến ba cái nguồn sáng. Ờ thứ nhất là nguồn sáng thuận tức là nguồn sáng hắt vào mặt cái đối tượng streamer như này."},{"l":9,"p":"Phần 2","t":"Nguồn sáng thứ hai là nguồn sáng nghịch, tức là nguồn sáng à đằng sau à của bao giờ nguồn sáng nghịch cũng phải yếu hơn nguồn sáng thuận. Và thứ ba đấy là nguồn sáng xiên, tức là các nguồn sáng để chúng ta tạo khối, tạo hình tạo nền cho cái gì ạ? Cho cho một cái phiên la tốt."},{"l":9,"p":"Phần 2","t":"À về không gian thì chúng ta có thể tham khảo không gian bên trên không gian trong slide mà thầy đã chia sẻ với các bạn. Không gian thì bối cảnh gọn gàng, sạch sẽ và chuyên nghiệp. Có thể sử dụng backdrop hoặc là kệ trưng bày sản phẩm theo phong cách thương hiệu."},{"l":9,"p":"Phần 2","t":"Bố trí bàn live thì khu vực bàn chính này, khu vực để sản phẩm demo, khu vực đèn nước uống vật dụng cá nhân và chúng ta có thể bố trí theo hình bên trên nhé. À các cái phần mềm và công cụ thì các cái nền tảng hiện nay thì họ đã hỗ trợ à tất cả những cái phần mềm để chúng ta xử lý ví dụ như TikTok Live, Facebook Live hay là Shopee Live. Công cụ để mà phát Line hiệu quả chúng ta có thể dùng OBS Studio."},{"l":9,"p":"Phần 2","t":"OBS nó cho phép chúng ta linh hoạt giữa các màn hình. Ví dụ chúng ta muốn chiếu màn hình doanh số của chúng ta lên, chúng ta cũng có thể dụng. Chúng ta muốn chiếu màn hình à các KOL, KOC đã nói gì về sản phẩm này mới minhĩ họa cho sản phẩm thì có thể sử dụng OBS, phần mềm quản lý bình luận rồi là công cụ tạo hiệu ứng âm thanh nhạc nền và bản tính theo dõi đơn hàng Real Time."},{"l":9,"p":"Phần 2","t":"Tiếp theo nữa là chúng ta nói về kịch bản và tương tác. Thông thường trong một cái phiên livestream chúng ta sẽ có các cái giai đoạn như sau."},{"l":9,"p":"Phần 2","t":"Đầu tiên đó là giai đoạn warm up sẽ kéo dài từ 0 cho đến 5 phút đầu tiên chào hỏi, giới thiệu bản thân và tạo không khí. Thường dọn dưỡ đoạn này chúng ta sẽ tạo ra nhạc sôi động, tặng quà đầu giờ, kêu gọi live share. 5 đến 10 phút sau thì chúng ta bắt đầu giới thiệu những cái chủ đề hôm nay bán gì ưu đãi ra làm sao."},{"l":9,"p":"Phần 2","t":"à câu view đếm ngược à đến những cái sản phẩm đầu tiên. Tiếp theo là những cái phần chính chúng ta sẽ dành thời gian để chúng ta giới thiệu những cái sản phẩm chủ lực, sản phẩm mồi, sản phẩm để tăng được ưu tiên a tăng được cái cái giá trị đơn hàng. Rồi là cũng có thể áp dụng công thức trong line bao gồm là những cái từ khóa ví dụ như các bạn nhìn này, demo công dụng so sánh chỉ với à tạo ra sự khan hiếm với việc là chúng ta chỉ còn bao bao nhiêu trong giỏ hàng đấy."},{"l":9,"p":"Phần 2","t":"Rồi là action khuyến khích khách hàng. kích vào dòng hàng để mua. Và giữa các phần thì chúng ta nên có các cái phần minig game tương tác, giúp thăm trúng thưởng hoặc là trả lời bình luận nhé."},{"l":9,"p":"Phần 2","t":"Và cuối cùng đó là kết thúc một cái phiên live thì chúng ta sẽ gì ạ? À tổng kết ưu đãi nhắc lại những cái sản phẩm bán chạy. Cảm ơn và hẹn gặp lại và có thể tạo ra một vài cái hiệu ứng liên quan đến Formo ở phút cuối và xây dựng lòng trung thành của khách hàng."},{"l":9,"p":"Phần 2","t":"Thứ tư đó là giai đoạn process. Process chính là những cái giai đoạn xử lý hậu cần. Cái giai đoạn này rất quan trọng bởi vì sau khi khách hàng người ta đã đặt đơn ấy thì cái hiệu suất Khi mà cái lượng đơn của chúng ta tăng lên như vậy thì cũng rất dễ rơi vào tình trạng đó là chúng ta chậm đóng gói hoặc là chúng ta chậm giao cho đơn vị vận chuyển."},{"l":9,"p":"Phần 2","t":"Thì thường là trong 2 đến 4 giờ thì các bạn phải xác định đơn hàng, xác nhận đơn hàng. Đấy, nếu mà chậm thì khách sẽ hủy đơn và cảm giác không được quan tâm. Tiếp theo là trong 12 đến 24 giờ đầu thì phải đóng gói và giao hàng cho đơn vị vận chuyển. Nếu như mà đóng gói chậm thì cái hiệu suất gian hàng của chúng ta nó sẽ bị giảm đi."},{"l":9,"p":"Phần 2","t":"Bàn giao cho đơn vị vận chuyển trong 24 đến 48 tiếng đầu và khách hàng chờ đợi nếu như mà không làm tốt. khách hàng chờ đợi dễ đánh giá xấu. Cuối cùng là cập nhật liên tục trên off, trên SMS để có thể hỗ trợ khách hàng remarketing lại tệp đối tượng đã từng mua."},{"l":9,"p":"Phần 2","t":"Quy trình hậu cần sau live thì chúng ta có các bước. Một là chúng ta xuất đơn để phân loại. Đấy, xuất danh sách nhân đơn hàng từ nền tảng này, phân loại theo khu vực sản phẩm, kiểm tra đơn trùng, đơn ảo."},{"l":9,"p":"Phần 2","t":"Bước số hai đó là chúng ta lấy hàng và chúng ta đóng gói. Lấy hàng từ kho theo đơn này. Kiểm tra chất lượng lần cuối."},{"l":9,"p":"Phần 2","t":"Đóng gói với thông điệp và thương hiệu, dán mã vận đơn. Thứ ba là chúng ta có thể bàn giao cho đơn vị vận chuyển. Và cuối cùng là các cái bước chăm sóc sau bán."},{"l":9,"p":"Phần 2","t":"À giai đoạn số năm đấy là giai đoạn postline tức là phân tích và tối ưu. Chúng ta sẽ đọc những cái chỉ số để phản ánh cái sức khỏe của một cái tên lai bao gồm các cái chỉ số tổng thể ví dụ như là lượt xem đó, lượt xem đồng thời, thời gian xem trung bình."},{"l":9,"p":"Phần 2","t":"Ý nghĩa của các chỉ số này nó liên quan đến mức độ phủ sức hút của phiên lai. Target tốt thì đâu đó khoảng 100.000 lượt view đấy. Rồi là khoảng 1000 lượt xem đồng thời."},{"l":9,"p":"Phần 2","t":"Rồi là cái thời gian trung bình khách hàng ở lại phiên là khoảng 5 phút được cho là tốt. Tương tác thì chúng ta có thể đo bằng tổng bình luận, tỉ lệ tương tác, lượt like, share để phản ánh mức độ hấp dẫn của phiên live. À bán hàng thì chúng ta có thể đo bằng tổng doanh thu, tổng số đơn, giá trị đơn hàng, tỉ lệ chuyển đổi để chúng ta có thể tính hiệu suất bán hàng."},{"l":9,"p":"Phần 2","t":"Và cuối cùng đấy là các cái chi phí bao gồm quảng cáo, khuyến mãi, Rust để chúng ta đo cái hiệu quả của sự đầu tư nhé. Như vậy để có tổ thể tổ chức một cái phiên live trên bán hàng chuyên việc chúng ta có thể nhìn toàn bộ quy trình dưới dạng mô hình 5P. Một buổi livestream thực chất là một cái dự án nhỏ và để thành công thì cần đi qua năm giai đoạn à liên tiếp. Thứ nhất là preline, giai đoạn chuẩn bị."},{"l":9,"p":"Phần 2","t":"Đây là giai đoạn nên kế hoạch trước khi mà chúng ta livestream. Tiếp theo là giai đoạn production, tức là chúng ta cùng nhau setup từ thiết bị, âm thanh, ánh sáng, performance là giai đoạn trong live. Đó, các cái kịch bản, các cái sự tương tác trong quá trình live."},{"l":9,"p":"Phần 2","t":"Rồi là giai đoạn process, tức là giai đoạn xử lý đơn, giai đoạn là à bốn là giai đoạn liên quan đến à xử lý đơn hàng và cuối cùng đấy là giai đoạn đo lường và đánh giá hiệu quả. Thông qua 5P này thì chúng ta có thể tổ chức được một cái tên laine hoàn chỉnh. Phần tiếp theo là chúng ta sẽ cùng nhau thực hành tổ chức một cái phiên livestream."},{"l":9,"p":"Phần 2","t":"Phần này rất là quan trọng. À nếu như ở phần trước chúng ta đã tìm hiểu về nội dung à hai nội dung. Thứ nhất là tiềm năng và vai trò của livestream trên thương mại điện tử."},{"l":9,"p":"Phần 2","t":"Thứ hai là quy trình để tổ chức một cái tên live chuyên nghiệp theo mô hình 5P. Tuy nhiên hiểu quy trình chưa đủ để chúng ta có thể để livestream thành công."},{"l":9,"p":"Phần 2","t":"Điều quyết định sự khác biệt giữa các streamer là nắm rõ các cái các cái lộ trình, các cái cách trình bày này, các cái tương tác thu hút người xem. Vì vậy, phần ba của bài học chúng ta sẽ chuyển sang nội dung thực hành tổ chức livestream thu hút khách hàng nhé. Đầu tiên là chúng ta có thể mở ứng dụng TikTok lên và nhấn vào biểu tượng dấu cộng ở phía dưới màn hình để chuyển sang giao diện quay video."},{"l":9,"p":"Phần 2","t":"Thứ hai là chúng ta chọn vào mục like để tiến hành livestream. Thứ ba là chúng ta có thể nhập nội dung livestream của chúng ta và Đây mô tả livestream và thứ tư chúng ta ấn vào bước go live tức là bắt đầu livestream. Đến bước này là các bạn có thể bắt đầu livestream rồi và chúng ta có thể trò chuyện giống như là chúng ta đang có hàng thật để chúng ta bán nhá."},{"l":9,"p":"Phần 2","t":"Thế thì có một vài tình huống đã sẽ xảy ra trong quá trình các bạn live. Ví dụ có người bình luận người ta chê hàng đắt chất lượng kém thì có thể trả lời lịch sự giải thích giá trị sản phẩm không tranh cãi."},{"l":9,"p":"Phần 2","t":"Mạng lag hình ảnh đứng thì bình tĩnh chúng ta thông báo và chuyển sang nói chuyện kể chuyện để chờ kết nối lại. Có người hỏi thông tin chi tiết về sản phẩm thì trả lời nhanh, chính xác và tạo ra một cái sự tôn trọng nhất định bằng việc gọi tên khách hàng. Còn những cái sản phẩm bất ngờ trái hàng thì thông báo vui mừng, giới thiệu sản phẩm thay thế tương tự và có những cái bình luận tiêu cực thì chúng ta có thể trợ dùng trợ lý để chặn ngay streamer bỏ qua và công phản ứng."},{"l":9,"p":"Phần 2","t":"Và đây là toàn bộ bài số 9 trong môn kinh doanh trên thương trên sàn thương mại điện tử. Hẹn gặp lại các bạn vào những buổi sau. Xin chào."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Xin chào các bạn. Trong video này thì chúng ta sẽ cùng nhau tìm hiểu cách để đọc và phân tích các cái chỉ số trong một shop bán hàng trên sàn thương mại điện tử. Và ở đây thì chúng ta sẽ cùng nhau tìm hiểu trên sàn thương mại điện tử Shopee."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Thế thì để vào phần xem các chỉ số của shop thì chúng ta sẽ vào phần phân tích bán hàng. Ở trong phần phân tích bán hàng này thì như trên màn hình thì các bạn đã nhìn thấy có những cái thông tin chính mà chúng ta nên nắm được. Thứ nhất đó là các cái thông tin chỉ số ở đây đã được chia theo các cái tab từ phần tổng quan cho đến chi tiết về phần hiệu quả của sản phẩm, doanh số hay là các hoạt động marketing, tức là các công cụ marketing mà Shopee đang trang bị cho nhà bán hàng."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Tiếp theo nữa chúng ta có thể chỉnh được cái khoảng thời gian mà chúng ta muốn đo lường các chỉ số theo thời gian tuy chỉnh chúng ta mong muốn. Phất loại đơn hàng đúng không ạ? Và thường chúng ta sẽ để mặc định ở cái phần đơn đã xác nhận."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Tiếp theo bên dưới này thì đó là các cái khối thông tin các blog thông tin chia ra cũng rất là trực quan rồi. Trước hết là chúng ta xem được phần tổng quan từ phần doanh số đúng không ạ? Rồi các cái khối thông tin về chỉ số theo thời gian thực, khối thông tin về nguồn lưu lượng truy cập hay các khối thông tin về hiệu quả chi tiết của các sản phẩm theo sản phẩm tốt, sản phẩm mới hay là sản phẩm đề xuất trạng quảng cáo."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Thế thì chi tiết vào đây chúng ta có thể demo một số các chỉ số chính theo từng các khối th thông tin này ờ ở trong phần tổng quan đúng không ạ? Chúng ta có thể biết được những thông tin quan trọng đó là doanh số hay là doanh số không bao gồm trợ giá bởi Shopee. Chắc chắn rồi, tất cả các nhà bán hàng ai cũng sẽ mong muốn xem được nhanh cái chỉ số tổng quan về phần doanh số này để xem là shop của mình đang bán được bao nhiêu đơn hàng, bao nhiêu tiền trong cái khoảng thời gian mà chúng ta lựa chọn đúng không ạ?"},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Cái doanh số không bao gồm cho trợ giá của Shopee nghĩa rằng là Shopee sẽ loại trừ đi những cái số tiền mà đã được trợ giá bởi sàn hoặc là bởi người bán để các nhà bán hàng biết rằng nếu không bao gồm những chương trình đó thì shop chúng ta thực tế là sẽ thu được bao nhiêu tiền và chúng ta sẽ có một cái so sánh. Rồi ngoài ra chúng ta có thể biết được số lượng đơn hàng hay tỉ lệ chuyển nối đơn hàng cũng như là doanh số trên mỗi đơn hàng đang là bao nhiêu, tức là AOV."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Rồi tiếp theo nữa nữa bên dưới này thì chúng ta có thể xem được doanh số theo từng nguồn. Đây là một trong những cải tiến rất hay của sàn Shopee giúp cho các nhà bán hàng xem một cách rất trực quan về hiệu quả doanh số theo từng nguồn. Ví dụ chúng ta có thể biết được trong tổng số những doanh số mà chúng ta thu được á thì có bao nhiêu doanh số được tạo ra bởi việc mà người dùng đặt hàng trực tiếp từ các cái Việc tìm kiếm sản phẩm trên Shopee ạ. Chính là thẻ sản phẩm."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Tiếp theo nữa chúng ta có thể biết được bao nhiêu doanh số đang được tạo ra từ phên Live, từ những Shopee video hay là từ những chương trình liên kết. Ngoài ra nữa thì cũng ch sẽ tách ra cho chúng ta biết được là có bao nhiêu doanh số được tạo ra từ quảng cáo. Hay ở đây thì gọi chính là dịch vụ thị Shopee."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Ở bên dưới này thì chúng ta cũng biết được thêm đó là có bao nhiêu kính lượt truy cập vào trang sản phẩm của chúng ta là từ kết quả tìm kiếm trên sàn, tức là kết quả tìm kiếm nội sàn ạ. Và bên tay phải này chúng ta sẽ xem được các cái chỉ số chính theo từng cái chỉ à cái nhóm chỉ số của cái nguồn tìm kiếm này ạ. Chúng ta biết được từ phần doanh số rồi cho đến phần CTR tức là tỉ lệ nhấp ạ."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Rồi cho đến tỉ lệ chuyển đổi đơn hàng hay là doanh số trên mỗi v đơn hàng thì chúng ta sẽ đánh giá được hơn hiệu quả hơn về cái việc mà shop chúng ta đã tối ưu trong việc trong kết quả tìm kiếm hay chưa."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Để xe
