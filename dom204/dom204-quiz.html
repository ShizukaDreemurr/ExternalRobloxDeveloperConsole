n lược nào tập trung vào việc xây dựng lòng tin bằng cách tạo ra các nội dung giải quyết \"nỗi đau\" hoặc vấn đề của khách hàng thông qua bài blog so sánh, hướng dẫn sử dụng hoặc video review chân thực ở giai đoạn đầu phễu?","options":[{"id":"A","text":"Chiến lược Quảng cáo có trả tiền (Paid Advertising)"},{"id":"B","text":"Chiến lược Sở hữu khách hàng (Owned Media)"},{"id":"C","text":"Chiến lược Tối ưu hóa giá trị đơn hàng (AOV Optimization)"},{"id":"D","text":"Chiến lược Content & Sáng tạo (Content & Creative)"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại ba chiến lược kéo traffic ngoại sàn.","Chiến lược đầu phễu tập trung tạo nhu cầu và lòng tin trước khi khách có ý định mua.","Loại {A}: quảng cáo trả phí là chiến lược thứ hai. Loại {B}: sở hữu kênh là chiến lược thứ ba. Loại {C}: không phải chiến lược kéo traffic."],"explanation":"Chiến lược Content và Sáng tạo xây lòng tin và nhu cầu ở đầu phễu bằng blog so sánh, hướng dẫn sử dụng và video unbox chân thực.","whyWrong":{"A":"Quảng cáo trả phí là chiến lược thứ hai.","B":"Sở hữu khách hàng là chiến lược thứ ba.","C":"AOV Optimization thuộc phần tối ưu GMV, không phải chiến lược kéo traffic."},"source":{"lesson":10,"part":"Phần 1","quote":"tạo ra những cái nội dung giải quyết vấn đề như một cái bài blog để so sánh này hay là một cái hướng dẫn sử dụng"},"keywords":["content","đầu phễu"],"note":""},{"id":"q10-2","n":2,"type":"single","prompt":"Đặc điểm nào sau đây mô tả đúng về bản chất của chỉ số GMV trong kinh doanh TMĐT?","options":[{"id":"A","text":"GMV chỉ tính những đơn hàng đã hoàn tất thủ tục đổi trả sau 30 ngày"},{"id":"B","text":"GMV là thước đo chính xác nhất về lợi nhuận cuối cùng của doanh nghiệp"},{"id":"C","text":"GMV KHÔNG PHẢI là thước đo phản ánh quy mô hay thị phần của thương hiệu"},{"id":"D","text":"GMV bao gồm cả giá trị của các đơn hàng bị hủy hoặc chưa thanh toán"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại định nghĩa và bản chất của GMV.","GMV là doanh số tổng thể, chưa trừ chi phí và chưa trừ đơn hoàn hủy.","Loại {A} và {B}: GMV không chờ đổi trả 30 ngày và không phải lợi nhuận. Loại {C}: GMV phản ánh quy mô."],"explanation":"GMV tính cả đơn hủy, chưa thanh toán và hoàn tiền. Nó là thước đo quy mô, không phải lợi nhuận hay doanh thu thuần.","whyWrong":{"A":"GMV không chờ thủ tục đổi trả.","B":"GMV là quy mô, không phải lợi nhuận.","C":"GMV phản ánh quy mô và thị phần, nên câu này sai."},"source":{"lesson":10,"part":"Phần 2","quote":"bao gồm gồm tổng tất cả những cái đơn hàng kể cả đơn vàng hủy, đơn hàng chưa thanh toán"},"keywords":["GMV","doanh thu thuần"],"note":"Phương án C chứa cụm 'KHÔNG PHẢI' có thể do lỗi soạn đề, giữ nguyên chữ của đề. Đáp án D đúng theo transcript, C sai vì transcript nói GMV là thước đo quy mô."},{"id":"q10-3","n":3,"type":"single","prompt":"Chính sách Brand Referral Bonus của các sàn TMĐT (như Amazon) mang lại lợi ích tài chính nào cho người bán?","options":[{"id":"A","text":"Tặng thêm tiền mặt vào tài khoản cá nhân của chủ gian hàng"},{"id":"B","text":"Trả lại một phần hoa hồng khi người bán tự mang traffic từ ngoài sàn vào"},{"id":"C","text":"Miễn phí hoàn toàn các loại thuế kinh doanh cho doanh nghiệp"},{"id":"D","text":"Giảm giá nhập hàng hóa từ các nhà cung cấp nước ngoài"}],"answer":["B"],"confidence":"low","hints":["Nghĩ về mục đích của sàn khi khuyến khích người bán đưa khách từ bên ngoài vào.","Sàn có thể thưởng cho người bán mang traffic ngoại sàn về, dưới dạng ưu đãi về phí.","Loại {A}, {C}, {D}: tiền mặt vào tài khoản cá nhân, miễn thuế và giảm giá nhập hàng không liên quan đến chính sách phí của sàn."],"explanation":"Ngoài bài giảng: Brand Referral Bonus của Amazon hoàn lại một phần phí giới thiệu cho người bán khi họ tự đưa traffic từ ngoài sàn vào. Bài giảng chỉ nói quảng cáo ngoại sàn giúp bán hàng mà không phải chịu phí sàn.","whyWrong":{"A":"Không phải khoản tiền mặt trả vào tài khoản cá nhân.","C":"Chính sách không miễn thuế kinh doanh.","D":"Chính sách không liên quan đến giá nhập hàng."},"source":{"lesson":10,"part":"Phần 1","quote":"Và quảng cáo ngoại sàn là một cách để chúng ta ra tiền ngay mà không phải chịu phí sàn","nearest":true},"keywords":["traffic ngoại sàn","phí sàn"],"note":"Không có trong bài giảng. Transcript không đề cập Brand Referral Bonus, đoạn trích chỉ là đoạn gần nhất về ngoại sàn và phí sàn. Đáp án B dựa trên kiến thức ngoài bài giảng, cần đối chiếu đáp án chính thức."},{"id":"q10-4","n":4,"type":"single","prompt":"TikTok Shop Affiliate tận dụng thế mạnh nào để tạo ra tỷ lệ chuyển đổi lớn (20-30%)?","options":[{"id":"A","text":"Việc cung cấp hàng hóa miễn phí hoàn toàn cho người mua"},{"id":"B","text":"Khả năng tự động thanh toán đơn hàng thay cho người tiêu dùng"},{"id":"C","text":"Khả năng lan tỏa viral cao, tận dụng thuật toán đề xuất nội dung"},{"id":"D","text":"Việc thay thế hoàn toàn các đơn vị vận chuyển truyền thống"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại phần giải pháp Affiliate trên TikTok Shop.","Thế mạnh nằm ở cách nội dung được phân phối trên nền tảng.","Loại {A}, {B}, {D}: miễn phí hàng hóa, tự thanh toán và thay vận chuyển không phải thế mạnh được nêu."],"explanation":"TikTok Shop Affiliate tận dụng khả năng lan tỏa cao và thuật toán đề xuất nội dung để tăng chuyển đổi.","whyWrong":{"A":"Bài giảng không nêu việc cung cấp hàng miễn phí.","B":"Bài giảng không nêu việc tự động thanh toán thay người mua.","D":"Bài giảng không nêu việc thay thế đơn vị vận chuyển."},"source":{"lesson":10,"part":"Phần 2","quote":"khả năng lan tỏa của TikTok thì rất là cao. Tận dụng thuật toán đề xuất từ nội dung"},"keywords":["affiliate","lan tỏa"],"note":"Con số 20 đến 30% trong transcript gắn với livestream, còn đề gắn với TikTok Shop Affiliate. Đáp án C vẫn là phương án duy nhất khớp với thế mạnh được nêu."},{"id":"q10-5","n":5,"type":"single","prompt":"Theo bài học, tệp khách hàng nào có dung lượng cực kỳ lớn và cần nhà bán hàng chủ động thuyết phục?","options":[{"id":"A","text":"Tệp khách hàng cũ đã từng mua hàng nhiều lần tại gian hàng"},{"id":"B","text":"Tệp khách hàng \"Lạnh\" chưa có nhu cầu nhưng có thể cân nhắc nếu được thuyết phục"},{"id":"C","text":"Tệp khách hàng \"Sốt\" đang đi tìm mua ngay"},{"id":"D","text":"Tệp khách hàng \"Nóng\" đã biết sản phẩm nhưng chưa mua"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại cách bài giảng phân loại khách hàng theo mức độ nhu cầu.","Nhóm này chưa có nhu cầu rõ nhưng dung lượng rất lớn.","Loại {A}, {C}, {D}: khách cũ, khách đang tìm mua ngay và khách đã biết sản phẩm là các nhóm đã có nhu cầu rõ."],"explanation":"Tệp khách hàng lạnh chưa có nhu cầu nhưng có thể cân nhắc nếu được thuyết phục, dung lượng rất lớn.","whyWrong":{"A":"Bài giảng không mô tả khách cũ là nhóm cần thuyết phục.","C":"Nhu cầu nóng sốt, cấp thiết là nhóm đang tìm mua ngay.","D":"Nhóm đã biết sản phẩm không được mô tả là nhóm cần chủ động thuyết phục."},"source":{"lesson":10,"part":"Phần 1","quote":"tệp khách hàng lạnh tuy nhu cầu của họ chưa quá nét nhưng chúng ta cần chủ động giới thiệu, thuyết phục"},"keywords":["khách hàng lạnh","ngoại sàn"],"note":""},{"id":"q10-6","n":6,"type":"single","prompt":"Tại sao quảng cáo ngoại sàn được coi là cách làm thương hiệu tốt hơn so với chỉ quảng cáo trên sàn?","options":[{"id":"A","text":"Vì nội sàn KHÔNG PHẢI là nơi khách hàng có thể nhìn thấy hình ảnh sản phẩm"},{"id":"B","text":"Vì nó cho phép chủ động tiếp cận, nuôi dưỡng kết nối và tạo ra nhiều lần mua tiếp theo"},{"id":"C","text":"Vì các mạng xã hội cam kết doanh số cho người bán cao hơn các sàn TMĐT"},{"id":"D","text":"Vì chi phí quảng cáo ngoại sàn luôn luôn rẻ hơn nội sàn trong mọi trường hợp"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại lý do làm thương hiệu cần chủ động tiếp cận khách.","Thương hiệu là một quá trình, không phải chờ khách tìm đến.","Loại {C} và {D}: bài giảng không nói mạng xã hội cam kết doanh số hay chi phí ngoại sàn rẻ hơn."],"explanation":"Quảng cáo ngoại sàn cho phép chủ động tiếp cận, nuôi dưỡng kết nối và tăng khả năng khách quay lại mua.","whyWrong":{"A":"Nội sàn vẫn hiển thị ảnh sản phẩm, phương án này sai về nội dung.","C":"Bài giảng không nói mạng xã hội cam kết doanh số.","D":"Bài giảng không nói chi phí ngoại sàn rẻ hơn mọi trường hợp."},"source":{"lesson":10,"part":"Phần 1","quote":"một quá trình nuôi dưỡng nhắc nhở và tạo ra sự kết nối giữa thương hiệu và khách hàng"},"keywords":["quảng cáo ngoại sàn","thương hiệu"],"note":"Phương án A chứa cụm 'KHÔNG PHẢI' có thể do lỗi soạn đề, giữ nguyên chữ của đề. Đáp án B khớp transcript. Phương án D nói chi phí ngoại sàn rẻ hơn trong mọi trường hợp, transcript không nói vậy."},{"id":"q10-7","n":7,"type":"single","prompt":"Vai trò chủ chốt của các Mạng lưới Affiliate (Affiliate Network) là gì?","options":[{"id":"A","text":"Là trung gian kết nối nhà cung cấp và người tiếp thị, cung cấp công cụ theo dõi"},{"id":"B","text":"Thay mặt người mua để thực hiện các giao dịch thanh toán trực tuyến"},{"id":"C","text":"Chịu trách nhiệm pháp lý hoàn toàn về chất lượng sản phẩm của người bán"},{"id":"D","text":"Trực tiếp sản xuất hàng hóa thay cho các gian hàng trên sàn"}],"answer":["A"],"confidence":"high","hints":["Nhớ lại bốn bên trong mô hình Affiliate và vai trò của nền tảng.","Nền tảng đứng giữa các bên và hỗ trợ theo dõi, báo cáo.","Loại {B}, {C}, {D}: không thay mặt thanh toán, không chịu trách nhiệm pháp lý hoàn toàn và không sản xuất hàng."],"explanation":"Affiliate Network là trung gian kết nối nhà cung cấp với người tiếp thị, cung cấp công cụ theo dõi, báo cáo và bảo vệ quyền lợi các bên.","whyWrong":{"B":"Không thay mặt người mua thanh toán.","C":"Bài giảng không nói chịu trách nhiệm pháp lý về chất lượng sản phẩm.","D":"Không sản xuất hàng hóa."},"source":{"lesson":10,"part":"Phần 2","quote":"đơn vị trung gian kết nối cung cấp à kết nối nhà cung cấp và người tiếp thị, cung cấp các công cụ theo dõi"},"keywords":["affiliate network","trung gian"],"note":""},{"id":"q10-8","n":8,"type":"single","prompt":"Hình thức hoa hồng nào phổ biến nhất trong TMĐT, dựa trên giá trị đơn hàng thành công?","options":[{"id":"A","text":"CPM (Cost Per Mille)"},{"id":"B","text":"CPL (Cost Per Lead)"},{"id":"C","text":"CPC (Cost Per Click)"},{"id":"D","text":"CPS (Cost Per Sale)"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại các cách nhận hoa hồng phổ biến trong Affiliate.","Hình thức phổ biến nhất gắn với đơn hàng thành công.","Loại {A}, {B}, {C}: CPM, CPL và CPC không dựa trên giá trị đơn hàng thành công."],"explanation":"CPS là hoa hồng dựa trên giá trị đơn hàng thành công và là hình thức phổ biến nhất.","whyWrong":{"A":"CPM không được nêu trong nhóm hoa hồng Affiliate.","B":"CPL tính theo số khách hàng tiềm năng.","C":"CPC tính theo lượt click, kể cả khi không phát sinh mua hàng."},"source":{"lesson":10,"part":"Phần 2","quote":"CPS, C per sale, tức là hoa hồng dựa trên giá trị đơn hàng thành công"},"keywords":["CPS","hoa hồng"],"note":""},{"id":"q10-9","n":9,"type":"multi","prompt":"Những thành phần nào tham gia trực tiếp vào mô hình Affiliate Marketing? Lựa chọn TẤT CẢ các phương án đúng.","options":[{"id":"A","text":"Khách hàng cuối (End User)"},{"id":"B","text":"Mạng lưới/Nền tảng Affiliate (Affiliate Network)"},{"id":"C","text":"Nhà cung cấp (Merchant/Advertiser)"},{"id":"D","text":"Người tiếp thị (Affiliate/Publisher)"}],"answer":["A","B","C","D"],"confidence":"high","hints":["Nhớ lại bốn bên được nêu khi giới thiệu mô hình Affiliate.","Mỗi bên có một vai trò riêng từ cung cấp, quảng bá, mua hàng đến kết nối.","Hãy đối chiếu từng phương án với bốn vai trò đã nêu. Câu này không có phương án nhiễu."],"explanation":"Bài giảng nêu bốn bên: nhà cung cấp, người tiếp thị, khách hàng mua qua link và nền tảng trung gian. Cả bốn phương án đều đúng.","whyWrong":{},"source":{"lesson":10,"part":"Phần 2","quote":"Thứ hai là người tiếp thị là người quảng bá sản phẩm thông qua các kênh nhận hoa hồng"},"keywords":["affiliate","nhà cung cấp","người tiếp thị"],"note":"Câu nhiều đáp án, cả bốn lựa chọn đều đúng: khách hàng cuối, mạng lưới Affiliate, nhà cung cấp, người tiếp thị."},{"id":"q10-10","n":10,"type":"single","prompt":"Trong vòng lặp vô tận của AISAS, hành động \"Chia sẻ\" (Share) của khách hàng cũ có tác động như thế nào đến hệ thống?","options":[{"id":"A","text":"Làm gián đoạn quá trình tìm kiếm thông tin của các khách hàng mới"},{"id":"B","text":"Tạo ra giai đoạn \"Chú ý\" (Attention) mới cho các tập khách hàng tiềm năng khác"},{"id":"C","text":"Khiến người bán KHÔNG PHẢI thực hiện các chương trình hậu mãi"},{"id":"D","text":"Làm giảm tỷ lệ chuyển đổi (CVR) của các chiến dịch quảng cáo trả phí"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại pha cuối của AISAS và vòng lặp.","Khách hài lòng chia sẻ thông tin cho người thân, bạn bè.","Loại {A}, {C}, {D}: chia sẻ không làm gián đoạn tìm kiếm, không bỏ hậu mãi và không làm giảm CVR theo bài."],"explanation":"Khi khách chia sẻ, thông tin lan đến người khác và tạo ra giai đoạn Chú ý mới, hình thành vòng lặp.","whyWrong":{"A":"Chia sẻ không làm gián đoạn việc tìm kiếm của khách mới.","C":"Bài giảng không nói bỏ chương trình hậu mãi.","D":"Bài giảng không nói chia sẻ làm giảm CVR."},"source":{"lesson":10,"part":"Phần 1","quote":"một cái vòng lập vô tận share tạo ra attention mới"},"keywords":["AISAS","share"],"note":"Phương án C chứa cụm 'KHÔNG PHẢI' có thể do lỗi soạn đề, giữ nguyên chữ của đề."},{"id":"q10-11","n":11,"type":"single","prompt":"Tình huống: Gian hàng của bạn đang bị cạnh tranh gay gắt về giá tại nội sàn, dẫn đến biên lợi nhuận cực thấp. Dựa trên tư duy hệ sinh thái ngoại sàn, hành động bền vững nhất là gì?","options":[{"id":"A","text":"Đóng gian hàng ngay lập tức để chuyển sang bán hàng offline truyền thống"},{"id":"B","text":"Tiếp tục hạ giá sâu hơn nữa để tiêu diệt các đối thủ cạnh tranh nội sàn"},{"id":"C","text":"Chủ động kéo traffic ngoại sàn từ tệp khách hàng \"lạnh\" và nuôi dưỡng thương hiệu đa kênh"},{"id":"D","text":"Ngừng toàn bộ các hoạt động nội dung và chỉ tập trung vào đấu thầu từ khóa giá cao"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại vì sao ngoại sàn giúp giảm sự cạnh tranh của nội sàn.","Khi nội sàn khó khăn, người bán mở rộng ra nhóm khách chưa có nhu cầu.","Loại {A}, {B}, {D}: đóng shop, hạ giá nữa hay chỉ đấu thầu từ khóa giá cao đều không mở rộng tệp khách."],"explanation":"Hướng bền vững là chủ động kéo traffic ngoại sàn từ tệp khách hàng lạnh và nuôi dưỡng thương hiệu đa kênh, giảm cạnh tranh giá nội sàn.","whyWrong":{"A":"Bài giảng không khuyên đóng gian hàng.","B":"Hạ giá sâu hơn làm biên lợi nhuận thấp hơn nữa.","D":"Bài giảng khuyến khích làm nội dung, không bỏ nội dung."},"source":{"lesson":10,"part":"Phần 1","quote":"Việc mở rộng tệp và chủ động tiếp cận, chủ động giới thiệu trên đến khách hàng thông qua hình thức ngoại sàn là một chiến lược tất yếu"},"keywords":["traffic ngoại sàn","cạnh tranh","đa kênh"],"note":""},{"id":"q10-12","n":12,"type":"single","prompt":"Giai đoạn Tìm kiếm (Search) trong mô hình AISAS đóng vai trò quan trọng như thế nào?","options":[{"id":"A","text":"Là bước kết thúc hoàn toàn hành trình của khách hàng"},{"id":"B","text":"Là giai đoạn mà người bán KHÔNG PHẢI can thiệp bằng quảng cáo"},{"id":"C","text":"Là cầu nối chìa khóa giữa sự quan tâm (Interest) và hành động mua (Action)"},{"id":"D","text":"Là bước giúp khách hàng chia sẻ sản phẩm đến bạn bè và người thân"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại năm pha của AISAS.","Pha tìm kiếm nằm giữa hai pha đầu và hai pha sau.","Loại {A} và {D}: hành trình còn tiếp tục sau tìm kiếm và chia sẻ thuộc pha cuối. Loại {B}: bài giảng khuyên can thiệp ở bước này."],"explanation":"Search là cầu nối giữa Interest và Action, nên nội dung blog, video review và từ khóa cần được đầu tư.","whyWrong":{"A":"Tìm kiếm không phải bước kết thúc hành trình.","B":"Bài giảng khuyên tối ưu nội dung và từ khóa ở bước này.","D":"Chia sẻ là pha cuối Share."},"source":{"lesson":10,"part":"Phần 1","quote":"Trong mô hình ISAS này thì giai đoạn tìm kiếm là cầu nối quan trọng nhất giữa quan tâm và mua hàng"},"keywords":["AISAS","tìm kiếm"],"note":"Phương án B chứa cụm 'KHÔNG PHẢI' có thể do lỗi soạn đề, giữ nguyên chữ của đề. Transcript viết 'cầu nối quan trọng nhất', đề viết 'cầu nối chìa khóa'."},{"id":"q10-13","n":13,"type":"single","prompt":"Khi người bán gợi ý khách mua thêm \"bộ lọc thay thế\" khi họ đang chọn \"máy lọc không khí\", đây là chiến lược gì?","options":[{"id":"A","text":"Bundle (Bán theo bộ)"},{"id":"B","text":"Up-selling (Nâng cấp sản phẩm)"},{"id":"C","text":"Seeding (Tạo bằng chứng xã hội)"},{"id":"D","text":"Cross-selling (Bán chéo)"}],"answer":["D"],"confidence":"high","hints":["Phân biệt gợi ý sản phẩm bổ trợ với gợi ý phiên bản cao cấp hơn.","Chiến lược này gợi ý sản phẩm liên quan, bổ trợ cho sản phẩm chính.","Loại {B}: nâng cấp lên phiên bản cao hơn. Loại {A}: gộp thành bộ. Loại {C}: tạo bằng chứng xã hội."],"explanation":"Gợi ý bộ lọc thay thế khi khách mua máy lọc không khí là bán chéo (cross-selling).","whyWrong":{"A":"Bundle là bán theo bộ, khác bán chéo.","B":"Up-selling là gợi ý phiên bản cao cấp hơn.","C":"Seeding là tạo đánh giá và đơn hàng ban đầu."},"source":{"lesson":10,"part":"Phần 2","quote":"mua máy lọc không khí gợi ý thêm là mua bộ lọc thay thế hoặc là máy đo độ ẩm"},"keywords":["cross-sell","up-sell","bundle"],"note":""},{"id":"q10-14","n":14,"type":"single","prompt":"Ưu điểm lớn nhất của việc doanh nghiệp tự xây dựng Website bán hàng độc lập (DTC) là gì?","options":[{"id":"A","text":"Giúp tiết kiệm 100% chi phí vận chuyển cho mọi đơn hàng"},{"id":"B","text":"Xây dựng thương hiệu độc lập và làm chủ dữ liệu khách hàng"},{"id":"C","text":"Không cần thực hiện bất kỳ hoạt động quảng cáo nào vẫn có khách"},{"id":"D","text":"Loại bỏ hoàn toàn sự cạnh tranh từ các đối thủ cùng ngành"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại ưu điểm của website độc lập do doanh nghiệp tự xây.","Kênh do chính doanh nghiệp quản lý mang lại sự chủ động.","Loại {A}, {C}, {D}: bài giảng không nói miễn chi phí vận chuyển, không cần quảng cáo hay hết cạnh tranh."],"explanation":"Website độc lập giúp xây thương hiệu riêng và làm chủ dữ liệu khách hàng.","whyWrong":{"A":"Bài giảng không nêu tiết kiệm 100% chi phí vận chuyển.","C":"Vẫn cần hoạt động để khách biết đến website.","D":"Bài giảng không nói loại bỏ cạnh tranh."},"source":{"lesson":10,"part":"Phần 1","quote":"xây dựng thương hiệu độc lập và làm chủ về mặt dữ liệu khách hàng"},"keywords":["website","dữ liệu khách hàng"],"note":""},{"id":"q10-15","n":15,"type":"single","prompt":"Tại sao các nhà bán hàng nhỏ thường đối mặt với tình trạng bị đẩy lên các vị trí ít người qua lại trên sàn?","options":[{"id":"A","text":"Do hệ thống thuật toán của sàn chỉ nhận diện được các thương hiệu toàn cầu"},{"id":"B","text":"Vì người mua chỉ muốn tìm kiếm các sản phẩm có giá thành cao nhất"},{"id":"C","text":"Vì nhà bán hàng nhỏ KHÔNG PHẢI đóng thuế cho nhà nước"},{"id":"D","text":"Do sàn ưu tiên những gian hàng trả nhiều tiền thuê hoặc có sức bán tốt"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại ví dụ siêu thị giai đoạn đầu và giai đoạn sau.","Sau khi đông khách, sàn ưu tiên vị trí đẹp cho một nhóm gian hàng.","Loại {A}, {B}, {C}: không phải lý do nêu trong bài."],"explanation":"Sàn đưa vị trí đẹp cho gian hàng trả nhiều tiền hoặc bán tốt, nên gian hàng nhỏ bị đẩy ra vùng rìa.","whyWrong":{"A":"Bài giảng không nói thuật toán chỉ nhận diện thương hiệu toàn cầu.","B":"Bài giảng không nói người mua chỉ tìm hàng giá cao.","C":"Thuế không phải lý do bị đẩy ra vùng rìa."},"source":{"lesson":10,"part":"Phần 1","quote":"họ sẽ ưu tiên những cái gian hàng nào trả nhiều tiền để thuê hoặc là bán tốt"},"keywords":["nội sàn","vị trí đẹp","nhà bán nhỏ"],"note":"Phương án C chứa cụm 'KHÔNG PHẢI' có thể do lỗi soạn đề, giữ nguyên chữ của đề."}]},{"id":11,"title":"Bài 11: Vận hành, đo lường và phân tích hiệu quả","summary":["Quy trình xử lý đơn gồm 5 bước từ tiếp nhận, đóng gói, in và dán vận đơn, bàn giao đến theo dõi và hoàn tất.","Đóng gói chịu được lực rơi từ 1 m, không dán băng keo đè lên mã vận đơn, nên quay video đóng gói.","Sàn phạt khi chỉ số vận hành kém bằng cắt trợ giá, giảm hiển thị hoặc khóa shop. Có sao quả tạ trên Shopee và điểm vi phạm trên TikTok Shop.","Dữ liệu khách hàng gồm định danh, hành vi, giao dịch. Sàn che thông tin định danh để bảo vệ quyền riêng tư.","RFM phân loại khách hàng để có cách ứng xử phù hợp, ví dụ nhóm VIP, nguy cơ, tiềm năng.","CSKH có ba giai đoạn trước, trong và sau khi mua. Với đánh giá xấu, bước đầu là liên hệ trực tiếp qua chat hoặc hotline.","Xây dashboard theo hành trình khách hàng, phân biệt tỉ lệ chuyển đổi và tỉ lệ chuyển đổi đơn hàng, theo dõi CTR, AOV, tỉ lệ thoát trang.","Dùng 5 Whys, biểu đồ xương cá để tìm điểm gãy phễu và nguyên nhân gốc rễ, rồi cải tiến liên tục bằng PDCA."],"questions":[{"id":"q11-1","n":1,"type":"single","prompt":"Mục tiêu của giai đoạn CSKH \"Trong khi mua\" (Theo dõi đơn hàng) là gì?","options":[{"id":"A","text":"Xử lý triệt để các khiếu nại đổi trả để khách hàng cảm thấy hài lòng nhất"},{"id":"B","text":"Tư vấn nhiệt tình để chuyển đổi khách từ tò mò sang quyết định đặt đơn"},{"id":"C","text":"Xin khách hàng đánh giá 5 sao kèm theo hình ảnh và video thực tế sản phẩm"},{"id":"D","text":"Gửi tin nhắn tự động xác nhận và thông báo khi hàng bắt đầu được giao"}],"answer":["D"],"confidence":"medium","hints":["Nhớ lại ba giai đoạn CSKH: trước, trong và sau khi mua.","Giai đoạn giữa gắn với việc theo dõi tình trạng đơn hàng.","Loại {B}: tư vấn thuộc giai đoạn trước khi mua. Loại {A} và {C}: đổi trả và đánh giá thuộc giai đoạn sau khi mua."],"explanation":"Trong khi mua, shop theo dõi sát trạng thái đơn hàng, ví dụ gửi tin nhắn xác nhận và thông báo khi hàng bắt đầu giao.","whyWrong":{"A":"Xử lý khiếu nại đổi trả thuộc giai đoạn sau khi mua.","B":"Tư vấn để chốt đơn thuộc giai đoạn trước khi mua.","C":"Xin đánh giá diễn ra sau khi khách nhận hàng."},"source":{"lesson":11,"part":"Toàn bài","quote":"Giai đoạn thứ hai là giai đoạn trong khi mua. Ở giai đoạn này, chúng ta sẽ cần theo dõi sát sao trạng thái của đơn hàng"},"keywords":["chăm sóc khách hàng","trong khi mua","trạng thái của đơn hàng"],"note":"Transcript nêu giai đoạn trong khi mua là theo dõi sát sao trạng thái đơn hàng. Việc gửi tin nhắn tự động xác nhận và thông báo giao hàng là cách cụ thể hóa, không nêu nguyên văn. Các phương án khác thuộc trước hoặc sau khi mua."},{"id":"q11-2","n":2,"type":"single","prompt":"Trong mô hình RFM dùng để phân loại khách hàng, yếu tố \"Frequency\" (F) có nghĩa là:","options":[{"id":"A","text":"Tốc độ phản hồi các chương trình khuyến mãi được shop gửi qua tin nhắn"},{"id":"B","text":"Khoảng thời gian tính từ lần mua hàng gần nhất của khách đến hiện tại"},{"id":"C","text":"Tần suất mua hàng của khách hàng trong một khoảng thời gian nhất định"},{"id":"D","text":"Tổng số tiền mà khách hàng đã chi trả cho các đơn hàng tại gian hàng"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại ba chữ cái của mô hình RFM.","Chữ F đo mức độ trung thành của khách.","Loại {B} là chữ R, loại {D} là chữ M. Loại {A}: không phải thành phần của RFM."],"explanation":"F là Frequency, tần suất mua hàng, cho biết khách mua thường xuyên hay chỉ chờ giảm giá sâu mới mua.","whyWrong":{"A":"Tốc độ phản hồi khuyến mãi không phải thành phần của RFM.","B":"Khoảng thời gian từ lần mua gần nhất là chữ R.","D":"Tổng số tiền chi trả là chữ M."},"source":{"lesson":11,"part":"Toàn bài","quote":"chữ F cho biết mức độ trung thành khách hàng mua thường xuyên hay chỉ chờ có giả giá cực sâu mới mua"},"keywords":["RFM","mức độ trung thành"],"note":""},{"id":"q11-3","n":3,"type":"single","prompt":"Chính sách \"Masking\" trên các sàn TMĐT gây ra khó khăn gì cho nhà bán hàng?","options":[{"id":"A","text":"Che thông tin định danh của khách hàng nhằm bảo vệ quyền riêng tư cá nhân"},{"id":"B","text":"Giới hạn số lượng tin nhắn mà shop có thể gửi cho khách hàng mỗi ngày"},{"id":"C","text":"Làm tăng chi phí quảng cáo từ khóa do cạnh tranh với nhiều đối thủ lớn"},{"id":"D","text":"Tự động ẩn các sản phẩm có lượt bán thấp ra khỏi kết quả tìm kiếm sàn"}],"answer":["A"],"confidence":"medium","hints":["Nhớ lại chính sách về thông tin khách hàng của Shopee và TikTok Shop.","Sàn giữ thông tin khách hàng cho riêng họ vì quyền riêng tư.","Loại {B}, {C}, {D}: giới hạn tin nhắn, chi phí quảng cáo và ẩn sản phẩm không được nói trong bài."],"explanation":"Masking che thông tin định danh của khách trên vận đơn và hệ thống quản lý đơn hàng, khiến nhà bán khó thu thập dữ liệu khách hàng.","whyWrong":{"B":"Bài giảng không nêu giới hạn số tin nhắn mỗi ngày.","C":"Chính sách này không liên quan đến chi phí quảng cáo từ khóa.","D":"Chính sách này không liên quan đến việc ẩn sản phẩm bán thấp."},"source":{"lesson":11,"part":"Toàn bài","quote":"áp dụng chính sách share thông tin khách hàng trên vận đơn và trong hệ thống quản lý đơn hàng để bảo vệ quyền riêng tư"},"keywords":["thông tin khách hàng","dữ liệu định danh","quyền riêng tư"],"note":"Transcript nói sàn che thông tin khách hàng trên vận đơn và hệ thống đơn hàng nhằm bảo vệ quyền riêng tư (bản ghi viết chữ 'share', có thể là 'mask'), và gọi thông tin khách hàng là 'vàng đen' sàn giữ riêng. Bài không nêu rõ khó khăn cụ thể cho nhà bán."},{"id":"q11-4","n":4,"type":"single","prompt":"Tầng \"Quan tâm\" trong Dashboard đo lường theo hành trình khách hàng bao gồm:","options":[{"id":"A","text":"Số lượng khách hàng duy nhất đã truy cập vào gian hàng (Lượt Visitors)"},{"id":"B","text":"Lượt nhấp chuột và lượt xem trang chi tiết thông tin của sản phẩm"},{"id":"C","text":"Lượt khách hàng thực hiện thao tác thêm sản phẩm vào giỏ hàng của họ"},{"id":"D","text":"Lượt khách hàng đã thực hiện đặt hàng và thanh toán thành công đơn hàng"}],"answer":["B"],"confidence":"low","hints":["Sắp xếp các hành động của khách theo phễu từ nhận biết đến mua.","Tầng quan tâm nằm sau khi khách đã vào shop và trước khi họ cân nhắc mua.","Loại {A}: truy cập thuộc tầng nhận biết. Loại {C}: thêm giỏ hàng gần quyết định mua. Loại {D}: đặt hàng là hành động."],"explanation":"Suy ra theo thứ tự phễu AIDA, tầng Quan tâm gồm lượt nhấp chuột và lượt xem trang chi tiết sản phẩm.","whyWrong":{"A":"Lượt Visitors thuộc tầng nhận biết.","C":"Thêm vào giỏ hàng gần tầng mong muốn.","D":"Đặt hàng và thanh toán thuộc tầng hành động."},"source":{"lesson":11,"part":"Demo Phân tích chỉ số sàn Shopee","quote":"Thì chúng ta sẽ có quan tâm những chỉ số nào theo từng giai đoạn này đó từng chỉ số đo lường","nearest":true},"keywords":["dashboard","hành trình khách hàng","AIDA"],"note":"Transcript chỉ nói Dashboard nên xây dựng theo hành trình khách hàng, không liệt kê chỉ số của tầng 'Quan tâm'. Đáp án B suy ra theo thứ tự phễu AIDA (nhận biết, quan tâm, mong muốn, hành động) trong Bài 9. Cần đối chiếu đáp án chính thức."},{"id":"q11-5","n":5,"type":"single","prompt":"Trong chu trình PDCA trong cải thiện hiệu quả kinh doanh sàn, bước \"Check\" (C) yêu cầu nhà bán hàng thực hiện điều gì?","options":[{"id":"A","text":"Đo lường lại các chỉ số sau 7-14 ngày để xem số liệu có tốt lên không"},{"id":"B","text":"Chuẩn hóa các quy trình thành công để áp dụng cho toàn bộ sản phẩm khác"},{"id":"C","text":"Lập kế hoạch cải thiện dựa trên các Insight thu thập được từ dữ liệu"},{"id":"D","text":"Thực hiện các thay đổi về ảnh sản phẩm, chạy Ads hoặc tung ra Voucher"}],"answer":["A"],"confidence":"medium","hints":["Nhớ lại bốn chữ P, D, C, A của chu trình PDCA.","Chữ C là bước kiểm tra kết quả bằng số liệu.","Loại {B} là chuẩn hóa (Act). Loại {C} là lập kế hoạch (Plan). Loại {D} là thực hiện thay đổi (Do)."],"explanation":"Check là bước đo lường lại chỉ số sau khi thay đổi. Chuẩn hóa là Act, lập kế hoạch là Plan, thực hiện là Do.","whyWrong":{"B":"Chuẩn hóa quy trình thành công thuộc bước Act.","C":"Lập kế hoạch thuộc bước Plan.","D":"Thực hiện thay đổi thuộc bước Do."},"source":{"lesson":11,"part":"Toàn bài","quote":"Chúng ta bắt đầu từ việc lập kế hoạch đến thực hiện các hoạt động thường xuyên đo lường và tiếp tục tối ưu"},"keywords":["PDCA","đo lường"],"note":"Transcript chỉ mô tả PDCA khái quát: lập kế hoạch, thực hiện, đo lường, tối ưu. Mốc 7 đến 14 ngày không có trong bài giảng. Đáp án A chọn vì Check là bước đo lường, các phương án B, C, D ứng với Act, Plan, Do."},{"id":"q11-6","n":6,"type":"single","prompt":"Việc cá nhân hóa trải nghiệm chăm sóc khách hàng (CSKH) giúp doanh nghiệp đạt được:","options":[{"id":"A","text":"Tăng mức giá bán lẻ của sản phẩm lên cao hơn so với các đối thủ khác"},{"id":"B","text":"Gia tăng giá trị vòng đời khách hàng (LTV) và giảm chi phí Marketing"},{"id":"C","text":"Loại bỏ hoàn toàn các án phạt về tỷ lệ giao hàng muộn trên các sàn TMĐT"},{"id":"D","text":"Giảm bớt số lượng nhân sự cần thiết cho khâu đóng gói và xử lý đơn hàng"}],"answer":["B"],"confidence":"low","hints":["Nghĩ về lợi ích dài hạn của việc chăm sóc từng khách hàng một cách riêng biệt.","Khách hài lòng quay lại và giới thiệu thêm, giúp giảm chi phí thu hút khách mới.","Loại {A}, {C}, {D}: tăng giá, bỏ án phạt và giảm nhân sự đóng gói không phải kết quả của cá nhân hóa CSKH."],"explanation":"Ngoài bài giảng: cá nhân hóa CSKH giúp khách hài lòng và quay lại, tăng giá trị vòng đời khách hàng (LTV) và giảm chi phí Marketing. Bài giảng chỉ nói khách hài lòng thành quảng cáo tự nhiên.","whyWrong":{"A":"Bài giảng không nói CSKH để tăng giá bán.","C":"Án phạt giao muộn vẫn áp dụng, CSKH không loại bỏ.","D":"CSKH không liên quan đến nhân sự đóng gói."},"source":{"lesson":11,"part":"Toàn bài","quote":"Một khách hàng hài lòng sẽ để lại đánh giá cái hình ảnh cái video thì đây là một loại quảng cáo có giá trị cao nhất","nearest":true},"keywords":["chăm sóc khách hàng","niềm tin","khách hàng quay lại"],"note":"Transcript nói CSKH xây niềm tin và khách hài lòng thành quảng cáo tự nhiên, nhưng không nhắc 'cá nhân hóa', LTV hay giảm chi phí Marketing. Đáp án B chọn vì các phương án khác không có căn cứ. Cần đối chiếu đáp án chính thức."},{"id":"q11-7","n":7,"type":"single","prompt":"Hệ quả nghiêm trọng nhất của việc duy trì tỷ lệ phản hồi Chat thấp trên Shopee là:","options":[{"id":"A","text":"Thuật toán sàn ngừng phân phối Traffic và shop có nguy cơ bị \"chết\""},{"id":"B","text":"Shop sẽ bị giới hạn số lượng sản phẩm được đăng tải mới mỗi ngày"},{"id":"C","text":"Khách hàng không thể sử dụng các mã giảm giá khi thanh toán đơn hàng"},{"id":"D","text":"Toàn bộ các sản phẩm trong gian hàng sẽ bị sàn tự động giảm giá bán"}],"answer":["A"],"confidence":"medium","hints":["Nhớ lại các hình phạt sàn áp dụng khi chỉ số vận hành kém.","Hình phạt liên quan đến mức hiển thị của shop.","Loại {B}, {C}, {D}: giới hạn đăng sản phẩm, chặn mã giảm giá và tự giảm giá bán không được nêu."],"explanation":"Chỉ số vận hành kém bị sàn phạt bằng cắt trợ giá, giảm hiển thị và nặng nhất là khóa shop, nên nguồn traffic bị ảnh hưởng nghiêm trọng.","whyWrong":{"B":"Giới hạn số sản phẩm đăng mới không được nêu.","C":"Không liên quan đến mã giảm giá khi thanh toán.","D":"Sàn không tự giảm giá bán của shop."},"source":{"lesson":11,"part":"Toàn bài","quote":"Nếu chúng ta vi phạm thì san sẽ phạt bằng cách ví dụ như là cắt trợ giá giảm hiển thị hoặc nặng nhất nó sẽ khóa so"},"keywords":["tỉ lệ phản hồi chat","giảm hiển thị","vi phạm"],"note":"Transcript nói vi phạm chỉ số bị phạt bằng cắt trợ giá, giảm hiển thị hoặc khóa shop, và nêu 'tỉ lệ phản hồi chat' trong phần xương cá. Cụm 'ngừng phân phối Traffic' và 'chết' không có nguyên văn. Đáp án A là phương án gần nhất."},{"id":"q11-8","n":8,"type":"single","prompt":"Chỉ số NFR (Non-fulfillment rate) trên sàn Shopee và TikTok Shop dùng để đo lường:","options":[{"id":"A","text":"Tỷ lệ khách hàng đánh giá 5 sao sau khi đã nhận được sản phẩm thực tế"},{"id":"B","text":"Tỷ lệ tin nhắn khách hàng được shop phản hồi trong vòng 12 giờ làm việc"},{"id":"C","text":"Tỷ lệ đơn hàng không thành công do lỗi người bán hoặc khách trả hàng"},{"id":"D","text":"Tỷ lệ đơn hàng được giao đến tay người mua sớm hơn thời gian dự kiến"}],"answer":["C"],"confidence":"medium","hints":["Nhớ lại nhóm chỉ số vận hành và trải nghiệm trên TikTok Shop.","NFR liên quan đến những đơn hàng không hoàn thành.","Loại {A}: đánh giá 5 sao. Loại {B}: phản hồi tin nhắn. Loại {D}: giao sớm hơn dự kiến."],"explanation":"NFR đo tỉ lệ đơn hàng không thành công do lỗi từ phía người bán. Đây thuộc nhóm chỉ số vận hành và trải nghiệm.","whyWrong":{"A":"Đánh giá 5 sao thuộc điểm đánh giá cửa hàng.","B":"Phản hồi tin nhắn là chỉ số khác.","D":"Giao sớm hơn dự kiến không phải điều NFR đo."},"source":{"lesson":11,"part":"Toàn bài","quote":"tỉ lệ đơn hàng bị hủy do lỗi từ người bán, tỉ lệ gửi hàng muộn, điểm đánh giá cửa hàng"},"keywords":["chỉ số vận hành","đơn hàng bị hủy","lỗi từ người bán"],"note":"Transcript nhắc chỉ số tỉ lệ đơn hàng bị hủy do lỗi từ người bán trong nhóm vận hành, nhưng không nêu tên NFR. Đáp án C khớp ý. Vế 'hoặc khách trả hàng' không có trong transcript."},{"id":"q11-9","n":9,"type":"single","prompt":"Nếu một shop có \"Traffic thấp nhưng CR cao\", hành động tối ưu nào là phù hợp nhất?","options":[{"id":"A","text":"Sửa lại toàn bộ ảnh sản phẩm và video mô tả để tăng tính thuyết phục khách hàng"},{"id":"B","text":"Xây dựng các gói Combo hoặc Mua kèm deal sốc để tăng giá trị đơn hàng"},{"id":"C","text":"Tăng ngân sách quảng cáo, tham gia Flash Sale hoặc thuê KOC kéo traffic"},{"id":"D","text":"Giảm tỷ lệ hoàn hàng bằng cách gọi điện xác nhận cho từng đơn hàng một"}],"answer":["C"],"confidence":"medium","hints":["Xác định điểm gãy: shop thiếu khách vào hay khách vào rồi không mua.","Tỉ lệ mua cao cho thấy sản phẩm đã thuyết phục, vấn đề nằm ở số người nhìn thấy.","Loại {A}: sửa ảnh dùng khi chuyển đổi thấp. Loại {B}: combo tăng giá trị đơn. Loại {D}: giảm hoàn hàng không liên quan."],"explanation":"Traffic thấp, CR cao do thiếu hiển thị, nên cần tăng nguồn khách bằng quảng cáo, Flash Sale hoặc KOC.","whyWrong":{"A":"Sửa ảnh và video phù hợp khi chuyển đổi thấp, không phải khi CR đã cao.","B":"Combo tăng giá trị đơn, không giải quyết thiếu traffic.","D":"Giảm hoàn hàng không liên quan đến thiếu hiển thị."},"source":{"lesson":11,"part":"Toàn bài","quote":"traffic thì thấp nhưng tỉ lệ chuyển đổi tỉ lệ cao. Thì nguyên nhân có thể là sản phẩm chất lượng giá tốt nhưng bị thiếu hiển thị"},"keywords":["traffic","tỉ lệ chuyển đổi","thiếu hiển thị"],"note":"Transcript nêu nguyên nhân là sản phẩm tốt nhưng thiếu hiển thị, và không nêu giải pháp. Đáp án C (tăng hiển thị, kéo traffic) suy ra từ nguyên nhân đó, dựa trên các công cụ ở Bài 7 và Bài 10."},{"id":"q11-10","n":10,"type":"single","prompt":"Phiên Livestream có lượt xem cao nhưng GPM thấp, tỷ lệ checkout thấp mặc dù lượt nhấp giỏ hàng cao. Giải pháp tập trung vào:","options":[{"id":"A","text":"Kiểm tra lại mức giá bán, mã Freeship hoặc tạo thêm sự khan hiếm hàng"},{"id":"B","text":"Tìm kiếm các KOC mới có số lượng người theo dõi lớn hơn để hợp tác lại"},{"id":"C","text":"Điều chỉnh ánh sáng và âm thanh của phiên live để thu hút khách ở lại lâu"},{"id":"D","text":"Thay đổi hoàn toàn kịch bản livestream để khách hàng cảm thấy vui vẻ hơn"}],"answer":["A"],"confidence":"medium","hints":["Tìm điểm gãy trong phễu của phiên live: người xem, nhấp giỏ, thanh toán.","Khách đã nhấp giỏ nhưng không thanh toán, nên vấn đề nằm ở quyết định cuối.","Loại {B}: tìm KOC mới để tăng người xem. Loại {C} và {D}: ánh sáng, âm thanh và kịch bản ảnh hưởng thời gian ở lại, không phải bước thanh toán."],"explanation":"Lượt nhấp giỏ hàng cao nhưng checkout thấp cho thấy điểm gãy ở quyết định mua, cần xem lại giá, mã Freeship và tạo khan hiếm.","whyWrong":{"B":"Tăng người theo dõi không xử lý việc khách không thanh toán.","C":"Ánh sáng và âm thanh ảnh hưởng thời gian ở lại, không phải checkout.","D":"Đổi toàn bộ kịch bản chưa nhắm đúng điểm gãy ở thanh toán."},"source":{"lesson":11,"part":"Toàn bài","quote":"Còn tỉ lệ thanh toán khách đã thêm vào giỏ nhưng không mua"},"keywords":["điểm gãy","GPM","livestream"],"note":"Transcript chỉ nêu cách phân tích theo dữ liệu thời gian thực (lượt nhấp giỏ hàng, tỉ lệ giữ chân, tỉ lệ thanh toán), không nêu giải pháp cho tình huống này. Đáp án A suy ra từ điểm gãy ở bước thanh toán, và 'tạo sự khan hiếm' có ở Bài 9."},{"id":"q11-11","n":11,"type":"single","prompt":"Nhóm khách hàng \"Nguy cơ\" trong mô hình RFM thường có đặc điểm nào sau đây?","options":[{"id":"A","text":"Thường xuyên mua hàng với tần suất cao và chi trả số tiền rất lớn"},{"id":"B","text":"Luôn phản hồi tin nhắn tư vấn của shop một cách nhanh chóng và tích cực"},{"id":"C","text":"Có chỉ số R cao, nghĩa là đã từ lâu không quay lại mua hàng tại shop"},{"id":"D","text":"Có giá trị mua hàng lớn nhưng chỉ mới mua một lần duy nhất tại shop"}],"answer":["C"],"confidence":"medium","hints":["Nhớ lại ý nghĩa chữ R của RFM.","R cho biết khoảng thời gian từ lần mua gần nhất.","Loại {A}: nhóm VIP. Loại {B}: không phải đặc điểm của nhóm nguy cơ. Loại {D}: khách mua một lần giá trị lớn là nhóm tiềm năng."],"explanation":"Nhóm nguy cơ có R cao theo quy ước số ngày kể từ lần mua cuối, nghĩa là đã lâu không quay lại mua hàng.","whyWrong":{"A":"Mua thường xuyên và chi nhiều là nhóm VIP.","B":"Phản hồi nhanh không phải tiêu chí RFM.","D":"Bài giảng không mô tả nhóm này là nhóm nguy cơ."},"source":{"lesson":11,"part":"Toàn bài","quote":"chữ R cho chúng ta biết khách hàng vừa mua hàng của mình hôm qua hay là đã từ một khoảng thời gian nào đó"},"keywords":["RFM","nhóm nguy cơ","khách hàng quay lại"],"note":"Transcript nêu R cho biết khách mua hôm qua hay đã lâu, và có nhóm 'nguy cơ'. Cách hiểu 'R cao' phụ thuộc quy ước chấm điểm: nếu R là số ngày kể từ lần mua cuối thì R cao nghĩa là lâu không mua, nếu chấm điểm R cao là mua gần đây thì ngược lại. Đề dùng quy ước số ngày."},{"id":"q11-12","n":12,"type":"single","prompt":"Trong tiêu chuẩn đóng gói thực chiến, việc dán băng keo lên vận đơn cần lưu ý điều gì?","options":[{"id":"A","text":"Chỉ cần dán một góc của vận đơn để nhân viên bưu cục dễ dàng bóc ra xem"},{"id":"B","text":"Nên dán đè nhiều lớp băng keo lên toàn bộ vận đơn để tránh bị rách hỏng"},{"id":"C","text":"Dán vận đơn ở mặt dưới của hộp để không làm ảnh hưởng đến thẩm mỹ gói"},{"id":"D","text":"Không dán đè băng keo lên mã QR/Bar code để tránh phản quang khi quét"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại lỗi đóng gói phổ biến liên quan đến vận đơn.","Máy quét của đơn vị vận chuyển rất nhạy cảm với ánh sáng.","Loại {B}: dán đè nhiều lớp chính là lỗi. Loại {A} và {C}: không phải hướng dẫn trong bài."],"explanation":"Băng keo dán đè lên mã vận đơn gây phản quang, máy quét không đọc được và đơn hàng bị tồn đọng.","whyWrong":{"A":"Dán một góc không phải hướng dẫn trong bài.","B":"Dán đè nhiều lớp là lỗi phổ biến.","C":"Bài giảng không nêu vị trí dán ở mặt dưới."},"source":{"lesson":11,"part":"Toàn bài","quote":"dán băng keo đè lên mã vận đơn các máy quét của đơn vị vận chuyển rất nhạy cảm với ánh sáng"},"keywords":["đóng gói","vận đơn","băng keo"],"note":""},{"id":"q11-13","n":13,"type":"single","prompt":"Khi gặp đánh giá xấu (1-3 sao), bước đầu tiên trong quy trình xử lý thực chiến là:","options":[{"id":"A","text":"Tặng ngay một Voucher giảm giá lớn cho khách mà không cần hỏi nguyên nhân"},{"id":"B","text":"Liên hệ trực tiếp với khách qua Chat hoặc Hotline để lắng nghe vấn đề"},{"id":"C","text":"Phản hồi lại đánh giá của khách bằng những lời lẽ gay gắt để bảo vệ shop"},{"id":"D","text":"Gửi yêu cầu lên tổng đài của sàn TMĐT để xóa đánh giá đó ngay lập tức"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại quy trình xử lý đánh giá xấu.","Bước đầu là kết nối với khách để hiểu vấn đề.","Loại {A}: tặng voucher khi chưa biết nguyên nhân. Loại {C}: phản hồi gay gắt. Loại {D}: yêu cầu xóa đánh giá ngay."],"explanation":"Bước đầu tiên là liên hệ trực tiếp qua chat hoặc hotline, lắng nghe rồi mới đưa phương án bồi thường.","whyWrong":{"A":"Bài giảng không nói tặng voucher khi chưa hỏi nguyên nhân.","C":"Phản hồi gay gắt làm tổn hại uy tín shop.","D":"Bài giảng không nói nhờ sàn xóa ngay đánh giá."},"source":{"lesson":11,"part":"Toàn bài","quote":"chúng ta hãy liên hệ trực tiếp qua chat hotline ngay lập tức"},"keywords":["đánh giá xấu","hotline"],"note":""},{"id":"q11-14","n":14,"type":"single","prompt":"Quy trình xử lý đơn hàng tổng quát trên sàn TMĐT bao gồm các bước cốt lõi nào theo bài giảng?","options":[{"id":"A","text":"Bao gồm 5 bước: Tiếp nhận, Chuẩn bị hàng, In vận đơn, Bàn giao cho đơn vị vận chuyển và Theo dõi"},{"id":"B","text":"Bao gồm 4 bước: Xác nhận đơn, Dán mã vận đơn, Giao hàng và Thu tiền"},{"id":"C","text":"Bao gồm 3 bước: Tiếp nhận đơn, Đóng gói sản phẩm và Bàn giao vận chuyển"},{"id":"D","text":"Bao gồm 6 bước: Quảng cáo, Tư vấn khách, Chốt đơn, Đóng gói và Giao"}],"answer":["A"],"confidence":"high","hints":["Nhớ lại số bước của quy trình vận hành tổng quan.","Quy trình đi từ khi khách đặt hàng đến khi đơn được giao thành công.","Loại {B}, {C}, {D}: số bước và nội dung không khớp bài giảng."],"explanation":"Quy trình gồm 5 bước: tiếp nhận và xác nhận, chuẩn bị hàng và đóng gói, in và dán vận đơn, bàn giao vận chuyển, theo dõi và hoàn tất.","whyWrong":{"B":"Không phải 4 bước này.","C":"Không phải 3 bước này.","D":"Không phải 6 bước, quảng cáo và tư vấn không thuộc quy trình xử lý đơn."},"source":{"lesson":11,"part":"Toàn bài","quote":"Bước thứ nhất là tiếp nhận và xác nhận đơn hàng. Bước thứ hai là chuẩn bị hàng và đóng gói. Bước thứ ba in và dán vận đơn"},"keywords":["xử lý đơn hàng","năm bước"],"note":""},{"id":"q11-15","n":15,"type":"single","prompt":"Chỉ số CTR (Click-Through Rate) trên sàn Shopee được tính bằng công thức nào?","options":[{"id":"A","text":"Phần trăm giữa Lượt nhấp chuột chia cho tổng số Lượt hiển thị sản phẩm"},{"id":"B","text":"Tỷ lệ phần trăm người dùng rời đi sau khi chỉ xem một trang duy nhất"},{"id":"C","text":"Tổng doanh thu của gian hàng chia cho tổng số đơn hàng đã giao thành công"},{"id":"D","text":"Tổng số đơn hàng thành công chia cho tổng số lượt người đặt hàng tại shop"}],"answer":["A"],"confidence":"high","hints":["Nhớ lại chỉ số đo mức hấp dẫn của quảng cáo trên Shopee.","CTR so sánh số lượt bấm với số lần sản phẩm được hiển thị.","Loại {B}: tỉ lệ thoát trang. Loại {C}: doanh thu trung bình mỗi đơn. Loại {D}: tỉ lệ chuyển đổi đơn hàng."],"explanation":"CTR = Lượt click / Lượt hiển thị x 100%, cho biết cứ 100 lượt hiển thị có bao nhiêu người bấm vào sản phẩm.","whyWrong":{"B":"Đó là tỉ lệ thoát trang.","C":"Đó là doanh thu trên mỗi đơn (AOV).","D":"Đó là tỉ lệ chuyển đổi đơn hàng."},"source":{"lesson":8,"part":"Phần 1","quote":"CTR cho biết là cứ 100 lượt hiển thị thì sẽ có bao nhiêu người bấm vào sản phẩm"},"keywords":["CTR","lượt hiển thị"],"note":""}]}],"glossary":[{"term":"Tiêu đề chuẩn SEO","aliases":["tiêu đề sản phẩm","title SEO"],"lesson":6,"definition":"Tiêu đề chứa từ khóa chính, thương hiệu nếu có, thuộc tính, từ khóa mô tả tốt và có thể có tên gian hàng. Không viết hoa toàn bộ, không ký tự đặc biệt, không lặp từ khóa.","source":{"lesson":6,"part":"Phần 1","quote":"có chứa từ khóa chính thì thường là những cái từ khóa chính này sẽ chính là cái tên sản phẩm luôn"}},{"term":"Ảnh bìa (3 tiêu chí)","aliases":["ảnh bìa","ảnh đại diện"],"lesson":6,"definition":"Ảnh hiện đầu tiên khi khách tìm kiếm. Ba tiêu chí: hình ảnh hóa đặc điểm nổi bật, tạo ấn tượng trong 1 giây, trải nghiệm nhìn và đọc tốt với tối đa ba màu.","source":{"lesson":6,"part":"Phần 1","quote":"ba cái tiêu chí mà có thể gọi là then chốt để giúp cho một cái ảnh bìa có thể được gọi là tốt"}},{"term":"Cấu trúc 5 loại ảnh sản phẩm","aliases":["5 loại ảnh","ảnh mô tả sản phẩm"],"lesson":6,"definition":"Gồm ảnh tổng quan, ảnh lợi ích và tính năng chính, ảnh so sánh và USP, ảnh ứng dụng thực tế, ảnh cam kết, dịch vụ sau bán hàng và quà tặng.","source":{"lesson":6,"part":"Phần 2","quote":"Thế thì một cái cấu trúc nên có của ảnh sản phẩm đấy là chúng ta sẽ gồm năm cái loại"}},{"term":"USP","aliases":["Unique Selling Point","điểm bán hàng độc đáo"],"lesson":6,"definition":"Điểm đặc biệt của sản phẩm so với các sản phẩm khác trên thị trường, thường thể hiện bằng ảnh so sánh.","source":{"lesson":6,"part":"Phần 2","quote":"Nghĩa là cái điểm đặc biệt của sản phẩm so với những cái sản phẩm khác ở trên thị trường"}},{"term":"Mô tả sản phẩm","aliases":["description","phần mô tả"],"lesson":6,"definition":"Phần nằm dưới ảnh. Mô tả 3 đến 5 dòng thông tin quan trọng nhất, chia đoạn, không để số điện thoại, địa chỉ hay website. Xu hướng dùng ảnh nhiều hơn chữ.","source":{"lesson":6,"part":"Phần 2","quote":"mô tả từ ba cho đến năm dòng cái thông tin quan trọng nhất về sản phẩm"}},{"term":"Hashtag","aliases":["thẻ hashtag"],"lesson":6,"definition":"Nên thêm 3 đến 5 hashtag liên quan nhất vào phần mô tả để Shopee hiểu nhanh sản phẩm thuộc loại gì và phân phối đúng tệp khách.","source":{"lesson":6,"part":"Phần 2","quote":"một số hashtag đó từ 3 cho 5 hashtag là những cái từ mà liên quan nhất đến cái sản phẩm này"}},{"term":"Lỗi tăng giá bất hợp lý","aliases":["tăng giá trước khuyến mãi","lỗi tăng giá bán"],"lesson":6,"definition":"Lỗi tăng giá bán trước khuyến mãi. Cách tránh: chỉnh giá khuyến mãi chứ không chỉnh giá gốc, tăng giá gốc kèm chứng từ gửi Shopee, không tham gia khuyến mãi, hoặc chỉnh giá gốc trước ít nhất 7 ngày.","source":{"lesson":6,"part":"Phần 2","quote":"Lỗi đầu tiên là lỗi tăng giá bán bất hợp lý trước khuyến mãi"}},{"term":"Seeding","aliases":["seeding sản phẩm","sitting sản phẩm"],"lesson":6,"definition":"Hoạt động tạo đơn hàng và đánh giá ban đầu để xây dựng độ tin cậy, tăng tỉ lệ chuyển đổi và cải thiện khả năng hiển thị của sản phẩm.","source":{"lesson":6,"part":"Phần 2","quote":"đây là một cái hoạt động tạo các đơn hàng và đánh giá ban đầu cho sản phẩm nhằm xây dựng cái độ tin cậy"}},{"term":"Hành vi gian lận Shopee","aliases":["gian lận seeding","hành vi gian lận"],"lesson":6,"definition":"Gồm tự tạo tài khoản đặt hàng, đặt hộ, tạo nhiều tài khoản để hưởng chương trình, thỏa thuận tăng giá trục lợi, tách nhỏ đơn. Hình phạt phổ biến là khóa vĩnh viễn.","source":{"lesson":6,"part":"Phần 2","quote":"hình phạt phổ biến mà dành cho cái hành vi này chính là khóa Sĩnh viễn"}},{"term":"Kalodata","aliases":["calodata","Carolata","nghiên cứu thị trường TikTok Shop"],"lesson":6,"definition":"Công cụ nghiên cứu thị trường theo ngành hàng trên TikTok Shop, cho doanh thu, số cửa hàng, tăng trưởng, top 3 và top 10 cửa hàng. Nên dùng dữ liệu từ 30 ngày trở lên.","source":{"lesson":6,"part":"Demo Kalodata","quote":"thầy khuyên là chúng ta sẽ nên sử dụng những cái khoảng dữ liệu từ khoảng 30 ngày đổ lên"}},{"term":"Top 3 và top 10 cửa hàng (Kalodata)","aliases":["chỉ số ngành","tỉ lệ top 3","tỉ lệ top 10"],"lesson":6,"definition":"Tỉ lệ doanh thu của 3 và 10 cửa hàng đứng đầu so với cả ngành. Càng cao thì ngành càng nhiều ông lớn và cơ hội cạnh tranh càng ít.","source":{"lesson":6,"part":"Demo Kalodata","quote":"Và ngành hàng nào mà có càng nhiều ông lớn thì thực ra là nó sẽ càng ít cái cơ hội"}},{"term":"Khuyến mãi của shop","aliases":["chương trình khuyến mãi của shop"],"lesson":7,"definition":"Công cụ tạo đợt giảm giá cho một hoặc nhiều sản phẩm, hiển thị giá gạch và nhãn giảm giá. Hiệu quả không còn như trước vì khách hàng hiện nay thông minh hơn.","source":{"lesson":7,"part":"Phần 1","quote":"Thì đây là một cái công cụ giúp cho nhà bán tạo ra một cái đợt giảm giá khuyến mãi"}},{"term":"Flash Sale của shop","aliases":["flash sale","class sale"],"lesson":7,"definition":"Chương trình khuyến mãi thời gian ngắn do gian hàng thiết lập, giảm giá trong khung giờ nhất định để kích thích mua nhanh. Nên chọn sản phẩm nhu cầu cao hoặc chủ lực.","source":{"lesson":7,"part":"Phần 1","quote":"Thì Flash Sale của shop là một cái chương trình khuyến mãi trong thời gian ngắn do chính gian hàng thiết lập"}},{"term":"Mã giảm giá","aliases":["voucher","mã giảm giá của shop"],"lesson":7,"definition":"Mã do gian hàng tạo, giảm một phần giá trị đơn khi nhập mã lúc thanh toán, kèm điều kiện như giá trị đơn tối thiểu.","source":{"lesson":7,"part":"Phần 1","quote":"cho phép người mua được giảm giá một phần giá trị đơn hàng khi nhập hoặc là áp dụng mã trong cái quá trình thanh toán"}},{"term":"Combo khuyến mãi","aliases":["combo","combo khuế mãi","bán theo bộ"],"lesson":7,"definition":"Gói nhiều sản phẩm liên quan bán chung với giá ưu đãi so với mua lẻ, dùng để tăng giá trị đơn hàng.","source":{"lesson":7,"part":"Phần 1","quote":"người bán kết hợp nhiều sản phẩm thành một gói bán chung với mức giá ưu đãi so với khi mua lẻ từng sản phẩm"}},{"term":"Mua kèm deal sốc","aliases":["mua kèm du shop","mua kèm duo","deal sốc","deal shock"],"lesson":7,"definition":"Khách mua sản phẩm chính thì được mua thêm sản phẩm phụ với giá ưu đãi. Sản phẩm kèm nên bổ trợ sản phẩm chính, giá trị thấp hoặc chi phí hợp lý.","source":{"lesson":7,"part":"Phần 1","quote":"chương trình khuyến mãi cho phép khách hàng mua thêm một số sản phẩm với mức giá ưu đãi khi đã chọn mua một sản phẩm chính"}},{"term":"Quảng cáo trả phí","aliases":["quảng cáo trả phí Shopee","paid ads"],"lesson":7,"definition":"Công cụ marketing nội sàn cho phép người bán trả phí để tăng hiển thị. Thường tính theo CPC và đo bằng lượt hiển thị, click, đơn hàng, doanh thu, ROAS.","source":{"lesson":7,"part":"Phần 1","quote":"công cụ marketing nội sàn cho phép người bán trả phí để tăng khả năng hiển thị của sản phẩm hoặc gian hàng"}},{"term":"SEO sản phẩm","aliases":["SEO","search engine optimization","sale sản phẩm"],"lesson":7,"definition":"Tối ưu thông tin và nội dung sản phẩm để tăng khả năng xuất hiện khi khách tìm từ khóa. Chịu ảnh hưởng của tiêu đề, mô tả, danh mục và hiệu quả bán hàng.","source":{"lesson":7,"part":"Phần 1","quote":"để tăng cái khả năng xuất hiện của sản phẩm khi mà khách hàng tìm kiếm từ khóa trên sàn"}},{"term":"Shopee Affiliate","aliases":["tiếp thị liên kết","affiliate Shopee"],"lesson":7,"definition":"Người bán cho đối tác quảng bá sản phẩm và nhận hoa hồng khi có đơn thành công qua link giới thiệu. Người bán chỉ trả phí khi có đơn phát sinh.","source":{"lesson":7,"part":"Phần 1","quote":"người bán sẽ chỉ trả phí khi mà có đơn hàng phát sinh"}},{"term":"Ưu đãi follower","aliases":["ưu đãi người theo dõi"],"lesson":7,"definition":"Khuyến mãi dành riêng cho khách theo dõi gian hàng, giúp xây dựng tệp khách hàng trung thành.","source":{"lesson":7,"part":"Phần 1","quote":"ưu đãi follower là một cái chương trình khuyến mãi dành cho những khách hàng mà theo dõi cái gian hàng"}},{"term":"Shopee Live","aliases":["Shopee Livestream"],"lesson":7,"definition":"Công cụ bán hàng trực tiếp trên Shopee, giới thiệu sản phẩm qua video phát trực tiếp và tương tác với khách theo thời gian thực.","source":{"lesson":7,"part":"Phần 1","quote":"Shopee Livestream là một cái công cụ bán hàng trực tiếp trên nền tảng Shopee"}},{"term":"Shopee Video","aliases":["video ngắn Shopee"],"lesson":7,"definition":"Công cụ video ngắn trên Shopee, giới thiệu sản phẩm và gắn liên kết để khách mua trực tiếp.","source":{"lesson":7,"part":"Phần 1","quote":"nhằm thu hút sự chú ý của người mua và tăng khả năng tiếp cận sản phẩm"}},{"term":"GMV","aliases":["Gross Merchandise Value","tổng giá trị hàng hóa"],"lesson":7,"definition":"Tổng giá trị hàng hóa bán ra trong một khoảng thời gian. Là thước đo quy mô, chưa trừ chi phí và còn tính cả đơn hủy, hoàn.","source":{"lesson":7,"part":"Phần 2","quote":"GMV thì chính là tổng giá trị hàng hóa được bán ra trên gian hàng trong một khoảng thời gian nhất định"},"formula":"GMV = Số đơn hàng x AOV"},{"term":"AOV","aliases":["giá trị đơn hàng trung bình","average order value"],"lesson":7,"definition":"Giá trị trung bình của một đơn hàng. Combo và mua kèm giúp tăng AOV mà không cần tăng traffic.","source":{"lesson":7,"part":"Phần 2","quote":"AOV nó được viết tắt của avid order value nghĩa là giá trị trung bình của một đơn hàng"}},{"term":"4 chiến lược tối ưu GMV","aliases":["bốn chiến lược GMV"],"lesson":7,"definition":"Thu hút khách hàng, tăng tốc doanh số bằng khuyến mãi, tăng giá trị đơn hàng AOV và kết hợp nhiều chương trình marketing.","source":{"lesson":7,"part":"Phần 2","quote":"Thì ở đây chúng ta sẽ có bốn cái chiến lược"}},{"term":"Người tìm hàng / Hàng tìm người","aliases":["nền tảng người tìm hàng","nền tảng hàng tìm người"],"lesson":8,"definition":"Shopee là nền tảng người tìm hàng, giống siêu thị. TikTok Shop là hàng tìm người dựa trên sở thích, giống trung tâm thương mại.","source":{"lesson":8,"part":"Phần 1","quote":"Shopee chính là một cái nền tảng người tìm hàng"}},{"term":"Shopee Ads","aliases":["quảng cáo Shopee","Shopee Art"],"lesson":8,"definition":"Công cụ marketing trả phí của Shopee để mua lượt hiển thị tại vị trí nổi bật như trang tìm kiếm và trang chủ. Tính phí chủ yếu theo CPC.","source":{"lesson":8,"part":"Phần 1","quote":"marketing trả phí do Shopee cung cấp cho phép người bán được mua lượt hiển thị sản phẩm gian hàng"}},{"term":"CPC","aliases":["cost per click","chi phí mỗi click"],"lesson":8,"definition":"Chi phí cho mỗi lượt click, người bán trả phí khi khách nhấp vào quảng cáo. Trong Affiliate, CPC tính theo số click kể cả khi không phát sinh mua hàng.","source":{"lesson":8,"part":"Phần 1","quote":"Thuật ngữ của chi phí cho mỗi lượt click gọi là CPC click"}},{"term":"Quảng cáo khám phá","aliases":["quảng cáo sản phẩm","quảng cáo tìm kiếm","quảng cáo shop"],"lesson":8,"definition":"Quảng cáo hiển thị ở sản phẩm tương tự hoặc mục có thể bạn cũng thích. Shopee đã gộp quảng cáo tìm kiếm và khám phá thành quảng cáo sản phẩm.","source":{"lesson":8,"part":"Phần 1","quote":"quảng cáo khám phá hiển thị ở những cái sản phẩm tương tự hoặc là mục có thể bạn cũng thích"}},{"term":"CPAS","aliases":["CP","quảng cáo hợp tác Facebook","mẫu quảng cáo CP"],"lesson":8,"definition":"Mẫu quảng cáo Shopee hợp tác với Facebook để quảng cáo ngoài sàn và dẫn link về shop. Bản ghi chép của bài giảng viết là CP.","source":{"lesson":8,"part":"Phần 1","quote":"nền tảng Shopee người ta gọi là mẫu quảng cáo CP"}},{"term":"TikTok Ads","aliases":["quảng cáo TikTok","TikTok Ad"],"lesson":8,"definition":"Quảng cáo video ngắn trên TikTok để tăng nhận diện thương hiệu, thu hút lượt xem, tương tác và chuyển đổi. Hình thức phổ biến: In-Feed, Take over, Hashtag Challenge, Branded Effect.","source":{"lesson":8,"part":"Phần 1","quote":"Các hình thức quảng cáo phổ biến nhất của TikTok Ad đó là đầu tiên là Infit"}},{"term":"In-Feed","aliases":["Infit","quảng cáo xen kẽ"],"lesson":8,"definition":"Hình thức TikTok Ads xuất hiện xen kẽ giữa các video khi người dùng lướt feed.","source":{"lesson":8,"part":"Phần 1","quote":"quảng cáo xuất hiện xen kẽ giữa các video khi mà người dùng người ta lướt trên nền tảng TikTok"}},{"term":"TopView / Takeover","aliases":["Take over","Brand Takeover","TopView"],"lesson":8,"definition":"Hình thức TikTok Ads hiển thị ngay khi người dùng mở ứng dụng.","source":{"lesson":8,"part":"Phần 1","quote":"Take over tức là quảng cáo hiển thị ngay khi mà chúng ta mở ứng dụng"}},{"term":"Hashtag Challenge","aliases":["thử thách hashtag"],"lesson":8,"definition":"Hình thức TikTok Ads tạo trào lưu thông qua hashtag.","source":{"lesson":8,"part":"Phần 1","quote":"tức là tạo ra các cái trào lưu thông qua các cái hashtag"}},{"term":"Branded Effect","aliases":["Branded Effects","bộ lọc thương hiệu"],"lesson":8,"definition":"Hình thức TikTok Ads tạo hiệu ứng, bộ lọc filter gắn liền với thương hiệu.","source":{"lesson":8,"part":"Phần 1","quote":"branded effect tức là tạo ra các hiệu ứng các bộ lọc filter gắn liền với các cái thương hiệu"}},{"term":"OCPM","aliases":["OCPS","đấu thầu tự động"],"lesson":8,"definition":"Mô hình đấu thầu tự động của TikTok Shop Ads. Hệ thống tối ưu hiển thị theo khả năng chuyển đổi, người bán không kiểm soát từng lượt click.","source":{"lesson":8,"part":"Phần 1","quote":"thường sử dụng các cái mô hình như OCPM hoặc là OCPS"}},{"term":"GMV Max","aliases":["Jmax","JVMAX","Product GMV Max","quảng cáo tự động"],"lesson":8,"definition":"Giải pháp quảng cáo tự động dùng AI chọn từ khóa, đấu thầu và vị trí để tối đa hóa doanh thu theo ngân sách và ROAS mục tiêu. Các nền tảng bắt đầu thử nghiệm từ tháng 7 năm 2025.","source":{"lesson":8,"part":"Phần 1","quote":"một cái giải pháp giúp quảng cáo tự động thay thế con người, sử dụng AI để tự động chọn từ khóa này đấu thầu"}},{"term":"Learning phase","aliases":["giai đoạn máy học","learning face"],"lesson":8,"definition":"Giai đoạn hệ thống học dữ liệu trước khi ổn định. GMV Max thường lên tới 7 ngày và cần khoảng 50 đến 100 đơn hàng. Video mới thường ở trạng thái đang học dưới 3 ngày.","source":{"lesson":8,"part":"Phần 1","quote":"thông thường là lên tới 7 ngày"}},{"term":"Từ khóa mở rộng / chính xác","aliases":["từ khóa mở rộng","từ khóa chính xác","bộ từ khóa"],"lesson":8,"definition":"Từ khóa mở rộng: quảng cáo hiện với cụm từ biến thể, cùng ý nghĩa, cùng ngành. Từ khóa chính xác: chỉ hiện khi khách gõ đúng từ khóa đã thiết lập.","source":{"lesson":8,"part":"Phần 1","quote":"quảng cáo của chúng ta chỉ hiển thị khi người dùng tìm tìm kiếm chính xác từ khóa mà chúng ta đã thiết lập"}},{"term":"Giá thầu khoán","aliases":["giá thầu","Giá bán x 0.4%","khoán giá thầu"],"lesson":8,"definition":"Cách đặt giá thầu cho người mới, dựa trên giá bán, phần trăm quảng cáo chịu được và tỉ lệ chuyển đổi dự kiến. Với giả định 20% và 2% thì giá thầu bằng giá bán x 0.4%, ví dụ giá bán 200k cho giá thầu 800 đồng.","source":{"lesson":8,"part":"Phần 1","quote":"Giá bán nhân với 0.4 là chúng ta ra giá thầu"},"formula":"Giá thầu khoán = Giá bán x %QC dự kiến x %CVR dự kiến"},{"term":"ROAS","aliases":["Return on Ad Spend","RAS","Rust","tỉ suất hoàn vốn quảng cáo"],"lesson":8,"definition":"Chỉ số hiệu quả quảng cáo. Ví dụ chi 100.000 quảng cáo và thu 400.000 doanh thu thì ROAS bằng 4.","source":{"lesson":8,"part":"Phần 1","quote":"Rust sẽ được tính bằng doanh thu phát sinh từ quảng cáo chia cho chi phí quảng cáo"},"formula":"ROAS = Doanh thu từ quảng cáo / Chi phí quảng cáo"},{"term":"ROI mục tiêu","aliases":["ROI","Roy","target ROAS"],"lesson":8,"definition":"Mức ROI người bán đặt cho chiến dịch. Ví dụ giá bán 200k và 20k dành cho lợi nhuận cộng quảng cáo thì ROI chạy từ 10 đến 20. Đặt ROI quá cao làm quảng cáo khó phân phối.","source":{"lesson":8,"part":"Phần 2","quote":"Như vậy Roy của các bạn sẽ chạy từ 10 cho đến 20"},"formula":"ROI mục tiêu = Giá bán / Chi phí QC chấp nhận cho 1 đơn"},{"term":"CTR","aliases":["Click Through Rate","tỉ lệ click","tỉ lệ nhấp"],"lesson":8,"definition":"Tỉ lệ click, cho biết cứ 100 lượt hiển thị có bao nhiêu người bấm vào sản phẩm. CTR cao cho thấy hình ảnh, tiêu đề, giá hấp dẫn hơn đối thủ.","source":{"lesson":8,"part":"Phần 1","quote":"CTR cho biết là cứ 100 lượt hiển thị thì sẽ có bao nhiêu người bấm vào sản phẩm"},"formula":"CTR = Lượt click / Lượt hiển thị x 100%"},{"term":"CPC thực tế","aliases":["CPC đặt thầu","CPC đấu thầu"],"lesson":8,"definition":"Số tiền thực tế phải trả cho mỗi lượt click, khác với CPC thiết lập khi đấu thầu. Tính thủ công bằng chi phí quảng cáo chia số click.","source":{"lesson":8,"part":"Phần 1","quote":"CPC thực tế nên được tính theo công thức CPC bằng chi phí quảng cáo chia cho số click"},"formula":"CPC thực tế = Chi phí quảng cáo / Số click"},{"term":"Xếp hạng quảng cáo","aliases":["ba yếu tố xếp hạng","giá thầu điểm liên quan hiệu suất"],"lesson":8,"definition":"Shopee xếp hạng quảng cáo dựa vào ba yếu tố: giá thầu, điểm liên quan và hiệu suất sản phẩm bán.","source":{"lesson":8,"part":"Phần 1","quote":"Thế thì Shopee sẽ xếp hạng quảng cáo dựa vào ba yếu tố như sau"}},{"term":"Điểm liên quan","aliases":["relevance score"],"lesson":8,"definition":"Mức độ liên quan giữa sản phẩm và từ khóa khách tìm. Shopee căn cứ vào hiệu suất CTR trước đó để đánh giá.","source":{"lesson":8,"part":"Phần 1","quote":"Shopee căn cứ vào hiệu suất CTR trước đó để mà có thể đánh giá"}},{"term":"Miễn dịch quảng cáo","aliases":["sự miễn dịch quảng cáo"],"lesson":8,"definition":"Hiện tượng khách dị ứng và bỏ qua quảng cáo do nội dung bão hòa, tỉ lệ click giảm và thời gian vuốt qua nhanh hơn.","source":{"lesson":8,"part":"Phần 2","quote":"Khách hàng của chúng ta đã đến một cái giai đoạn họ cực kỳ dị ứng và thường là họ sẽ bỏ qua những cái chiến dịch quảng cáo"}},{"term":"Trạng thái video","aliases":["đang chờ","đang học","đang phân phối","không phân phối"],"lesson":8,"definition":"Bốn trạng thái video trong GMV Max: đang chờ, đang học, đang phân phối, không phân phối. Video được phân phối thì giữ lại, video không phân phối thì thay thế.","source":{"lesson":8,"part":"Phần 2","quote":"Nguyên tắc rất đơn giản, video nào mà được phân phối thì giữ lại và nhân rộng, video nào không phân phối thì thay thế"}},{"term":"Creative Boost","aliases":["creative boot","tăng cường nội dung sáng tạo"],"lesson":8,"definition":"Tính năng dồn thêm ngân sách vào video có tiềm năng để thử nghiệm khi video bị gắn không phân phối. Ngân sách này không đảm bảo ROI.","source":{"lesson":8,"part":"Phần 2","quote":"hệ thống tự động dồn thêm ngân sách vào những video có tiềm năng có chuyển đổi"}},{"term":"Value-based optimization","aliases":["value based","định giá theo giá trị khách hàng","tối ưu theo giá trị"],"lesson":8,"definition":"Hệ thống chia khách thành các tệp giá trị và ưu tiên người có khả năng mua với giá trị cao hơn, thay vì chỉ tìm thật nhiều người mua.","source":{"lesson":8,"part":"Phần 2","quote":"không chỉ tìm người có khả năng mua hàng mà cần tìm những cái người có khả năng mua với giá trị cao hơn"}},{"term":"PSA","aliases":["PSR","thẻ sản phẩm","Product Shopping Ads"],"lesson":8,"definition":"Quảng cáo hiển thị dưới dạng thẻ sản phẩm, xuất hiện trong shop tab gợi ý hoặc kết quả tìm kiếm trong shop tab. Bản ghi chép viết là PSR.","source":{"lesson":8,"part":"Phần 2","quote":"thẻ sản phẩm thì chúng ta gọi là PSR, tức là quảng cáo hiển thị dưới dạng thẻ sản phẩm"}},{"term":"VSA","aliases":["video có gắn sản phẩm","Video Shopping Ads"],"lesson":8,"definition":"Video quảng cáo có gắn sản phẩm, có thể xuất hiện trong For You Feed hoặc kết quả tìm kiếm trên TikTok.","source":{"lesson":8,"part":"Phần 2","quote":"Thứ hai là video có gắn sản phẩm người ta gọi là VSA"}},{"term":"Livestream commerce","aliases":["livestream bán hàng","mô hình livestream","livestream thương mại"],"lesson":9,"definition":"Hình thức người bán phát video trực tiếp, vừa giới thiệu sản phẩm vừa tương tác với khách theo thời gian thực. Kết hợp giải trí, tương tác và mua hàng kèm khuyến mãi.","source":{"lesson":9,"part":"Phần 1","quote":"người bán phát video trực tiếp trên nền tảng, vừa giới thiệu về sản phẩm mà lại vừa tương tác với khách hàng theo thời gian thực"}},{"term":"Kinh tế chú ý","aliases":["Attention Economy","nền kinh tế của sự chú ý"],"lesson":9,"definition":"Trong môi trường internet, thứ khan hiếm là sự chú ý của người tiêu dùng. Livestream chiếm sự chú ý và chuyển thành hành vi mua.","source":{"lesson":9,"part":"Phần 1","quote":"cái thứ khan hiếm không phải là sản phẩm mà chính là phải lấy được những cái sự chú ý của người tiêu dùng"}},{"term":"Kinh tế trải nghiệm","aliases":["Experience Economy"],"lesson":9,"definition":"Người xem không chỉ mua sản phẩm mà còn trải nghiệm một buổi trình diễn trực tiếp, nơi người bán giới thiệu, thử sản phẩm và tạo cảm xúc.","source":{"lesson":9,"part":"Phần 1","quote":"Trước hết là livestream là một phần của kinh tế trải nghiệm"}},{"term":"Rich Media","aliases":["Rich Media Channel","kênh truyền thông giàu thông tin"],"lesson":9,"definition":"Livestream là kênh truyền thông giàu thông tin, truyền cùng lúc hình ảnh, âm thanh, ngôn ngữ cơ thể, cảm xúc của người bán và phản hồi ngay với người xem.","source":{"lesson":9,"part":"Phần 1","quote":"kênh truyền thông rất là rất là giàu thông tin. hay còn gọi là Rich Media Channel"}},{"term":"Sự hiện diện xã hội","aliases":["Social Presence","lý thuyết hiện diện xã hội"],"lesson":9,"definition":"Lý thuyết cho rằng người dùng online vẫn cảm nhận sự hiện diện của người khác. Trong livestream, khách thấy nhiều người cùng xem và mua nên có cảm giác cộng đồng.","source":{"lesson":9,"part":"Phần 1","quote":"Một trong những lý thuyết quan trọng trong livestream ấy đó là lý thuyết của sự hiện diện xã hội"}},{"term":"AIDA","aliases":["IDA","Attention Interest Desire Action","nhận biết quan tâm mong muốn hành động"],"lesson":9,"definition":"Mô hình hành trình khách hàng gồm Nhận biết, Quan tâm, Mong muốn, Hành động. Livestream dồn các pha này vào một phiên.","source":{"lesson":9,"part":"Phần 1","quote":"bao gồm bốn pha: Awen là nhận biết, quan tâm, interest, mong muốn, design và hành động action"}},{"term":"Mô hình 5P","aliases":["5P","Pre-live","Production","Performance","Process","Post-live","preline","postline"],"lesson":9,"definition":"Quy trình tổ chức livestream gồm Pre-live (chuẩn bị), Production (sản xuất, dàn dựng), Performance (kịch bản, tương tác), Process (xử lý đơn, hậu cần), Post-live (phân tích, tối ưu).","source":{"lesson":9,"part":"Phần 2","quote":"Process tức là các cái khâu liên quan đến xử lý đơn hàng và hậu cần"}},{"term":"Quy tắc 80/20 chuẩn bị","aliases":["80/20","nguyên tắc vàng 5P"],"lesson":9,"definition":"80% thành công của một phiên live đến từ khâu chuẩn bị, chỉ 20% đến từ khâu lên hình.","source":{"lesson":9,"part":"Phần 2","quote":"80 thành công thành công của một viên lai nó đến từ khâu chuẩn bị, chỉ có 20% đến từ khâu lên hình"}},{"term":"Sản phẩm mồi / chủ lực / bán kèm","aliases":["sản phẩm mồi","sản phẩm chủ lực","sản phẩm bán kèm"],"lesson":9,"definition":"Sản phẩm mồi giá hấp dẫn để thu hút và tạo nhiệt cho phiên. Sản phẩm chủ lực mang doanh thu lớn. Sản phẩm bán kèm tăng giá trị đơn hàng.","source":{"lesson":9,"part":"Phần 2","quote":"những cái sản phẩm mồi có một cái mức giá hấp dẫn để khách hàng có thể mua"}},{"term":"Peak CCU","aliases":["CCU","lượt xem đồng thời đỉnh","lượt xem đồng thời"],"lesson":9,"definition":"Lượt xem đồng thời cao nhất trong phiên live. Mục tiêu tham khảo trong bài là khoảng 1000 lượt xem đồng thời.","source":{"lesson":9,"part":"Phần 2","quote":"Rồi là khoảng 1000 lượt xem đồng thời"}},{"term":"Traffic nội sàn / ngoại sàn","aliases":["traffic nội sàn","traffic ngoại sàn","nguồn traffic"],"lesson":10,"definition":"Traffic nội sàn đến từ chính nền tảng sàn. Traffic ngoại sàn đến từ mạng xã hội, website hoặc đơn vị khác.","source":{"lesson":10,"part":"Phần 1","quote":"đến từ mạng xã hội hay là đến từ website khác thì người ta gọi đấy là nguồn traffic ngoại sàn nhé"}},{"term":"Khách hàng lạnh","aliases":["tệp khách hàng lạnh","tệp lạnh"],"lesson":10,"definition":"Nhóm chưa có nhu cầu rõ nhưng có thể cân nhắc mua nếu được thuyết phục. Dung lượng rất lớn, cần người bán chủ động tiếp cận.","source":{"lesson":10,"part":"Phần 1","quote":"tệp khách hàng lạnh tuy nhu cầu của họ chưa quá nét nhưng chúng ta cần chủ động giới thiệu, thuyết phục"}},{"term":"AISAS","aliases":["ISAS","ISAT","Attention Interest Search Action Share"],"lesson":10,"definition":"Mô hình năm pha: Chú ý, Quan tâm, Tìm kiếm, Hành động, Chia sẻ. Search là cầu nối giữa Interest và Action, Share tạo ra Attention mới.","source":{"lesson":10,"part":"Phần 1","quote":"Mô hình ISAS này bao gồm năm pha quan trọng trong hành trình khách hàng"}},{"term":"Owned media / Website DTC","aliases":["website độc lập","DTC","kênh tự chủ","owned media","sở hữu khách hàng"],"lesson":10,"definition":"Kênh do doanh nghiệp tự xây như website, Facebook, TikTok. Ưu điểm: hoạt động 24/7, xây thương hiệu độc lập và làm chủ dữ liệu khách hàng.","source":{"lesson":10,"part":"Phần 1","quote":"xây dựng thương hiệu độc lập và làm chủ về mặt dữ liệu khách hàng"}},{"term":"Micro/Nano influencer","aliases":["micro influencer","nano influencer","KOC nhỏ"],"lesson":10,"definition":"Nhóm KOC nhỏ có lượng người theo dõi vừa phải nhưng độ tin tưởng nhất định, tạo nội dung chân thật.","source":{"lesson":10,"part":"Phần 1","quote":"Chúng ta gọi là micro và nano influencer influencer ấy"}},{"term":"GMV vs doanh thu thuần","aliases":["doanh thu thuần","GMV không phải lợi nhuận"],"lesson":10,"definition":"GMV là quy mô, tính cả đơn hủy, chưa thanh toán, hoàn tiền và chưa trừ chi phí. Ví dụ 100 đơn x 500.000 = 50 triệu, doanh thu thực và lợi nhuận thấp hơn.","source":{"lesson":10,"part":"Phần 2","quote":"vẫn là 50 triệu nhưng doanh thu thực tế và lợi nhuận của bạn sẽ thấp hơn nha"},"formula":"GMV = Số lượng đơn hàng x Giá trị trung bình mỗi đơn"},{"term":"CVR","aliases":["tỉ lệ chuyển đổi","conversion rate"],"lesson":10,"definition":"Phần trăm khách mua trên tổng số khách truy cập. Tối ưu GMV là kết hợp traffic chất lượng, CVR và giá trị đơn hàng.","source":{"lesson":10,"part":"Phần 2","quote":"CVR tức là phần trăm khách hàng mua trên tổng số khách hàng truy cập"},"formula":"GMV = Traffic chất lượng x CVR x AOV"},{"term":"Cross-sell","aliases":["bán chéo","cross selling","cross sale"],"lesson":10,"definition":"Gợi ý sản phẩm liên quan, bổ trợ cho sản phẩm chính. Ví dụ mua máy lọc không khí gợi ý thêm bộ lọc thay thế hoặc máy đo độ ẩm.","source":{"lesson":10,"part":"Phần 2","quote":"mua máy lọc không khí gợi ý thêm là mua bộ lọc thay thế hoặc là máy đo độ ẩm"}},{"term":"Up-sell","aliases":["upsell","up-selling","nâng cấp sản phẩm"],"lesson":10,"definition":"Gợi ý thêm một phiên bản cao cấp hơn, ví dụ nâng cấp lên loại máy có diệt khuẩn, công suất lớn hơn.","source":{"lesson":10,"part":"Phần 2","quote":"Upsell đ có nghĩa là gợi ý thêm một cái phiên bản cao cấp hơn"}},{"term":"Bundle","aliases":["bán theo bộ","bán theo combo"],"lesson":10,"definition":"Bán nhiều sản phẩm theo combo, ví dụ máy lọc không khí, máy hút ẩm, máy tạo độ ẩm cho phòng ngủ.","source":{"lesson":10,"part":"Phần 2","quote":"bán theo một combo máy lọc không khí, máy hút ẩm, máy tạo độ ẩm"}},{"term":"Affiliate","aliases":["tiếp thị liên kết","affiliate marketing","KOL KOC"],"lesson":10,"definition":"Mô hình tiếp thị liên kết cho phép người tiếp thị quảng bá sản phẩm của nhà cung cấp và nhận hoa hồng khi có khách mua. Bốn bên: nhà cung cấp, người tiếp thị, khách hàng, nền tảng.","source":{"lesson":10,"part":"Phần 2","quote":"affilate là một mô hình tiếp thị liên kết trực tuyến cho phép người tiếp thị quảng bá dịch vụ ấy của nhà cung cấp và nhận hoa hồng khi có khách mua hàng"}},{"term":"Affiliate Network","aliases":["mạng lưới Affiliate","nền tảng Affiliate"],"lesson":10,"definition":"Đơn vị trung gian kết nối nhà cung cấp và người tiếp thị, cung cấp công cụ theo dõi, báo cáo và bảo đảm quyền lợi các bên.","source":{"lesson":10,"part":"Phần 2","quote":"đơn vị trung gian kết nối cung cấp à kết nối nhà cung cấp và người tiếp thị, cung cấp các công cụ theo dõi"}},{"term":"CPS","aliases":["cost per sale","hoa hồng theo đơn thành công"],"lesson":10,"definition":"Hoa hồng dựa trên giá trị đơn hàng thành công. Đây là hình thức phổ biến nhất trong Affiliate, đơn hàng càng cao thì phần trăm càng lớn.","source":{"lesson":10,"part":"Phần 2","quote":"CPS, C per sale, tức là hoa hồng dựa trên giá trị đơn hàng thành công"}},{"term":"CPO","aliases":["cost per order"],"lesson":10,"definition":"Hoa hồng tương tự CPS nhưng tính theo số lượng đơn hàng.","source":{"lesson":10,"part":"Phần 2","quote":"Tiếp theo là CPO tương tự CPS tính theo là số lượng đơn hàng"}},{"term":"CPL","aliases":["cost per lead"],"lesson":10,"definition":"Hoa hồng dựa trên số lượng khách hàng tiềm năng.","source":{"lesson":10,"part":"Phần 2","quote":"Tiếp theo là CPL tức là hoa hồng dựa trên số lượng khách hàng tiềm năng"}},{"term":"Xu hướng CLV","aliases":["Content Livestream Video","xu hướng 2026"],"lesson":10,"definition":"Xu hướng Affiliate năm 2026 gồm Content, Livestream, Video. Thành công đến từ nội dung chất lượng, livestream tương tác cao và video ngắn lan tỏa.","source":{"lesson":10,"part":"Phần 2","quote":"Tức là bạn phải làm content, bạn phải livestream và bạn phải có video"}},{"term":"Quy trình 5 bước xử lý đơn","aliases":["xử lý đơn hàng","quy trình vận hành tổng quan","năm bước"],"lesson":11,"definition":"Năm bước: tiếp nhận và xác nhận đơn, chuẩn bị hàng và đóng gói, in và dán vận đơn, bàn giao đơn vị vận chuyển, theo dõi hành trình và hoàn tất đơn hàng.","source":{"lesson":11,"part":"Toàn bài","quote":"Bước thứ nhất là tiếp nhận và xác nhận đơn hàng. Bước thứ hai là chuẩn bị hàng và đóng gói. Bước thứ ba in và dán vận đơn"}},{"term":"Tiêu chuẩn đóng gói","aliases":["đóng gói","băng keo","vận đơn"],"lesson":11,"definition":"Kiện hàng chịu được lực rơi từ độ cao 1 m. Không dán băng keo đè lên mã vận đơn vì gây phản quang. Nên quay video đóng gói và chụp ảnh kiện hàng đã dán vận đơn.","source":{"lesson":11,"part":"Toàn bài","quote":"đảm bảo tiện hàng chịu được lực rơi từ độ cao 1 m mà không hư họng sản phẩm bên trong"}},{"term":"Dữ liệu định danh / hành vi / giao dịch","aliases":["dữ liệu định danh","dữ liệu hành vi","dữ liệu giao dịch","thông tin khách hàng"],"lesson":11,"definition":"Ba nhóm dữ liệu khách hàng: định danh, hành vi và giao dịch. Sàn che thông tin định danh trên vận đơn để bảo vệ quyền riêng tư.","source":{"lesson":11,"part":"Toàn bài","quote":"Nhóm hai là dữ liệu hành vi và nhóm thứ ba là dữ liệu giao dịch"}},{"term":"Masking","aliases":["che thông tin khách hàng","chính sách share thông tin"],"lesson":11,"definition":"Chính sách của sàn che thông tin khách hàng trên vận đơn và hệ thống quản lý đơn hàng để bảo vệ quyền riêng tư. Bản ghi chép viết chữ share.","source":{"lesson":11,"part":"Toàn bài","quote":"áp dụng chính sách share thông tin khách hàng trên vận đơn và trong hệ thống quản lý đơn hàng để bảo vệ quyền riêng tư"}},{"term":"RFM","aliases":["Recency","Frequency","Monetary","nhóm VIP","nhóm nguy cơ","nhóm tiềm năng"],"lesson":11,"definition":"Mô hình phân loại khách hàng. R cho biết mua gần đây hay đã lâu, F cho biết mức độ mua thường xuyên, M cho biết giá trị chi tiêu. Từ đó chia nhóm như VIP, nguy cơ, tiềm năng.","source":{"lesson":11,"part":"Toàn bài","quote":"RFM giúp chúng ta phân loại khách hàng thành từng nhóm để có cách ứng xử phù hợp"}},{"term":"Tỉ lệ chuyển đổi vs tỉ lệ chuyển đổi đơn hàng","aliases":["tỉ lệ chuyển đổi đơn hàng","CR"],"lesson":11,"definition":"Tỉ lệ chuyển đổi đơn hàng: trong 100 người vào shop có bao nhiêu đơn được tạo. Tỉ lệ chuyển đổi: có bao nhiêu sản phẩm được bán trên số người truy cập.","source":{"lesson":11,"part":"Demo Phân tích chỉ số sàn Shopee","quote":"Tỉ lệ chuyển đối đơn hàng cho chúng ta biết rằng trong tổng số 100 người truy cập vào Shopee"}},{"term":"Tỉ lệ thoát trang","aliases":["bounce rate","tỉ lệ thoát"],"lesson":11,"definition":"Tỉ lệ người dùng vào trang sản phẩm rồi thoát ra mà không thực hiện thêm thao tác nào. Giúp đánh giá cách làm thông tin mô tả sản phẩm.","source":{"lesson":11,"part":"Demo Phân tích chỉ số sàn Shopee","quote":"Tỉ lệ thoát trang nghĩa rằng là cho chúng ta biết được rằng là có bao nhiêu nhiều người dùng đã truy cập vào trang sản phẩm mà thoát ra"}},{"term":"Dashboard theo hành trình khách hàng","aliases":["dashboard","bảng theo dõi chỉ số"],"lesson":11,"definition":"Bảng theo dõi chỉ số, chọn chỉ số theo từng giai đoạn hành trình khách hàng. Nên tập trung vào chỉ số mang lại lợi nhuận thực tế.","source":{"lesson":11,"part":"Demo Phân tích chỉ số sàn Shopee","quote":"các nhà bán hàng chúng ta có thể tạo ra một cái dashboard để theo dõi các chỉ số"}},{"term":"5 Whys","aliases":["Five Whys","FW","file wise","kỹ thuật hỏi tại sao"],"lesson":11,"definition":"Kỹ thuật đặt liên tiếp các câu hỏi tại sao để đào sâu tới nguyên nhân gốc rễ, ví dụ tại sao lượt truy cập giảm. Bản ghi chép viết là file wise.","source":{"lesson":11,"part":"Toàn bài","quote":"trên slide gợi ý cho các bạn kỹ thuật file wise để đào sâu vấn đề tận gốc rễ"}},{"term":"Biểu đồ xương cá","aliases":["fishbone","mô hình xương cá"],"lesson":11,"definition":"Mô hình nhìn bao quát mọi nguyên nhân có thể gây lỗi, chia thành năm nhóm chính như sản phẩm, giá, vận hành để rà soát.","source":{"lesson":11,"part":"Toàn bài","quote":"mô hình xương cá giúp chúng ta có cái nhìn bao quát về tất cả những nguyên nhân có thể gây ra lỗi"}},{"term":"Điểm gãy phễu","aliases":["điểm gãy trong phễu","funnel"],"lesson":11,"definition":"Chỗ trong phễu chuyển đổi mà số liệu thực tế lệch so với KPI mục tiêu. Cần nhìn sự tương quan giữa các con số thay vì từng số độc lập.","source":{"lesson":11,"part":"Toàn bài","quote":"cần phải nhận diện được điểm gãy trong phễu"}},{"term":"PDCA","aliases":["Plan Do Check Act","chu trình PDCA"],"lesson":11,"definition":"Chu trình cải tiến liên tục: lập kế hoạch, thực hiện, đo lường, tối ưu. Áp dụng thường xuyên để tối ưu hoạt động kinh doanh trên sàn.","source":{"lesson":11,"part":"Toàn bài","quote":"Chúng ta bắt đầu từ việc lập kế hoạch đến thực hiện các hoạt động thường xuyên đo lường và tiếp tục tối ưu"}},{"term":"GPM","aliases":["GMV per mille"],"lesson":11,"definition":"Chỉ số trên TikTok Shop được nhắc cùng tỉ lệ chuyển đổi và doanh thu khi tóm tắt bài. Ngoài bài giảng: GPM là doanh thu trên một nghìn lượt hiển thị.","source":{"lesson":11,"part":"Toàn bài","quote":"và GPM tỉ lệ chuyển đổi doanh thu AUL trên TikTok Shop"}},{"term":"Sao quả tạ / điểm vi phạm","aliases":["sao quả tả","điểm vi phạm vận hành","hệ thống sao quả tạ"],"lesson":11,"definition":"Hệ thống phạt của sàn: Shopee có sao quả tạ, TikTok Shop có điểm vi phạm vận hành. Chăm sóc kém dẫn đến khiếu nại cao và bị giới hạn số đơn mỗi ngày.","source":{"lesson":11,"part":"Toàn bài","quote":"Nếu như trên shop có hệ thống sao quả tả thì trên TikTok shop cũng có những hệ thống điểm vi phạm vận hành"}},{"term":"NFR","aliases":["Non-fulfillment rate","tỉ lệ đơn hủy do lỗi người bán"],"lesson":11,"definition":"Tỉ lệ đơn hàng không thành công do lỗi từ người bán. Bài giảng nêu chỉ số tỉ lệ đơn hàng bị hủy do lỗi từ người bán nhưng không gọi tên NFR.","source":{"lesson":11,"part":"Toàn bài","quote":"tỉ lệ đơn hàng bị hủy do lỗi từ người bán, tỉ lệ gửi hàng muộn, điểm đánh giá cửa hàng"}},{"term":"Ba giai đoạn CSKH","aliases":["chăm sóc khách hàng","trước khi mua","trong khi mua","sau khi mua"],"lesson":11,"definition":"Trước khi mua: tư vấn bán hàng. Trong khi mua: theo dõi sát trạng thái đơn hàng. Sau khi mua: hướng dẫn sử dụng, kích hoạt bảo hành, xử lý khiếu nại đổi trả.","source":{"lesson":11,"part":"Toàn bài","quote":"Giai đoạn thứ hai là giai đoạn trong khi mua. Ở giai đoạn này, chúng ta sẽ cần theo dõi sát sao trạng thái của đơn hàng"}}],"transcriptChunks":[{"l":6,"p":"Demo Kalodata","t":"Xin chào tất cả các bạn. Ờ giới thiệu với các bạn thì thầy là Nguyễn Phúc Long. Thì hôm nay thì thầy sẽ hướng dẫn các bạn một cái công cụ rất là hay trong cái việc là chúng ta nghiên cứu thị trường trong nội dung khuôn khổ của cái môn học là kinh doanh trên sàn thân mạ điện tử."},{"l":6,"p":"Demo Kalodata","t":"Thì công cụ này thì nó có tên là calodata.com. Thì để sử dụng một công cụ này các bạn sẽ vào cho thầy hướng dẫn đó là calodata.com. Khi mà chúng ta vào cái đường dẫn này xong thì nó sẽ hiển thị ra một cái giao diện như thế này."},{"l":6,"p":"Demo Kalodata","t":"Thì ở đây thì các bạn có thể tiến hành đăng ký tài khoản thì ở phần bên tay phải nó sẽ có một cái phần đó là đăng ký tài khoản và các bạn có thể đăng ký tài khoản bằng cách là sử dụng cái email của mình. Và khi mà chúng ta đăng ký và đăng nhập xong thì nó sẽ hiển thị ra cái giao diện như thế này. Khi mà vào giao diện này xong thì các bạn có thể bấm cho thầy là mình sẽ có cái phần là 7 ngày dụng tiểu miễn phí."},{"l":6,"p":"Demo Kalodata","t":"Thì khi mà chúng ta d sử dụng miễn phí thì phần mềm nó sẽ cung cấp cho chúng ta một số tính năng. Thì dựa vào những cái tính năng này thì một phần nào đấy chúng ta cũng sẽ thực hiện được cái hoạt động đó là nghiên cứu thị trường trong khổ nội dung của môn học. Thì ở đây thầy đã đăng nhập cái tài khoản của mình rồi."},{"l":6,"p":"Demo Kalodata","t":"Thì khi mà các bạn à đăng nhập xong thì các bạn bấm giúp thầy vào cái phần đó là danh mục. Ờ ở cái giao diện của phần danh mục này thì nó sẽ có một cái phần đó là một cái thanh tìm kiếm. Thì ở đây thì các bạn sẽ lựa chọn cho thầy cái lĩnh vực cũng như là cái ngành ngàng mà các bạn đ
