<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ôn tập DOM204</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#eef1f8; --ink:#1a2130; --muted:#556073; --line:#d6dbe7;
  --primary:#2350cf; --primary-ink:#ffffff; --primary-soft:#e5ecff;
  --ok:#157347; --ok-soft:#e1f4e9; --bad:#b3322a; --bad-soft:#fdebe9; --warn:#8a5600; --warn-soft:#fff2d3;
  --mark:#ffe58a; --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.07);
  --radius:12px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141d; --surface:#181e2a; --surface2:#212938; --ink:#e8ecf4; --muted:#a2adc0; --line:#313b4f;
    --primary:#7aa2ff; --primary-ink:#0b1020; --primary-soft:#1d2a4a;
    --ok:#5fd394; --ok-soft:#17352a; --bad:#ff8b80; --bad-soft:#3b1d1b; --warn:#f2c35c; --warn-soft:#3a2f12;
    --mark:#6b5a12; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#181e2a; --surface2:#212938; --ink:#e8ecf4; --muted:#a2adc0; --line:#313b4f;
  --primary:#7aa2ff; --primary-ink:#0b1020; --primary-soft:#1d2a4a;
  --ok:#5fd394; --ok-soft:#17352a; --bad:#ff8b80; --bad-soft:#3b1d1b; --warn:#f2c35c; --warn-soft:#3a2f12;
  --mark:#6b5a12; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font);overflow-x:clip;overflow-wrap:anywhere}
h1,h2,h3,h4{line-height:1.3;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:var(--primary-ink);padding:10px 14px;z-index:100;border-radius:0 0 8px 0}
.skip:focus{left:0}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
main{padding:16px 0 56px}
main:focus,main:focus-visible{outline:none}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;min-height:60px}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px;min-height:44px}
.brand b{background:var(--primary);color:var(--primary-ink);border-radius:8px;padding:2px 8px;font-size:.9rem}
.searchbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface2);color:var(--muted);text-align:left}
.searchbtn span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn kbd{font:600 .75rem var(--font);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--surface);color:var(--muted)}
.icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--surface);border-radius:50%;flex:none}
.icon svg,.searchbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){.searchbtn kbd{display:none}.brand .full{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:16px}
.grid > .card{margin-top:0}
.hello{margin-bottom:16px}
.hello h1{font-size:1.5rem}
.hello p{color:var(--muted);margin-top:4px}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--ok)}
.bar .bad{background:var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;color:var(--muted);font-size:.95rem}
.stats b{color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:12px}
.toggle{display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--primary)}
.grid{display:grid;gap:16px;grid-template-columns:1fr;margin-top:16px}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.lesson{display:flex;flex-direction:column}
.lesson h3{font-size:1.05rem}
.lesson .meta{color:var(--muted);font-size:.92rem;margin:6px 0 10px}
.lesson .row{margin-top:auto;padding-top:14px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.notice{margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.92rem}

/* practice */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.crumbs h2{font-size:1.05rem;flex:1 1 100%;order:3}
@media (min-width:700px){.crumbs h2{flex:1;order:0;min-width:200px}}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-bottom:16px}
.num{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;position:relative}
.num.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.num.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.num.cur{outline:3px solid var(--primary);outline-offset:1px}
.num .m{font-size:.7rem;margin-left:2px}
.qcard.enter{animation:rise .22s ease-out}
.pw{display:flex;flex-direction:column}
@media (max-width:700px){.pw .numgrid{order:3;margin:16px 0 0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.prompt{font-size:1.12rem;font-weight:600;line-height:1.55;outline:none}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;color:var(--ink)}
.opt:hover:not([aria-disabled="true"]){border-color:var(--primary)}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt .lab{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;margin-top:-2px}
.opt.multi .lab{border-radius:8px}
.opt .txt{flex:1}
.opt .mk{flex:none;font-weight:700;min-width:1.2em;text-align:center}
.opt[aria-disabled="true"]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.opt.ok .lab,.opt.ok .mk{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .lab,.opt.bad .mk{color:var(--bad)}
.opt.missed{border-style:dashed}
.hints{margin:12px 0;padding:0;list-style:none;display:grid;gap:8px}
.hints li{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px}
.hints b{color:var(--warn)}
.banner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-weight:700}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.feedback{display:grid;gap:12px;margin-top:6px}
.feedback h3{font-size:.95rem;color:var(--muted);text-transform:none;margin-bottom:2px}
.wrongs{margin:0;padding-left:18px;display:grid;gap:4px}
.quote{margin:0;padding:10px 14px;border-left:4px solid var(--primary);background:var(--primary-soft);border-radius:8px}
.quote small{display:block;color:var(--muted);font-weight:600;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.chip:hover{border-color:var(--primary)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.note{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.note b{color:var(--warn)}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.nav .spacer{flex:1}
.hint-help{color:var(--muted);font-size:.92rem}

/* results / summary */
.score{font-size:2.4rem;font-weight:700;line-height:1.1}
.rl{display:grid;gap:8px;margin:12px 0;padding:0;list-style:none}
.rl li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rl li span.q{flex:1}
.bul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
.term{padding:14px 0;border-top:1px solid var(--line)}
.term:first-of-type{border-top:0}
.term h4{font-size:1rem}
.formula{margin:8px 0 0;padding:8px 12px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font:600 .92rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.src{display:block;color:var(--muted);font-size:.85rem;margin-top:6px}
.sec{margin-top:18px}
.sec h3{font-size:1.05rem;margin-bottom:6px}

/* panel */
.backdrop{position:fixed;inset:0;background:rgba(8,12,24,.45);z-index:40;display:none}
.panel{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);color:var(--ink);box-shadow:-8px 0 30px rgba(0,0,0,.18);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
.panel.open{transform:none;visibility:visible;transition:transform .2s ease,visibility 0s}
@media (max-width:760px){
  .backdrop.show{display:block}
  .panel{top:auto;left:0;right:0;width:auto;height:84vh;max-height:84vh;border-radius:18px 18px 0 0;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
}
.panel-head{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sfield{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface2)}
.sfield svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.sfield input{flex:1;min-width:0;border:0;background:transparent;outline:none;min-height:42px}
.sfield:focus-within{border-color:var(--primary)}
.lf{padding:10px 16px 0}
.lf .chip{min-height:44px;padding:0 12px}
.panel-body{flex:1;overflow:auto;padding:12px 16px 24px}
.grp{margin-top:14px}
.grp h3{font-size:.95rem;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center}
.res{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.res p{margin-top:6px;font-size:.95rem}
.res .row{margin-top:8px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);padding:8px 0}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(8,12,24,.5);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:420px;width:100%}
.modal p{margin:8px 0 16px}
footer{color:var(--muted);font-size:.88rem;padding:8px 0 40px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

</div>

<script>
const DATA = {"lessons":[{"id":6,"title":"Bài 6: Xây dựng và tối ưu sản phẩm trên sàn TMĐT","summary":["Đăng sản phẩm trên Shopee gồm 5 bước: hình ảnh, thông tin sản phẩm, giá và kho hàng, đơn vị vận chuyển, hoàn tất đăng tải.","Tiêu đề không viết hoa toàn bộ, không có đánh giá chủ quan, khuyến mãi, ký tự đặc biệt và không lặp từ khóa.","Tiêu đề chuẩn SEO gồm từ khóa chính, thương hiệu, thuộc tính và từ khóa mô tả sản phẩm tốt.","Ảnh bìa tốt hình ảnh hóa đặc điểm nổi bật, tạo ấn tượng trong 1 giây, dễ nhìn dễ đọc và tối đa ba màu.","Ảnh sản phẩm dùng tỉ lệ 1:1, không để số điện thoại, website, địa chỉ, nên có logo và theo cấu trúc 5 loại ảnh.","Mô tả 3 đến 5 dòng thông tin quan trọng nhất, chia đoạn, thêm 3 đến 5 hashtag, xu hướng dùng ảnh nhiều hơn chữ.","Tránh lỗi tăng giá bất hợp lý trước khuyến mãi và các nhóm vi phạm về sản phẩm cấm, hàng giả, spam và gian lận.","Seeding tăng độ tin cậy, tỉ lệ chuyển đổi và hiển thị, nhưng hành vi gian lận có thể bị khóa vĩnh viễn."],"questions":[{"id":"q6-1","n":1,"type":"single","prompt":"Việc viết tiêu đề sản phẩm bằng chữ IN HOA toàn bộ có thể gây ra hệ quả gì trong vận hành trên Shopee?","options":[{"id":"A","text":"Giúp tăng độ tin cậy với khách hàng"},{"id":"B","text":"Giúp sản phẩm nổi bật hơn và tăng tỷ lệ click"},{"id":"C","text":"Bị hệ thống đánh giá là spam và có thể giảm hiển thị"},{"id":"D","text":"Không ảnh hưởng vì chỉ là yếu tố hình thức"}],"answer":["C"],"confidence":"medium","hints":["Nghĩ về quy định đặt tên sản phẩm của Shopee, đặc biệt là cách viết hoa.","Shopee yêu cầu không viết hoa tất cả chữ cái trong tiêu đề, trừ tên thương hiệu.","Loại {B} và {A}: chữ IN HOA không giúp tăng click hay tăng độ tin cậy, mà là lỗi vi phạm quy định."],"explanation":"Bài giảng nêu viết hoa toàn bộ tiêu đề là lỗi không được phép. Việc bị đánh giá là spam và giảm hiển thị là suy ra hợp lý từ việc vi phạm quy định tiêu đề.","whyWrong":{"A":"Bài giảng xếp viết hoa toàn bộ vào lỗi không được phép, không phải yếu tố tạo tin cậy.","B":"Không có căn cứ cho việc IN HOA giúp tăng click. Đây là lỗi bị cấm.","D":"Đây là quy định bắt buộc nên không chỉ là yếu tố hình thức."},"source":{"lesson":6,"part":"Phần 1","quote":"lỗi viết hoa toàn bộ cái phần tiêu đề. Thì đây là một cái lỗi không được phép"},"keywords":["tiêu đề","viết hoa","SEO"],"note":"Transcript không dùng chữ 'spam' cho lỗi IN HOA, chữ 'spam' chỉ xuất hiện với lỗi lặp từ khóa trong tiêu đề. Đáp án C là phương án hợp lý nhất trong các lựa chọn."},{"id":"q6-2","n":2,"type":"single","prompt":"Vai trò của hashtag trong mô tả sản phẩm trên Shopee được hiểu đúng là gì?","options":[{"id":"A","text":"Rất quan trọng như TikTok"},{"id":"B","text":"Quyết định khả năng hiển thị sản phẩm"},{"id":"C","text":"Bắt buộc phải có nhiều hashtag"},{"id":"D","text":"Không ảnh hưởng nhiều đến hành vi tìm kiếm"}],"answer":["D"],"confidence":"medium","hints":["Hãy nhớ lại phần mô tả sản phẩm và vai trò của hashtag trong đó.","Bài giảng khuyên thêm vài hashtag liên quan, và nói hashtag chỉ giúp Shopee phần nào hiểu sản phẩm thuộc loại gì.","Loại {C}: bài giảng chỉ gợi ý 3 đến 5 hashtag, không bắt buộc nhiều. Loại {A} và {B}: bài giảng không so sánh với TikTok và không nói hashtag quyết định hiển thị."],"explanation":"Hashtag là yếu tố bổ trợ giúp Shopee hiểu sản phẩm thuộc loại gì, chỉ nên dùng 3 đến 5 từ liên quan nhất. Bài giảng không nói hashtag quyết định khả năng hiển thị.","whyWrong":{"A":"Bài giảng không so sánh hashtag trên Shopee với TikTok và không gọi là rất quan trọng.","B":"Không có căn cứ cho việc hashtag quyết định khả năng hiển thị.","C":"Bài giảng chỉ gợi ý 3 đến 5 hashtag liên quan, không bắt buộc nhiều."},"source":{"lesson":6,"part":"Phần 2","quote":"một số hashtag đó từ 3 cho 5 hashtag là những cái từ mà liên quan nhất đến cái sản phẩm này"},"keywords":["hashtag","mô tả sản phẩm"],"note":"Bài giảng nói hashtag giúp Shopee phần nào hiểu loại sản phẩm, nên đáp án D (không ảnh hưởng nhiều) không khớp hoàn toàn nhưng là phương án ít mâu thuẫn nhất. Các phương án A, B, C đều trái với bài giảng. Cần đối chiếu đáp án chính thức."},{"id":"q6-3","n":3,"type":"single","prompt":"Hành vi tăng giá trước khi giảm giá để tạo cảm giác khuyến mãi sâu có thể dẫn đến hậu quả gì?","options":[{"id":"A","text":"Tăng uy tín với khách hàng"},{"id":"B","text":"Bị Shopee hạn chế hiển thị hoặc xử phạt"},{"id":"C","text":"Không bị phát hiện"},{"id":"D","text":"Tăng tỷ lệ chuyển đổi"}],"answer":["B"],"confidence":"medium","hints":["Liên hệ với nhóm lỗi vi phạm khi đăng sản phẩm mà bài giảng đã liệt kê.","Tăng giá bán bất hợp lý trước khuyến mãi là một lỗi vi phạm. Cách tránh là chỉnh giá khuyến mãi, không chỉnh giá gốc.","Loại {A}, {C} và {D}: đây là hành vi vi phạm nên không tạo uy tín và không phải cách tăng chuyển đổi hợp lệ."],"explanation":"Bài giảng xếp tăng giá bán bất hợp lý trước khuyến mãi vào các lỗi khi đăng sản phẩm và hướng dẫn cách tránh. Hậu quả hạn chế hiển thị hoặc xử phạt là suy ra từ việc đây là lỗi vi phạm.","whyWrong":{"A":"Đây là lỗi vi phạm, không tạo uy tín cho shop.","C":"Bài giảng coi đây là lỗi cần tránh, không phải hành vi an toàn.","D":"Đây không phải cách tăng chuyển đổi hợp lệ vì là lỗi bị xử lý."},"source":{"lesson":6,"part":"Phần 2","quote":"Lỗi đầu tiên là lỗi tăng giá bán bất hợp lý trước khuyến mãi"},"keywords":["tăng giá","khuyến mãi","vi phạm"],"note":"Transcript nêu đây là lỗi vi phạm và cách tránh, nhưng không nêu rõ mức xử phạt cho riêng lỗi này. Hậu quả hạn chế hiển thị hoặc xử phạt là suy ra."},{"id":"q6-4","n":4,"type":"single","prompt":"Trong quy trình đăng sản phẩm trên Shopee, yếu tố nào tạo ra sự khác biệt lớn nhất giữa người bán hiệu quả và không hiệu quả?","options":[{"id":"A","text":"Cập nhật tồn kho chính xác"},{"id":"B","text":"Hoàn tất đầy đủ các bước đăng bài"},{"id":"C","text":"Tối ưu tiêu đề và thông tin sản phẩm"},{"id":"D","text":"Chọn đơn vị vận chuyển phù hợp"}],"answer":["C"],"confidence":"medium","hints":["Nhớ lại mục tiêu của Bài 6: vai trò của việc tối ưu nội dung.","Bài giảng nhấn mạnh tối ưu tiêu đề, ảnh và thông tin sản phẩm để tăng hiển thị và chuyển đổi.","Loại {B}: mọi người bán đều phải hoàn tất các bước đăng bài nên không tạo khác biệt. Loại {D}: chọn vận chuyển chỉ là khai báo cân nặng, kích thước."],"explanation":"Bài 6 tập trung vào tối ưu nội dung sản phẩm gồm tiêu đề, ảnh và mô tả để tăng hiển thị và chuyển đổi. Các bước đăng bài, tồn kho và vận chuyển là thao tác cơ bản.","whyWrong":{"A":"Tồn kho là thông tin cơ bản phải điền, không phải trọng tâm tối ưu của bài.","B":"Mọi người bán đều phải hoàn tất các bước, nên đây không phải điểm khác biệt.","D":"Vận chuyển chỉ là khai báo cân nặng và kích thước gói hàng."},"source":{"lesson":6,"part":"Phần 1","quote":"vai trò của việc tối ưu nội dung sản phẩm trên sàn thương mại điện tử"},"keywords":["tối ưu sản phẩm","tiêu đề"],"note":"Transcript không nêu thẳng yếu tố 'khác biệt lớn nhất'. Đáp án C suy ra từ trọng tâm tối ưu nội dung của cả bài."},{"id":"q6-5","n":5,"type":"single","prompt":"Hoạt động seeding sản phẩm trên sàn TMĐT có vai trò quan trọng nhất là gì?","options":[{"id":"A","text":"Tăng tỷ lệ sử dụng mã giảm giá"},{"id":"B","text":"Tăng giá trị đơn hàng"},{"id":"C","text":"Tạo độ tin cậy và cải thiện tỷ lệ chuyển đổi"},{"id":"D","text":"Không ảnh hưởng đến quyết định mua"}],"answer":["C"],"confidence":"high","hints":["Seeding liên quan đến những đơn hàng và đánh giá ban đầu của sản phẩm mới.","Khách hàng thường dựa vào đánh giá và số lượng đã bán để quyết định mua.","Loại {D}: bài giảng nói seeding giúp khách dễ ra quyết định mua. Loại {A} và {B}: seeding không nhằm tăng mã giảm giá hay giá trị đơn."],"explanation":"Seeding tạo đơn và đánh giá ban đầu để xây dựng độ tin cậy, từ đó tăng tỷ lệ chuyển đổi và cải thiện khả năng hiển thị.","whyWrong":{"A":"Seeding không liên quan đến việc dùng mã giảm giá, bài giảng còn cảnh báo không lợi dụng mã.","B":"Bài giảng không nêu seeding để tăng giá trị đơn hàng.","D":"Bài giảng nêu seeding làm khách dễ ra quyết định mua hơn."},"source":{"lesson":6,"part":"Phần 2","quote":"chỉ thường dựa và đánh giá và cái số lượng đã bán để quyết định có mua sản phẩm hay không"},"keywords":["seeding","độ tin cậy","tỉ lệ chuyển đổi"],"note":""},{"id":"q6-6","n":6,"type":"single","prompt":"Theo quy định của Shopee, ảnh sản phẩm KHÔNG nên chứa nội dung nào sau đây?","options":[{"id":"A","text":"Số điện thoại hoặc website"},{"id":"B","text":"Logo thương hiệu"},{"id":"C","text":"Hình ảnh sản phẩm"},{"id":"D","text":"Bối cảnh sử dụng sản phẩm"}],"answer":["A"],"confidence":"high","hints":["Nghĩ về thông tin liên lạc mà người bán hay vô tình để trên ảnh sản phẩm.","Shopee coi việc đưa thông tin liên lạc vào ảnh là lỗi vi phạm, có thể bị phạt hoặc khóa shop.","Loại {C} và {D}: hình sản phẩm và bối cảnh sử dụng là nội dung nên có. Loại {B}: bài giảng khuyến khích đặt logo để bảo vệ bản quyền ảnh."],"explanation":"Bài giảng nêu không để số điện thoại, website, địa chỉ hoặc bất cứ thông tin liên lạc nào trên ảnh. Vi phạm có thể bị phạt hoặc khóa shop.","whyWrong":{"B":"Bài giảng nên để logo vào ảnh để bảo vệ bản quyền.","C":"Hình ảnh sản phẩm là nội dung cần có.","D":"Bối cảnh sử dụng giúp thể hiện ứng dụng thực tế, được khuyến khích."},"source":{"lesson":6,"part":"Phần 2","quote":"không để bất cứ những thông tin liên lạc nào vào trên ảnh"},"keywords":["ảnh sản phẩm","số điện thoại","logo"],"note":""},{"id":"q6-7","n":7,"type":"single","prompt":"Khái niệm \"hình ảnh hóa tính năng sản phẩm\" được hiểu đúng là gì?","options":[{"id":"A","text":"Sử dụng template có sẵn để làm ảnh"},{"id":"B","text":"Dùng icon minh họa"},{"id":"C","text":"Viết mô tả tính năng bằng chữ"},{"id":"D","text":"Dùng hình ảnh để thể hiện trực tiếp công dụng sản phẩm"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại tiêu chí đầu tiên của một ảnh bìa tốt.","Trong môi trường online khách không cầm nắm được sản phẩm nên cần hình dung ngay đặc điểm nổi bật qua hình ảnh.","Loại {A}, {B}, {C}: template, icon hay chữ mô tả đều không phải là thể hiện trực tiếp công dụng bằng hình ảnh."],"explanation":"Hình ảnh hóa tính năng là dùng hình ảnh để thể hiện trực tiếp đặc điểm nổi bật và công dụng, giúp khách dễ hình dung sản phẩm.","whyWrong":{"A":"Template có sẵn không nói gì về cách thể hiện công dụng.","B":"Icon minh họa không phải là thể hiện trực tiếp công dụng.","C":"Viết bằng chữ ngược với ý hình ảnh hóa."},"source":{"lesson":6,"part":"Phần 1","quote":"hình ảnh hóa được cái đặc điểm nổi bật của sản phẩm"},"keywords":["ảnh bìa","đặc điểm nổi bật"],"note":""},{"id":"q6-8","n":8,"type":"single","prompt":"Trong môi trường cạnh tranh cao như Shopee, việc sử dụng hình ảnh tương tự đối thủ nhưng chỉ đẹp hơn một chút có đủ để tạo lợi thế không?","options":[{"id":"A","text":"Có, vì đẹp là đủ"},{"id":"B","text":"Có, nếu giá rẻ"},{"id":"C","text":"Không, vì cần sự khác biệt rõ ràng để thu hút"},{"id":"D","text":"Không ảnh hưởng"}],"answer":["C"],"confidence":"high","hints":["Hãy nghĩ cách một ảnh bìa khiến khách dừng lại giữa rất nhiều sản phẩm.","Khi lướt, khách chỉ dừng lại ở những ảnh nổi bật.","Loại {A}, {B}, {D}: đẹp hơn một chút hay giá rẻ không thay cho sự khác biệt rõ ràng."],"explanation":"Khách lướt nhiều ảnh cùng lúc nên chỉ ảnh nổi bật và khác biệt mới khiến họ dừng lại. Ảnh chỉ đẹp hơn một chút chưa tạo khác biệt rõ.","whyWrong":{"A":"Đẹp hơn một chút chưa đủ nổi bật và khác biệt.","B":"Bài giảng không nói giá rẻ bù được cho ảnh giống đối thủ.","D":"Có ảnh hưởng, vì ảnh bìa quyết định khách có bấm xem hay không."},"source":{"lesson":6,"part":"Phần 1","quote":"chỉ có những cái ảnh nổi bật và khác biệt thì mới khiến họ dừng lại thôi"},"keywords":["ảnh bìa","khác biệt"],"note":""},{"id":"q6-9","n":9,"type":"single","prompt":"Các yếu tố cần có khi tối ưu tiêu đề sản phẩm?","options":[{"id":"A","text":"Viết càng dài càng tốt"},{"id":"B","text":"Lặp lại từ khóa chính nhiều lần để hỗ trợ SEO tốt hơn"},{"id":"C","text":"Viết càng ngắn càng tốt"},{"id":"D","text":"Có cấu trúc rõ ràng và dễ hiểu"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại các nguyên tắc đặt tiêu đề và SEO trong Bài 6.","Tiêu đề cần cấu trúc hợp lý, có từ khóa chính, thương hiệu và thuộc tính, đồng thời tránh lặp từ khóa.","Loại {B}: lặp từ khóa bị tính là spam. Loại {A} và {C}: bài giảng không đặt tiêu chí dài hay ngắn."],"explanation":"Tiêu đề cần cấu trúc rõ ràng, dễ hiểu, gồm từ khóa chính, thương hiệu và thuộc tính. Lặp từ khóa bị đánh giá là spam.","whyWrong":{"A":"Bài giảng không yêu cầu viết càng dài càng tốt.","B":"Lặp từ khóa là lỗi spam từ khóa.","C":"Bài giảng không yêu cầu viết ngắn, mà cần đủ các thành phần."},"source":{"lesson":6,"part":"Phần 1","quote":"đặt theo một cái cấu trúc hợp lý không viết hoa tất cả các chữ cái trừ tên thương hiệu"},"keywords":["tiêu đề","cấu trúc","spam từ khóa"],"note":""},{"id":"q6-10","n":10,"type":"single","prompt":"Trong bối cảnh kinh doanh trên Shopee, tại sao trang sản phẩm lại được xem là yếu tố quyết định đến việc khách hàng có mua hàng hay không?","options":[{"id":"A","text":"Vì đây là nơi để tăng số lượng tồn kho"},{"id":"B","text":"Vì đây là nơi lưu trữ thông tin sản phẩm"},{"id":"C","text":"Vì đây là điểm khách hàng trực tiếp xem và đưa ra quyết định mua"},{"id":"D","text":"Vì đây là nơi để đăng càng nhiều sản phẩm càng tốt"}],"answer":["C"],"confidence":"medium","hints":["Nghĩ về nơi khách hàng xem sản phẩm trước khi bấm mua.","Bài giảng nhấn mạnh ảnh bìa và tiêu đề quyết định việc khách có bấm vào xem sản phẩm hay không.","Loại {A}, {B}, {D}: tồn kho, lưu trữ thông tin và số lượng sản phẩm không phải lý do quyết định mua."],"explanation":"Khách hàng chỉ thấy tiêu đề, ảnh bìa và giá khi tìm kiếm, rồi vào trang sản phẩm để quyết định mua. Trang sản phẩm là điểm khách trực tiếp xem.","whyWrong":{"A":"Tồn kho không phải lý do khách quyết định mua.","B":"Lưu trữ thông tin chỉ là một chức năng, chưa giải thích vì sao quyết định mua.","D":"Đăng nhiều sản phẩm không phải mục tiêu của trang sản phẩm."},"source":{"lesson":6,"part":"Phần 1","quote":"gần như là rất là quyết định khi mà khách hàng đưa ra quyết định là có bấm vào cái xem cái sản phẩm"},"keywords":["ảnh bìa","trang sản phẩm"],"note":"Transcript nói ảnh bìa gần như quyết định việc khách bấm vào xem sản phẩm. Câu 'trang sản phẩm quyết định việc mua' là suy ra, không nói thẳng."},{"id":"q6-11","n":11,"type":"single","prompt":"Trong hành vi người dùng Shopee, tại sao ảnh bìa sản phẩm cần tạo ấn tượng ngay trong 1 giây đầu tiên?","options":[{"id":"A","text":"Vì khách hàng lướt rất nhanh và chỉ dừng lại khi thấy nổi bật"},{"id":"B","text":"Vì Shopee ưu tiên ảnh có nhiều chữ"},{"id":"C","text":"Vì ảnh càng phức tạp càng thu hút"},{"id":"D","text":"Vì khách hàng đọc hết nội dung ảnh"}],"answer":["A"],"confidence":"high","hints":["Nghĩ về cách khách hàng duyệt trang kết quả tìm kiếm.","Khách thấy nhiều ảnh cùng lúc và chỉ dừng lại khi một ảnh nổi bật.","Loại {B}, {C}, {D}: ảnh nhiều chữ hay phức tạp khó đọc trên điện thoại, và khách không đọc hết nội dung ảnh."],"explanation":"Khách lướt nhiều ảnh sản phẩm cùng lúc nên chỉ ảnh nổi bật mới khiến họ dừng lại. Vì vậy ảnh bìa cần tạo ấn tượng trong 1 giây.","whyWrong":{"B":"Bài giảng không nói Shopee ưu tiên ảnh nhiều chữ, ảnh nhiều chữ nhỏ còn khó đọc.","C":"Ảnh phức tạp gây khó nhìn, ảnh bìa nên đơn giản và tối đa ba màu.","D":"Khách chỉ lướt nhanh, không đọc hết nội dung ảnh."},"source":{"lesson":6,"part":"Phần 1","quote":"cần phải tạo được cái ấn tượng cho khách hàng trong 1 giây thôi"},"keywords":["ảnh bìa","1 giây"],"note":""},{"id":"q6-12","n":12,"type":"single","prompt":"Trong phần mô tả sản phẩm, tại sao 3-5 dòng đầu tiên lại được xem là quan trọng nhất?","options":[{"id":"A","text":"Vì giúp giảm chi phí vận hành"},{"id":"B","text":"Vì giúp tăng độ dài bài viết"},{"id":"C","text":"Vì Shopee yêu cầu bắt buộc"},{"id":"D","text":"Vì khách hàng thường chỉ đọc phần đầu"}],"answer":["D"],"confidence":"medium","hints":["Nghĩ về hành vi đọc của khách hàng với phần mô tả dài.","Bài giảng nói khách hàng ngà ường là những cái từ khóa chính này sẽ chính là cái tên sản phẩm luôn"},"keywords":["SEO","từ khóa chính","thuộc tính"],"note":""},{"id":"q6-14","n":14,"type":"single","prompt":"Xu hướng hiện nay trong phần mô tả sản phẩm trên Shopee đang thay đổi theo hướng nào?","options":[{"id":"A","text":"Tăng lượng chữ trong mô tả"},{"id":"B","text":"Chỉ sử dụng văn bản thuần túy"},{"id":"C","text":"Bỏ hoàn toàn phần mô tả"},{"id":"D","text":"Tăng sử dụng hình ảnh trong mô tả để dễ hiểu hơn"}],"answer":["D"],"confidence":"high","hints":["Nghĩ về hành vi khách hàng hiện nay với đoạn văn dài.","Bài giảng nói về cách khách hàng ngày càng ngại đọc nhiều chữ và xu hướng thay đổi của phần mô tả.","Loại {A}, {B}, {C}: tăng chữ, chỉ dùng văn bản hay bỏ mô tả đều trái với xu hướng."],"explanation":"Phần mô tả đang chuyển dần sang dùng ảnh nhiều hơn chữ để khách bỏ ít công sức nhất mà vẫn hiểu sản phẩm.","whyWrong":{"A":"Xu hướng là ít chữ hơn, không phải tăng chữ.","B":"Bài giảng nói dùng ảnh nhiều hơn chữ.","C":"Bài giảng vẫn yêu cầu tối ưu phần mô tả."},"source":{"lesson":6,"part":"Phần 2","quote":"cái phần mô tả thì sẽ sử dụng cái ảnh nhiều hơn là sử dụng chữ"},"keywords":["mô tả sản phẩm","xu hướng"],"note":""},{"id":"q6-15","n":15,"type":"single","prompt":"Một lỗi phổ biến khiến ảnh sản phẩm bị người dùng bỏ qua là gì?","options":[{"id":"A","text":"Có mô tả các chương trình marketing trên ảnh"},{"id":"B","text":"Màu sắc đơn giản"},{"id":"C","text":"Sử dụng nền trắng"},{"id":"D","text":"Quá nhiều chữ nhỏ, khó đọc trên điện thoại"}],"answer":["D"],"confidence":"high","hints":["Nghĩ về việc khách xem ảnh sản phẩm trên điện thoại.","Điện thoại có màn hình nhỏ nên chữ nhiều và nhỏ sẽ không đọc được.","Loại {B} và {C}: màu đơn giản và nền trắng không phải lỗi. Loại {A}: bài giảng không nhắc đến lỗi này."],"explanation":"Ảnh có quá nhiều chữ nhỏ sẽ không đọc được trên điện thoại, nên khách bỏ qua. Bài giảng khuyên ảnh bìa nên đơn giản, tối đa ba màu.","whyWrong":{"A":"Bài giảng không nêu chương trình vẫn tồn tại và vẫn hiển thị hiệu ứng giảm giá. Loại {B}: bài giảng không nêu lý do giá cao."],"explanation":"Khách hàng hiện nay thông minh nên hiệu ứng giảm giá của chương trình không tác động nhiều tới quyết định mua.","whyWrong":{"A":"Chương trình vẫn đang được Shopee cung cấp.","B":"Bài giảng không nói giá sản phẩm trên sàn tăng.","D":"Sản phẩm vẫn hiện giá gạch và nhãn giảm giá."},"source":{"lesson":7,"part":"Phần 1","quote":"nó cũng không tác động quá nhiều tới cái quyết định mua của khách hàng"},"keywords":["khuyến mãi của shop","quyết định mua"],"note":"Transcript nói khách hàng thông minh và hiệu ứng giảm giá không tác động nhiều tới quyết định mua. Cụm 'không còn tin' và 'hiển thị cho đẹp' là cách diễn đạt của đề, ý khớp nhưng không trùng chữ."},{"id":"q7-12","n":12,"type":"single","prompt":"Vì sao các công cụ marketing nội sàn nên được sử dụng kết hợp thay vì sử dụng riêng lẻ từng công cụ?","options":[{"id":"A","text":"Vì sử dụng một công cụ sẽ không được hiển thị trên sàn"},{"id":"B","text":"Vì hệ thống Shopee yêu cầu người bán phải sử dụng nhiều công cụ cùng lúc"},{"id":"C","text":"Vì khi kết hợp nhiều công cụ thì sẽ luôn giảm chi phí marketing"},{"id":"D","text":"Vì mỗi công cụ chỉ tác động đến một phần trong hành trình mua hàng của khách"}],"answer":["D"],"confidence":"high","hints":["Nghĩ về hành trình mua hàng gồm nhiều giai đoạn.","Mỗi công cụ marketing nội sàn đảm nhận một vai trò khác nhau, ví dụ quảng cáo đưa khách đến trang sản phẩm.","Loại {A} và {B}: không có quy định bắt buộc hay hạn chế hiển thị. Loại {C}: bài giảng không nói kết hợp công cụ sẽ giảm chi phí."],"explanation":"Quảng cáo đưa khách đến trang sản phẩm, Flash Sale và mã giảm giá thúc đẩy quyết định mua, combo tăng giá trị đơn hàng. Mỗi công cụ chỉ phụ trách một phần hành trình.","whyWrong":{"A":"Dùng một công cụ vẫn hiển thị được trên sàn.","B":"Bài giảng không nói Shopee bắt buộc dùng nhiều công cụ cùng lúc.","C":"Bài giảng không nói kết hợp công cụ sẽ giảm chi phí marketing."},"source":{"lesson":7,"part":"Phần 2","quote":"nhằm tác động đến những cái yếu tố trong hành trình mua hàng của khách hàng"},"keywords":["hành trình mua hàng","marketing nội sàn"],"note":""},{"id":"q7-13","n":13,"type":"single","prompt":"Nếu shop tạo combo gồm các sản phẩm không liên quan đến nhau, điều gì dễ xảy ra?","options":[{"id":"A","text":"Khách hàng sẽ mua nhiều hơn vì có giảm giá"},{"id":"B","text":"Khách hàng khó ra quyết định mua vì combo không phù hợp nhu cầu thực tế"},{"id":"C","text":"Không ảnh hưởng đến quyết định mua"},{"id":"D","text":"Khách hàng dễ bị thu hút bởi số lượng sản phẩm"}],"answer":["B"],"confidence":"medium","hints":["Nhớ lại nguyên tắc chọn sản phẩm đưa vào combo khuyến mãi.","Combo thường áp dụng cho các sản phẩm có liên quan hoặc dùng cùng nhau.","Loại {A}, {C}, {D}: bài giảng không cho rằng sản phẩm rời rạc làm khách mua nhiều hơn hay không ảnh hưởng gì."],"explanation":"Combo nên gồm sản phẩm có liên hệ về nhu cầu hoặc công năng. Nếu không liên quan, combo khó phù hợp nhu cầu thực tế nên khách khó quyết định.","whyWrong":{"A":"Bài giảng không nói giảm giá bù được cho combo không liên quan.","C":"Combo không phù hợp có thể ảnh hưởng quyết định mua.","D":"Số lượng sản phẩm không phải yếu tố thu hút theo bài giảng."},"source":{"lesson":7,"part":"Phần 1","quote":"chúng ta nên lựa chọn các sản phẩm có mối liên hệ và về nhu cầu hoặc công năng sử dụng"},"keywords":["combo","công năng"],"note":"Transcript nêu nên chọn sản phẩm có liên hệ về nhu cầu hoặc công năng, nhưng không nêu thẳng hậu quả khi gộp sản phẩm không liên quan. Đáp án B suy ra từ nguyên tắc này."},{"id":"q7-14","n":14,"type":"single","prompt":"Trong kinh doanh trên sàn TMĐT, tại sao các shop cần sử dụng các công cụ marketing nội sàn thay vì chỉ đăng sản phẩm?","options":[{"id":"A","text":"Vì sàn thương mại điện tử bắt buộc người bán phải sử dụng các công cụ marketing"},{"id":"B","text":"Vì sử dụng marketing giúp giảm toàn bộ chi phí vận hành của gian hàng"},{"id":"C","text":"Vì giúp gian hàng có thể đăng được nhiều sản phẩm hơn"},{"id":"D","text":"Vì chỉ đăng sản phẩm là chưa đủ để tạo ra đơn hàng ổn định và tăng trưởng doanh thu"}],"answer":["D"],"confidence":"medium","hints":["Nghĩ về những gì một sản phẩm mới đăng còn thiếu để có đơn đều đặn.","Công cụ marketing nội sàn tác động đến traffic, chuyển đổi và giá trị đơn hàng.","Loại {A}, {B}, {C}: bài giảng không nêu việc bắt buộc, giảm toàn bộ chi phí hay tăng số sản phẩm được đăng."],"explanation":"Marketing nội sàn giúp tăng traffic, chuyển đổi và giá trị đơn hàng, là phần mà việc đăng sản phẩm đơn thuần không tạo ra.","whyWrong":{"A":"Bài giảng không nói sàn bắt buộc người bán dùng công cụ marketing.","B":"Marketing có chi phí, không giảm toàn bộ chi phí vận hành.","C":"Công cụ marketing không liên quan đến số sản phẩm được đăng."},"source":{"lesson":7,"part":"Phần 2","quote":"vừa tăng traffic vừa vừa tăng chuyển đổi đồng thời lại vừa tăng cái giá trị đơn hàng"},"keywords":["marketing nội sàn","GMV"],"note":"Transcript không nêu thẳng câu 'chỉ đăng sản phẩm là chưa đủ'. Đáp án D suy ra từ vai trò của các công cụ marketing nội sàn đối với traffic, chuyển đổi và giá trị đơn hàng."},{"id":"q7-15","n":15,"type":"single","prompt":"Để chương trình \"mua kèm deal sốc\" hoạt động hiệu quả, sản phẩm mua kèm nên có đặc điểm gì?","options":[{"id":"A","text":"Là sản phẩm bất kỳ trong gian hàng"},{"id":"B","text":"Có giá hợp lý và mang tính bổ trợ cho sản phẩm chính"},{"id":"C","text":"Không cần liên quan đến sản phẩm chính"},{"id":"D","text":"Có giá cao để tăng doanh thu"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại lưu ý khi chọn sản phẩm mua kèm.","Sản phẩm mua kèm nên bổ trợ cho sản phẩm chính và có chi phí hợp lý.","Loại {A} và {C}: không phải sản phẩm nào cũng phù hợp. Loại {D}: giá cao không khuyến khích mua thêm."],"explanation":"Sản phẩm mua kèm nên liên quan hoặc bổ trợ cho sản phẩm chính, có giá trị thấp hoặc chi phí hợp lý để khuyến khích khách mua thêm.","whyWrong":{"A":"Cần chọn sản phẩm có liên quan, không phải sản phẩm bất kỳ.","C":"Bài giảng yêu cầu sản phẩm liên quan hoặc bổ trợ.","D":"Nên có giá trị thấp hoặc hợp lý, không phải giá cao."},"source":{"lesson":7,"part":"Phần 1","quote":"nên lựa chọn những sản phẩm có liên quan hoặc là bổ trợ cho sản phẩm chính"},"keywords":["mua kèm deal sốc","bổ trợ"],"note":""}]},{"id":8,"title":"Bài 8: Quảng cáo trả phí trên sàn TMĐT","summary":["Shopee là nền tảng người tìm hàng, TikTok Shop là hàng tìm người dựa trên sở thích.","Shopee Ads tính phí chủ yếu theo CPC, có thể tiêu hết ngân sách rất nhanh. Xếp hạng dựa vào giá thầu, điểm liên quan và hiệu suất.","Giá thầu khoán cho người mới: giá bán x %QC dự kiến x %CVR dự kiến, với giả định 20% và 2% thì bằng giá bán x 0.4%.","Đọc báo cáo qua chi phí, doanh thu và ROAS, cùng CTR và CPC thực tế.","TikTok Ads gồm In-Feed, Take over, Hashtag Challenge, Branded Effect. Nội dung quảng cáo đang bão hòa nên cần chú trọng chất lượng.","GMV Max là quảng cáo tự động dùng AI, học từ tín hiệu quảng cáo, Affiliate và Organic, learning phase thường lên tới 7 ngày.","Video trong GMV Max có các trạng thái đang chờ, đang học, đang phân phối, không phân phối. Video phân phối thì giữ, không phân phối thì thay.","ROI mục tiêu nên đặt trong một khoảng hợp lý. Đặt quá cao thì quảng cáo khó phân phối."],"questions":[{"id":"q8-1","n":1,"type":"single","prompt":"Khái niệm định giá giá trị khách hàng (Value-based) theo xu hướng mới có nghĩa là gì?","options":[{"id":"A","text":"Người bán chỉ cần tập trung vào lượt xem thay vì giá trị đơn"},{"id":"B","text":"Hệ thống chia khách hàng thành các nhóm giá trị, ưu tiên nhóm có khả năng mua hàng với giá trị cao"},{"id":"C","text":"Mọi khách hàng đều được hệ thống đối xử như nhau"},{"id":"D","text":"Sàn sẽ ép giá CPC xuống mức thấp nhất cho tất cả nhà bán"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại khái niệm value based optimization của TikTok.","Thay vì chỉ tìm thật nhiều người mua, hệ thống còn xét giá trị mà mỗi nhóm khách có thể mang lại.","Loại {C}: hệ thống không đối xử như nhau. Loại {A} và {D}: bài giảng không nói về lượt xem hay ép giá CPC."],"explanation":"Value based là tối ưu theo giá trị. Hệ thống phân khách thành các tệp khác nhau và ưu tiên người có khả năng mua với giá trị cao hơn.","whyWrong":{"A":"Mục tiêu không phải là lượt xem.","C":"TikTok phân khách thành các tệp khác nhau, không cào bằng.","D":"Bài giảng không nói sàn ép giá CPC xuống mức thấp nhất."},"source":{"lesson":8,"part":"Phần 2","quote":"không chỉ tìm người có khả năng mua hàng mà cần tìm những cái người có khả năng mua với giá trị cao hơn"},"keywords":["value based","giá trị khách hàng"],"note":""},{"id":"q8-2","n":2,"type":"single","prompt":"Để đánh giá video hiệu quả để giữ lại chạy quảng cáo, nhà bán hàng KHÔNG PHẢI căn cứ vào tiêu chí nào?","options":[{"id":"A","text":"Tổng số lượng video mà đối thủ đã đăng tải trong ngày"},{"id":"B","text":"Các chỉ số chính về kinh doanh như Chi phí/đơn, ROI"},{"id":"C","text":"Các chỉ số phụ như Tỉ lệ xem video trong 2s, 6s"},{"id":"D","text":"Đánh giá chủ quan về nội dung video"}],"answer":["A"],"confidence":"high","hints":["Nhớ lại ba nhóm tiêu chí để đánh giá video trong GMV Max.","Ba nhóm gồm chỉ số kinh doanh, chỉ số phụ về nội dung và cảm quan của nhà bán.","Loại {B}, {C}, {D}: đây là ba nhóm tiêu chí đã nêu trong bài."],"explanation":"Bài giảng nêu ba nhóm tiêu chí: chỉ số chính về kinh doanh, chỉ số phụ như CTR và tỉ lệ xem video 3 giây hoặc 6 giây, và đánh giá chủ quan. Số video của đối thủ không thuộc nhóm nào.","whyWrong":{"B":"Chi phí mỗi đơn và ROI thuộc nhóm chỉ số chính.","C":"Tỉ lệ xem video trong vài giây đầu thuộc nhóm chỉ số phụ.","D":"Đánh giá chủ quan là tiêu chí thứ ba."},"source":{"lesson":8,"part":"Phần 2","quote":"Chúng ta phân thành ba nhóm chỉ số quan trọng"},"keywords":["chỉ số chính","đánh giá chủ quan","GMV Max"],"note":"Đề ghi tỉ lệ xem video trong 2s, 6s còn transcript nói 3 giây hoặc 6 giây. Chi tiết này không ảnh hưởng đáp án."},{"id":"q8-3","n":3,"type":"single","prompt":"Thuật ngữ \"Sự miễn dịch quảng cáo\" trên TikTok dùng để mô tả hiện tượng gì?","options":[{"id":"A","text":"Tài khoản quảng cáo bị khóa do vi phạm chính sách cộng đồng"},{"id":"B","text":"Khách hàng không còn khả năng thanh toán khi xem quảng cáo"},{"id":"C","text":"Hiệu quả nội dung suy giảm, khách vuốt qua nhanh do nội dung bão hòa"},{"id":"D","text":"Video quảng cáo đạt tương tác tự nhiên cao không cần trả phí"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại ví dụ miếng bọt biển trong phần mở đầu thực hành quảng cáo TikTok.","Khách đã thấy quá nhiều quảng cáo nên phản ứng nhanh hơn trước.","Loại {A}, {B}, {D}: đây không phải khóa tài khoản, mất khả năng thanh toán hay tương tác tự nhiên."],"explanation":"Miễn dịch quảng cáo là khi nội dung quảng cáo bão hòa, tỉ lệ click giảm và khách vuốt qua nhanh hơn.","whyWrong":{"A":"Không liên quan đến vi phạm chính sách.","B":"Không liên quan đến khả năng thanh toán.","D":"Tương tác tự nhiên cao không phải hiện tượng này."},"source":{"lesson":8,"part":"Phần 2","quote":"Khách hàng của chúng ta đã đến một cái giai đoạn họ cực kỳ dị ứng và thường là họ sẽ bỏ qua những cái chiến dịch quảng cáo"},"keywords":["miễn dịch quảng cáo","bão hòa"],"note":""},{"id":"q8-4","n":4,"type":"multi","prompt":"Những hình thức nào sau đây thuộc quảng cáo TikTok (TikTok Ads)? Lựa chọn TẤT CẢ các phương án đúng.","options":[{"id":"A","text":"Branded Effects"},{"id":"B","text":"In-Feed Ads"},{"id":"C","text":"Brand Takeover"},{"id":"D","text":"Hashtag Challenge"}],"answer":["A","B","C","D"],"confidence":"high","hints":["Nhớ lại danh sách các hình thức quảng cáo phổ biến nhất của TikTok Ads.","Bài giảng mô tả các hình thức theo cách chúng xuất hiện trước người dùng.","Hãy đối chiếu từng phương án với danh sách trong bài. Câu này không có phương án nhiễu."],"explanation":"Bài giảng nêu bốn hình thức: In-Feed, Take over, Hashtag Challenge và Branded Effect. Cả bốn phương án đều đúng.","whyWrong":{},"source":{"lesson":8,"part":"Phần 1","quote":"Take over tức là quảng cáo hiển thị ngay khi mà chúng ta mở ứng dụng"},"keywords":["TikTok Ads","take over","hashtag challenge","branded effect"],"note":"Câu nhiều đáp án, cả bốn lựa chọn đều đúng. Brand Takeover trong đề tương ứng Take over trong bài giảng."},{"id":"q8-5","n":5,"type":"single","prompt":"Tình huống: Sản phẩm giá 200k, lợi nhuận gộp sau khi trừ chi phí vận hành là 20k. Bạn muốn chi một nửa lợi nhuận đó cho QC để lãi 10k/đơn. ROI mục tiêu cần thiết lập là bao nhiêu?","options":[{"id":"A","text":"ROI = 40"},{"id":"B","text":"ROI = 20"},{"id":"C","text":"ROI = 5"},{"id":"D","text":"ROI = 10"}],"answer":["B"],"confidence":"high","hints":["ROI mục tiêu liên hệ giá bán với chi phí quảng cáo chấp nhận cho một đơn.","Công thức: giá bán chia cho chi phí quảng cáo chấp nhận cho 1 đơn.","Chi phí QC cho 1 đơn là 10k nên ROI bằng 200k chia 10k. Các phương án ROI 40, 5 và 10 không khớp phép chia này."],"explanation":"Lợi nhuận gộp 20k, chi một nửa cho quảng cáo nên chi phí QC cho 1 đơn là 10k. ROI mục tiêu = 200k / 10k = 20.","whyWrong":{"A":"ROI 40 ứng với chi phí QC 5k cho 1 đơn.","C":"ROI 5 ứng với chi phí QC 40k, vượt lợi nhuận gộp 20k.","D":"ROI 10 ứng với chi phí QC 20k, dùng hết lợi nhuận gộp."},"source":{"lesson":8,"part":"Phần 2","quote":"Như vậy Roy của các bạn sẽ chạy từ 10 cho đến 20"},"keywords":["ROI mục tiêu","chi phí quảng cáo"],"note":"Phép tính: chi phí QC cho 1 đơn = 20k / 2 = 10k. ROI mục tiêu = 200k / 10k = 20. Transcript nêu ví dụ cùng số liệu với khoảng ROI từ 10 đến 20."},{"id":"q8-6","n":6,"type":"single","prompt":"\"Giai đoạn học máy\" (Learning Phase) của một chiến dịch quảng cáo GMV Max thường cần khoảng bao lâu để đạt trạng thái ổn định?","options":[{"id":"A","text":"Cần khoảng 7 ngày để hệ thống học dữ liệu khách hàng và sản phẩm"},{"id":"B","text":"Cần tối thiểu 30 ngày để thuật toán AI ghi nhận hành vi"},{"id":"C","text":"Ngay sau khi bấm nút xuất bản chiến dịch"},{"id":"D","text":"Phải đợi đến khi gian hàng đạt đủ 1000 đánh giá 5 sao"}],"answer":["A"],"confidence":"high","hints":["Nhớ lại đặc điểm số bốn của GMV Max: giai đoạn máy học.","Chiến dịch cần thời gian học dữ liệu khách hàng và sản phẩm trước khi ổn định.","Loại {C}: không thể ổn định ngay khi xuất bản. Loại {D}: số đánh giá 5 sao không phải điều kiện. Loại {B}: bài giảng không nêu mốc 30 ngày."],"explanation":"Learning phase của GMV Max thường kéo dài tới 7 ngày để hệ thống học dữ liệu khách hàng và sản phẩm.","whyWrong":{"B":"Bài giảng không nêu mốc 30 ngày.","C":"Chiến dịch tự động cần thời gian học nên không ổn định ngay.","D":"Bài giảng không đặt điều kiện 1000 đánh giá 5 sao."},"source":{"lesson":8,"part":"Phần 1","quote":"thông thường là lên tới 7 ngày"},"keywords":["learning phase","GMV Max"],"note":"Transcript có hai con số: 'lên tới 7 ngày' (đặc điểm số bốn của GMV Max) và 'khoảng 50 đến 100 đơn hàng' (phần so sánh với quảng cáo thủ công). Đề chỉ có phương án 7 ngày nên chọn A."},{"id":"q8-7","n":7,"type":"single","prompt":"Công thức nào sau đây được sử dụng để xác định giá thầu khởi điểm cho người mới trên Shopee dựa trên giả định thực tế?","options":[{"id":"A","text":"Giá thầu = Giá bán * 10% phí sàn"},{"id":"B","text":"Giá thầu = Giá bán * 0.4% (với giả định 20% phí QC và 2% tỉ lệ CĐ)"},{"id":"C","text":"Giá thầu = Tổng ngân sách ngày / 100"},{"id":"D","text":"Giá thầu = Giá bán * Chi phí nhập hàng"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại cách khoán giá thầu cho người mới, dùng giá bán nhân với phần trăm chi cho quảng cáo và tỉ lệ chuyển đổi.","Công thức: giá bán x %QC dự kiến x %CVR dự kiến, với giả định thực tế là 20% và 2%.","Loại {A}, {C}, {D}: phí sàn, ngân sách chia 100 và chi phí nhập hàng không nằm trong công thức."],"explanation":"Giá thầu = Giá bán x 20% x 2% = Giá bán x 0.4%. Với giá bán 200k, giá thầu khởi điểm là 800 đồng cho một click.","whyWrong":{"A":"Công thức không dùng phí sàn.","C":"Công thức không dựa vào ngân sách ngày.","D":"Công thức không dùng chi phí nhập hàng."},"source":{"lesson":8,"part":"Phần 1","quote":"Giá bán nhân với 0.4 là chúng ta ra giá thầu"},"keywords":["giá thầu khoán","giá thầu","CPC"],"note":"Transcript đọc là 'nhân với 0.4', hiểu là 0.4% (20% x 2%). Ví dụ 200k x 0.4% = 800 đồng khớp với con số giá thầu nêu trong bài."},{"id":"q8-8","n":8,"type":"single","prompt":"Cơ chế vận hành của TikTok GMV Max dựa trên các tín hiệu tổng hợp từ đâu?","options":[{"id":"A","text":"Tổng hợp tín hiệu từ quảng cáo, Affiliate và traffic tự nhiên (Organic)"},{"id":"B","text":"Chỉ dựa trên các tín hiệu từ lượt click quảng cáo trả phí"},{"id":"C","text":"Chỉ dựa trên số lượng hashtag gắn vào video"},{"id":"D","text":"Dựa trên số tiền nạp vào tài khoản doanh nghiệp"}],"answer":["A"],"confidence":"high","hints":["Nhớ lại việc GMV Max học không chỉ từ quảng cáo trả phí.","Hệ thống thu thập tín hiệu từ nhiều nguồn trên hệ sinh thái TikTok Shop.","Loại {B}, {C}, {D}: không chỉ dựa vào click trả phí, hashtag hay số tiền nạp."],"explanation":"GMV Max tổng hợp tín hiệu từ quảng cáo, Affiliate và Organic để hiểu nhóm khách, video và sản phẩm hiệu quả nhất.","whyWrong":{"B":"Không chỉ dựa vào click quảng cáo trả phí.","C":"Hashtag không phải nguồn tín hiệu được nêu.","D":"Số tiền nạp không phải tín hiệu để hệ thống học."},"source":{"lesson":8,"part":"Phần 2","quote":"những tín hiệu quảng cáo, tín hiệu từ offet, tín hiệu từ organic"},"keywords":["GMV Max","tín hiệu","organic"],"note":""},{"id":"q8-9","n":9,"type":"single","prompt":"Đâu là điểm khác biệt về cơ chế tiêu tiền giữa Shopee Ads và quảng cáo trên Facebook/TikTok?","options":[{"id":"A","text":"Shopee chỉ tiêu tiền vào những khung giờ người bán đặt lịch sẵn"},{"id":"B","text":"Facebook và TikTok yêu cầu chỉnh giá thầu thủ công cho từng từ khóa"},{"id":"C","text":"Shopee có thể tiêu ngân sách rất nhanh và không có trách nhiệm tiêu đều tiền"},{"id":"D","text":"Shopee tự động dàn đều ngân sách trong suốt 24 giờ"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại ví dụ ngân sách 1 triệu đồng.","Facebook và TikTok dàn đều ngân sách theo thời gian, còn Shopee thì khác.","Loại {D} và {B}: đó là cách vận hành của Facebook và TikTok. Loại {A}: Shopee không tự đặt lịch."],"explanation":"Shopee có thể tiêu hết ngân sách trong thời gian ngắn và không có trách nhiệm tiêu đều tiền, khác với Facebook và TikTok dàn đều trong 24 giờ.","whyWrong":{"A":"Người bán phải tự phân bổ ngân sách theo khung giờ, Shopee không tự đặt lịch.","B":"Bài giảng không nói Facebook và TikTok chỉnh giá thầu thủ công cho từng từ khóa.","D":"Dàn đều 24 giờ là cơ chế của Facebook và TikTok."},"source":{"lesson":8,"part":"Phần 1","quote":"Shopee cũng sẽ không có trách nhiệm tiêu tiền trong một ngày mà nó có thể tiêu thốc trong một cái khoảng thời gian rất là nhanh"},"keywords":["ngân sách","tiêu thốc","Shopee Ads"],"note":""},{"id":"q8-10","n":10,"type":"single","prompt":"Trong cơ chế xếp hạng quảng cáo của Shopee, yếu tố \"Điểm liên quan\" thường được hệ thống căn cứ vào chỉ số nào?","options":[{"id":"A","text":"Hiệu suất tỉ lệ nhấp chuột (CTR) của sản phẩm trước đó"},{"id":"B","text":"Số năm kinh nghiệm kinh doanh của chủ gian hàng"},{"id":"C","text":"Tổng số lượng sản phẩm đang có trong kho"},{"id":"D","text":"Tốc độ phản hồi chat của nhân viên trực shop"}],"answer":["A"],"confidence":"high","hints":["Nhớ lại ba yếu tố xếp hạng quảng cáo của Shopee.","Điểm liên quan đo mức độ phù hợp giữa sản phẩm và từ khóa khách tìm kiếm.","Loại {B}, {C}, {D}: kinh nghiệm chủ shop, số lượng tồn kho và tốc độ chat không phải căn cứ của điểm liên quan."],"explanation":"Điểm liên quan được Shopee căn cứ vào hiệu suất CTR trước đó của sản phẩm.","whyWrong":{"B":"Số năm kinh nghiệm không được nêu trong bài.","C":"Số lượng tồn kho không được nêu trong bài.","D":"Tốc độ trả lời chat thuộc yếu tố hiệu suất vận hành, không phải điểm liên quan."},"source":{"lesson":8,"part":"Phần 1","quote":"Shopee căn cứ vào hiệu suất CTR trước đó để mà có thể đánh giá"},"keywords":["xếp hạng quảng cáo","điểm liên quan","CTR"],"note":""},{"id":"q8-11","n":11,"type":"single","prompt":"Tình huống: Một chiến dịch GMV Max đang tiêu tiền tốt và ROI cao, nhưng đột ngột tiêu chậm và ROI giảm sâu. Hành động nào là hợp lý nhất?","options":[{"id":"A","text":"Xóa toàn bộ chiến dịch cũ và tạo lại chiến dịch mới y hệt"},{"id":"B","text":"Ngay lập tức tăng gấp đôi ngân sách để ép phân phối lại"},{"id":"C","text":"Giảm giá thầu CPC xuống mức thấp nhất để tiết kiệm"},{"id":"D","text":"Kiểm tra trạng thái các video \"win\" xem có bị chuyển sang \"Không phân phối\" không"}],"answer":["D"],"confidence":"medium","hints":["Nghĩ về việc người chạy GMV Max cần theo dõi thường xuyên điều gì.","Mỗi video có một trạng thái phản ánh mức ưu tiên phân phối của hệ thống.","Loại {A}, {B}, {C}: tạo lại chiến dịch, tăng gấp đôi ngân sách hay giảm giá thầu đều bỏ qua nguyên nhân từ video."],"explanation":"Khi chiến dịch tiêu chậm và ROI giảm, bước hợp lý là kiểm tra trạng thái các video win. Video bị chuyển sang không phân phối thì cần thay bằng nội dung mới.","whyWrong":{"A":"Bài giảng không khuyên xóa và tạo lại chiến dịch.","B":"Bài giảng không khuyên ép phân phối bằng cách tăng ngân sách.","C":"Giảm giá thầu CPC không phải cách xử lý trong GMV Max."},"source":{"lesson":8,"part":"Phần 2","quote":"việc theo dõi trạng thái của video là một cái công việc cực kỳ quan trọng"},"keywords":["trạng thái video","không phân phối","creative boost"],"note":"Transcript không có đúng tình huống này. Đáp án D suy ra từ yêu cầu theo dõi trạng thái video và nguyên tắc thay video không phân phối. Các phương án A, B, C đi ngược nguyên tắc tối ưu GMV Max."},{"id":"q8-12","n":12,"type":"single","prompt":"Đặc điểm nào sau đây KHÔNG PHẢI là ưu điểm cốt lõi của giải pháp quảng cáo GMV Max?","options":[{"id":"A","text":"Tối ưu hóa phân phối dựa trên mục tiêu doanh thu và ROAS"},{"id":"B","text":"Phân phối đa kênh trên toàn bộ hệ sinh thái của nền tảng"},{"id":"C","text":"Cho phép người bán can thiệp thủ công vào từng phiên đấu giá từ khóa"},{"id":"D","text":"Tự động hóa toàn diện việc chọn từ khóa và đấu thầu"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại các đặc điểm cốt lõi của GMV Max.","GMV Max hướng đến tự động hóa, người bán chủ yếu đặt mục tiêu và ngân sách.","Loại {A}, {B}, {D}: đây đều là đặc điểm đã được nêu trong bài."],"explanation":"GMV Max tự động chọn từ khóa, đấu thầu và vị trí hiển thị, nên người bán không can thiệp thủ công vào từng phiên đấu giá.","whyWrong":{"A":"Đây là ưu điểm: tối ưu theo mục tiêu doanh thu và ROAS.","B":"Đây là ưu điểm: phân phối đa kênh trên hệ sinh thái.","D":"Đây là ưu điểm: tự động hóa chọn từ khóa và đấu thầu."},"source":{"lesson":8,"part":"Phần 1","quote":"Hệ thống sẽ tự động chọn từ khóa này, đấu thầu giá này và lựa chọn những cái vị trí hiển thị"},"keywords":["GMV Max","tự động"],"note":"Câu hỏi tìm đặc điểm KHÔNG PHẢI ưu điểm của GMV Max. Phương án C trái với tính tự động hóa của GMV Max nên là đáp án."},{"id":"q8-13","n":13,"type":"single","prompt":"Điểm khác biệt căn bản về bản chất tiếp cận khách hàng giữa Shopee và TikTok là gì?","options":[{"id":"A","text":"Shopee là \"Hàng tìm người\", TikTok là \"Người tìm hàng\""},{"id":"B","text":"Cả hai đều thuần túy là nền tảng trưng bày sản phẩm trên kệ"},{"id":"C","text":"Shopee là \"Người tìm hàng\", TikTok là \"Hàng tìm người\" dựa trên sở thích"},{"id":"D","text":"TikTok chỉ tập trung bán hàng, Shopee tập trung giải trí"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại ví dụ siêu thị và trung tâm thương mại.","Một nền tảng khách chủ động tìm theo nhu cầu, một nền tảng chủ động đưa sản phẩm đến theo sở thích.","Loại {A}: đảo ngược vai trò. Loại {B} và {D}: không khớp với bài giảng."],"explanation":"Shopee là nền tảng người tìm hàng, giống siêu thị. TikTok là hàng tìm người dựa trên sở thích, giống trung tâm thương mại.","whyWrong":{"A":"Đảo ngược vai trò của Shopee và TikTok.","B":"TikTok còn là nơi giải trí, không chỉ là kệ trưng bày.","D":"Cả hai nền tảng đều bán hàng, không phải TikTok bán còn Shopee giải trí."},"source":{"lesson":8,"part":"Phần 1","quote":"Shopee chính là một cái nền tảng người tìm hàng"},"keywords":["người tìm hàng","hàng tìm người"],"note":""},{"id":"q8-14","n":14,"type":"single","prompt":"Mô hình tính phí chủ yếu của quảng cáo Shopee (Shopee Ads) là gì?","options":[{"id":"A","text":"CPM - Tính phí dựa trên mỗi 1000 lượt hiển thị"},{"id":"B","text":"CPA - Tính phí dựa trên mỗi hành động thêm vào giỏ hàng"},{"id":"C","text":"CPS - Chỉ tính phí khi đơn hàng thành công"},{"id":"D","text":"CPC (Cost Per Click) - Trả phí khi khách nhấp vào quảng cáo"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại phần đặc điểm chính của quảng cáo Shopee.","Người bán trả phí khi khách thực hiện một thao tác cụ thể với quảng cáo.","Loại {A}, {B}, {C}: CPM, CPA theo giỏ hàng và CPS không phải mô hình chủ yếu của Shopee Ads."],"explanation":"Shopee Ads tính phí chủ yếu theo CPC, người bán trả tiền khi khách nhấp vào quảng cáo.","whyWrong":{"A":"CPM không phải mô hình chủ yếu.","B":"CPA theo giỏ hàng không được nêu.","C":"CPS là hình thức hoa hồng của Affiliate."},"source":{"lesson":8,"part":"Phần 1","quote":"Thứ hai là cái mô hình tính phí của nền tảng hiện nay phổ biến nhất vẫn là mô hình tính phí chủ yếu dựa trên CPC"},"keywords":["CPC","Shopee Ads"],"note":""},{"id":"q8-15","n":15,"type":"single","prompt":"Khi nào nhà bán hàng nên chuyển sang chế độ \"Thủ công chọn video\" để chạy quảng cáo trên TikTok?","options":[{"id":"A","text":"Khi muốn TikTok tự động tìm đối tượng khách hàng mới"},{"id":"B","text":"Khi bắt đầu phân phối ngân sách vào video không mong muốn hoặc kém hiệu quả"},{"id":"C","text":"Khi sản phẩm có nhiều video Affiliate thực hiện tốt"},{"id":"D","text":"Khi mới bắt đầu chiến dịch và chưa có dữ liệu"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại khi nào chọn video thủ công thay vì để hệ thống tự động.","Chọn thủ công phù hợp khi cần kiểm soát hoặc đã có dữ liệu về video hiệu quả.","Loại {A} và {D}: tự động phù hợp khi mới bắt đầu và chưa có dữ liệu. Loại {C}: bài giảng không nêu video Affiliate tốt là dấu hiệu chuyển sang thủ công."],"explanation":"Nên chuyển sang chọn video thủ công khi ngân sách bắt đầu đổ vào video không mong muốn hoặc kém hiệu quả.","whyWrong":{"A":"Để TikTok tự tìm đối tượng là lợi thế của chế độ tự động.","C":"Bài giảng không nêu video Affiliate tốt là lý do chuyển sang thủ công.","D":"Giai đoạn mới bắt đầu nên để tự động để hệ thống khám phá."},"source":{"lesson":8,"part":"Phần 2","quote":"khi bắt đầu thấy ngân sách bị phân phối vào những video không mong muốn"},"keywords":["chọn thủ công","creative boost"],"note":""}]},{"id":9,"title":"Bài 9: Tổng quan mô hình livestream trong TMĐT","summary":["Livestream bán hàng là phát video trực tiếp, giới thiệu sản phẩm và tương tác với khách theo thời gian thực.","Sức hút của livestream giải thích bằng kinh tế trải nghiệm, kinh tế chú ý, Rich Media và sự hiện diện xã hội.","Sự bùng nổ đến từ hành vi người dùng, niềm tin và tính xác thực, hạ tầng công nghệ.","Livestream dồn các pha AIDA vào một phiên và đóng vai trò kênh bán hàng, Launchpad, xả hàng tồn, xây thương hiệu, nghiên cứu thị trường.","Mô hình 5P gồm Pre-live, Production, Performance, Process, Post-live. Quy tắc 80/20: 80% thành công đến từ khâu chuẩn bị.","Pre-live trả lời 5W1H và chuẩn bị sản phẩm mồi, chủ lực, bán kèm. Production nên quay 4K, FPS 30, camera 1X.","Process cần xác nhận đơn trong 2 đến 4 giờ, đóng gói và bàn giao trong 24 đến 48 giờ.","Post-live đo các nhóm chỉ số tổng thể, tương tác, bán hàng và chi phí gồm ROAS."],"questions":[{"id":"q9-1","n":1,"type":"single","prompt":"Tại sao livestream được ví như một \"Phòng thí nghiệm\" nghiên cứu thị trường trong thời gian thực (real-time)?","options":[{"id":"A","text":"Vì nó chỉ dành cho các sản phẩm liên quan đến y tế và sức khỏe"},{"id":"B","text":"Vì dữ liệu khách hàng sẽ được lưu trữ trong môi trường chân không"},{"id":"C","text":"Vì bình luận của người xem hiện lên như một cuộc khảo sát khổng lồ về sở thích và giá cả"},{"id":"D","text":"Vì nó yêu cầu các thiết bị đo lường hóa học phức tạp"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại vai trò nghiên cứu thị trường của livestream.","Streamer có thể biết ngay phản hồi của người xem về màu sắc, giá và điểm họ thích hoặc ghét.","Loại {A}, {B}, {D}: livestream không giới hạn ở ngành y tế và không cần môi trường chân không hay thiết bị đo hóa học."],"explanation":"Bình luận của người xem giống một cuộc khảo sát thời gian thực về sở thích và giá cả.","whyWrong":{"A":"Livestream không giới hạn ở ngành y tế.","B":"Dữ liệu khách hàng không liên quan đến môi trường chân không.","D":"Livestream không cần thiết bị đo hóa học."},"source":{"lesson":9,"part":"Phần 1","quote":"cái bình luận của khách hàng giống như một cái cuộc khảo sát"},"keywords":["phòng thí nghiệm","nghiên cứu thị trường"],"note":""},{"id":"q9-2","n":2,"type":"multi","prompt":"Sự bùng nổ của livestream xuất phát từ sự hội tụ của những cuộc cách mạng nào? Lựa chọn TẤT CẢ các phương án đúng.","options":[{"id":"A","text":"Cách mạng về Hành vi Người dùng"},{"id":"B","text":"Cách mạng về Quy trình sản xuất công nghiệp"},{"id":"C","text":"Cách mạng về Công nghệ và Hạ tầng"},{"id":"D","text":"Cách mạng về Niềm tin và Xác thực"}],"answer":["A","C","D"],"confidence":"high","hints":["Nhớ lại ba yếu tố hội tụ khiến livestream thương mại bùng nổ.","Các yếu tố liên quan đến người tiêu dùng, tâm lý tin tưởng và điều kiện kỹ thuật.","Loại {B}: sản xuất công nghiệp không được nhắc trong bài. Ba lựa chọn còn lại ứng với ba yếu tố trong bài."],"explanation":"Bài giảng nêu ba yếu tố hội tụ: kinh tế hành vi của người tiêu dùng, niềm tin và tính xác thực, hạ tầng công nghệ. Quy trình sản xuất công nghiệp không có.","whyWrong":{"B":"Quy trình sản xuất công nghiệp không được nhắc trong bài giảng."},"source":{"lesson":9,"part":"Phần 1","quote":"Thứ hai đó là yếu tố liên quan đến niềm tin và tính thác thực"},"keywords":["kinh tế hành vi","niềm tin","hạ tầng"],"note":"Câu nhiều đáp án. Đúng: Hành vi Người dùng, Công nghệ và Hạ tầng, Niềm tin và Xác thực. Sai: Quy trình sản xuất công nghiệp."},{"id":"q9-3","n":3,"type":"single","prompt":"Nhóm chỉ số nào sau đây được dùng để đo lường \"Hiệu suất bán hàng\" (Sales Performance) sau phiên live?","options":[{"id":"A","text":"Chi phí quảng cáo và lợi nhuận trên chi phí (ROAS)"},{"id":"B","text":"Tỷ lệ tương tác và lượt like, share"},{"id":"C","text":"Tổng lượt xem và lượt xem đồng thời đỉnh"},{"id":"D","text":"Tổng doanh thu (GMV), số đơn hàng và tỷ lệ chuyển đổi"}],"answer":["D"],"confidence":"high","hints":["Nhớ lại các nhóm chỉ số trong báo cáo Post-Live.","Mỗi nhóm đo một khía cạnh: sức hút, tương tác, bán hàng và chi phí.","Loại {A}: thuộc nhóm chi phí. Loại {B}: thuộc nhóm tương tác. Loại {C}: thuộc nhóm tổng thể."],"explanation":"Hiệu suất bán hàng đo bằng tổng doanh thu, số đơn hàng, giá trị đơn hàng và tỉ lệ chuyển đổi.","whyWrong":{"A":"Chi phí quảng cáo và ROAS thuộc nhóm chi phí đầu tư.","B":"Like, share và tỉ lệ tương tác thuộc nhóm tương tác.","C":"Lượt xem và xem đồng thời đỉnh thuộc nhóm chỉ số tổng thể."},"source":{"lesson":9,"part":"Phần 2","quote":"bán hàng thì chúng ta có thể đo bằng tổng doanh thu, tổng số đơn, giá trị đơn hàng, tỉ lệ chuyển đổi"},"keywords":["post-live","tỉ lệ chuyển đổi","GMV"],"note":""},{"id":"q9-4","n":4,"type":"single","prompt":"Để cải thiện chất lượng hình ảnh khi livestream bằng smartphone, người mới bắt đầu nên ưu tiên thiết lập nào?","options":[{"id":"A","text":"Quay chế độ 4K, FPS 60 và dùng zoom kỹ thuật số"},{"id":"B","text":"Quay chế độ 4K, FPS 30 và dùng camera thường 1x"},{"id":"C","text":"Quay chế độ mặc định của ứng dụng và không cần chỉnh sửa"},{"id":"D","text":"Quay chế độ HD, FPS 60 và dùng camera trước"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại mẹo cải thiện chất lượng video trong giai đoạn Production.","Ưu tiên độ phân giải cao, khung hình ở mức tiêu chuẩn và ống kính gốc.","Loại {A}, {C}, {D}: không phải các thông số được bài giảng nêu."],"explanation":"Người mới nên quay chế độ 4K, FPS 30 và dùng camera thường ở mức 1X.","whyWrong":{"A":"Bài giảng nêu FPS 30 và camera 1X, không nêu FPS 60 hay zoom.","C":"Bài giảng khuyên cài đặt thông số để chọn chất lượng tốt nhất.","D":"Bài giảng không nêu HD, FPS 60 hay camera trước."},"source":{"lesson":9,"part":"Phần 2","quote":"quay ở chế độ 4K khung hình là FPS30 luôn ưu tiên quay bằng camera thường để chế độ 1X"},"keywords":["production","4K","FPS"],"note":""},{"id":"q9-5","n":5,"type":"single","prompt":"Đâu KHÔNG PHẢI là một vai trò của livestream trong việc gia tăng doanh thu?","options":[{"id":"A","text":"Phòng thí nghiệm nghiên cứu thị trường thực tế"},{"id":"B","text":"Công cụ ra mắt sản phẩm mới (Launchpad)"},{"id":"C","text":"Thay thế hoàn toàn các kênh bán lẻ truyền thống và kho bãi"},{"id":"D","text":"Kênh xây dựng thương hiệu và lòng trung thành"}],"answer":["C"],"confidence":"medium","hints":["Nhớ lại các vai trò của livestream trong việc tăng doanh thu.","Bài giảng liệt kê các vai trò như kênh bán, ra mắt sản phẩm, xả tồn kho, xây thương hiệu và nghiên cứu thị trường.","Loại {A}, {B}, {D}: đây đều là vai trò được nêu trong bài."],"explanation":"Ba vai trò {A}, {B}, {D} đều được nêu trong bài. Thay thế hoàn toàn các kênh bán lẻ truyền thống và kho bãi không phải vai trò của livestream.","whyWrong":{"A":"Đây là vai trò: phòng thí nghiệm nghiên cứu thị trường.","B":"Đây là vai trò: công cụ ra mắt sản phẩm (Launchpad).","D":"Đây là vai trò: kênh xây dựng thương hiệu và lòng trung thành."},"source":{"lesson":9,"part":"Phần 1","quote":"livestream không chỉ là một cái kênh bán hàng mà còn là một cuộc cách mạng trong hành vi mua sắm"},"keywords":["ra mắt sản phẩm","phòng thí nghiệm","xây dựng thương hiệu"],"note":"Transcript nêu các vai trò: kênh bán hàng, Launchpad, xả hàng tồn, xây thương hiệu, phòng thí nghiệm thị trường. Không có vai trò thay thế hoàn toàn kênh bán lẻ và kho bãi, nên chọn C theo cách loại trừ."},{"id":"q9-6","n":6,"type":"single","prompt":"Livestream đã tác động như thế nào đến phễu bán hàng truyền thống (AIDA)?","options":[{"id":"A","text":"Nén phễu bán hàng lại trong thời gian ngắn, tạo vòng lặp thống nhất"},{"id":"B","text":"Loại bỏ hoàn toàn bước hành động (Action) trong giao dịch"},{"id":"C","text":"Kéo dài thời gian khách hàng di chuyển qua các tầng phễu"},{"id":"D","text":"Giữ nguyên các bước nhận biết và quan tâm để đảm bảo quy trình"}],"answer":["A"],"confidence":"medium","hints":["Nhớ lại mô hình AIDA gồm bốn pha và hành trình khách hàng truyền thống.","Trong livestream, các pha diễn ra trong một khoảng thời gian rất ngắn.","Loại {B}: bước hành động vẫn còn vì khách bấm giỏ hàng để mua. Loại {C} và {D}: livestream không kéo dài hay giữ nguyên chu trình dài."],"explanation":"Livestream dồn các pha nhận biết, quan tâm, mong muốn và hành động vào một phiên, nên nén phễu bán hàng trong thời gian ngắn.","whyWrong":{"B":"Khách vẫn bấm giỏ hàng để mua trong phiên.","C":"Livestream rút ngắn chứ không kéo dài hành trình.","D":"Livestream thay đổi chu trình dài của hình thức truyền thống."},"source":{"lesson":9,"part":"Phần 1","quote":"Tất cả nó đều dồn lại trong một cái phiên livestream"},"keywords":["AIDA","phễu","livestream"],"note":"Transcript nói livestream dồn toàn bộ các pha AIDA vào một phiên, tức là rút ngắn phễu. Cụm 'vòng lặp thống nhất' trong đáp án không xuất hiện nguyên văn."},{"id":"q9-7","n":7,"type":"single","prompt":"Mô hình livestream trong thương mại là sự tích hợp của ba yếu tố cốt lõi nào?","options":[{"id":"A","text":"Quảng cáo, Vận chuyển và Thanh toán"},{"id":"B","text":"Sản xuất, Kho bãi và Phân phối"},{"id":"C","text":"Giải trí, Tương tác và Thương mại"},{"id":"D","text":"Hình ảnh, Văn bản và Âm thanh"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại lý do khiến livestream tạo trải nghiệm mua sắm liền mạch.","Ba yếu tố gồm cảm xúc của khách, mối quan hệ với người bán và hoạt động mua.","Loại {A}, {B}, {D}: các nhóm này không phải ba yếu tố cốt lõi nêu trong bài."],"explanation":"Livestream kết hợp giải trí, tương tác với người bán và mua hàng kèm khuyến mãi.","whyWrong":{"A":"Vận chuyển và thanh toán không được nêu là yếu tố cốt lõi.","B":"Kho bãi và phân phối là khâu hậu cần.","D":"Hình ảnh, văn bản, âm thanh là định dạng truyền thông."},"source":{"lesson":9,"part":"Phần 1","quote":"nó kết hợp ba yếu tố. Thứ nhất là yếu tố liên quan đến giải trí"},"keywords":["livestream commerce","giải trí","tương tác"],"note":"Yếu tố thứ ba trong bài là mua sản phẩm kèm voucher và khuyến mãi, tương ứng 'Thương mại' trong đáp án."},{"id":"q9-8","n":8,"type":"single","prompt":"Mục tiêu chính của việc tổ chức các mini game hoặc tặng quà giữa các phần trong buổi livestream là gì?","options":[{"id":"A","text":"Để quảng cáo cho các nhãn hàng tài trợ bên ngoài"},{"id":"B","text":"Để thay thế hoàn toàn phần giới thiệu tính năng sản phẩm"},{"id":"C","text":"Để streamer có thời gian nghỉ ngơi lâu hơn"},{"id":"D","text":"Để duy trì năng lượng, giữ chân người xem và tăng tương tác"}],"answer":["D"],"confidence":"medium","hints":["Nhớ lại giai đoạn Performance, phần kịch bản và tương tác.","Hoạt động xen giữa các phần liên quan đến mức độ tương tác của người xem.","Loại {A}, {B}, {C}: không phải mục tiêu của mini game."],"explanation":"Mini game và tặng quà xen giữa các phần để duy trì tương tác và sự chú ý của người xem.","whyWrong":{"A":"Bài giảng không nói mini game để quảng cáo cho nhãn hàng tài trợ.","B":"Mini game không thay thế phần giới thiệu sản phẩm.","C":"Mục tiêu không phải để streamer nghỉ ngơi."},"source":{"lesson":9,"part":"Phần 2","quote":"giữa các phần thì chúng ta nên có các cái phần minig game tương tác, giúp thăm trúng thưởng hoặc là trả lời bình luận"},"keywords":["tương tác","performance"],"note":"Transcript nêu nên có mini game giữa các phần và nói hoạt động trong live nhằm gia tăng tương tác, chú ý. Cụm 'duy trì năng lượng, giữ chân người xem' là diễn giải."},{"id":"q9-9","n":9,"type":"single","prompt":"Một streamer nên xử lý như thế nào khi sản phẩm chính bất ngờ bị \"cháy hàng\" trong lúc đang livestream?","options":[{"id":"A","text":"Xin lỗi và dừng phiên livestream ngay lập tức"},{"id":"B","text":"Thông báo vui mừng và khéo léo giới thiệu sản phẩm thay thế tương tự"},{"id":"C","text":"Tranh cãi với bộ phận kho ngay trên sóng trực tiếp"},{"id":"D","text":"Bỏ qua bình luận của khách hàng và tiếp tục giới thiệu sản phẩm đó"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại các tình huống xử lý khi livestream.","Bài giảng khuyên giữ thái độ tích cực và đưa phương án cho người xem.","Loại {A}, {C}, {D}: dừng live, tranh cãi hay phớt lờ bình luận đều là phản ứng tiêu cực."],"explanation":"Khi cháy hàng, streamer thông báo vui mừng và giới thiệu sản phẩm thay thế tương tự.","whyWrong":{"A":"Bài giảng không khuyên dừng phiên live.","C":"Bài giảng không khuyên tranh cãi trên sóng.","D":"Bài giảng khuyên trả lời nhanh và gọi tên khách."},"source":{"lesson":9,"part":"Phần 2","quote":"Còn những cái sản phẩm bất ngờ trái hàng thì thông báo vui mừng, giới thiệu sản phẩm thay thế tương tự"},"keywords":["sản phẩm thay thế","streamer"],"note":""},{"id":"q9-10","n":10,"type":"single","prompt":"Theo tiêu chuẩn hậu cần sau phiên live, thời gian lý tưởng để xác nhận đơn hàng với khách là bao lâu?","options":[{"id":"A","text":"Sau 24 giờ kể từ khi live để khách suy nghĩ kỹ"},{"id":"B","text":"Trong vòng 2-4 giờ sau khi kết thúc live"},{"id":"C","text":"Ngay trong lúc khách đang xem live"},{"id":"D","text":"Chỉ cần xác nhận khi hàng đã bắt đầu được giao"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại các mốc thời gian trong giai đoạn Process.","Mốc đầu tiên là xác nhận đơn, mốc sau là đóng gói và bàn giao.","Loại {A} và {D}: xác nhận quá muộn khiến khách hủy đơn. Loại {C}: đơn cần xử lý sau khi khách đã đặt."],"explanation":"Bài giảng nêu xác nhận đơn trong 2 đến 4 giờ. Chậm hơn thì khách có thể hủy đơn.","whyWrong":{"A":"24 giờ là quá muộn, khách có thể hủy đơn.","C":"Bài giảng nêu mốc 2 đến 4 giờ sau live.","D":"Không đợi đến khi giao hàng mới xác nhận."},"source":{"lesson":9,"part":"Phần 2","quote":"Thì thường là trong 2 đến 4 giờ thì các bạn phải xác định đơn hàng, xác nhận đơn hàng"},"keywords":["process","hậu cần","xác nhận đơn hàng"],"note":""},{"id":"q9-11","n":11,"type":"single","prompt":"Trong mô hình quản trị \"5P\" của livestream, giai đoạn nào được coi là quan trọng nhất khi quyết định đến 80% sự thành công?","options":[{"id":"A","text":"Giai đoạn Production (Sản xuất)"},{"id":"B","text":"Giai đoạn Pre-Live (Chuẩn bị)"},{"id":"C","text":"Giai đoạn Performance (Lên hình)"},{"id":"D","text":"Giai đoạn Post-Live (Phân tích)"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại nguyên tắc vàng của chuỗi 5P.","Tỉ lệ 80 và 20 phân chia thành công giữa khâu chuẩn bị và khâu lên hình.","Loại {A}, {C}, {D}: lên hình chỉ chiếm 20%, sản xuất và phân tích không phải khâu quyết định 80%."],"explanation":"Quy tắc 80/20: 80% thành công đến từ khâu chuẩn bị (Pre-Live), 20% đến từ khâu lên hình.","whyWrong":{"A":"Production là khâu sản xuất và dàn dựng.","C":"Performance chỉ chiếm 20%.","D":"Post-Live là khâu phân tích sau live."},"source":{"lesson":9,"part":"Phần 2","quote":"80 thành công thành công của một viên lai nó đến từ khâu chuẩn bị, chỉ có 20% đến từ khâu lên hình"},"keywords":["5P","pre-live","80/20"],"note":""},{"id":"q9-12","n":12,"type":"single","prompt":"Tình huống: Một phiên live đạt lượt xem đồng thời đỉnh (Peak CCU) rất cao nhưng tỷ lệ chuyển đổi (CVR) lại rất thấp. Dựa trên quy trình 5P, bạn nên ưu tiên tối ưu khâu nào nhất?","options":[{"id":"A","text":"Tối ưu khâu Post-Live bằng cách chạy thêm nhiều quảng cáo hơn"},{"id":"B","text":"Tối ưu khâu Production để hình ảnh sắc nét hơn nữa"},{"id":"C","text":"Tối ưu khâu Performance bằng cách xem lại kịch bản chốt đơn và sự phù hợp của sản phẩm"},{"id":"D","text":"Tối ưu khâu Process bằng cách thuê thêm nhân viên đóng gói"}],"answer":["C"],"confidence":"medium","hints":["Xác định điểm nghẽn của phễu: nhiều người xem nhưng ít người mua.","Người xem đã đến, vấn đề nằm ở cách dẫn dắt và chốt đơn trong phiên.","Loại {A}, {B}, {D}: thêm quảng cáo, hình ảnh sắc nét hay thêm nhân viên đóng gói không giải quyết việc khách không mua."],"explanation":"Peak CCU cao nghĩa là phiên đã thu hút người xem. CVR thấp cho thấy cần xem lại kịch bản, tương tác và chốt đơn trong khâu Performance.","whyWrong":{"A":"Thêm quảng cáo chỉ tăng người xem, không tăng chuyển đổi.","B":"Hình ảnh sắc nét không giải quyết việc khách không mua.","D":"Đóng gói là khâu sau khi đã có đơn."},"source":{"lesson":9,"part":"Phần 2","quote":"Thứ ba đó là performance tức là các cái kịch bản và tương tác trong quá trình trong quá trình làm"},"keywords":["CVR","peak CCU","performance"],"note":"Transcript định nghĩa Performance là kịch bản và tương tác trong live. Việc chọn Performance cho tình huống Peak CCU cao nhưng CVR thấp là suy luận, bài không nêu tình huống này. 'Sự phù hợp của sản phẩm' thuộc khâu chuẩn bị theo transcript."},{"id":"q9-13","n":13,"type":"single","prompt":"Tại sao việc xây dựng \"Tín nhiệm cá nhân hóa\" của streamer lại giúp giải quyết điểm nghẽn lớn nhất của mua sắm online?","options":[{"id":"A","text":"Vì streamer là người trực tiếp chịu trách nhiệm bảo hành thay cho hãng"},{"id":"B","text":"Vì khách hàng tin tưởng vào trải nghiệm thực tế của người thật hơn là các hình ảnh quảng cáo tĩnh"},{"id":"C","text":"Vì streamer có khả năng ép sàn TMĐT giảm giá sâu hơn banner"},{"id":"D","text":"Vì streamer giúp khách hàng thanh toán nhanh hơn các ví điện tử"}],"answer":["B"],"confidence":"medium","hints":["Nhớ lại điểm nghẽn của thương mại điện tử truyền thống mà livestream giải quyết.","Khách chỉ thấy hình ảnh và thông tin do người bán cung cấp nên còn nhiều nghi ngại.","Loại {A}, {C}, {D}: bảo hành, ép giá sàn hay thanh toán nhanh không phải lý do tạo niềm tin."],"explanation":"Streamer cho khách thấy sản phẩm thật và nghe tư vấn trực tiếp nên niềm tin tăng hơn so với hình ảnh quảng cáo tĩnh.","whyWrong":{"A":"Bài giảng không nói streamer chịu bảo hành thay hãng.","C":"Bài giảng không nói streamer ép sàn giảm giá.","D":"Bài giảng không liên quan đến tốc độ thanh toán."},"source":{"lesson":9,"part":"Phần 1","quote":"cho khách hàng thấy trực tiếp sản phẩm và cách sử dụng, nghe tư vấn trực tiếp, từ đó tăng cảm giác tin tưởng hơn"},"keywords":["niềm tin","streamer","cá nhân hóa"],"note":"Cụm 'Tín nhiệm cá nhân hóa' không xuất hiện nguyên văn. Transcript nói livestream tăng niềm tin nhờ thấy sản phẩm thật, nghe tư vấn trực tiếp, và khách mua từ một người họ yêu mến."},{"id":"q9-14","n":14,"type":"single","prompt":"Chỉ số ROAS (Lợi nhuận trên chi phí) trong báo cáo Post-Live có ý nghĩa gì đối với chủ shop?","options":[{"id":"A","text":"Đo lường sức hấp dẫn của streamer đối với khán giả"},{"id":"B","text":"Đo lường độ hài lòng của khách hàng sau khi nhận sản phẩm"},{"id":"C","text":"Đo lường hiệu quả đầu tư so với chi phí quảng cáo và khuyến mãi"},{"id":"D","text":"Đo lường tốc độ đóng gói hàng hóa của bộ phận hậu cần"}],"answer":["C"],"confidence":"high","hints":["Nhớ lại nhóm chỉ số chi phí trong báo cáo Post-Live.","ROAS gắn với tiền đầu tư vào quảng cáo và khuyến mãi.","Loại {A}, {B}, {D}: sức hấp dẫn, độ hài lòng và tốc độ đóng gói thuộc các chỉ số khác."],"explanation":"ROAS đo hiệu quả đầu tư so với chi phí quảng cáo và khuyến mãi.","whyWrong":{"A":"Sức hấp dẫn của streamer đo bằng lượt xem và tương tác.","B":"Độ hài lòng của khách không phải ý nghĩa của ROAS.","D":"Tốc độ đóng gói thuộc khâu Process."},"source":{"lesson":9,"part":"Phần 2","quote":"các cái chi phí bao gồm quảng cáo, khuyến mãi, Rust để chúng ta đo cái hiệu quả của sự đầu tư"},"keywords":["ROAS","post-live"],"note":""},{"id":"q9-15","n":15,"type":"single","prompt":"Dưới góc độ Kinh tế học Hành vi, yếu tố nào mô tả việc người bán livestream chiếm đoạt sự chú ý để chuyển hóa thành hành vi mua hàng?","options":[{"id":"A","text":"Kinh tế tuần hoàn (Circular Economy)"},{"id":"B","text":"Kinh tế chú ý (Attention Economy)"},{"id":"C","text":"Kinh tế chia sẻ (Sharing Economy)"},{"id":"D","text":"Kinh tế tri thức (Knowledge Economy)"}],"answer":["B"],"confidence":"high","hints":["Nhớ lại hai khái niệm kinh tế học hành vi gắn với livestream.","Một khái niệm nói về trải nghiệm, khái niệm kia nói về thứ khan hiếm trong thời đại internet.","Loại {A}, {C}, {D}: kinh tế tuần hoàn, chia sẻ và tri thức không được nhắc trong bài."],"explanation":"Livestream thuộc kinh tế chú ý: thứ khan hiếm là sự chú ý của người tiêu dùng, và livestream chuyển sự chú ý thành hành vi mua.","whyWrong":{"A":"Kinh tế tuần hoàn không được nhắc trong bài.","C":"Kinh tế chia sẻ không được nhắc trong bài.","D":"Kinh tế tri thức không được nhắc trong bài."},"source":{"lesson":9,"part":"Phần 1","quote":"cái thứ khan hiếm không phải là sản phẩm mà chính là phải lấy được những cái sự chú ý của người tiêu dùng"},"keywords":["kinh tế chú ý","kinh tế trải nghiệm"],"note":""}]},{"id":10,"title":"Bài 10: Kéo traffic ngoại sàn, tối ưu GMV và Affiliate","summary":["Traffic nội sàn đến từ sàn, traffic ngoại sàn đến từ mạng xã hội, website và các nguồn khác. Nội sàn ngày càng khan hiếm và đắt.","Sàn ưu tiên gian hàng trả nhiều tiền hoặc bán tốt, nhà bán nhỏ bị đẩy ra vùng rìa. Ngoại sàn giúp tiếp cận tệp khách hàng lạnh.","Ba chiến lược kéo traffic ngoại sàn: Content và sáng tạo, quảng cáo trả phí, sở hữu kênh tự chủ.","AISAS gồm Chú ý, Quan tâm, Tìm kiếm, Hành động, Chia sẻ. Sàn đóng vai trò từ Search đến Share.","GMV tính cả đơn hủy và hoàn, là thước đo quy mô chứ không phải lợi nhuận. Tối ưu GMV = traffic x CVR x AOV.","Tăng AOV bằng cross-sell, up-sell và bundle.","Affiliate có bốn bên: nhà cung cấp, người tiếp thị, khách hàng và nền tảng. CPS là hình thức hoa hồng phổ biến nhất.","Xu hướng CLV: Content, Livestream, Video dẫn dắt Affiliate."],"questions":[{"id":"q10-1","n":1,"type":"single","prompt":"Chiế
