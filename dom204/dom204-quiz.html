ỉ số sàn Shopee","t":"Thì đấy là những thông tin rất hay. Rồi đối với phần truy cập thì chúng ta cũng sẽ biết được là có bao nhiêu các chỉ số chính là theo lượt xem hay là theo khách truy cập đúng không ạ? Ở đây thì có cái tỉ lệ thoát trang thì chúng ta cũng lưu ý ạ."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Tỉ lệ thoát trang nghĩa rằng là cho chúng ta biết được rằng là có bao nhiêu nhiều người dùng đã truy cập vào trang sản phẩm mà thoát ra mà không thực hiện thêm bất kể một cái đề nghị nào khác. Ví dụ như là à đánh giá sản phẩm hay là xếp hạ sản phẩm vân vân ạ. Thì đây cũng là những chỉ độ rất hay để chúng ta biết được cái hiệu quả về phần cách làm thông tin mô tả sản phẩm của chúng ta."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Rồi đối với phần tab marketing thì đây là những cái thông tin liên quan đến các cái công cụ marketing mà Shopee đã trang bị cho nhà bán hàng. từ phần flat sale vure hay là những cái phần như là giải thưởng có shop thì chúng ta cũng sẽ biết được ở đây hiệu quả. Đó."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Thế thì về cơ bản thì trong a một tài khoản của người bán hàng á chúng ta vừa thấy thì có rất rất nhiều các chỉ số. Vậy thì đâu sẽ là cái thông tin mà chúng ta đặc biệt quan tâm đúng không ạ?"},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Thế thì cái này thì đương nhiên là sẽ tùy theo từng nhà bán hàng họ lựa chọn tùy theo mục tiêu, tùy theo từng giai đoạn phát triển của shop thì họ sẽ quan tâm đến chỉ số nào? Thì ở đây á Mình cũng có gợi ý thêm đó là các nhà bán hàng chúng ta có thể tạo ra một cái dashboard để theo dõi các chỉ số và lựa chọn ra những chỉ số nào thì chúng ta có thể dựa theo một cái gọi là theo hành trình của khách hàng."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Theo cái hành trình của khách hàng. Ví dụ ở đây đây là một ví dụ đó dựa theo một cái hành trình từ phần nhận thức vấn đề cho đến giai đoạn sau mua đúng không ạ? Thì chúng ta sẽ có quan tâm những chỉ số nào theo từng giai đoạn này đó từng chỉ số đo lường."},{"l":11,"p":"Demo Phân tích chỉ số sàn Shopee","t":"Những chỉ số chính để chúng ta đo lường và chúng ta sẽ hình dung được những cái hành Hương trình mua hàng của khách. Vâng thì đây là video demo và giới thiệu với các bạn về cách thức đọc các chỉ số chính một shop trên sàn thương mại điện tử Shopee. Xin cảm ơn các bạn."},{"l":10,"p":"Phần 1","t":"Xin chào các bạn. Ngày hôm nay chúng ta cùng nhau tiếp tục với môn kinh doanh trên sàn thương mại điện tử. Và ngày hôm nay sẽ là bài số 10."},{"l":10,"p":"Phần 1","t":"Bài mang chủ đề kéo traff phí ngoại sàn tối vi và offlate trên sàn thương mại điện tử. Chúng ta sẽ có ba mục tiêu quan trọng trong bài số 10 ngày hôm nay. Mục tiêu thứ nhất đó là chúng ta hiểu về traffic ngoại sàn."},{"l":10,"p":"Phần 1","t":"Thứ hai là chúng ta biết cách tối ưu GMV tổng thể. Và số ba Đó là chúng ta biết cách thức hoạt động của Affilate trên sàn thương mại điện tử như thế nào. Và tương ứng với ba mục tiêu này, chúng ta cũng sẽ có ba nội dung bài học chính trong buổi ngày hôm nay."},{"l":10,"p":"Phần 1","t":"Buổi thứ nhất đó là chúng ta sẽ cùng nhau tổng quan về traffic ngoại sàn. Thứ hai đó là tối ưu GMV tổng thể và thứ ba đó là hoạt động offlate trên sàn thương mại điện tử. Trong phần đầu tiên của bài học chúng ta sẽ tìm hiểu về một khái niệm rất là quan trọng đó là nguồn traffic ngoại sàn."},{"l":10,"p":"Phần 1","t":"Như các bạn đã biết là khi kinh doanh trên các cái sàn thương mại điện tử như Shopee hay TikTok Shop, sàn sản phẩm của chúng ta có thể nhận được một cái lượng truy cập từ nền tảng thì đấy được gọi là nguồn traffic nội sàn. Nhưng đồng thời chúng ta cũng có thể kéo những cái nguồn traffic khác đến từ những cái đơn vị khác, đến từ mạng xã hội hay là đến từ website khác thì người ta gọi đấy là nguồn traffic ngoại sàn nhé."},{"l":10,"p":"Phần 1","t":"Thế thì một vài con số để chúng ta cùng chia sẻ đó là cách nguồn traffic ngoại sàn trong thương mại điện tử như sau. Chúng ta cùng nhau vào phần số một đó là tổng quan về traffic ngoại sàn. À một vài con số ấn tượng để các bạn sẽ thấy là Tại sao nguồn traff phí ngoại sàn là một trong những cái nguồn traff phí quan trọng nhất khi kinh doanh trên sàn thương mại điện tử nhá."},{"l":10,"p":"Phần 1","t":"Đầu tiên thì có tới 63% doanh nghiệp bán lẻ trên toàn cầu đang bán lẻ trên ít nhất ba nền tảng bao gồm cả thương mại điện tử, cả website tự chủ và các nền tảng mạng xã hội."},{"l":10,"p":"Phần 1","t":"Và chỉ có 12% doanh nghiệp bán hàng trên một cái nền tảng duy nhất thôi. Đấ đa kênh là một cái xu thế bắt buộc và ngoại sàn là một phần của chiến lược đa kênh đó. Thứ hai nữa là trong những cái nghỉ trong những cái kỳ nghỉ lễ năm 2025 thì TikTok Shop họ đã có một cái báo cáo là họ đạt doanh số đâu đó khoảng 12,45 triệu đô doanh số tại thị trường Mỹ với 318.000 đơn hàng."},{"l":10,"p":"Phần 1","t":"Tốc độ tăng trưởng thần tốc này doanh thu xuyên biên giới nhân dịp 12 tháng 12 đấy tăng 493% so với cùng kỳ năm trước. Tại Malaysia thì tăng 138%, tại Singapore là tăng 127% và tại Thái Lan là 170%. Đây là một trong những cái minh chứng rõ ràng nhất cho sức mạnh của ngoại sàn."},{"l":10,"p":"Phần 1","t":"Ở đây là mạng xã hội nhé. Nguồn traffic đến từ các cái nhà sáng tạo nội dung này và livestream có thể chuyển đổi GMV khổng lồ chỉ trong một cái thời gian rất là ngắn thôi."},{"l":10,"p":"Phần 1","t":"Thông qua các cái con số này thì chúng ta có thể thấy là phần lớn những cái ngày siêu sale á các cái nguồn traffic đến ngoại từ ngoại sàn sẽ là những cái nguồn traffic chính đem lại doanh thu cho các cái sàn thương mại điện tử hay là các nhà bán. Và mạng xã hội là điểm khởi đầu cho rất nhiều những cái nguồn traffic ngoại sàn. Đầu tiên thì có một cái thống kê như sau."},{"l":10,"p":"Phần 1","t":"Hơn 70% người dùng TikTok mua hàng sau khi họ xem sản phẩm thông qua video trên Fit hoặc là trên livestream. Và cứ hai người tiêu dùng thuộc thế hệ Genj thì sẽ có một người sử dụng TikTok như một công cụ tìm kiếm. Trước đây TikTok chúng ta được hiểu là đây là một công cụ gợi ý chứ không phải là công cụ tìm kiếm."},{"l":10,"p":"Phần 1","t":"Nhưng hiện nay thế hệ trẻ những cái thế hệ Genj nay á thì họ dùng TikTok giống như một công cụ tìm kiếm để họ được tham khảo một cách trực quan thay vì cách tìm kiếm cũ là tìm kiếm trên Google giống như trước đây. Khách hàng người ta còn không vào thẳng Amazon hay là Shopee để tìm kiếm nữa luôn."},{"l":10,"p":"Phần 1","t":"Họ bắt đầu tìm kiếm thông qua mạng xã hội. Do đó việc hiện diện và kéo họ từ các kênh bán hàng có thể là sàn hoặc là web dự chủ đây là một cái chiến lược cực kỳ quan trọng nhá. À tiếp theo nữa là chúng ta sẽ nói đến trí tuệ nhân tạo AI lên ngôi."},{"l":10,"p":"Phần 1","t":"Lưu lượng truy cập của AI tính đến lưu lượng lưu lượng truy cập từ AI đến các cái trang bán lẻ tại Mỹ và ngày cer đây ấy năm 2025 ấy tăng 670% so với cùng kỳ năm trước và người tiêu dùng họ đang sử dụng AI Chat GBT hay là Gemini để họ được gợi ý và so sánh sản phẩm tức là đây là một cái công cụ để họ tham khảo thêm thông tin trước khi họ quyết định mua tối ưu hóa nội dung để các công cụ AI có thể đọc và giới thiệu sản phẩm của bạn là một hình thức kéo traffic ngoại sàn hoàn toàn mới. Và đó là câu chuyện diễn ra trên toàn thế giới."},{"l":10,"p":"Phần 1","t":"Như chúng ta thấy là sàn không chỉ là một đơn vị hoạt động độc lập Và để sàn có thể phát triển tốt thì họ cần kết hợp với các nền tảng mạng xã hội, các website tự chủ hay là từ chính những AI mà chúng ta đang sử dụng hàng ngày. Đấy là câu chuyện của thế giới. Còn tại thị trường Việt Nam thì sao?"},{"l":10,"p":"Phần 1","t":"À thị trường Việt Nam có diễn ra như vậy hay không? Chúng ta cùng nhau tìm hiểu các con số tại thị trường Việt Nam nhé. Đầu tiên thì hiện nay khi mà kinh doanh trên sàn ấ chúng ta sẽ thấy là cái nguồn traffic nội sàn đang ngày càng khan hiếm hơn bởi vì miếng bánh lúc này được chia năm sẻ B."},{"l":10,"p":"Phần 1","t":"Bởi vì sàn thương mại điện tử. Lúc này không chỉ có một mình chúng ta bán mà đang có hàng trăm nghìn nhà bán khác đang kinh doanh trên sàn thương mại điện tử. Và vì vậy cái miếng bánh về thị phần không thể nào phình to ra nhanh được. Nhưng cái số người phải tham gia vào để cạnh tranh nhau để sâu xé miếng bánh nó thì ngày càng lớn."},{"l":10,"p":"Phần 1","t":"Thế nên là cái chi phí đấu thầu quảng cáo của chúng ta đang ngày càng cao hơn. Cái giá thầu thì ăn luôn vào tiền lãi. Mà thầu thấp thì ờ quảng cáo của chúng ta lại không chi tiêu."},{"l":10,"p":"Phần 1","t":"Nhà bán hàng không chủ động được kiểm soát à cách quảng cáo vận hành thì đây chính là thực trạng tại trường Việt Nam. Và câu chuyện của sàn thương mại điện tử nó cũng giống như là câu chuyện của một cái siêu thị khi mới bắt đầu thôi. Khi mới bắt đầu kinh doanh thì cái siêu thị đó cần khách hàng và cần cả nhà bán."},{"l":10,"p":"Phần 1","t":"Thế nên siêu thị đó ban đầu cho chúng ta kinh doanh ở những cái vị trí rất là đẹp. À cho chúng ta rất nhiều những khách hàng thậm chí là tài trợ tiền cho chúng ta để chúng ta kinh doanh. Tuy nhiên sau một thời gian khi mà cái siêu thị đó bắt đầu đông khách lên à đó bắt đầu làm tốt hơn thì các nhà bán nhỏ phải đẩy sang những cái vị trí kém hơn. Tức là chúng ta không có ngân sách để thuê những cái vị trí đẹp giống như trước đây chúng ta được cho nữa."},{"l":10,"p":"Phần 1","t":"Mà bây giờ sàn sẽ bắt đầu bổ những cái vị trí đẹp ra để bán cho những cái nhà bán hàng lớn có ngân sách chi tiêu tốt. Còn những cái nhà bán hàng lẻ thì buộc chúng ta phải đẩy ra những cái vùng rìa, vùng bên ngoài. Đấy là thực trạng của sàn thương mại điện tử nội sàn hiện nay."},{"l":10,"p":"Phần 1","t":"Thế thì khi siêu thị đã qua được cái giai đoạn hút khách hàng rồi, họ sẽ ưu tiên những cái gian hàng nào trả nhiều tiền để thuê hoặc là bán tốt. Còn những cái gian hàng nhỏ sẽ đối diện với tình trạng. Một là chúng ta không có tiền để chúng ta thuê những cái vị trí đẹp."},{"l":10,"p":"Phần 1","t":"Hai là chúng ta bị đẩy lên những cái vị trí kém ít người qua lại đúng không ạ? Và nếu như nội sàn khó khăn hơn thì các nhà bán của chúng ta có những con đường nào để tiếp cận ngoại sàn? Đầu tiên chúng ta nói về nội sàn và ngoại sàn."},{"l":10,"p":"Phần 1","t":"Nó giống như một cái biểu đồ đang biểu hiện ở trên bảng nội sàn đại diện cho những khách hàng người ta đã có vấn đề và họ tiến hành đi tìm kiếm."},{"l":10,"p":"Phần 1","t":"Ví dụ thầy Thành ngày hôm nay lau nhà và thầy Thành bị cái chổi lau nhà của thầy Thành bị hỏng. Ngay lập tức thầy Thành sẽ lên Shopee để tra cứu là chổi lau nhà. Bởi vì thầy Thành là một cái người có vấn đề và thầy Thành đang tìm kiếm để giải quyết những cái vấn đề của mình."},{"l":10,"p":"Phần 1","t":"Ngay lập tức thầy Thành sẽ nhận được hàng trăm nghìn kết quả khác nhau. Và hầu hết các kết quả ban đầu ấy, những cái lựa chọn ban đầu nhất mà thầy Thành được tiếp cận là những shop đã bán được rất là tốt là những cái thương hiệu rất lớn và tuyệt nhiên thầy Thành không thấy những cái thương hiệu nhỏ đâu, những cái thương hiệu mới đâu và thầy Thành chính là đại diện cho một cái tệp khách hàng có nhu cầu và muốn đi tìm kiếm. Và khi mà câu chuyện đó xảy ra, tình huống đó xảy ra thì chúng ta cũng bắt đầu đặt một câu hỏi."},{"l":10,"p":"Phần 1","t":"Thế nếu chúng ta là những nhà bán hàng mới, chúng ta là những cái thương hiệu mới, chúng ta chưa có sản phẩm để chúng ta à đủ uy tín để chúng ta bán thì có phải là chúng ta sẽ không thể cạnh tranh được trên nội sàn có phải không? Câu trả lời chính là như vậy. Và lúc đó chúng ta sẽ nghĩ đến một cái việc thế thì thay vì để thầy Thành phải hỏng cái chổi lau nhà, thế bây giờ tôi có thể tiếp cận một cái chổi lau nhà loại mới cho thầy Thành được không?"},{"l":10,"p":"Phần 1","t":"Tôi có thể tiếp thị một cái sản phẩm mới cho thầy Thành được không? Thế thì lúc đó chúng ta phải nghĩ đến một cái câu chuyện lớn hơn chính là câu chuyện ngoại sàn. Vẫn là thầy Thành lau nhà nhưng cây chổi lau nhà của thầy Thành thì đã cũ rồi."},{"l":10,"p":"Phần 1","t":"Mặc dù nó vẫn dùng tốt nhưng mà nó cũng là một cái cây lau nhà cũ. Và cây lau nhà này nó có một cái đặc điểm là nó chỉ có một một cái ngăn ngăn để đựng nước thôi. Nước bẩn và nước sạch thì đều để trong một ngăn hết. Thế thì tôi sẽ làm như thế nào để tiếp cận những cái người như thầy thầy?"},{"l":10,"p":"Phần 1","t":"Mặc dù chưa có nhu cầu thay chổi lau nhà nhưng tôi sẽ cân nhắc một cái nội thoại chổi lau nhà nó sẽ ưu việt hơn, tối ưu hơn. Thế thì tình huống thứ hai chính là tình huống của ngoại sàn khi chúng ta tiếp cận khách hàng ngay từ khi khách hàng chưa có nhu cầu nhưng sẽ cân nhắc mua nếu như được thuyết phục. Và vai trò của ngoại sàn chính là vậy, một vai trò rất lớn."},{"l":10,"p":"Phần 1","t":"trong việc là gợi ý. Ngoại sàn là một cái lựa chọn tốt để chinh phục một cái nhóm khách hàng rộng lớn hơn, giảm bớt sự cạnh tranh của nội sàn. Nếu chúng ta chỉ khai thác được nhu cầu nóng sốt, nhu cầu cấp thiết của khách hàng thì cái tiếp cận của chúng ta sẽ rất là giới hạn."},{"l":10,"p":"Phần 1","t":"Chưa kể là chúng ta còn bị chia năm sẻ bảy miếng bánh cho các bên đối thủ khác. Thế thì tệp khách hàng lạnh tuy nhu cầu của họ chưa quá nét nhưng chúng ta cần chủ động giới thiệu, thuyết phục và dung lượng của nhóm. đối tượng này cực kỳ lớn các bạn nha. Đấy, nhu cầu của nhóm đối tượng này cực kỳ lớn."},{"l":10,"p":"Phần 1","t":"Thế thì ngoại sàn nó có những cái đặc điểm nào à nó vượt trội hơn so với cái nguồn traffic nội sàn? Đầu tiên đó là cái định dạng nội dung trên trên trên nội sàn ấy thì nó bị giới hạn các bạn ạ. Các bạn có thể tưởng tượng trên Shopee hiện nay á cái định dạng của nó đơn thuần chỉ là những bức ảnh có điểm suyết thêm một vài cái video nhưng cái video đấy nó cũng không trực quan và hình như nó cũng hơi bị giả giả một chút có đúng không ạ?"},{"l":10,"p":"Phần 1","t":"Thế thì định dạng nội dung trên trên sàn thương mại điện tử nó bị kém hơn so với các định dạng trên các cái nền tảng mạng xã hội. Bởi vì định dạng trên mạng xã hội đa dạng hơn. Chúng ta có video, chúng ta có ảnh, chúng ta có landing page, chúng ta có rất nhiều những cái cách để chúng ta thể hiện cho chức năng, công năng, tính năng của một cái sản phẩm."},{"l":10,"p":"Phần 1","t":"Được chưa ạ? Rất đa dạng về việc này. Và tiếp nữa đó là gì ạ? Việc chủ động chúng ta tiếp cận đến khách hàng là một cách làm thương hiệu tốt."},{"l":10,"p":"Phần 1","t":"Bởi vì thương hiệu không chỉ là bạn làm một cái sản phẩm tốt, và bạn chờ khách hàng đến công nhận bạn tốt. Điều đó trong thế giới số rất là khó và rất là cạnh tranh. Thế thì một cái sản phẩm tốt cần được đem ra để đi giới thiệu với người khác trước khi người ta tìm đến mình."},{"l":10,"p":"Phần 1","t":"Thế thì thương hiệu là một kết quả, là một quá trình bạn phải chủ động tiếp cận bán hàng khiến khách hàng nhớ tới mình và tác động tới việc bán hàng của khách. Thế thì nếu chúng ta đang xây dựng một cái thương hiệu mới, rõ ràng rằng việc chúng ta chủ động tiếp cận thông qua các nền tảng mạng xã hội hoặc là các website tự thân của chúng ta bao giờ cũng sẽ có lợi hơn so với việc để khách hàng chủ động tìm kiếm chúng ta trên các nền tảng sàn thương mại điện tử nhé."},{"l":10,"p":"Phần 1","t":"Được chưa ạ? Và tiếp theo nữa là việc xây dựng thương hiệu nó là một cái quá trình thông qua việc chúng ta chủ động tiếp cận."},{"l":10,"p":"Phần 1","t":"Nếu như chúng ta chỉ tiếp cận thuần sàn ấy thì bao giờ khách có nhu cầu người ta mới tìm kiếm đến mình và lần sau khách hàng người ta có thể quên chúng ta đi rất là nhanh. Nhưng với việc các bạn tiếp cận đa kênh tiếp cận ngoại sàn thì khi khách hàng người ta có nhu cầu người ta có tìm kiếm thì có một cách nữa để chúng ta có thể chủ động tiếp cận khách hàng chính là chúng ta quảng cáo ngay từ trên các cái nền tảng mạng xã hội và thương hiệu sẽ được tiếp cận một cách chủ động hơn tới khách hàng của mình và sau này á à các cái việc tiếp cận ngoại sàn ấy nó là còn là một quá trình nuôi dưỡng nhắc nhở và tạo ra sự kết nối giữa thương hiệu và khách hàng và khách hàng sẽ khó bị quên hơn và người ta ta sẽ dễ tạo ra nhiều lần doanh thu sau khi mua nữa."},{"l":10,"p":"Phần 1","t":"Tức là tỉ lệ khách hàng quay lại sẽ cao hơn nhờ việc chúng ta chủ động giới thiệu, chúng ta chủ động kết nối, chúng ta chủ động tương tác với khách hàng thông qua các nền tảng mạng xã hội. Được chưa ạ?"},{"l":10,"p":"Phần 1","t":"Và quảng cáo ngoại sàn là một cách để chúng ta ra tiền ngay mà không phải chịu phí sàn. Đầu tiên thì chủ động tiếp cận khách hàng từ ngoại sàn bằng quảng cáo là một cách tiếp cận rất nhanh. Có thể khách hàng không cần phải vào Shopee mua một sản phẩm của các bạn mà người ta có thể mua ngay thông qua liên hệ Facebook cá nhân của các bạn."},{"l":10,"p":"Phần 1","t":"Việc thiết lập một trang Facebook TikTok cũng là một cách đơn giản, nhanh chóng hơn à so với việc thiết lập một cái gian hàng trên Shopee sau đó setting vào nhé. Ok chưa ạ? Đấy và kết luận là gì?"},{"l":10,"p":"Phần 1","t":"Chúng ta muốn bán hàng tốt, chúng ta muốn giảm bớt cái sự cạnh tranh và kết luận cho việc này đó là chúng ta muốn bán hàng tốt. Việc mở rộng tệp và chủ động tiếp cận, chủ động giới thiệu trên đến khách hàng thông qua hình thức ngoại sàn là một chiến lược tất yếu chúng ta phải làm theo. Và các cái nguồn traff phí ngoại sàn phổ biến hiện nay hay bao gồm những cái nguồn nào? Đầu tiên chúng ta sẽ nói đến mạng xã hội. Đây là một nguồn traffic lớn nhất hiện nay."},{"l":10,"p":"Phần 1","t":"Đây có thể xem là một cái kênh ngoại sàn quan trọng bậc nhất, nơi người bán có thể tiếp cận. Nơi người bán có thể tiếp cận và tương tác trực tiếp với khách hàng tiềm năng. À chúng ta có thể nói đến Facebook với cái sự tiếp cận người dùng lớn nhất hiện nay khoảng 66 triệu tại thị trường Việt Nam."},{"l":10,"p":"Phần 1","t":"Đa dạng hình thức bán hàng, hỗ trợ chạy quảng cáo và xây dựng cộng đồng. Thứ nữa là Instagram thế mạnh là hình ảnh rất là tốt, video rất là đẹp và phù hợp với những cái ngành có thẩm cao ví dụ thời trang, đồ handmade hay là mỹ phẩm và TikTok. Dĩ nhiên rồi, đây là một cái mô hình kết hợp mua sắm, kết hợp với giải trí, tốc độ tăng trưởng vược bậc vượt bậc và có khả năng lan tỏa, tạo ra xu hướng mạnh mẽ."},{"l":10,"p":"Phần 1","t":"Ngoài ra thì chúng ta có thể nói đến các cái website một cách độc lập. Đây là kênh do chính doanh nghiệp của chúng ta xây dựng và chúng ta quản lý, mang lại sự chủ động và thương hiệu riêng. Doanh nghiệp thì tự xây dựng để bán hàng trực tiếp dịch vụ của mình."},{"l":10,"p":"Phần 1","t":"Ưu điểm thì website của chúng ta hoạt động 24/7, tiếp cận khách hàng toàn cầu. tiết kiệm chi phí vận hành và xây dựng thương hiệu độc lập và làm chủ về mặt dữ liệu khách hàng nhé. Tiếp nữa chúng ta có thể tìm hiểu đến các cái kênh nhà bán lẻ đa kênh ví dụ như Plus."},{"l":10,"p":"Phần 1","t":"Đây là cái sàn thương mại điện tử của hệ thống bán lẻ của Nhật nhá. Nó kết hợp giữa trải nghiệm mua sắm online và hệ thống cửa hàng offline. Sau khi chúng ta đã hiểu về các cái nguồn traffic ngoại sàn thì câu hỏi quan trọng tiếp theo là làm thế nào để chúng ta kéo được lượng traffic đó về gian hàng của mình."},{"l":10,"p":"Phần 1","t":"Thế thì có mấy chiến lược như sau. Chiến lược đầu tiên đó là chiến lược liên quan đến content và sáng tạo, đầu phễu và tạo ra nhu cầu. Đây là một chiến lược tập trung vào việc xây dựng các cái lòng tin và sự quan tâm từ khách hàng trước khi họ có ý định mua sắm nhé."},{"l":10,"p":"Phần 1","t":"Các cái nội dung về xây dựng lòng tin bao gồm thay vì chúng ta tập trung quảng cáo trên sàn thì hãy tạo ra những cái nội dung giải quyết vấn đề như một cái bài blog để so sánh này hay là một cái hướng dẫn sử dụng cho khách hàng hay là một cái video unbox chân thực trên các cái nền tảng Instagram hay là TikTok. Chúng ta có thể tận dụng sức mạnh của những cái người ảnh hưởng bao gồm chúng ta booking KC đấy."},{"l":10,"p":"Phần 1","t":"Đặc biệt là những cái nhóm KOC nhỏ nhá. Chúng ta gọi là micro và nano influencer influencer ấy. Đấy."},{"l":10,"p":"Phần 1","t":"À tiếp theo là tận dụng sức mạnh của những cái người ảnh hưởng đó là việc chúng ta kết hợp cùng các KL KOC để tạo ra những cái nội dung chân thật. Phương pháp này thì đặc biệt hiệu quả vì lượng người theo dõi của cái nhóm này có độ tin tưởng nhất định rồi. Và thứ ba đó là chúng ta sẽ tận dụng một cái nền tảng trực quan bằng việc chúng ta sử dụng video ngắn. Thì đây là một cái hình thức gọi là vua trong cái việc là chúng ta thu hút sự chú ý rồi."},{"l":10,"p":"Phần 1","t":"Chúng ta hoạt động giống như một cánh cửa dẫn dắt người xem và nội dung chi tiết hơn. Từ đó gia tăng chất lượng chuyển đổi khi họ được dẫn về sàn nhé. Chiến lược số hai đó chính là chiến lược chúng ta kéo traffic ngoại sàn về gian hàng của mình thông qua chúng ta trả phí để chúng ta tiếp cận."},{"l":10,"p":"Phần 1","t":"Thế thì hiện nay nhóm nhóm chiến lược này thì tập trung vào việc là chúng ta tiếp cận khách hàng ở đúng thời điểm họ đang có nhu cầu. Như các bạn đã biết thì hiện nay các cái nền tảng online á thì rất là chính xác trong việc là đưa một cái nội dung đến với cái người cần cái nội dung đó. Thế thì quảng cáo cũng như vậy."},{"l":10,"p":"Phần 1","t":"Hiện nay khách hàng của chúng ta được phân tách thành các cái dữ liệu quan trọng và nền tảng thì họ sở hữu những cái dữ liệu đó. Và từ cái việc chạy quảng cáo thì họ đảm bảo là họ sẽ đưa được nội dung đến chính xác là cái người nào cần nội dung của các bạn, cái sản phẩm của các bạn. Thế thì có những cái cách nào để chúng ta có thể quảng cáo?"},{"l":10,"p":"Phần 1","t":"Đầu tiên là chúng ta có thể quảng cáo trên chính cái thanh công cụ tìm kiếm trên Google. Đây là một cái kênh đặc biệt, hiệu quả để chúng ta có thể đánh thức nhu cầu và dẫn dất khách hàng đến trang sản phẩm. Thứ hai là chúng ta có thể mở rộng tiếp cận thông qua quảng cáo ngoại sàn nhé."},{"l":10,"p":"Phần 1","t":"Thông qua việc là chúng ta có thể kết hợp cung cấp các giải pháp bên ngoài cái nền tảng bao gồm là các bạn có thể tạo những cái chiến dịch quảng cáo trên Google, Pinterest để tăng RAS lên. Với các giải pháp này sử dụng dữ liệu khách hàng từ nhà bán lẻ để nhắm mục tiêu một cách chính xác trên website hơn. Đấy."},{"l":10,"p":"Phần 1","t":"Thứ ba là chúng ta có chiến lược liên quan đến sở hữu khách hàng bằng việc là chúng ta ta xây các cái kênh tự chủ. Chiến lược này giúp chúng ta chủ động không phải là phụ thuộc vào hoàn toàn vào các nền tảng nhé. Xây kênh sở hữu riêng nó giống như việc chúng ta xây một cái nền móng cho sự phòng thủ á."},{"l":10,"p":"Phần 1","t":"Bởi vì khi khách hàng người ta bắt đầu biết đến tên thương hiệu của các bạn thì đầu tiên người ta sẽ tìm xem là website của bạn là gì. À bạn có Facebook không? Bạn có TikTok không?"},{"l":10,"p":"Phần 1","t":"Bạn có YouTube không? Và nếu như mà chúng ta không có thì chắc chắn khách hàng người ta sẽ đánh giá là đây là một cái thương hiệu chưa quá được nhiều người hiểu biết. À đây là một cái thương hiệu chưa uy tín."},{"l":10,"p":"Phần 1","t":"Còn Ngược lại, nếu như chúng ta làm tốt các cái hoạt động liên quan đến nuôi dưỡng phòng thủ như vậy thì rõ ràng rằng chúng ta sẽ có lợi hơn về mặt hình ảnh trước mặt khách hàng nhá. Chúng ta có thể tận dụng tối đa đấy những cái gì ạ? À những cái cái cách để chúng ta có thể xây kênh tự thân, có thể là website hoặc là TikTok hoặc là ờ một cái a cái kênh Facebook của chúng ta thông qua việc này."},{"l":10,"p":"Phần 1","t":"Thứ ba là chúng ta kết nối hành trình khách hàng đa kênh. Để hiểu cách cho phí ngoại sàn dẫn khách hàng đến hành động mua hàng như thế nào thì chúng ta có có thể sử dụng mô hình mang tên là ISAS."},{"l":10,"p":"Phần 1","t":"Hiện nay mô hình ISAS này khá phù hợp với những anh những ờ hiện nay mô hình ISAS này khá phù hợp với trong lĩnh vực thương mại điện tử. Mô hình ISAS này bao gồm năm pha quan trọng trong hành trình khách hàng. Đầu tiên đó là pha liên quan đến sự chú ý."},{"l":10,"p":"Phần 1","t":"À tại đây thì các bạn có thể tạo lập những cái video ngắn tập trung vào lợi ích, đăng tải trên các nền tảng mạng xã hội, sử dụng quảng cáo để nhắm đúng đối tượng hơn. Thứ hai là liên quan đến interest, tức là chúng ta có thể chạy quảng cáo người dùng đã tương tác với video trên Facebook. Facebook, Instagram để chúng ta hiển thị thông tin chi tiết, bài viết so sánh hoặc là các cái ưu đãi đặc biệt."},{"l":10,"p":"Phần 1","t":"Thứ ba là cái người tiêu dùng người ta bắt đầu tìm kiếm. Đấy thì chúng ta có thể tối ưu các nội dung trên blog hoặc là các cái video review để xuất hiện trên các cái thanh tìm kiếm và có thể chạy các cái từ khóa thương hiệu, từ khóa chung. Đây là bước đặc trưng nhất của ISAT chính là khách hàng bắt đầu so sánh và đánh giá."},{"l":10,"p":"Phần 1","t":"Bước so sánh và đánh giá này thì người ta có thể so sánh cả trên Shopee và trên a các cái nền tảng sàn thương mại điện tử nữa nhé. Bước tiếp theo là họ sẽ hành động thì chúng ta có thể có cái link dẫn này các cái ưu đãi độc quyền sử dụng các cái link đặc biệt à để theo dõi cái nguồn traffic đến từ cái nguồn này và tạo các cái mã giảm giá dành riêng cho khách hàng từ Google, TikTok để khuyến khích chuyển đổi và tận dụng các cái à cái cái cái hoạt động về thương hiệu của sàn."},{"l":10,"p":"Phần 1","t":"Và cuối cùng đấy là share. Khách hàng trên môi trường số thì người ta sẽ có một cái hoạt động đấy là à feedback và share cái thông tin này cho các cái đối tượng khách hàng ác, những cái người thân, người quen bạn bè thông qua kênh TikTok hoặc là kênh Facebook. Thế thì cái pha cuối cùng trong cái phễu chuyển đổi này chính là hoạt động liên quan đến share."},{"l":10,"p":"Phần 1","t":"Từ mô hình ISAT chúng ta cũng có thể rút ra được một góc nhìn rất quan trọng về vai trò của thương mại điện tử trong hành trình mua sắm khách hàng."},{"l":10,"p":"Phần 1","t":"Thực tế thì sàn thương mại điện tử giống như một cái pha chung kết trong toàn bộ cái trận đấu này thôi. À sàn thương mại điện tử đóng vai trò từ search cho đến action cho đến xe. Còn lại thì phải phụ thuộc vào ngoại sàn trong các cái vai trò liên quan đến nhận biết và tạo ra các cái nhu cầu."},{"l":10,"p":"Phần 1","t":"Đấy, tra phức ngoại sàn đây là một cái nhiên liệu cho toàn bộ hành trình. Nó không chỉ mang lại người mua về sàn mà còn nuôi dưỡng họ từ những cái giai đoạn đầu tiên. À search chính là chìa khóa."},{"l":10,"p":"Phần 1","t":"Trong mô hình ISAS này thì giai đoạn tìm kiếm là cầu nối quan trọng nhất giữa quan tâm và mua hàng, đầu tư cho sale, US, Content Blog hay là các video review. Đây là một cách tận dụng tối đa cái nguồn traffic chủ động này nhé."},{"l":10,"p":"Phần 1","t":"Và cuối cùng đấy là một cái vòng lập vô tận share tạo ra attention mới khách hàng khi người ta đã cảm thấy hài lòng với với sản phẩm dịch vụ rồi thì rõ ràng họ sẽ giới thiệu, họ sẽ làm những video feedback về những sản phẩm và chúng ta lại tạo ra một cái vòng lập mới, vòng lặp mới từ attention cho đến xe. Và đây chính là nội dung tổng kết của phần số 1."},{"l":10,"p":"Phần 2","t":"Chúng ta cùng nhau sang phần số hai. Sau khi mà đã tìm hiểu về các chiến lược kéo traffic ngoại sàn rồi, chúng ta sẽ cùng nhau chuyển sang nội dung liên quan đến tối ưu GMV tổng thể. Đầu tiên thì khái niệm GMV là gì?"},{"l":10,"p":"Phần 2","t":"GMV là tổng giá trị hàng hóa được giao dịch trên các nền tảng sàn thương mại điện tử trong một khoảng thời gian nhất định. Công thức là GMV bằng số lượng đơn hàng nhân với giá trị trung bình mỗi đơn và GMV bằng tổng lượng sản phẩm bán ra nhân với giá bình quân thì ra GMV. Đấy."},{"l":10,"p":"Phần 2","t":"Thế Thì điểm quan trọng của GMV trong thương mại điện tử là gì? Đầu tiên đây là một thước đo về quy mô. Quy mô thì khác so với lợi nhuận bởi vì GMV là một cái doanh số tổng thể chưa được trừ đi các loại chi phí và cũng chưa trừ đi các cái loại đơn hàng hoàn hủy."},{"l":10,"p":"Phần 2","t":"Thế nên về bản chất GMV là quy mô chứ không phải lợi nhuận nhé. GV sẽ phản ánh sức khỏe của thương hiệu, thị phần, tốc độ tăng trưởng nhưng không phải là doanh thuần của người bán đâu."},{"l":10,"p":"Phần 2","t":"JV bao gồm gồm tổng tất cả những cái đơn hàng kể cả đơn vàng hủy, đơn hàng chưa thanh toán, đơn hàng trả hàng hoàn tiền. Một ví dụ rất trực quan cho các bạn. Đầu tiên đó là bạn bán được 100 đơn hàng trong 1 tháng."},{"l":10,"p":"Phần 2","t":"Mỗi đơn trị giá 500.000đ. GMV sẽ bằng 100 x 500.000 bằng 50 triệu. Tuy nhiên trong 100 đơn này thì sẽ có năm đơn bị hủy."},{"l":10,"p":"Phần 2","t":"Năm đơn bị hủy này trị giá là 2,5 triệu. 10 đơn khách hàng trả lại trị giá là 5 triệu. Và bạn phải trả phí sàn, phí vận chuyển, chiết khấu cho Offet."},{"l":10,"p":"Phần 2","t":"Jimv vẫn là 50 triệu nhưng doanh thu thực tế và lợi nhuận của bạn sẽ thấp hơn nha. Thì đấy chính là sự khác biệt giữa GMV và doanh thuần. Thế thì phần số một, chúng ta đã dùng các chiến lược ngoại sàn để tạo ra cho fix rồi và chốt đơn thành công trên sàn rồi."},{"l":10,"p":"Phần 2","t":"Những cái đơn hàng đó chính là những cái hạt nhân cấu thành nên GMV cho fix từ ngoại sàn bao gồm Facebook, Google, TikTok là một cái nguồn nước chảy vào sàn. Còn GMV chính là lượng nước được tích trữ lại thì chúng ta gọi là tổng doanh thu. Được chưa ạ?"},{"l":10,"p":"Phần 2","t":"Thế thì ở đây tổng số lượng đơn hàng kết nối trực tiếp với traffic, số lượng đơn hàng quyết định bởi hai yếu tố quan trọng. Một, bạn có bao nhiêu lưu lượng truy cập? Người ta có một câu nói đấy là traffic is king, tức là có traffic là có tiền."},{"l":10,"p":"Phần 2","t":"Cái thứ đầu tiên mà cấu thành lên GMV của chúng ta chính là bạn có bao nhiêu traffic, bao nhiêu lưu lượng truy cập? Và từ số lưu lượng truy cập đó làm sao để bạn có thể tạo ra một yếu tố được gọi là tỉ lệ chuyển đổi. Tức là trong số traffic đi vào thì sẽ có bao nhiêu khách hàng họ quyết định mua thì chúng ta gọi đó là sự chuyển đổi."},{"l":10,"p":"Phần 2","t":"Và chúng ta thường đo bằng con số là tỉ lệ chuyển đổi. Thế thì thông qua bảng trên chúng ta sẽ thấy là yếu tố cốt lõi là traffic đấy và CVR tức là phần trăm khách hàng mua trên tổng số khách hàng truy cập."},{"l":10,"p":"Phần 2","t":"Thế thì với chiến lược kéo traffic ngoại sàn ấy thông qua cái à cái cái hành trình khách hàng ISAS giúp đưa khách hàng từ Facebook cù Google vào trong gian hàng và chất lượng traffic đó là traffic cao thì khách hàng sẽ bắt đầu search, khách hàng sẽ bắt đầu chú ý và khách hàng sẽ bắt đầu chuyển đổi. Thì hiện nay chúng ta có hai công việc cần làm nếu như muốn tăng doanh thu. Một là tối ưu một cái điểm trạm cá nhân, đảm bảo trang đầu tiên khách hàng thấy thường là những sản phẩm đó à trang chủ gian hàng phải đúng với thông điệp sản phẩm và ưu đãi đã cam kết trong quảng cáo."},{"l":10,"p":"Phần 2","t":"Thứ hai nữa để tối ưu CVR ấ tức là tối ưu tỉ lệ chuyển đổi ấy thì chúng ta phải tối ưu gian hàng một cách tổng thể bao gồm cho Chúng ta phải có một gia hàng giao diện chuyên nghiệp. Chúng ta sắp xếp danh mục gian hàng một cách khoa học. Rồi là chúng ta có video giới thiệu về shop."},{"l":10,"p":"Phần 2","t":"Rồi là tối ưu trên từng sản phẩm bao gồm là hình ảnh này, mô tả chi tiết và các cái bằng chứng xã hội cho thấy rằng sản phẩm về chất lượng cao. Nhờ tối ưu hai cái tỉ lệ này thì chúng ta mới bắt đầu có doanh thu, có GMV. Được chưa ạ?"},{"l":10,"p":"Phần 2","t":"Thế thì tối ưu doanh thu còn là việc chúng ta có thể tối ưu giá trị trung bình đơn hàng người ta gọi là AOV. Đấy. Thế thì thường chúng ta sẽ làm như thế nào?"},{"l":10,"p":"Phần 2","t":"Thầy ví dụ cho các bạn đó là ví dụ chúng ta bán một bịch cơm cháy đi chẳng hạn. Ví dụ ch một traffic vào người ta chỉ mua một bịch cơm cháy trị giá 50.000đ thôi thì GMV lúc này chúng ta có chỉ là 50.000 thôi. Nhưng nếu như các bạn biết bán thành một cái combo đấy vàng ba bịch cơm cháy thì được giảm 5000 chẳng hạn thì các bạn sẽ tăng được cái IOV lên."},{"l":10,"p":"Phần 2","t":"Một khách hàng thay vì bây giờ họ chỉ mua là 50.000đ thì bây giờ họ vào họ mua ba bịch cơm cháy thì sẽ giá trị đơn hàng sẽ lên tới là 14 5000 chẳng hạn thì chúng ta sẽ đã tăng được gì ạ? Tăng được GMV lên rồi."},{"l":10,"p":"Phần 2","t":"Thế thì tương tự như vậy chúng ta có các chiến lược như sau. Một là chúng ta bán chéo, tức là chúng ta gợi ý các cái sản phẩm liên quan bổ t ưu GMV chính là sử dụng tổng hòa các chiến lược chiến dịch để làm sao mà tăng được giá trị đơn hay là tăng lượt truy cập lên và tăng tỉ lệ chuyển đổi lên. Ok chưa ạ? Thế thì tối JDV tổng thể là thức đo tổng giá trị hàng hóa bán ra phản ánh đúng quy mô về mặt kinh doanh."},{"l":10,"p":"Phần 2","t":"Tối GMV là một bài tám tuần tổng hòa không thể tách rời giữa kéo traffic và chốt khách. Công thức tổng lại rất đơn giản đó là gì? Traffic chất lượng này nhân với tỉ lệ chuyển đổi này nhân với giá trị đơn hàng."},{"l":10,"p":"Phần 2","t":"thì GMV của các bạn sẽ bùng nổ thôi. Đây là kiến thức lý thuyết làm cơ sở cho phần tiếp theo. Được chưa ạ?"},{"l":10,"p":"Phần 2","t":"Chúng ta sẽ nói đến hoạt động affilate trên sàn thương mại điện tử. Hoạt động affilate là một trong những cái hoạt động đã bùng nổ rất trong đâu đó khoảng 3 năm nay."},{"l":10,"p":"Phần 2","t":"Kể từ khi sàn thương mại điện tử TikTok Shop bắt đầu xuất hiện tại thị trường Việt Nam năm 2022 thì Affilate giờ đây không chỉ còn là một kỹ năng nữa mà đây còn là kỹ năng sinh tồn dành cho những ai muốn bán hàng tốt. và muốn tối đa hóa doanh thu của mình khi mà chúng ta kinh doanh trên sàn nhé. Vậy thì chúng ta cùng nhau tìm hiểu về affilate trên sàn thương mại điện tử sẽ hoạt động như thế nào."},{"l":10,"p":"Phần 2","t":"Đầu tiên là affilate là một mô hình tiếp thị liên kết trực tuyến cho phép người tiếp thị quảng bá dịch vụ ấy của nhà cung cấp và nhận hoa hồng khi có khách mua hàng. Chúng ta cứ hiểu đơn giản affilate chính là việc chúng ta giới thiệu review một cái sản phẩm của một cái nhà bán và chúng ta được ăn hoa hồng từ chính cái việc chúng ta bán một cái sản phẩm như vậy đúng không ạ? Thế thì có vai trò như thế nào trong tổng hòa của hệ sinh thái của những nhà bán? Đầu tiên nhà cung cấp đ là chủ sở hữu dịch vụ xây dựng chương trình affilate và trả hoa hồng."},{"l":10,"p":"Phần 2","t":"Phần lớn những nhà bán như chúng ta sẽ xây dựng chương trình cho những người affil làm sao để họ hấp dẫn được họ. Thứ hai là đơn vị vận chuyển. Và bước số năm là theo dõi hành trình và hoàn tất đơn hàng."},{"l":11,"p":"Toàn bài","t":"Trên slide chúng ta có thể thấy Đây là quy trình vận hành tổng quan của từng sàn thương mại điện tử Shopee và TikTok. Trong quy trình vận hành trên sàn thương mại điện tử, chúng ta không thể bỏ qua một khâu cực kỳ quan trọng đó là tiêu chuẩn đóng gói hàng hóa. Đồng thời điều này cũng sẽ giúp cho việc chúng ta tuân thủ đúng quy định và tránh bị nền tạm phạt."},{"l":11,"p":"Toàn bài","t":"Đóng gói là nghệ thuật để bảo vệ uy tính của shop. Các bạn phải nhớ rằng khách hàng mua hàng trên sàn thương mại điện tử thường có tâm lý rất mong chờ nhưng nếu nhận được một cái hộp móp méo rách nát thì cảm xúc của họ sẽ chuyển sang tiêu cực ngay lập tức tiêu chuẩn đóng gói chuẩn của sàn yêu cầu chúng ta phải đảm bảo tiện hàng chịu được lực rơi từ độ cao 1 m mà không hư họng sản phẩm bên trong một lỗi rất phổ biến mà shop thường mắc phải khi vận hành là dán băng keo đè lên mã vận đơn các máy quét của đơn vị vận chuyển rất nhạy cảm với ánh sáng nếu băng keo làm phản quang mã sẽ không thể đọc được đơn hàng cũng sẽ bị tồn đọng lại tại khoển."},{"l":11,"p":"Toàn bài","t":"Đặc biệt về việc lưu trữ bằng chứng đóng gói, thương mại điện tử luôn có rủi ro về việc cháo hàng hoặc hư hỏng do vận chuyển. Vì vậy, hãy tạo thói quen quay video trong quá trình đóng gói và chụp ảnh kiện hàng đã dán vận đơn trước khi giao cho B. Phần cuối cùng của quy trình vận hành là kiểm soát các chỉ số."},{"l":11,"p":"Toàn bài","t":"Cả Shopee và TikTok Shop đều vận hành dựa trên các con số. Nếu chúng ta vi phạm thì san sẽ phạt bằng cách ví dụ như là cắt trợ giá giảm hiển thị hoặc nặng nhất nó sẽ khóa so thì trên đây là một số các chỉ số vận hành chính ở trên hai sàn trên mạng điện tử mà chúng ta cần hiểu và vận hành một cách nghiêm túc sau khi đã xử lý xong đơn hàng thì câu hỏi tiếp theo đặt ra đó là ai là người đã mua hàng của chúng ta và để tìm hiểu được nội dung này thì chúng ta sẽ chuyển qua phần tiếp theo trong bài học ngày hôm nay Đó là thu thập thông tin và quản lý thông tin khách hàng."},{"l":11,"p":"Toàn bài","t":"Trên sàn thương mại điện tử, thông tin khách hàng là một loại vàng đen mà sàn thường giữ riêng cho họ. Hiện nay thì cả Shopee và TikTok Shop đều áp dụng chính sách share thông tin khách hàng trên vận đơn và trong hệ thống quản lý đơn hàng để bảo vệ quyền riêng tư. Chúng ta sẽ chia dữ liệu khách hàng thành ba nhóm chính. Nhóm một là dữ liệu định danh."},{"l":11,"p":"Toàn bài","t":"Nhóm hai là dữ liệu hành vi và nhóm thứ ba là dữ liệu giao dịch với vai trò quan trọng của dữ liệu khách hàng trong kinh doanh nói chung cũng như là kinh doanh trên sàn thương mại điện tử nói riêng. Vậy thì các nhà kinh doanh trên sàn chúng ta sẽ có một số những cách thức nào để có thể có được dữ liệu khách hàng? Thì trên slide là một vài ý để chúng ta có được điều này."},{"l":11,"p":"Toàn bài","t":"Sau khi đã có được dữ liệu thì chúng ta không thể để chúng nằm yên trong một cái sách dài dàng đặc được chúng ta cần một tư duy quản trị khoa học và mô hình trên slide muốn giới thiệu với các bạn đó là RFM một công thức kinh điển trong marketing dữ liệu RFM giúp chúng ta phân loại khách hàng thành từng nhóm để có cách ứng xử phù hợp chữ R cho chúng ta biết khách hàng vừa mua hàng của mình hôm qua hay là đã từ một khoảng thời gian nào đó chữ F cho biết mức độ trung thành khách hàng mua thường xuyên hay chỉ chờ có giả giá cực sâu mới mua và chữ M cho biết giá trị túi tiền của khách."},{"l":11,"p":"Toàn bài","t":"Dựa vào đây, chúng ta có thể chia ra được các phân khúc khách hàng khác nhau. Ví dụ như có thể có nhóm VIP, nhóm nguy cơ hay nhóm tiềm năng. Đây là một bảng ví dụ trong việc ứng dụng mô hình RFM và phân loại khách hàng theo chữ M ở trong mô hình đó."},{"l":11,"p":"Toàn bài","t":"Tiếp theo chúng ta sẽ nhìn nhận việc chăm sóc khách hàng là một vũ khí cực kỳ quan trọng trong kinh doanh trên sàn thương mại điện tử vào thời điểm hiện tại. Chúng ta có thể tưởng tượng rằng trên Shopee hay TikTok Shop khách hàng không thể trực tiếp thừ sản phẩm. Thứ duy nhất mà họ dựa vào để ra quyết định đó là niềm tin."},{"l":11,"p":"Toàn bài","t":"Và niềm tin đó được xây dựng từ đâu? Chính là từ cách các shop phản hồi tin nhắn và xử lý vấn đề. Đặc biệt trong kỷ nguyên mạng xã hội."},{"l":11,"p":"Toàn bài","t":"Một khách hàng hài lòng sẽ để lại đánh giá cái hình ảnh cái video thì đây là một loại quảng cáo có giá trị cao nhất giúp cho shop tạo dựng được uy tín một cách hoàn toàn tự nhiên."},{"l":11,"p":"Toàn bài","t":"Trên các nền tảng sàn thương mại điện tử có thường thì cũng sẽ có phải và quy chế sàn đưa ra cũng sẽ có những chế tài cực kỳ nghiêm khắc với những shop không tuân thủ những quy định này. Và đây là một ví dụ. Nếu như trên shop có hệ thống sao quả tả thì trên TikTok shop cũng có những hệ thống điểm vi phạm vận hành."},{"l":11,"p":"Toàn bài","t":"Những chính sách chăm sóc khách hàng kém sẽ dẫn đến những tỉ lệ khiếu nại cao và shop sẽ bị giới hạn về số đơn hàng trên một ngày. Ở những slide trước chúng ta đã thấy rõ được vai trò quan trọng của chăm sóc khách hàng và tương tác phản hồi với khách hàng. Thì đây là một ví dụ trong việc chúng ta trả lời khách hàng thông qua các tin nhắn như thế nào trong quy trình trong khách hàng chúng ta có thể chia thành ba giai đoạn chính."},{"l":11,"p":"Toàn bài","t":"Giai đoạn thứ nhất đó là trước khi mua. Đây là giai đoạn chúng ta thực hiện hoạt động tư vấn để bán hàng. Giai đoạn thứ hai là giai đoạn trong khi mua. Ở giai đoạn này, chúng ta sẽ cần theo dõi sát sao trạng thái của đơn hàng."},{"l":11,"p":"Toàn bài","t":"Và giai đoạn thứ ba là giai đoạn sau khi mua. Giai đoạn này chúng ta có thể thực hiện một số các hoạt động như là hướng dẫn sử dụng, kích hoạt bảo hành hay là xử lý các khiếu nại đổi trả vân vân. Bài học này chúng ta cũng có một vài các gợi ý trong câu chuyện sử dụng những công cụ để hỗ trợ chăm sóc khách hàng một cách hiệu quả."},{"l":11,"p":"Toàn bài","t":"Ví dụ chúng ta có thể thiết lập những tin nhắn tự động ngay trên các nền tảng. Đó có thể là tin nhắn chào mừng hoặc là những tin nhắn khi mà shop đang vắng mặt. Quy trình xử lý các đánh giá xấu cũng rất quan trọng."},{"l":11,"p":"Toàn bài","t":"Có một vài gợi ý ví dụ như chúng ta hãy liên hệ trực tiếp qua chat hotline ngay lập tức. Chính Chúng ta sẽ lắng nghe và đưa ra những phương án để bồi thường hoặc chúng ta sẽ khéo léo nhờ cách sửa lại cái đánh giá. Trong phần tiếp theo, chúng ta sẽ cùng nhau tìm hiểu một số các định nghĩa các chỉ số trên sản thương mại điện từ và từ đó chúng ta sẽ học cách để phân tích dữ liệu."},{"l":11,"p":"Toàn bài","t":"Đầu tiên chúng ta sẽ bắt đầu tìm hiểu chỉ số chính ở trên sàn thương mại điện tử Shopee. Ví dụ như là những lượt truy cập, lượt xem trang sản phẩm, tỉ lệ nhất tỉ lệ thoát hay là nguồn lưu lượng. Đối với các nhóm chỉ số thuộc về hoạt động chuyển đổi cũng như là vận hành thì đây là một vài các chỉ số chính như là tỉ lệ chuyển đổi hay giá trị đơn hàng trung bình."},{"l":11,"p":"Toàn bài","t":"Tiếp theo chúng ta chuyển sang nhóm chỉ số trên TikTok Shop. Tiếp hết chúng ta cũng sẽ chia ra cái nhóm chỉ số thuộc về doanh thu và nội dung. Thì có thể kể đến một vài các chỉ số rất quan trọng như là GMV như là tỉ lệ nhất và sản phẩm, tỉ lệ chuyển đối đơn hàng, hay là doanh thu từ thiết bị liên kết."},{"l":11,"p":"Toàn bài","t":"Đối với nhóm chỉ số về vận hành và trải nghiệm thì có thể kể đến như là chỉ số về tỉ lệ đơn hàng bị hủy do lỗi từ người bán, tỉ lệ gửi hàng muộn, điểm đánh giá cửa hàng, tỉ lệ phản hồi tiêu cực hay tỉ lệ khách hàng quay lại."},{"l":11,"p":"Toàn bài","t":"Khi đã biết đâu là những chỉ số chính để đo lường hiệu quả hoạt động của một shop thì việc xây dựng một dashboard để theo dõi các chỉ số hoạt động của shop là cực kỳ quan trọng. Điều ấy giúp cho chủ shop có góc nhìn tổng quan nhất về hiện trạng hoạt động trên shop của mình. Tuy nhiên, có rất nhiều các chỉ số khác nhau ở mỗi shop khiến chúng ta băn khoăn không biết nên lựa chọn chỉ số nào để phù hợp khi là sẽ phân tích vấn đề để tìm ra sự sai lệch giữa KPI mục tiêu và số lượng thực tế."},{"l":11,"p":"Toàn bài","t":"Chúng ta sẽ không nhìn những con số độc lập mà hãy nhìn vào sự tương quan. Ví dụ cho fix có tăng nhưng tại sao GMV lại giảm?"},{"l":11,"p":"Toàn bài","t":"Nếu mô hình FW giúp chúng ta đi sâu vào một vấn đề thì mô hình xương cá giúp chúng ta có cái nhìn bao quát về tất cả những nguyên nhân có thể gây ra lỗi trong thương mại điện tử có thể chia thành năm nhóm chính để dễ dàng ra soát. Ví dụ khi lấy tỉ lệ chuyển đổi của shop giảm mạnh thì chúng ta sẽ soi từng nhánh trong xương cá. Ví dụ như về sản phẩm có phải gần đây shop nhập lô hàng với chất lượng kém dẫn đến nhiều review một sao hay không anh sản phẩm có bị lỗi thời so với đối thủ không?"},{"l":11,"p":"Toàn bài","t":"Hoặc là về giá thì đối thủ có đang tham gia chương trình vẻ vô địch của sàn mà mình không biết hay không? Về vận hành hãy kiểm tra lại tỉ lệ phản hồi chat. Nếu khách hàng nhắn tin hỏi mà một thời gian lâu sau chúng ta mới trả lời thì dù sản phẩm có tốt thì khách cũng đã bỏ đi rồi."},{"l":11,"p":"Toàn bài","t":"Trên TikTok Shop chúng ta cũng hãy thử phân tích một vấn Vấn đề thực tế như sau. Đó là phiên livestream có nhiều người xem nhưng doanh thu thì lại thấp. Khi đó chúng ta sẽ phân tích nguyên nhân theo dữ liệu thời gian thực."},{"l":11,"p":"Toàn bài","t":"Lượt nhấp giỏ hàng. Khách có thể bấm vào xem sản phẩm hay không? Tỉ lệ giữa chân thì sao?"},{"l":11,"p":"Toàn bài","t":"Ví dụ khách vào đô ra ngay. Còn tỉ lệ thanh toán khách đã thêm vào giỏ nhưng không mua. Và đây là ví dụ ví dụ về một kịch bản để chúng ta có thể tối hóa được vỡ chuyển độ trong bài toán trên."},{"l":11,"p":"Toàn bài","t":"Đó có thể là cho phí cao nhưng CR thấp. Vậy thì nguyên nhân có thể là ảnh bìa quảng cáo tốt nhưng nội dung sản phẩm hoặc giá lại chưa kết phục. Hoặc một vấn đề khác đó là traffic thì thấp nhưng tỉ lệ chuyển đổi tỉ lệ cao. Thì nguyên nhân có thể là sản phẩm chất lượng giá tốt nhưng bị thiếu hiển thị."},{"l":11,"p":"Toàn bài","t":"Tiếp tục đây là một kịch bản khác. để ví dụ cho việc chúng ta sau khi đã tìm được những nguyên nhân thì sẽ có những giải pháp để khắc phục. Trong kinh doanh sàn có một chu trình rất phổ biến để chúng ta có thể áp dụng đó là chu trình PDCA."},{"l":11,"p":"Toàn bài","t":"Chúng ta bắt đầu từ việc lập kế hoạch đến thực hiện các hoạt động thường xuyên đo lường và tiếp tục tối ưu. Như vậy chúng ta đã lần lượt đi qua các nội dung chính trong bài học số 11 này. Sau đây hãy cùng tôi tổng kết lại những nội dung quan trọng."},{"l":11,"p":"Toàn bài","t":"của bài học. Nội dung thứ nhất là xử lý đơn hàng. Hãy thực hiện nghiêm ngặt quy trình năm bước cốt lõi từ tiếp nhận cho tới đóng gói, bàn giao và hoàn tất đơn hàng."},{"l":11,"p":"Toàn bài","t":"Nội dung thứ hai là dữ liệu khách hàng. Chúng ta có thể phân loại tệp khách hàng theo mô hình RFM để có hành động chiến lược phù hợp cho từng nhóm khách hàng khác nhau. Nội dung thứ ba là nắm được bản chất các chỉ số chẳng hạn như C CR AOV trên Shopee và GPM tỉ lệ chuyển đổi doanh thu AUL trên TikTok Shop nội dung thứ tư là truy vết vấn đề chúng ta có thể sử dụng kỹ thuật FW và mô hình xương cá để nhận diện đúng điểm gãy trong phễu chuyển đổi và tìm ra nguyên nhân gốc rễ."},{"l":11,"p":"Toàn bài","t":"Nội dung cuối cùng, nội dung số 5 là liên tục tối ưu. Chúng ta có thể sử dụng chu trình PDCA để thường xuyên tối ưu hoạt động kinh doanh trên sàn thương mại điện tử. Cảm ơn các bạn đã lắng nghe."}]};
</script>
<script>
(function () {
'use strict';
var KEY = 'dom204_progress_v1';
var LESSONS = DATA.lessons;
var QMAP = {}, QLESSON = {};
LESSONS.forEach(function (l) { l.questions.forEach(function (q) { QMAP[q.id] = q; QLESSON[q.id] = l; }); });
var ALLQ = [].concat.apply([], LESSONS.map(function (l) { return l.questions; }));
var TOTAL = ALLQ.length;
var LABELS = 'ABCD';

/* ---------- tiện ích ---------- */
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd'); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function sameSet(a, b) { return a.length === b.length && a.every(function (x) { return b.indexOf(x) >= 0; }); }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id) { return document.getElementById(id); }
function srcLabel(q) {
  var s = q.source;
  return (s.nearest ? 'Đoạn gần nhất trong bài giảng, ' : 'Theo bài giảng ') + 'Bài ' + s.lesson + ', ' + s.part;
}

/* ---------- lưu trữ ---------- */
var storageOK = true;
var S = { v: 1, q: {}, wrong: {}, settings: { theme: 'auto', shuffleQ: false, shuffleO: false } };
function load() {
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }
  if (!raw) return;
  try {
    var o = JSON.parse(raw);
    if (o && o.v === 1) {
      if (o.q && typeof o.q === 'object') S.q = o.q;
      if (o.wrong && typeof o.wrong === 'object') S.wrong = o.wrong;
      if (o.settings && typeof o.settings === 'object') {
        ['theme', 'shuffleQ', 'shuffleO'].forEach(function (k) { if (k in o.settings) S.settings[k] = o.settings[k]; });
      }
      Object.keys(S.q).forEach(function (k) { if (!QMAP[k]) delete S.q[k]; });
      Object.keys(S.wrong).forEach(function (k) { if (!QMAP[k]) delete S.wrong[k]; });
    }
  } catch (e) { /* dữ liệu hỏng, bỏ qua */ }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOK = false; } }
function st(id) { return S.q[id] || { sel: [], done: false, ok: false, hints: 0 }; }
function ensure(id) { if (!S.q[id]) S.q[id] = { sel: [], done: false, ok: false, hints: 0 }; return S.q[id]; }

/* ---------- giao diện sáng tối ---------- */
function effectiveTheme() {
  if (S.settings.theme === 'light' || S.settings.theme === 'dark') return S.settings.theme;
  return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
  var r = document.documentElement;
  if (S.settings.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.settings.theme);
  $('themeBtn').setAttribute('aria-pressed', effectiveTheme() === 'dark' ? 'true' : 'false');
}

/* ---------- thống kê ---------- */
function lessonStats(L) {
  var d = 0, ok = 0, h = 0;
  L.questions.forEach(function (q) { var s = st(q.id); if (s.done) { d++; if (s.ok) ok++; } h += s.hints || 0; });
  return { done: d, ok: ok, bad: d - ok, hints: h, total: L.questions.length };
}
function totalStats() {
  var t = { done: 0, ok: 0, bad: 0, hints: 0 };
  LESSONS.forEach(function (L) { var x = lessonStats(L); t.done += x.done; t.ok += x.ok; t.bad += x.bad; t.hints += x.hints; });
  return t;
}
function wrongIds(filter) {
  return ALLQ.filter(function (q) { return S.wrong[q.id] && (!filter || !filter.length || filter.indexOf(QLESSON[q.id].id) >= 0); }).map(function (q) { return q.id; });
}

/* ---------- phiên làm bài ---------- */
var session = null;
var pendingFocus = null;
var animateNext = true;
var wrongFilter = [];
function makeOptOrder(order) {
  var m = {};
  order.forEach(function (id) { var ids = QMAP[id].options.map(function (o) { return o.id; }); m[id] = S.settings.shuffleO ? shuffle(ids) : ids; });
  return m;
}
function startLesson(id, jumpQ) {
  var L = LESSONS.filter(function (l) { return l.id === id; })[0];
  var order = L.questions.map(function (q) { return q.id; });
  if (S.settings.shuffleQ) shuffle(order);
  var first = -1;
  for (var i = 0; i < order.length; i++) { if (!st(order[i]).done) { first = i; break; } }
  session = { kind: 'lesson', lessonId: id, order: order, optOrder: makeOptOrder(order), idx: first < 0 ? 0 : first, finished: false };
  if (jumpQ) { var j = order.indexOf(jumpQ); if (j >= 0) session.idx = j; }
}
function startWrong() {
  var order = wrongIds(wrongFilter);
  if (!order.length) return false;
  if (S.settings.shuffleQ) shuffle(order);
  order.forEach(function (id) { var s = ensure(id); s.sel = []; s.done = false; s.ok = false; s.hints = 0; });
  save();
  session = { kind: 'wrong', lessonId: 0, order: order, optOrder: makeOptOrder(order), idx: 0, finished: false };
  return true;
}
function cur() { return QMAP[session.order[session.idx]]; }
function labelOf(qid, optId) { var i = session.optOrder[qid].indexOf(optId); return LABELS[i]; }
function fill(q, str) { return str.replace(/\{([A-D])\}/g, function (m, id) { return labelOf(q.id, id); }); }

function grade(q) {
  var s = ensure(q.id);
  var ok = sameSet(s.sel, q.answer);
  s.done = true; s.ok = ok;
  if (!ok) { S.wrong[q.id] = { streak: 0 }; }
  else if (S.wrong[q.id]) { S.wrong[q.id].streak = (S.wrong[q.id].streak || 0) + 1; if (S.wrong[q.id].streak >= 2) delete S.wrong[q.id]; }
  save();
}

/* ---------- điều hướng ---------- */
function navigate(h) { if (location.hash === h) route(); else location.hash = h; }
function route() {
  var h = location.hash || '#/';
  if (h.charAt(1) !== '/') return;
  var m = h.match(/^#\/([a-z]+)(?:\/(\d+))?/);
  var name = m ? m[1] : 'home';
  var id = m && m[2] ? +m[2] : 0;
  var L = LESSONS.filter(function (l) { return l.id === id; })[0];
  var jump = pendingJump; pendingJump = null;
  if (name === 'lesson' && L) {

  var out = '', pos = 0;
  merged.forEach(function (m) { out += esc(text.slice(pos, m[0])) + '<mark>' + esc(text.slice(m[0], m[1])) + '</mark>'; pos = m[1]; });

  var terms = [], chunks = [], qs = [];

  IDX.chunks.forEach(function (x) { if (inL(x.c.l) && all(x.n)) chunks.push({ x: x, s: x.n.indexOf(nq) >= 0 ? 0 : 1 }); });
  chunks.sort(function (a, b) { return a.s - b.s; });

    h += '<span class="src">Theo bài giảng Bài ' + g.source.lesson + ', ' + esc(g.source.part) + '</span></div>';
  });
  if (r.terms.length > shown.terms) h += '<button class="btn" type="button" data-act="more" data-g="terms">Xem thêm (' + (r.terms.length - shown.terms) + ')</button>';
  h += '</div><div class="grp"><h3>Đoạn bài giảng <span class="tag">' + r.chunks.length + '</span></h3>';
  if (!r.chunks.length) h += '<p class="empty">Không có đoạn bài giảng khớp.</p>';
  r.chunks.slice(0, shown.chunks).forEach(function (o) {
    h += '<div class="res"><span class="tag">Bài ' + o.x.c.l + ' · ' + esc(o.x.c.p) + '</span><p>' + hl(o.x.c.t, r.toks) + '</p></div>';
  });
  if (r.chunks.length > shown.chunks) h += '<button class="btn" type="button" data-act="more" data-g="chunks">Xem thêm (' + (r.chunks.length - shown.chunks) + ')</button>';
  h += '</div><div class="grp"><h3>Câu hỏi liên quan <span class="tag">' + r.qs.length + '</span></h3>';
  if (!r.qs.length) h += '<p class="empty">Không có câu hỏi khớp.</p>';
  r.qs.slice(0, shown.qs).forEach(function (x) {
    var q = x.q, s = st(q.id), L = QLESSON[q.id];
    h += '<div class="res"><span class="tag">Quiz ' + ('0' + L.id).slice(-2) + ' · Câu ' + q.n + '</span> ';
    if (s.done) h += '<span class="badge">' + (s.ok ? '✓ Đã làm đúng' : '✗ Đã làm sai') + '</span>';
    h += '<p>' + hl(q.prompt, r.toks) + '</p>';
    if (s.done) h += '<p class="hint-help">Đáp án: ' + esc(q.answer.map(function (id) { return q.options.filter(function (o) { return o.id === id; })[0].text; }).join(' / ')) + '</p>';
    h += '<div class="row"><button class="btn" type="button" data-act="openq" data-q="' + q.id + '">Mở câu này</button></div></div>';
  });
  if (r.qs.length > shown.qs) h += '<button class="btn" type="button" data-act="more" data-g="qs">Xem thêm (' + (r.qs.length - shown.qs) + ')</button>';
  h += '</div>';
  box.innerHTML = h;
}
function renderChips() {
  $('lf').innerHTML = LESSONS.map(function (L) { return '<button class="chip" type="button" data-act="lchip" data-l="' + L.id + '" aria-pressed="' + (lessonSel.indexOf(L.id) >= 0) + '">Bài ' + L.id + '</button>'; }).join('');
}
function doSearch() { shown = { terms: 10, chunks: 10, qs: 10 }; renderResultsPanel(); }
function openSearch(text) {
  if (!panelOpen) lastFocus = document.activeElement;
  panelOpen = true;
  $('panel').classList.add('open'); $('panel').setAttribute('aria-hidden', 'false'); $('backdrop').classList.add('show');
  if (typeof text === 'string') $('sq').value = text;
  renderChips(); doSearch();
  setTimeout(function () { if (!panelOpen) return; $('sq').focus(); if (typeof text !== 'string') $('sq').select(); }, 30);
}
function closeSearch() {
  if (!panelOpen) return;
  panelOpen = false;
  $('panel').classList.remove('open'); $('panel').setAttribute('aria-hidden', 'true'); $('backdrop').classList.remove('show');
  if (lastFocus && document.contains(lastFocus)) try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* bỏ qua */ }
}
$('sq').addEventListener('input', function () { clearTimeout(debounceT); debounceT = setTimeout(doSearch, 150); });
$('closePanel').addEventListener('click', closeSearch);
$('backdrop').addEventListener('click', closeSearch);

/* ---------- xử lý thao tác ---------- */
function goIdx(i) {
  if (!session) return;
  session.finished = false;
  session.idx = Math.max(0, Math.min(session.order.length - 1, i));
  animateNext = true;
  renderPractice();
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  var p = $('qp'); if (p) p.focus({ preventScroll: true });
}
function selectByIndex(i) {
  if (!session || session.finished) return;
  var q = cur(), ord = session.optOrder[q.id];
  if (i < 0 || i >= ord.length) return;
  act('opt', { id: ord[i] });
}
function act(name, d) {
  switch (name) {
    case 'search': openSearch(); break;
    case 'theme': S.settings.theme = effectiveTheme() === 'dark' ? 'light' : 'dark'; save(); applyTheme(); break;
    case 'home': navigate('#/'); break;
    case 'start':
      if (session && session.kind === 'lesson' && session.lessonId === +d.l) session.finished = false;
      navigate('#/lesson/' + d.l); break;
    case 'summary': navigate('#/summary/' + d.l); break;
    case 'wrongpage': navigate('#/wrong'); break;
    case 'wfilter': { var id = +d.l, i = wrongFilter.indexOf(id); if (i >= 0) wrongFilter.splice(i, 1); else wrongFilter.push(id); renderWrong(); break; }
    case 'startwrong': if (startWrong()) navigate('#/review'); break;
    case 'clearwrong':
      confirmBox('Xóa danh sách sai', 'Xóa toàn bộ câu trong danh sách sai? Kết quả các câu đã làm vẫn được giữ.', 'Xóa').then(function (y) { if (y) { S.wrong = {}; save(); renderWrong(); } });
      break;
    case 'resetall':
      confirmBox('Đặt lại tiến độ', 'Xóa toàn bộ kết quả, danh sách sai và số gợi ý đã dùng? Thao tác này không hoàn tác được.', 'Đặt lại').then(function (y) {
        if (y) { S.q = {}; S.wrong = {}; save(); session = null; renderHome(); }
      });
      break;
    case 'opt': {
      if (!session) break;
      var q = cur(), s = ensure(q.id);
      if (s.done) break;
      pendingFocus = d.id;
      if (q.type === 'single') { s.sel = [d.id]; grade(q); }
      else { s.sel = s.sel.indexOf(d.id) >= 0 ? s.sel.filter(function (x) { return x !== d.id; }) : s.sel.concat(d.id); save(); }
      renderPractice();
      break;
    }
    case 'check': { var q2 = cur(), s2 = st(q2.id); if (!s2.done && s2.sel.length) { grade(q2); renderPractice(); } break; }
    case 'hint': { var q3 = cur(), s3 = ensure(q3.id); if (!s3.done && s3.hints < 3) { s3.hints++; save(); renderPractice(); } break; }
    case 'next': goIdx(session.idx + 1); break;
    case 'prev': goIdx(session.idx - 1); break;
    case 'jump': goIdx(+d.i); break;
    case 'redo': { var q4 = cur(), s4 = ensure(q4.id); s4.sel = []; s4.done = false; s4.ok = false; s4.hints = 0; save(); renderPractice(); break; }
    case 'results': session.finished = true; renderResults(); window.scrollTo(0, 0); break;
    case 'retry':
      confirmBox('Làm lại cả bài', 'Xóa kết quả của các câu trong bài này để làm lại từ đầu? Danh sách sai vẫn được giữ.', 'Làm lại').then(function (y) {
        if (!y) return;
        session.order.forEach(function (qid) { var s = ensure(qid); s.sel = []; s.done = false; s.ok = false; s.hints = 0; });
        save(); session.idx = 0; session.finished = false; renderPractice(); window.scrollTo(0, 0);
      });
      break;
    case 'kw': openSearch(d.kw); break;
    case 'lchip': { var lid = +d.l, k = lessonSel.indexOf(lid); if (k >= 0) lessonSel.splice(k, 1); else lessonSel.push(lid); renderChips(); doSearch(); break; }
    case 'more': shown[d.g] += 10; renderResultsPanel(); break;
    case 'openq': {
      var qq = QMAP[d.q]; pendingJump = qq.id; closeSearch();
      session = null; navigate('#/lesson/' + QLESSON[qq.id].id);
      break;
    }
  }
}
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t || t.disabled) return;
  act(t.getAttribute('data-act'), { l: t.getAttribute('data-l'), i: t.getAttribute('data-i'), id: t.getAttribute('data-id'), kw: t.getAttribute('data-kw'), g: t.getAttribute('data-g'), q: t.getAttribute('data-q') });
});
document.addEventListener('change', function (e) {
  var k = e.target.getAttribute && e.target.getAttribute('data-set');
  if (k) { S.settings[k] = !!e.target.checked; save(); }
});
function isTyping(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable); }
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if ($('modal').classList.contains('show')) { closeModal(false); return; }
    if (panelOpen) { e.preventDefault(); closeSearch(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
  if (e.key === '/' && !isTyping(e.target) && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); openSearch(); return; }
  if (panelOpen || isTyping(e.target) || $('modal').classList.contains('show')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var onPractice = session && /^#\/(lesson|review)/.test(location.hash) && !session.finished;
  if (!onPractice) return;
  var k = e.key, onBtn = e.target.closest && e.target.closest('button,a');
  if (k >= '1' && k <= '4') { selectByIndex(+k - 1); return; }
  var lk = k.toLowerCase();
  if (k.length === 1 && 'abcd'.indexOf(lk) >= 0) { selectByIndex(lk.charCodeAt(0) - 97); return; }
  if (lk === 'h' && k.length === 1) { act('hint', {}); return; }
  if (k === 'ArrowRight') { e.preventDefault(); if (session.idx < session.order.length - 1) goIdx(session.idx + 1); return; }
  if (k === 'ArrowLeft') { e.preventDefault(); if (session.idx > 0) goIdx(session.idx - 1); return; }
  if (k === 'Enter' && !onBtn) {
    var q = cur(), s = st(q.id);
    if (!s.done) act('check', {});
    else if (session.idx < session.order.length - 1) goIdx(session.idx + 1);
    else act('results', {});
  }
});
window.addEventListener('hashchange', route);

/* ---------- khởi động ---------- */
load();
applyTheme();
route();
})();
</script>
</body>
