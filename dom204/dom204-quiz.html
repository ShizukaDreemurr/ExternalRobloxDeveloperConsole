":7,"p":"Phần 2","t":"Thì việc lập danh sách trước giúp cho cái hoạt động được triển khai có định hướng tránh sử dụng công cụ cách rời dạc và thiếu kiểm soát. Đầu tiên chúng ta cần xác định mục tiêu của chương trình. Bước đầu tiên là xác định mục tiêu chính của chương trình marketing."},{"l":7,"p":"Phần 2","t":"Trong kinh doanh trên sàn thương mại điện tử thì các chương trình marketing thường được hướng đến một trong ba mục tiêu sau. Một đấy là tăng tra pic nghĩa là thu hút nhiều người dùng truy cập vào gian hàng hoặc là xem sản phẩm. Hai là tăng chuyển đổi, nghĩa là thúc đẩy khách hàng đưa ra cách mua hàng sau khi đã xem sản phẩm."},{"l":7,"p":"Phần 2","t":"Và thứ ba là tăng giá trị đơn hàng thì khuyến khích khách hàng mua nhiều sản phẩm hơn trong cùng của đơn hàng. Thế thì chúng ta cần xác định rõ cái mục tiêu của chúng ta là gì đúng không? Chúng ta cần tăng traích lên hay chúng ta cần tăng giá trị chuyển đổi lên hay chúng ta cần tăng giá trị đơn hàng lên thì chúng ta cần xác định được cái mục tiêu chính của chúng ta cần làm để làm gì."},{"l":7,"p":"Phần 2","t":"Sau đó thì chúng ta sẽ đến cái bước thứ hai là chúng ta cần xác định ngân sách và chi phí. Thì sau khi xác định mục tiêu thì người bán cần dự kiến ngân sách dành cho những cái hoạt động marketing này. Ngân sách này thì có thể là bao gồm chi phí quảng cáo trả phí này, rồi chi phí giảm giá hoặc là ưu đãi này, chi phí hoa hồng này, đúng không?"},{"l":7,"p":"Phần 2","t":"Thì việc xác định ngân sách này thì sẽ giúp người bán kiểm soát cái chi phí và đảm bảo các chương trình marketing không ảnh hưởng tới cái lợi nhuận của dân hàng. Và bước cuối cùng đấy là chúng ta lựa chọn những cái chương trình phù hợp. Thì dựa trên mục tiêu ô và ngân sách đã xác định thì người bán có thể lựa chọn các chương trình marketing phù hợp để triển khai."},{"l":7,"p":"Phần 2","t":"Nếu cái mục tiêu là tăng traffic thì có thể sử dụng những cái chương trình ví dụ như là quảng cáo Shopee này, Shopee video này hoặc là Shopee livestream. Còn với mục tiêu là tăng chuyển đổi thì có thể áp dụng những cái chương trình ví dụ là Flash sale này, mã giảm giá này."},{"l":7,"p":"Phần 2","t":"Còn với mục tiêu là tăng giá trị đơn hàng thì có thể sử dụng công cụ như là combo khuyến mãi hoặc là mua kẻ điu sống thì việc lựa chọn đúng cái chương trình marketing sẽ giúp dân hàng tận dụng tốt những cái công cụ một sàn và đạt được những cái hiệu quả kinh doanh tốt hơn. Sau khi mà chúng ta xây dựng được cái phần kế hoạch xong thì chúng ta sẽ tiến hành thực hành triển khai những cái chương trình marketing này trên chính cái gian hàng của chúng ta."},{"l":7,"p":"Phần 2","t":"Thì sau khi mà xây dựng kế hoạch thì bước tiếp theo chính là chúng ta thiết lập đúng không và triển khai. Thì trong cái quá trình thực hành thì người bán có thể cần thực hiện các bước cơ bản. Đầu tiên là lựa chọn những sản phẩm phù hợp cho từng chương trình marketing."},{"l":7,"p":"Phần 2","t":"Thứ hai là sẽ thiết lập thông thố của từng chương trình cũng như là mức tạm giá này, thời gian áp dụng hoặc là ngân sách quảng cáo này và sau đó thì chúng ta kiểm tra lại những cái điều kiện áp dụng và hiển thị của chương trình trên gian hàng."},{"l":7,"p":"Phần 2","t":"Ờ ở đây thì cũng sẽ có thêm một số lưu ý. Đầu tiên là trong giai đoạn đầu thì người bán à chúng ta nên thứ nhất là triển khai với quy mô nhỏ để thử nghiệm trước. Thứ hai là không cài đặt quá nhiều chương trình trong cùng một lúc và chúng ta cần theo dõi phản ứng của khách hàng và hiệu quả của bán hàng."},{"l":7,"p":"Phần 2","t":"Thì đấy chúng ta có thể đánh giá được hiệu quả của chương trình và có những cái cải tiến nó phù hợp. Quá trình thực hiện này sẽ giúp người bán hiểu rõ cái hành vi của khách hàng và tìm ra cách triển khai hiệu quả hơn trong những cái lần tiếp theo. Sau khi mà chúng ta đã có triển khai cái hoạt động marketing xong thì chúng ta cần phải đo lường hiệu quả của từng chương trình."},{"l":7,"p":"Phần 2","t":"Thì các chỉ số thường được sử dụng để đánh giá hiệu quả của từng cái chương trình này nó sẽ bao gồm một số các chỉ số ví dụ như là lượt xem sản phẩm, số đơn hàng, doanh thu từ chương trình, chi phí marketing đã sử dụng hoặc là tỉ lệ tuyệt đối của sản phẩm."},{"l":7,"p":"Phần 2","t":"Thì trong cái quá trình mà chúng ta thiết lập về chương trình này xong thì chúng ta có thể theo dõi từ cái chỉ số này thì những cái chỉ số này nó đều sẽ phản ánh được cái hiệu quả của chương trình và từ đấy chúng ta sẽ biết cách để mà chúng ta tối ưu từng cái chương trình này tốt hơn. Và cái việc đo lường này thì sẽ giúp người bán trả lời được những cái câu hỏi quan trọng. Ví dụ như là chương trình nào thì mang lại cái đơn hàng nhiều nhất này đúng không?"},{"l":7,"p":"Phần 2","t":"Chương trình nào thu hút được xem nhưng mà ít đơn hàng hay là chương trình nào có chi phí thấp nhưng mà hiệu quả cao thì từ những cái dữ liệu này thì chúng ta hoàn toàn có thể là tiếp tục mở rộng những cái chương trình hiệu quả này, điều chỉnh hoặc là dừng lại những cái chương trình kém hiệu quả hoặc là tối ưu ngân sách market cho từng cái hoạt động tiếp theo. Rồi thì đó cũng là toàn bộ cái nội dung của bài số 7 là các chương trình marketing đội sàn trên sàn thương mạnh điện tử. Thì rất cảm ơn các bạn đã lắng nghe."},{"l":7,"p":"Phần 2","t":"Xin chào các bạn và hẹn gặp lại các bạn ở những bài học sau."},{"l":8,"p":"Phần 1","t":"Xin chào các bạn. Ngày hôm nay chúng ta lại gặp lại nhau trong bài số 8 trong môn kinh doanh trên sàn thương mại điện tử. Và chủ đề của bài tám ngày hôm nay chính là quảng cáo trả phí trên sàn thương mại điện tử."},{"l":8,"p":"Phần 1","t":"Ở bài học này chúng ta sẽ tìm hiểu về quảng cáo trả phí à đặc biệt tập trung vào hai nền tảng chính hiện nay đó là nền tảng Shopee và nền tảng TikTok Shop. Nếu các bài trước chúng ta đã tìm hiểu về hệ sinh thái sàn thương mại điện tử và vai trò của traffic, cách sản phẩm được hiển thị. Thì ngày hôm nay chúng ta cùng nhau tìm hiểu một cái phương thức khác để chúng ta có thể tiếp cận khách hàng thông qua việc chúng ta chủ động tiếp cận đó chính là quảng cáo trả phí trên sàn thương mại điện tử."},{"l":8,"p":"Phần 1","t":"Và mục tiêu chính của bài học ngày hôm nay chúng ta sẽ bao gồm ba phần. Thứ nhất là chúng ta hiểu bản chất của quảng cáo trả phí trên sàn thương mại điện tử. Thứ hai đó là các em sinh viên chúng ta biết cách thực hành chạy quảng cáo trên nền tảng Shopee."},{"l":8,"p":"Phần 1","t":"Và cuối cùng đó là cách thực hànhể chạy quảng cáo trên nền tảng TikTok. Và tương ứng với các mục tiêu này thì nội dung bài học ngày hôm nay chúng ta cũng sẽ đi qua ba phần. Một là chúng ta cùng tìm hiểu bản chất của quảng cáo trả phí trên sàn thương mại điện tử."},{"l":8,"p":"Phần 1","t":"À phần thứ hai đó là chúng ta sẽ cùng nhau thực hành chạy quảng cáo trên Shopee. Và phần thứ ba đó là thực hành chạy quảng cáo trên nền tảng TikTok và TikTok Shop. Chúng ta cùng nhau vào phần đầu tiên đó là tìm hiểu bản chất của quảng cáo trả phí trên sàn thương mại điện tử như thế nào."},{"l":8,"p":"Phần 1","t":"Đầu tiên thì chúng ta sẽ cùng nhau chia sẻ về cách các nền tảng tiếp cận khách hàng. Như các bạn đã biết thì chúng ta có hai cái nền tảng quan trọng. nhất là chiếm tới 98% thị phần trên các sàn thương mại điện tử là TikTok Shop và Shopee. Vậy thì hai nền tảng này có cách hiển thị và tiếp cận khách hàng khác nhau như thế nào?"},{"l":8,"p":"Phần 1","t":"Chúng có những cái đặc điểm gì khiến cho các cái mẫu quảng cáo hiện nay có cái sự khác nhau và có những cái sự phân biệt riêng thì chúng ta cùng nhau tìm hiểu các cái phương thức tiếp cận đó. Đầu tiên thì với nền tảng thương mại điện tử Shopee chính là một cái nền tảng người tìm hàng. À chúng ta cứ tưởng tượng như này đó là khi khách hàng của chúng ta à người ta có một cái vấn đề, người ta có một cái nhu cầu người ta muốn mua có một cái sản phẩm cụ thể trong quá trình người ta à mua sắm á thì khách hàng sẽ tiếp cận nền tảng bằng việc là nên nền tảng bắt đầu là à tìm kiếm thông qua các cái từ khóa và các cái sản phẩm trên Shopee Lazada thì sẽ hiển thị giống như một cái kệ hàng để khách hàng có thể so sánh về giá, khách hàng có thể xem những cái lượt bán và lượt đánh giá tốt và từ đó khách hàng có thể lựa chọn ra những cái sản phẩm phù hợp. Nhưng ngược lại nền tảng TikTok Shop thì là một cái nền tảng mang tên là hàng tìm người."},{"l":8,"p":"Phần 1","t":"Có nghĩa là khách hàng hoàn toàn họ chưa có nhu cầu từ trước hoặc là có nhu cầu nhưng mà nhu cầu đó hiện tại không phải là những cái nhu cầu cấp thiết thì TikTok đây là một cái nền tảng sẽ tiếp cận khách hàng bằng việc chủ động giới thiệu sản phẩm đến với khách hàng thông qua việc dựa vào những cái sở thích và nền tảng sẽ đáp ứng những cái sở thích đó. Một cái ví dụ rất đơn giản như sau đó là khi chúng ta lướt trên nền tảng TikTok Shop thì nhu cầu đầu tiên của chúng ta là một nhu cầu liên quan đến sự giải trí à tìm hiểu thêm kiến thức."},{"l":8,"p":"Phần 1","t":"Nhưng trong quá trình lướt đó thì các cái sản phẩm được à đưa ra trước mặt các khách hàng của chúng ta và gợi ra những cái nhu cầu tiềm ẩn trong lòng khách hàng và người ta gọi đấy là những cái mẫu quảng cáo gián đoạn giống như là môn marketing mạng xã hội các bạn đã từng học trước đây. Và với cái điều đó thì nền tảng này được gọi là một cái nền tảng hàng chủ động đi tìm người thay vì người tìm hàng giống như nền tảng Shopee hay nền tảng Lazada."},{"l":8,"p":"Phần 1","t":"Và trong quá trình chúng ta triển khai các hoạt động bán hàng trên hai nền tảng này thì chúng ta có thể so sánh một cách rất trực quan với hai cái hình mẫu rất là cụ thể. Thứ nhất là đối với nền tảng Shopee thì ở đây giống như một cái siêu thị mua sắm truyền thống. Khách hàng nào mà có nhu cầu mua à tôi cần mua cái sản phẩm A thì khách hàng sẽ đến với siêu thị để trực tiếp à chi trả để đem lại được những cái sản phẩm cho cái nhu cầu của mình."},{"l":8,"p":"Phần 1","t":"Nhưng nền tảng TikTok thì lại khác. Ở đây giống như một cái trung tâm thương mại, giống như chúng ta đi Yon Môn, chúng ta đi Vincom, chúng ta chơi. Đầu tiên cái nhu cầu không phải là một cái nhu cầu mua sắm mà chúng ta có nhu cầu là giải trí trước."},{"l":8,"p":"Phần 1","t":"Sau đó là trong quá trình chúng ta à giải trí trên cái nền tảng đó thì chúng ta sẽ phát sinh các hành vi a muốn được à sắm một cái sản phẩm nào đó. Thì ờ TikTok Shop giống như một cái trung tâm mua sắm thôi. Khách hàng đến để tham quan và trong quá trình tham quan thì họ sẽ phát sinh hành vi mua."},{"l":8,"p":"Phần 1","t":"Đầu tiên chúng ta cùng nhau tìm hiểu những cái khái niệm cơ bản nhất về hai cái nền tảng quảng cáo mà chúng ta sẽ được tìm hiểu trong ngày hôm nay. Thứ nhất đó là quảng cáo liên quan đến Shopee hay người ta còn gọi là Shopee Art là công cụ và marketing trả phí do Shopee cung cấp cho phép người bán được mua lượt hiển thị sản phẩm gian hàng tại các cái vị trí nổi bật ví dụ như là trang kết quả tìm kiếm hay là trang chủ."},{"l":8,"p":"Phần 1","t":"Mục tiêu chính là tăng được khả năng tiếp cận của khách hàng tiềm năng, tăng được lưu lượng truy cập, từ đó tối ưu được tỉ lệ chuyển đổi và thúc đẩy được doanh số cho gian hàng. Và các cái đặc điểm chính của quảng cáo Shopee đó là gì? À thứ nhất là cái vị trí hiển thị của chúng ta cao, sản phẩm hay là shop của chúng ta được đẩy lên các cái vị trí hàng đầu trên trang kết quả tìm kiếm hoặc là trong mục gợi ý à ví dụ như là gợi ý ngày hôm nay hoặc là những cái sản phẩm tương tự như khách hàng đã tìm kiếm."},{"l":8,"p":"Phần 1","t":"Thứ hai là cái mô hình tính phí của nền tảng hiện nay phổ biến nhất vẫn là mô hình tính phí chủ yếu dựa trên CPC tức là code per click. Người bán sẽ chi trả phí khi mà khách hàng nhấp vào quảng cáo. Và các hình thức chính của quảng cáo Shopee thứ nhất là quảng cáo trên kênh tìm kiếm hay người ta còn gọi là search bao gồm tìm kiếm sản phẩm này và hiển thị khi mà khách người ta gõ từ khóa và tìm kiếm shop."},{"l":8,"p":"Phần 1","t":"Thứ hai, người ta gọi là quảng cáo khám phá hiển thị ở những cái sản phẩm tương tự hoặc là mục có thể bạn cũng thích. À thứ ba là các cái mẫu quảng cáo kết hợp cùng với những cái nền tảng khác. Ví dụ như kết hợp với Google trên Shop Google Shopping Ad hoặc là trên Facebook hay người ta còn gọi với một cái tên phổ biến trong nghề gọi là CP hợp tác với Facebook để mà quảng cáo ra ngoài sàn dẫn link về shop. Và chúng ta cũng có thể thấy những cái mẫu rất là rõ ràng ở trực quan đó là gì?"},{"l":8,"p":"Phần 1","t":"Khi chúng ta vào Shopee để chúng ta xem một cái sản phẩm thì chúng ta ra Facebook lại thấy cái sản phẩm đó nó đuổi theo mình như một cái mẫu quảng cáo thì đấy được gọi là mẫu quảng cáo hợp tác giữa nền tảng Meta Meta và nền tảng Shopee người ta gọi là mẫu quảng cáo CP. Tiếp theo là quảng cáo TikTok hay còn gọi là TikTok. Đây là hình thức tiếp cận sử dụng cái nền tảng video ngắn à TikTok để truyền thông thương hiệu, giới thiệu sản phẩm hay là thúc đẩy khả năng chuyển đổi."},{"l":8,"p":"Phần 1","t":"Quảng cáo sẽ hiển thị dưới dạng một cái video ngắn sáng tạo điều hướng cho người dùng đến trang web ứng dụng Shopee. Ja website hoặc là tăng tương tác trực tiếp trên TikTok hoặc là điều hướng khách hàng vào thẳng TikTok Shop. Các đặc điểm chính của hình thức quảng cáo TikTok thứ nhất là mục tiêu là giúp tăng nhận diện thương hiệu."},{"l":8,"p":"Phần 1","t":"Chúng ta có thể thấy là không phải nhà bán nào chúng ta cũng có mục tiêu điều hướng về TikTok Shop. Thế nên là TikTok phân ra thành hai cái nền tảng ờ rất là độc lập."},{"l":8,"p":"Phần 1","t":"Thứ nhất là TikTok là một cái mạng xã hội và TikTok Shop là một cái sàn thương mại điện tử. Một số cái nhà hàng, quán ăn, những cái sản phẩm dịch vụ chưa bán được trên TikTok Shop. thì họ cũng coi TikTok."},{"l":8,"p":"Phần 1","t":"Đây là một cái kênh mạng xã hội để nhiều khách hàng biết đến hơn. Và vì vậy những cái mục tiêu đầu tiên à đó là những cái mục tiêu liên quan đến tăng nhận diện thương hiệu rồi là thu hút lược xem, thu hút lượt tương tác và tối đa hóa được cái doanh thu của nhà bán khi mà chúng ta kinh doanh trên nền tảng này. Các hình thức quảng cáo phổ biến nhất của TikTok Ad đó là đầu tiên là Infit, tức là quảng cáo xuất hiện xen kẽ giữa các video khi mà người dùng người ta lướt trên nền tảng TikTok à hay còn gọi là lướt fit."},{"l":8,"p":"Phần 1","t":"À thứ hai là Take over tức là quảng cáo hiển thị ngay khi mà chúng ta mở ứng dụng. Chúng ta có thể thấy những cái pop up được hiển thị rất là nhanh chóng khi mà chúng ta bật TikTok lên. À thứ ba là hashtag challenge, tức là tạo ra các cái trào lưu thông qua các cái hashtag."},{"l":8,"p":"Phần 1","t":"Ví dụ như là trong thời gian vừa qua chúng ta có thể thấy những cái trào lưu như là à lon TikTok của DC Group khi mà họ tạo ra một cái phong trào đó là video thì không chỉ là để chúng ta giải trí mà còn để chúng ta được học tập trên nền tảng đó. Thứ Ờ tư nữa đó là branded effect tức là tạo ra các hiệu ứng các bộ lọc filter gắn liền với các cái thương hiệu và ưu điểm của TikTok thì bao giờ cũng vậy."},{"l":8,"p":"Phần 1","t":"À nó có khả năng tiếp cận khách hàng trẻ rất là nhanh. Các cái nội dung lan truyền một cách tự nhiên và có tỉ lệ chuyển đổi cao đến từ nền tảng này. Trong phần này chúng ta sẽ đi vào so sánh kỹ thuật giữa quảng cáo Shopee Ad và TikTok Shop Ad để hiểu rõ bản chất vận hành của hai nền tảng này."},{"l":8,"p":"Phần 1","t":"Trước hết là về mô hình đấu thầu quảng cáo. Shopee thì chủ yếu sử dụng mô hình CPC tức là chi trả tiền khi mà khách hàng nhấp vào quảng cáo. Điều này khiến cho quảng cáo Shopee dễ kiểm soát chi phí và phù hợp với người mới bắt đầu."},{"l":8,"p":"Phần 1","t":"À trong khi đó thì TikTok Shop Ad thường sử dụng các cái mô hình như OCPM hoặc là OCPS. Tức là hệ thống sẽ tự động tối ưu hiển thị theo khả năng chuyển đổi. Người bán không trực tiếp kiểm soát từng lượt click giống như trên Shopee."},{"l":8,"p":"Phần 1","t":"À tiếp theo đó là cách tối ưu phân phối quảng cáo. Shopee chủ yếu dựa vào từ khóa và hành vi mua hàng nên bản chất giống như là quảng cáo tìm kiếm giống như những cô mãi tìm kiếm lớn nhất hiện nay giống như là Google. Nếu cho chọn đúng từ khóa và sản phẩm có tỉ lệ chuyển đổi tốt thì quảng cáo sẽ tỏ ra hiệu quả."},{"l":8,"p":"Phần 1","t":"Ngược lại với TikTok thì sử dụng thuật toán nội dung kết hợp với chuyển đổi, nghĩa là video càng hấp dẫn thì quảng cáo càng được phân phối nhiều. Một điểm khác biệt rất quan trọng nữa là giai đoạn máy học. Quảng cáo Shopee thì gần như không có giai đoạn learning face một cách rõ ràng, có thể chạy và điều chỉnh gần như ngay lập tức."},{"l":8,"p":"Phần 1","t":"Trong khi đó, TikTok Ad thường cần khoảng 50 đến 100 đơn hàng đầu tiên để hệ thống có thể nhận diện được khách hàng tốt nhất. Vì vậy, quảng cáo TikTok thì thường cần phải có sự kiên nhẫn. hơn trong giai đoạn đầu."},{"l":8,"p":"Phần 1","t":"Còn về tín hiệu chuyển đổi thì Shopee chủ yếu dựa vào click và đơn hàng. Còn TikTok thì đánh giá nhiều yếu tố hơn như lượt xem video, lượt tích, lượt thêm vào dò hàng và mua hàng. Về ưu tiên phân phối thì Shopee tập trung vào CTR và tỉ lệ chuyển đổi trên sản phẩm tức là mức độ hấp dẫn của quảng cáo thì chúng ta đo bằng CTR và tỉ lệ chuyển đổi của sản phẩm."},{"l":8,"p":"Phần 1","t":"Còn TikTok ưu tiên mức độ hấp dẫn của video kết hợp với tỉ lệ chuyển đổi. Cuối cùng đó là về tốc độ thử nghiệm thì Shopee cho phép test và điều chỉnh rất là nhanh, phù hợp để tối ưu trên từng từ khóa hoặc là từng sản phẩm. Trong khi đó, TikTok thường chạy chậm hơn và cần đủ dữ liệu. Nhưng khi đã tối ưu tốt rồi thì nó có thể mở rộng kinh doanh và mở rộng doanh số rất là mạnh."},{"l":8,"p":"Phần 1","t":"Tóm lại, hiểu đơn giản là Shopee Ad là quảng cáo thiên về tìm kiếm và chuyển đổi trực tiếp. Còn TikTok Ad là quảng cáo thiên về nội dung và các cái thuật toán phân phối. Tiếp theo nữa, chúng ta cùng nhau tìm hiểu đến một khái niệm mang tên là GMV Max."},{"l":8,"p":"Phần 1","t":"Thế thì hiện nay à với giai đoạn hiện tại thì tất cả các nền tảng như là Shopee, như là TikTok thì họ đang đều chuyển một cái mẫu quảng cáo mới mang tên là JVMAX. Bắt đầu từ tháng 7 năm 2025 thì các nền tảng bắt đầu dục dịch thử nghiệm các cái tính năng của Jmax. Jmax chúng ta hiểu đơn giản đây là một cái giải pháp giúp quảng cáo tự động thay thế con người, sử dụng AI để tự động chọn từ khóa này đấu thầu và tối ưu hiện tị nhằm mục tiêu cao nhất là làm sao tối đa hóa được doanh thu dựa trên ngân sách và rust mục tiêu của người bán. Thay vì thủ công các cái nền tảng họ tự động phân phối quảng cáo đến tệp khách hàng có khả năng mua hàng cao nhất."},{"l":8,"p":"Phần 1","t":"Thế thì một trong những cái quyền lực lớn nhất của nền tảng chính là họ sở hữu những cái dữ liệu của người dùng. Và giờ đây khi họ sở hữu dữ liệu người dùng đủ lớn thì họ có thể ra quyết định thay cho những nhà quảng cáo. Thay vì nhà quảng cáo trước đây chúng ta phải cài đặt rất nhiều các cái bước thủ công liên quan đến nhắm đối tượng thì nền tảng họ đưa ra một cái đề xuất đó là à thay vì bạn nhắm đối tượng như vậy thì chúng tôi là những cái người chủ nền tảng chúng tôi hiểu khách hàng của các bạn hơn thì hãy để chúng tôi tự động là làm cái việc đó thông qua một mẫu quảng cáo mà là Vmax nhưng mà ngày hôm nay như là ngày hôm nay chúng ta cùng tìm hiểu nhé."},{"l":8,"p":"Phần 1","t":"Và mẫu quảng cáo J Vmax này thì đang tiến hành một phần đối với các cái nền tảng. Giả dụ như nền tảng Shopee hiện nay thì họ vẫn đang triển khai song song quảng cáo thủ công ở trên những cái gian hàng chính hãng. Còn quảng cáo Jmax thì họ đã triển khai trên hầu như là toàn bộ các cái nhà bán hàng thông thường."},{"l":8,"p":"Phần 1","t":"Còn đối với TikTok thì họ cũng làm tương tự như vậy. À hầu hết hiện nay thì họ triển khai trên trình quản lý của J Max à còn lại họ vẫn cho tiến hành các cái hoạt động liên quan đến quảng cáo thủ công trên Seller Center. Tuy nhiên thì họ cũng công bố rằng đến thời điểm hiện tại nếu như mà chúng ta chạy quảng cáo thủ công thì họ không còn hỗ trợ chúng ta nữa khi mà chúng ta sử dụng trình thủ công nhá."},{"l":8,"p":"Phần 1","t":"Còn Jmax thì họ đang hỗ trợ cực kỳ tốt. Thế thì ở đây các cái đặc điểm cốt lõi của JMAX là gì? Đầu tiên thì giống như cái tên của nó tức là nó tối đa hóa về mặt doanh thu cho nhà bán."},{"l":8,"p":"Phần 1","t":"Trước đây thay vì thì tôi tối ưu cho bạn à cái lượt hiển thị, tôi tối ưu cho bạn lượt click. Doanh số của bạn như nào thì tôi không quan tâm đến bạn. Nhưng bây giờ thì nền tảng và nhà bán có chung một tiếng nói đó là làm sao chúng ta tăng được doanh thu à khi mà chúng ta kết hợp cùng với nhau."},{"l":8,"p":"Phần 1","t":"Thế thì đầu tiên à nền tảng sẽ đưa ra một cái một cái một cái đề xuất rất là tốt đó là họ sẽ tự động một cách toàn diện. Hệ thống sẽ tự động chọn từ khóa này, đấu thầu giá này và lựa chọn những cái vị trí hiển thị trên toàn bộ hệ sinh thái nền tảng. Ví dụ như tìm kiếm khám phá video hay là game mà không cần sự can thiệp thủ công từ phía người bán."},{"l":8,"p":"Phần 1","t":"Thứ hai, như chúng ta đã bàn với nhau thì mẫu quảng cáo này là có chung một cái mục tiêu với nhà bán. Mục tiêu cuối cùng chính là mục tiêu liên quan đến RAST. Nhà bán chỉ cần cài đặt một cái mức RAS mục tiêu thôi, lợi nhuận mong muốn trên chi phí quảng cáo thôi và ngân sách thôi."},{"l":8,"p":"Phần 1","t":"Hệ thống sẽ tự điều phối để làm sao mà chúng ta có thể đạt được các cái con số này. Và thứ ba là với mẫu quảng cáo này thì sẽ phân phối đa kênh. Quảng cáo sẽ xuất hiện ở bất cứ đâu à mà thuật toán dự đoán có khả năng tạo ra đơn hàng một cách cao nhất bao gồm những cái vị trí mà các cái loại hình quảng cáo thông thường chưa tiếp cận được."},{"l":8,"p":"Phần 1","t":"Thứ tư nữa đó là một cái đặc điểm rất quan trọng đó là ờ các cái mẫu quảng cáo tự động ấy thì nó thường có một cái giai đoạn của máy học hay chúng ta gọi là learning phase. À chiến dịch thường cần một cái khoảng thời gian để mà nó có thể học dữ liệu của khách hàng thông thường là lên tới 7 ngày. Và sản phẩm trước khi đạt trạng thái ổn định và hiệu quả thì đều phải trải qua quá trình của cái máy học này các bạn nhé."},{"l":8,"p":"Phần 1","t":"À tiếp Tiế theo nữa, một cái ưu điểm của à quảng cáo Gmax đó chính là nó giúp chúng ta tiết kiệm thời gian quản lý quảng cáo, tăng doanh số nhanh chóng và đặc biệt là à những cái dịp sale lớn ấy thì quảng cáo chi tiêu rất là ờ tốt cho các cái nhà quảng cáo và tăng các cơ hội tiếp cận khách hàng tiềm năng. Tuy nhiên khi mà chúng ta chia sẻ về những cái điều tốt của Jmax thì như trải nghiệm của chính cá nhân thời thành trong quá trình triển khai cả hoạt động chiến dịch thủ công và Jmax thì cứ tưởng rằng là Jmax nó sẽ giúp chúng ta tự động về à kỹ thuật nhiều hơn."},{"l":8,"p":"Phần 1","t":"Nhưng mà sau này các bạn làm thì các bạn sẽ thấy là Vmax nó sẽ phát sinh rất nhiều tình huống mà ờ gần như là một cái người quảng cáo chúng ta phải có nhiều kinh nghiệm thì chúng ta mới có thể xử lý được các cái tình huống như vậy nhá. Các tình huống đó chúng ta sẽ nói sau trong bài học này. Tiếp theo nữa ở phần này chúng ta sẽ so sánh giữa JX và quảng cáo thủ công để hiểu rõ khi nào nên sử dụng mỗi loại."},{"l":8,"p":"Phần 1","t":"Trước hết mục tiêu chính của Jmax là tối đang hóa doanh thu. Tức là hệ thống sẽ cố gắng phân phối quảng cáo để tạo ra nhiều đơn hàng nhất có thể trong phạm vi trách. Trong khi đó thì Quảng cáo thủ công thường được dùng để kéo traffic hoặc là test sản phẩm, nghĩa là người bán có thể kiểm soát chi tiết hơn cho từng chiến dịch."},{"l":8,"p":"Phần 1","t":"Về cách đặt giá thầu, Jmax sử dụng các cái mô hình tự động như là OCPM hoặc là OCPS, hệ thống sẽ tự động điều chỉnh để đạt mục tiêu doanh số. Ngược lại, với quảng cáo thủ công, người bán phải tự cài CPC hoặc là ngân sách và phải theo dõi điều chỉnh thường xuyên."},{"l":8,"p":"Phần 1","t":"Một đặc điểm khác biệt quan trọng là giai đoạn máy học, Gmax thường cần khoảng từ 50 cho đến 100 đơn hàng để hệ thống có thể hiểu dữ liệu và hoạt động một cách ổn định. Trong khi đó, quảng cáo thủ công có thể chạy ngay lập tức mà không cần thời gian của máy học. Về tín hiệu tối ưu thì Jmax sử dụng rất nhiều dữ liệu như lượt xem, thời gian xem, lượt tích thêm vào dò hàng và mua hàng nên là khả năng tìm đúng khách hàng thường tốt hơn."},{"l":8,"p":"Phần 1","t":"Còn quảng cáo thủ công chủ yếu dựa vào click và đơn hàng nên dữ liệu đơn giản hơn. Ngoài ra thì Jmax thường phù hợp với các shop vừa và lớn khi đã có dữ liệu bán hàng à đủ nhiều để hệ thống có thể học được. Trong khi đó quảng cáo thủ công thì thường phù hợp với những shop nhỏ hoặc giai đoạn mới bắt đầu."},{"l":8,"p":"Phần 1","t":"Tuy nhiên, Jmax cũng có một cái rủi ro đó là Nếu như tín hiệu chuyển đổi của chúng ta giảm, hệ thống có thể tiêu ngân sách nhanh mà hiệu quả lại không cao."},{"l":8,"p":"Phần 1","t":"Có thể hiểu đơn giản là quảng cáo thủ công phù hợp để kiểm soát và thử nghiệm, còn JMX phù hợp để mở rộng và tăng trưởng doanh số nhé. Chúng ta cùng nhau chuyển sang phần số hai đó là thực hành quảng cáo Shopee. Đây là phần rất quan trọng mà các bạn có thể bắt đầu áp dụng kiến thức một cách rất thực tế nhá."},{"l":8,"p":"Phần 1","t":"Nếu như ở phần trước chúng ta đã hiểu bản chất của quảng cáo trả phí trong a sàn thương mại điện tử thì ở phần này chúng ta sẽ à tìm cách để cho chúng ta thiết lập và tối ưu quảng cáo Shopee với một cách rất là cụ thể. Mục tiêu của phần hành động không chỉ là bấm nút chạy quảng cáo là xong mà chúng ta còn quan tâm đến vì sao lại phải cài đặt như vậy và cách để chúng ta tối ưu quảng cáo một cách có hiệu quả."},{"l":8,"p":"Phần 1","t":"Đầu tiên chúng ta sẽ tìm hiểu cách thực hành quảng cáo trên nền tảng Shopee. À trước khi bắt tay vào làm quảng cáo, chúng ta cần làm rõ ba cái tư duy quan trọng như sau. À thứ nhất là quảng cáo là một cái hoạt động hiển thị sản phẩm tới nhiều người."},{"l":8,"p":"Phần 1","t":"Thế nên Nên là việc bán được hàng hay không có ra đơn hàng hay không à phần lớn không phụ thuộc vào quảng cáo mà phụ thuộc vào chính cái sản phẩm anh chị bán nó có đáp ứng được nhu cầu và mong muốn của khách hàng hay không. Nói cách khác thì quảng cáo sẽ biến một cái sản phẩm tốt trở nên tốt hơn còn nó sẽ không có khả năng biến một cái sản phẩm tồi trở nên tốt hơn vượt trội so với những cái sản phẩm khác ở trên thị trường."},{"l":8,"p":"Phần 1","t":"Thứ hai là không có một cái chuyên gia nào, không có một cái tool nào về quảng cáo có thể giúp chúng ta cải thiện vị trí quảng cáo. một cách hiệu quả, một cách đột biến nếu như sản phẩm của chúng ta là những cái sản phẩm tồi. Và thứ ba là mỗi một ngành hàng sẽ có một cách định giá khác nhau cho ra các kết quả khác nhau."},{"l":8,"p":"Phần 1","t":"Có người thì một đồng quảng cáo họ ra được 10 đồng doanh thu nhưng cũng có người một đồng doanh thu à một đồng quảng cáo đó họ cũng chỉ mang được ba đồng doanh thu thôi."},{"l":8,"p":"Phần 1","t":"Quan trọng nhất là chúng ta phải hiểu rằng là mỗi cái ngành hàng, mỗi một cái sản phẩm sẽ có một cái giá trung bình khác nhau. Và quan trọng đấy chính là cái lợi nhuận cuối cùng. Vì vậy là trong quá trình làm thì chúng ta cũng Đừng quá so sánh cái mẫu quảng cáo của mình với những cái bạn bè của mình trong khi bạn bè của mình lại là những cái ngành kh hoàn toàn khác so với chúng ta."},{"l":8,"p":"Phần 1","t":"Tùy thuộc vào cái mức độ cạnh tranh của ngành để chúng ta đưa ra các cái mức kỳ vọng phù hợp cho các cái vấn đề về chỉ số nhá. Tiếp theo nữa chúng ta cùng hiểu rằng là quảng cáo thì cũng giống như mang hàng ra chợ để bán thôi. Tại chợ thì cũng có năm bảy gian hàng họ cũng bán giống như mình."},{"l":8,"p":"Phần 1","t":"Và cái việc cạnh tranh là một cái điều không thể nào chúng ta tránh khỏi được. À khách hàng sẽ lựa chọn những cái sản phẩm nào phù hợp nhất, chất lượng phù hợp nhất, giá tốt nhất, uy tin nhất để khách hàng có thể mua."},{"l":8,"p":"Phần 1","t":"Thế nên câu chuyện ở đây còn là câu chuyện về sự cạnh tranh chứ không phải là câu chuyện là ai quảng cáo được nhiều hơn nhé. À đối với nền tảng Shopee thì hiện nay họ có các cái dạng quảng cáo như sau. Đầu tiên chúng ta gọi là quảng cáo sản phẩm."},{"l":8,"p":"Phần 1","t":"À gần đây thì Shopee họ đã gộp lại các cái mẫu quảng cáo tìm kiếm khám phá thành một, đó chính là quảng cáo sản phẩm. Đ quảng cáo tìm kiếm cũ hiển thị ở trang kết quả tìm kiếm, quảng cáo khám phá khá cũ thì hiển hiển thị ở trang chủ các trong danh mục, trang chi tiết sản phẩm. À hình ảnh ở đây à giúp các bạn có thể nhìn được cái mẫu cũ nó khác nhau như thế nào đấy."},{"l":8,"p":"Phần 1","t":"Còn hiện nay đã gộp lại thành cùng một mẫu quảng cáo sản phẩm rồi. Quảng cáo sẽ được hiển thị trên màn hình điện thoại và màn hình máy tính ra làm sao? Thì chúng ta cùng nhau nhìn hình minh họa."},{"l":8,"p":"Phần 1","t":"Đối với à điện thoại thì hai vị trí đầu tiên khi trong kết quả tìm kiếm sẽ là các vị trí quảng cáo và cứ ba vị trí tự nhiên chúng ta sẽ có một vị trí liên quan đến quảng cáo à trên máy tính thì đầu năm vị trí đầu tiên trên một trang và năm vị trí cuối cùng trên một trang sẽ là những cái vị trí quảng cáo. À hiện nay thì Shopee cũng đang triển khai một cái điều nữa đó là à không cho người dùng biết à đâu là vị trí quảng cáo, đâu là vị trí hiển thị tự nhiên."},{"l":8,"p":"Phần 1","t":"Thì đây là một cái tính năng mà Shopee hiện nay họ đang triển khai nhé. Còn dưới góc độ là các cái kiến thức họ công bố thì chúng ta sẽ thấy là các cái vị trí hiển thị nó sẽ như thế này. được chưa ạ?"},{"l":8,"p":"Phần 1","t":"Trên màn hình điện thoại và trên màn hình máy tính. Được chưa ạ? Tiếp theo nữa là thay vì quảng cáo sản phẩm thì sẽ có một cái dạng quảng cáo đó là dạng quảng cáo shop."},{"l":8,"p":"Phần 1","t":"Quảng cáo shop chính là à chúng ta thay vì chỉ quảng cáo một cái sản phẩm đơn lẻ thì bây giờ chúng ta truyền thông cho cả một shop."},{"l":8,"p":"Phần 1","t":"Các hiển thị của quảng cáo shop chính là ờ bao gồm là tên shop và các cái sản phẩm chính của những cái shop đó bán. Và ở phần này chúng ta sẽ cùng nhau tìm hiểu Shopee sẽ tính chi phí cho nhà quảng cáo như thế nào. Đầu tiên thì Shopee sẽ tính chi phí dựa trên mỗi một lượt click."},{"l":8,"p":"Phần 1","t":"Thuật ngữ của chi phí cho mỗi lượt click gọi là CPC click. Và giá click của mỗi ngành hàng, mỗi sản phẩm là khác nhau. Ví dụ là ngành thời trang giá rẻ click từ 200 đến 400 đồng, ngành gia dụng là từ 3000 đến 5000, ngành nhà cửa đời sống thì khoảng 2000 đến 3000 chẳng hạn."},{"l":8,"p":"Phần 1","t":"Tóm lại là Shopee sẽ tính dựa trên mỗi một cái lượt click của khách hàng. Tiếp theo nữa là cơ chế tiêu tiền của Shopee thì khác biệt hơn so với nền tảng Facebook. hay là TikTok."},{"l":8,"p":"Phần 1","t":"À Shopee có cơ chế là tiêu thốc tiền trong một thời gian ngắn. À giả dụ như là khi chúng ta cùng cài đặt 1 triệu đồng cho một chiến dịch quảng cáo trên Shopee thì có thể là trong khoảng 1 tiếng đồng hồ thôi là à chiến dịch quảng cáo của chúng ta đã tiêu hết 1 triệu đấy rồi. Nhưng ngược lại đối với nền tảng Facebook hay nền tảng TikTok ấy thì ví dụ chúng ta cài đặt 1 triệu một ngày cho à một cái sản phẩm A, một cái mẫu quảng, một cái chiến dịch quảng cáo A thì cơ chế tiêu tiền của Facebook, TikTok là nó sẽ có cơ chế dàn đều cái khoản tiền ra trong vòng 24 tiếng kể từ lúc chúng ta cài đặt quảng cáo."},{"l":8,"p":"Phần 1","t":"Thế nên là Shopee có một cái tình trạng đó là không kiểm soát được tốc độ chi tiêu tiền. Ngân sách quảng cáo có thể hết rất là nhanh trong khi mà trong khi đã đấu thầu ở mức thấp nhất. Shopee cũng sẽ không có trách nhiệm tiêu tiền trong một ngày mà nó có thể tiêu thốc trong một cái khoảng thời gian rất là nhanh. Thế nên là sau này khi mà chúng ta đi làm thì chúng ta sẽ có một cái à thủ thuật liên quan đến tiêu nới ngân sách."},{"l":8,"p":"Phần 1","t":"Tức là chúng ta sẽ phải sử dụng các cái phương pháp thủ công để phân bổ ng sách theo từng khung giờ phù hợp trong ngày à chứ còn để cho nền tảng tự động phân phối thì có thể là tiêu rất là nhanh các bạn nhé. Tiếp theo nữa đó là Shopee sẽ xếp hạ các cái quảng cáo của chúng ta như nào? Shopee thì họ không cào bằng tất cả các cái vị trí quảng cáo, tức là không phải ai cũng được hiển thị giống như nhau mà họ sẽ phải có những cái cơ chế riêng biệt để mà có thể tiếp cận."},{"l":8,"p":"Phần 1","t":"À và cái cơ chế này thì có thể là gọi là một cái cơ chế liên quan đến value based, tức là xếp hạng những cái giá trị của những cái nhà bán hàng, nhà quảng cáo theo những cái giá trị khác nhau và tùy vào những cái giá trị đó, giá trị nào lớn thì họ sẽ xếp các bạn lên đầu. Những nhà bán nào mà có giá trị nhỏ thì chúng ta sẽ phải xuống những cái vị trí xa xôi hơn. Thế thì Shopee sẽ xếp hạng quảng cáo dựa vào ba yếu tố như sau. À đầu tiên đó chính là giá thầu."},{"l":8,"p":"Phần 1","t":"Các bạn cứ hiểu đơn giản là ai cứ có nhiều tiền hơn thì người đó được ưu tiên hiển thị hơn. Thì cơ chế giá thầu là một trong ba cơ chế đó. Thứ hai đó là các cái điểm liên quan đến điểm liên quan."},{"l":8,"p":"Phần 1","t":"Điểm liên quan có nghĩa là gì? Là ờ khách hàng tìm kiếm một sản phẩm và cái sản phẩm đó liên quan mật thiết đến cái từ khóa khách hàng tìm kiếm, có mức độ liên quan đến nhu cầu của khách hàng thì à sẽ có khả năng hiển thị cao hơn so với những sản phẩm ít liên quan hơn. Và cuối cùng đó là hiệu suất của sản phẩm bán."},{"l":8,"p":"Phần 1","t":"À hiệu suất chính là những yếu tố như là lượt bán, à những yếu tố như là trả lời tin nhắn, những yếu tố liên quan đến vận hành của cả cái shop hoặc là cả cái sản phẩm đó. Thế thì trung hòa cả ba yếu tố này lại thì thì chúng ta có một à cái bảng xếp hạng đủ tốt để mà xếp hạng shop nào được hiển thị vào vị trí nào. Đấy. Thế thì giải thích một cách kỹ càng hơn, một cách cơ sở hơn thì chúng ta có thể nhìn thấy thứ nhất là giá thầu."},{"l":8,"p":"Phần 1","t":"Nhà bán sẽ đấu thầu cao hơn, sẽ có xu hướng được hiển thị, ưu tiên hiển thị nhiều hơn. Điểm liên quan là sản phẩm có tỉ lệ liên quan về mặt Click Shopee căn cứ vào hiệu suất CTR trước đó để mà có thể đánh giá. À hiệu suất bán của sản phẩm, các sản phẩm có chỉ số Ras từ quảng cáo tốt này, có khả năng phát sinh đơn hàng cao với những cái từ khóa đ thầu sẽ được ưu tiên hơn."},{"l":8,"p":"Phần 1","t":"Do đó là quảng cáo sản phẩm nào tỏ ra phù hợp với khách hàng sẽ được Shopee giảm giá thầu xuống và chạy á rẻ hơn. Và ngược lại nếu như những cái quảng cáo nào mà tỏ ra không phù hợp với khách hàng thì Shopee sẽ có cơ chế là tính phí cao hơn cho những cái mẫu quảng cáo đó. Tiếp theo nữa là khi chúng ta chạy quảng cáo ở chế độ thủ công với à Shopee thì chúng ta sẽ có một bước đó là à bước chọn từ khóa để chạy."},{"l":8,"p":"Phần 1","t":"Chúng ta dự đoán được một phần những từ khóa nào mà khách hàng sẽ tiến hành tìm kiếm để có thể tìm ra sản phẩm của chúng ta. Thì bộ từ khóa chính là những cái thứ mà chúng ta sẽ phải dự báo trước."},{"l":8,"p":"Phần 1","t":"Đầu tiên là bộ từ khóa là một cái danh sách các cái từ khóa mà nhà bán hàng chọn để chúng ta cài đặt quảng cáo. Bộ là số nhiều. Nhà bán hàng có thể chọn nhiều hơn một từ khóa để có thể đánh giá tổng thể hiệu quả của quảng cáo."},{"l":8,"p":"Phần 1","t":"Từ đó chọn ra những cái phương án à có khả năng bán hàng tốt nhất. Thế thì đề xuất của thầy Thành, gợi ý của thầy Thành Như sau là chúng ta có thể chọn từ 5 đến 10 từ khóa cho bộ từ khóa. Mỗi từ khóa nên có khoảng 1000 traffic 1 tháng trở lên."},{"l":8,"p":"Phần 1","t":"Và cẩn thận với những từ khóa trên 100.000 traffic một tháng. Chúng ta có thể nhập từ khóa gốc vào thanh tìm kiếm à trên Shopee và Shopee sẽ gợi ý ra những cái từ khóa dài hơn phát triển từ khóa gốc đó. Ví dụ cùng một chiếc áo sơ mi thì chúng ta có một bộ bao gồm là ví dụ như áo sơ mi trắng, áo sơ mi công sở, áo sơ mi nam. Tiếp theo nữa thì các bộ từ khóa sẽ rất rất là linh hoạt. Có thể sẽ là những cái bộ từ khóa thương hiệu."},{"l":8,"p":"Phần 1","t":"Khách hàng có thể tìm kiếm thay vì tìm kiếm là cụ thể là sản phẩm thì họ sẽ tìm sản phẩm với tên thương hiệu của cái sản phẩm đó. Ví dụ như cái thương hiệu như Gum, Yodi à thương hiệu của chúng ta ví dụ như là Lami chẳng hạn. À từ khóa sản phẩm thì chúng ta có những cái từ khóa chung ví dụ như áo sơ mi nữ."},{"l":8,"p":"Phần 1","t":"Từ khóa mô tả một vài cái đặc điểm đặc tính của sản phẩm. Ví dụ như áo sơ mi nữ công sở, áo sơ mi nữ công sở dài tay, áo sơ mi nữ công sở màu đỏ, áo sơ mi nữ dài tay chẳng hạn. À và các cái từ khóa liên quan."},{"l":8,"p":"Phần 1","t":"Ví dụ như là thời trang công sở. Và trong quá trình chọn từ khóa thì chúng ta sẽ có hai cái cách để chúng ta lựa chọn từ khóa cho hiệu quả. Và hai cách này chính là hai cái đặc điểm quan trọng của từ khóa nhé."},{"l":8,"p":"Phần 1","t":"Đầu tiên là khi chúng ta chọn chế độ từ khóa mở rộng thì quảng cáo sẽ xuất hiện trên trang kết quả tìm kiếm là các cái cụm từ có thể là biến thể và có liên quan đến từ khóa mà chúng ta đã chọn."},{"l":8,"p":"Phần 1","t":"Ví dụ những cái từ cùng ý nghĩa, cùng ngành hàng ngay cả khi các cái từ khóa đó không chứa từ khóa chúng ta thiết lập. Giả sử như khi chúng ta chọn từ áo thun để chúng ta chạy và chúng ta chọn ở chế độ mở rộng thì những khách hàng nào người ta tìm kiếm từ áo thun nam, áo sơ mê, áo croptop chỉ cần là cùng ý nghĩa và cùng ngành hàng thì sản phẩm đó cũng được hiển thị. Thì người ta gọi như thế là một cái cách cài đặt mở rộng."},{"l":8,"p":"Phần 1","t":"Còn từ khóa chính xác đó là quảng cáo của chúng ta chỉ hiển thị khi người dùng tìm tìm kiếm chính xác từ khóa mà chúng ta đã thiết lập. Ví dụ là chúng ta cùng nguồn là từ áo thun nhưng mà chúng ta để ở chế độ chính xác thì khách hàng phải đánh rõ ràng một từ đó là từ áo thun thì mới xuất hiện cái quảng cáo này. Đấy, xuất hiện quảng cáo này."},{"l":8,"p":"Phần 1","t":"Vậy thì có các cái tư duy nào khi chúng ta cài đặt giá thầu? Đầu tiên thì chúng ta có hai phương pháp cài đặt giá thầu trên cho từ khóa. Phương pháp thứ nhất đó là chúng ta cài đặt mức giá thầu ở mức thấp nhất hiện nay."},{"l":8,"p":"Phần 1","t":"Hiện nay thì Shopee đưa ra một cái mức thấp nhất là 720 đồng cho một từ khóa và dần dần chúng ta có thể tăng lên à các thứ hạ, chúng ta có thể kiểm tra thủ công và làm liên tục các bước đến khi quảng cáo của chúng ta vào được những cái vị trí mong muốn. À cách thứ hai đó là chúng ta có thể khoán à trong chuyên ngành gọi là khoán à khoán khoán thầu theo phương thức khoán có nghĩa là gì?"},{"l":8,"p":"Phần 1","t":"Giá thầu sẽ bằng giá bán nhân với một cái mức phần trăm tiền quảng cáo dự kiến mà nhà bán à chịu được và nhân với phần trăm tỉ lệ chuyển đổi dự kiến. Thế thì đối với những cái người mới làm trên Shopy á do chưa có số liệu thực tế về tỉ lệ chuyển đổi và tỉ lệ quảng cáo nên giả định cái chuyển đổi là 2%. Tỷ lệ quảng cáo mà chúng ta có thể chi được là 20% thì công thức sẽ là giá bán là 200k này, phần trăm tiền quảng cáo trung bình là 20% tỉ lệ chuyển đổi là 2%."},{"l":8,"p":"Phần 1","t":"Thế thì giá thầu sẽ là 800 đồng cho một click. Giá bán nhân với 0.4 là chúng ta ra giá thầu. Đấy."},{"l":8,"p":"Phần 1","t":"Tương tự như vậy thì Với các con số phía dưới các bạn có thể thấy là à tương ứng với mỗi một cái ngành hàng với mỗi một sản phẩm với mỗi một giá bán thì chúng ta sẽ đưa ra một mức khoán về CPC cơ bản như phía dưới. Cách số một của các cái cách tính về CVC ban đầu á cách số một sẽ là cách phù hợp với những cái người mới. Cách số hai thì sẽ phù hợp với những cái nhà bán nào sau một thời gian chúng ta chạy chúng ta bắt đầu có những cái dữ liệu, chúng ta bắt đầu có một cái ngân sách cụ thể cho việc quảng cáo thì chúng ta có thể áp dụng công thức số hai."},{"l":8,"p":"Phần 1","t":"Tiếp theo nữa là về vật về việc thiết lập quảng cáo. các bước setup cơ bản trên giao diện của Shopee như sau. À phần này rất lưu ý đó là hiện nay toàn bộ những cái chiến dịch quảng cáo trên những cái gian hàng thông thường thì chúng ta đã chuyển sang chế độ Jmax."},{"l":8,"p":"Phần 1","t":"Còn lại trên gian hàng Shopee More, gian hàng chính hãng thì vẫn còn các chế độ liên quan đến thủ công. Được chưa ạ? Thế thì cái màn hình và cái giao diện này chính là giao diện của các cái gian hàng Shopee More, tức là các cái gian hàng mà chúng ta tiến hành cài đặt thủ công."},{"l":8,"p":"Phần 1","t":"Vậy thì các bước setup cơ bản đối với à à quảng cáo thủ công à sẽ như thế nào chúng ta sẽ bắt đầu như sau. À đầu tiên chúng ta cần chú ý một số các cái vấn đề cài đặt quan trọng. Đầu tiên là ngân sách."},{"l":8,"p":"Phần 1","t":"À các bạn nên chọn ngân sách hàng ngày thay vì ngân sách không giới hạn. Việc này giúp chúng ta kiểm soát chi phí tốt và tránh được tình trạng quảng cáo chi tiêu quá nhanh. Tiếp theo là phần thời gian chạy quảng cáo."},{"l":8,"p":"Phần 1","t":"Ở giai đoạn đầu các bạn nên để không giới hạn với thời gian để quảng cáo có đủ dữ liệu học và tối ưu hiệu quả. Phần thứ ba đó là vị trí hiển thị. Không nên chọn tất cả các cái vị trí cùng một lúc."},{"l":8,"p":"Phần 1","t":"Thay vào đó, các bạn nên chọn từng vị trí riêng biệt. Ví dụ chị trệ quằng cháo tìm kiếm hoặc khám phá để dễ đo lường hiệu quả. Cuối cùng là phần chọn sản phẩm."},{"l":8,"p":"Phần 1","t":"Các bạn nên chọn sản phẩm một cách thủ công thay vì để Shopee tự động chọn nhé. Việc chọn thủ công giúp nhà bán của chúng ta kiểm soát được sản phẩm nào đang chạy quảng cáo và dễ dàng tối ưu. Tiếp theo chúng ta sẽ đến với mục thiết lập giá thầu."},{"l":8,"p":"Phần 1","t":"Đây là một trong những cái bước quan trọng nhất khi chúng ta chạy quảng cáo Shopee. Ở giao diện mới thì Shopee sẽ gợi ý cho chúng ta giá thầu tự động. Tuy nhiên trong phần thực hành này các bạn nên chọn giá thầu thủ công."},{"l":8,"p":"Phần 1","t":"Lý do là khi cài đặt giá thủ công chúng ta sẽ kiểm soát được chi phí click biết rõ mình đang chi trả bao nhiêu tiền cho mỗi một cái lượt truy cập và dễ dàng tối ưu về sau."},{"l":8,"p":"Phần 1","t":"Nếu giá thầu là tự động à Shopee sẽ tự động điều chỉnh giá thầu theo thuật toán. Điều này có thể tiện lợi nhưng mà khó kiểm soát chi phí, đặc biệt là đối với những người mới bắt đầu. Phần tiếp theo là cái phần liên quan đến tối ưu sáng tạo nhé."},{"l":8,"p":"Phần 1","t":"Thì các bạn nên tắt tối ưu sáng tạo. Vì bật tính năng này thì Shopee có thể tự động thay đổi hình ảnh hoặc là cách hiển thị sản phẩm khiến cho chúng ta khó đánh giá chính xác được hiệu quả quảng cáo. Ở giai đoạn học và thực hành, điều quan trọng nhất là chúng ta kiểm soát được những cái biến số nên chúng ta sẽ giữ giá thầu thủ công và tắt tối ưu sáng tạo."},{"l":8,"p":"Phần 1","t":"Sau khi thiết lập xong bước này, chúng ta sẽ chuyển sang phần quan trọng nhất chính là thiết lập bộ từ khóa. Tiếp theo, chúng ta sẽ tiến hành thiết lập bộ từ khóa quảng cáo. Đây một phần quyết định rất lớn tới hiệu quả chiến dịch."},{"l":8,"p":"Phần 1","t":"Nguyên tắc đầu tiên là các bạn nên chọn khoảng 5 đến 10 từ khóa liên quan trực tiếp đến sản phẩm. Ưu tiên các sản phẩm từ khóa có thuộc tính cụ thể."},{"l":8,"p":"Phần 1","t":"hoặc từ khóa đuôi giải. Ví dụ như là có màu sắc, có giới tính, có mục đích sử dụng hoặc đặc điểm của sản phẩm. Những cái từ khóa này thường có tỉ lệ mua hàng cao hơn so với từ khóa quá chung chung."},{"l":8,"p":"Phần 1","t":"Về tỉ lệ tìm kiếm thì các bạn nên ưu tiên những cái từ khóa có khoảng à từ 1000 cho đến 10.000 lượt tìm kiếm trở lên. Vì đây là một cái mức để đủ để tạo ra lượng truy cập một cách ổn định. Tuy nhiên, con số này chỉ mang tính chất tham khảo thôi, không phải cứ thấp là không có đơn hàng đâu nhé."},{"l":8,"p":"Phần 1","t":"Ngược lại các bạn cũng có thể nên cẩn thận với những cái từ khóa có lượng tìm kiếm quá lớn. Ví dụ trên 100.000 lượt tìm kiếm mỗi tháng. Vì những từ khóa này thường cạnh tranh cao, giá click đắt và người mới chạy quảng cáo sẽ khó đạt được hiệu quả."},{"l":8,"p":"Phần 1","t":"Mục tiêu của bước này không phải là chọn thật nhiều từ khóa mà chọn đúng những cái từ khóa có khả năng ra đơn hàng tốt nhất. Sau khi hoàn thành bước này chúng ta sẽ chuyển sang phần thiết lập giá thầu cho từng từ khóa nhé."},{"l":8,"p":"Phần 1","t":"Sau khi quảng cáo một thời gian, việc quan trọng tiếp theo là chúng ta cùng nhau đọc báo cáo, đánh giá hiệu quả quảng cáo. Trong phần này, chúng ta sẽ tập trung vào các cái nhóm chỉ số quan trọng đó là chi phí, doanh thu và RAS. Ba chỉ số này giúp nhà bán biết được quảng quảng cáo đang hoạt động hiệu quả hay không và có mang lại lợi nhuận hay không."},{"l":8,"p":"Phần 1","t":"Chỉ số đầu tiên đó là chi phí quảng cáo, tức là số tiền bạn đã bỏ ra để chạy quảng cáo cho sản phẩm. Chỉ số thứ hai là doanh thu từ quảng cáo, tức là số tiền bán hàng phát sinh từ những đơn hàng có nguồn thu đến từ quảng cáo. Và quan trọng nhất đó là RAS."},{"l":8,"p":"Phần 1","t":"À đây là viết tắt của return on spenden. Đây là chỉ số thể hiện hiệu quả của quảng cáo. Rust sẽ được tính bằng doanh thu phát sinh từ quảng cáo chia cho chi phí quảng cáo."},{"l":8,"p":"Phần 1","t":"Ví dụ nếu bạn bỏ ra 100.000 tiền quảng cáo và thu về là 400.000 thì Rust sẽ là 4. Điều đó có nghĩa là một đồng quảng cáo bạn tạo ra bốn đồng doanh thu."},{"l":8,"p":"Phần 1","t":"Khi theo dõi nhóm chỉ số này thường xuyên bạn sẽ biết được sản phẩm nào nên tiếp tục chạy quảng cáo, sản phẩm nào cần điều chỉnh hoặc có nên dừng lại hay không. Đây là các nhóm chỉ số cơ bản nhất mà bất cứ người bán hàng nào cũng cần hiểu trước khi chúng ta tối ưu quảng cáo nha. Ngoài nhóm chỉ số về doanh thu thì chúng ta còn một cái nhóm chỉ số rất quan trọng khác đó là bộ chỉ số phản ánh mức độ cạnh tranh của quảng cáo bao gồm CTR và và CPC."},{"l":8,"p":"Phần 1","t":"Chỉ số đầu tiên là CTR, tức là tỉ lệ click. CTR cho biết là cứ 100 lượt hiển thị thì sẽ có bao nhiêu người bấm vào sản phẩm. CTR càng cao chứng tỏ hình ảnh, tiêu đề giá bán của bạn hấp dẫn à hơn so với đối thủ."},{"l":8,"p":"Phần 1","t":"Ngược lại, CTR thấp thường cho thấy sản phẩm chưa đủ thu hút hoặc đang cạnh tranh kém hơn với các shop khác. Vì vậy, CTR chỉ là chỉ số giúp chúng ta đánh giá mức độ hấp dẫn của sản phẩm và khả năng cạnh tranh trên sàn. Chỉ số thứ hai đó là CPC, chi phí cho mỗi lượt click. Nhiều người thường nhầm l dẫn giữa CPC đặt giá thầu và CPC thực tế."},{"l":8,"p":"Phần 1","t":"CPC mà bạn thiết lập khi đấu thầu không phải là CPC thực tế mà bạn phải trả. CPC thực tế nên được tính theo công thức CPC bằng chi phí quảng cáo chia cho số click. Cái này chúng ta làm thủ công."},{"l":8,"p":"Phần 1","t":"Khi theo dõi CPC thực tế, bạn sẽ biết được mình đang trả bao nhiêu tiền cho mỗi một lượt truy cập vào sản phẩm, từ đó đánh giá được mức độ cạnh tranh của từ khóa và ngành hàng. Kết hợp giữa CTR và CPC, người bán có thể hiểu rõ hơn quảng cáo đang cạnh tranh tốt hay chưa và cần tối ưu hình ảnh sản phẩm giá bán hay là giá thẩu quảng cáo. Bây giờ chúng ta cùng xem một ví dụ thực tế về báo cáo hiệu quả quảng cáo Shopee."},{"l":8,"p":"Phần 1","t":"Để hiểu cách đọc các chỉ số quảng cáo một cách trực quan, trong báo cáo này, chúng ta có thể thấy một số chỉ số quan trọng. Thứ nhất là số lượt hiển thị. Ở đây là 300 được hiển thị."},{"l":8,"p":"Phần 1","t":"Đây là số lần quảng cáo của chúng ta được Shopee hiển thị với khách hàng. Tiếp theo là số lực click là 109, tức là 109 người đã bấm vào quảng cáo sau khi nhìn thấy quảng cáo."},{"l":8,"p":"Phần 1","t":"Từ đó hệ thống tính ra tỉ lệ CTR là khoảng 2,91. Đây là mức CTR tương đối tốt. với nhiều ngành hàng trên Shopee cho thấy sản phẩm có mức độ thu hút khá ổn."},{"l":8,"p":"Phần 1","t":"Tiếp theo là số sản phẩm được bán ra là chín sản phẩm. Đây là số đơn hàng phát sinh trực tiếp từ quảng cáo. Chỉ số quan trọng tiếp theo đó là doanh thu từ quảng cáo khoảng 1,7 triệu."},{"l":8,"p":"Phần 1","t":"Trong khi đó chi phí quảng cáo chỉ khoảng 50.000đ. Từ hai con số này, hệ thống tính ra khoảng 33.7 lần. Tức là bỏ một đồng quảng cáo thì thu về 33 đồng doanh thu."},{"l":8,"p":"Phần 1","t":"Đây là một chiến dịch có hiệu quả khá cao về mặt doanh thu. Ở phía dưới là biểu đồ hiển thị doanh thu và chi phí quảng cáo theo thời gian trong ngày. Đường màu xanh là doanh thu."},{"l":8,"p":"Phần 1","t":"Còn đường Màu đỏ là chi phí quảng cáo. Qua biểu đồ này, chúng ta có thể thấy quảng cáo thường tiêu tiền mạnh và một số khung giờ nhất định thay vì tiêu đều trong ngày. Việc đọc báo cáo theo cách này sẽ giúp người bán hiểu rõ quảng cáo đang hoạt động ra sao và biết khi nào nên tăng ngân sách hoặc tối ưu chiến dịch."},{"l":8,"p":"Phần 2","t":"Tiếp theo là chúng ta cùng nhau bước qua phần thực hành liên quan đến quảng cáo TikTok. Như vậy là chúng ta đã đi qua phần thực hành quảng cáo về Shopee rồi bao gồm các cái tư duy liên quan đến chạy quảng cáo, cách thiết lập chiến dịch, lựa chọn từ khóa cho tới là cái cách các bạn đọc báo cáo và đánh giá hiệu quả. Bây giờ chúng ta cùng nhau bước sang nội dung cuối cùng của bài học ngày hôm nay đó là thực hành quảng cáo trên nền tảng TikTok TikTok Shop."},{"l":8,"p":"Phần 2","t":"Nếu như quảng cáo Shopee chủ yếu xoay quanh là từ khóa, giá thầu và vị trí hiển thị thì quảng cáo TikTok lại à hoặ hoạt động theo một cái cơ chế hoàn toàn khác. Trên TikTok, nội dung video đóng vai trò quan trọng hơn rất là nhiều và thuật toán sẽ dựa vào những cái tín hiệu thương mại từ phía người xem. Ví dụ như là thời gian xem, à các cái lượt tương tác à thêm vào giỏ hàng hay là gian hàng để đánh giá là cái video đó nó có hiệu quả đối với việc bán hàng hay không. Và bây giờ chúng ta cùng nhau tìm hiểu nhé."},{"l":8,"p":"Phần 2","t":"Trước khi bắt đầu chạy quảng cáo TikTok, chúng ta cùng nhau tìm hiểu về một khái niệm à đó là khái niệm liên quan đến miễn dịch quảng cáo. À có một thống kê bên Trung Quốc nói về việc khách hàng có dấu hiệu diễn dịch hơn với quảng cáo với những cái nội dung như kiểu là chi 10 nhân dân tệ để mua một sản phẩm chỉ còn 100 sản phẩm cuối cùng. Các cái nội dung này có có một cái khả năng đó là bị suy giảm hiệu quả."},{"l":8,"p":"Phần 2","t":"Tỉ lệ click giảm 8% năm 2023 chỉ còn 2% năm 2025 thôi. Và thời gian vuốt skip quảng cáo nhanh hơn từ 3,2 giây xuống còn 1.8 giây. Và chúng ta cứ tưởng tượng như này là đầu óc của khách hàng ấy thì nó giống như một cái miếng bọt biển ấy."},{"l":8,"p":"Phần 2","t":"Khi mà miếng bọt biển đó nó đã thấm đầy đủ nước rồi thì chúng ta dù chúng ta có đổ thêm bao nhiêu nước vào cái miếng bọt biển đấy nữa thì cái miếng bọt biển đấy nó cũng sẽ không tiếp thu thêm lượng nước và nó cứ thế là có cơ chế là cứ cái cứ cái mới đến thì sẽ quên đi cái cũ. Và quảng cáo hiện nay nó cũng giống như vậy."},{"l":8,"p":"Phần 2","t":"Khách hàng của chúng ta đã đến một cái giai đoạn họ cực kỳ dị ứng và thường là họ sẽ bỏ qua những cái chiến dịch quảng cáo. Thế là một cái cách thức đặt ra đối với những cái người làm nội dung, những cái người chạy quảng cáo trên nền tảng TikTok là làm sao để khách hàng có thể nhớ về sản phẩm của chúng ta khách hàng có thể đưa ra những cái hành vi à liên quan đến bỏ dò hoặc là mua hàng và làm sao mà cái nội dung của chúng ta à ngày càng sáng tạo hơn để khách hàng có thể nhớ tới."},{"l":8,"p":"Phần 2","t":"Thế thì à nội dung quảng cáo hiện nay nó như đã khẳng định ở bên trên nó là một cái nội dung bị dư thừa bão hòa. Khi khách hàng quan tâm đến sản phẩm họ có thể xem rất nhiều video quảng cáo xoay quanh sản phẩm đó và nội dung cũng cạnh tranh nhau một cách gắt gao giống như sản phẩm thôi. Nội dung quảng cáo đang phải giành giật sự chú ý và cái lượt click từ khách hàng."},{"l":8,"p":"Phần 2","t":"Do đó không phải là ờ chúng ta chi rất nhiều cho cái sự chú ý về mặt số lượng cần sản xuất và booking nhiều cái lượng video mà nội dung của chúng ta cần làm được à bốn việc. Thứ nhất là phải gây ấn tượng hơn với khách hàng của chúng ta. À chúng ta phải chịu khó thay đổi sáng tạo và đổi mới và quảng cáo ngày càng phải trở nên nổi bật hơn và chúng ta cần đầu tư vào chất lượng nội dung thay vì số lượng nội dung giống như trước đây."},{"l":8,"p":"Phần 2","t":"Và nhiệm vụ quảng cáo của quảng cáo đó là giúp khách hàng của chúng ta hiểu rõ về sản phẩm, tiếp phục được được cả bằng lý và tình chứ không phải là chúng ta chỉ nhằm vào bẫy click, câu click hay là kéo traffic một cách vô hồn về gian hàng của mình. Cuối cùng quảng cáo JX mục tiêu là của TikTok đó là giúp nhà bán hàng lan tỏa những cái video trở nên tốt hơn, bán hàng được nhiều hơn chứ không phải là chúng ta cố ép khách hàng phải xem những cái video chất lượng kém, khó chịu, đem lại những cái trải nghiệm kém và không tạo ra sự chuyển đổi nhé."},{"l":8,"p":"Phần 2","t":"Bây giờ chúng ta cùng nhau à thảo luận về một cái câu hỏi rất quan trọng đó là theo các cái nhà bán hàng để quảng cáo TikTok trở nên hiệu quả hơn thì điều gì là quan trọng nhất? Điều thứ nhất đó là sản phẩm. Nếu như sản phẩm không tốt, không có lợi thế cạnh tranh hoặc không phù hợp với nhu cầu của thị trường thì quảng cáo giỏi đến đâu cũng rất khó để chúng ta có thể bán hàng."},{"l":8,"p":"Phần 2","t":"Thứ hai đó chính là hệ thống nội dung. À TikTok là một cái nền tảng nội dung vì vậy video phải đủ hấp dẫn à đủ khác biệt thì mình mới có thể thu hút được người xem và tạo ra chuyển đồi. Và cuối cùng đó là mới là các cái kỹ thuật quảng cáo."},{"l":8,"p":"Phần 2","t":"Trong ba yếu tố này thì thầy Thành xếp à yếu tố đầu tiên quan trọng nhất là sản phẩm. Yếu tố thứ hai là chúng ta phải có một cái hệ thống nội dung và yếu tố thứ ba là các kỹ thuật quảng cáo. Và hiện nay kỹ thuật quảng cáo đối với nền tảng TikTok thì phần lớn đã được áp dụng kỹ thuật của Jmax tức là hoàn toàn tự động đó."},{"l":8,"p":"Phần 2","t":"Hoàn toàn tự động và chỉ sử dụng thủ công trong một số trường hợp thôi các bạn nhá. Quảng cáo JX là gì và các cái đặc điểm của J Max thì chúng Chúng ta đã nói ở phần số 1 à chúng ta nói qua những cái điểm chính của JMAX đối với TikTok. Thứ nhất là quảng cáo JMAX thì tại vị trí hiển thị quảng cáo sẽ thể hiện ở trong cả video và cả trong thẻ sản phẩm nhé."},{"l":8,"p":"Phần 2","t":"Cả trong video và cả trong thẻ sản phẩm. À thứ hai là tự động về mặt đối tượng. À TikTok sẽ tự động tìm đến những đối tượng có khả năng à mua sản phẩm của bạn là cao nhất."},{"l":8,"p":"Phần 2","t":"À tự động tìm kiếm đến những cái từ khóa mà khách hàng hay dùng. Nhà quảng cáo chỉ cần cài đặt các mục tiêu tối ưu và cài đặt các cái nội dung để chạy add thôi. Thay vì chỉ có video do nhà quảng cáo tự chọn trước đây, giờ đây có thể chạy tự động các video có gắn sản phẩm, tức là cái luồng quảng cáo hiện nay được đa dạng hơn."},{"l":8,"p":"Phần 2","t":"Khi chúng ta bắt đầu kinh doanh một cái sản phẩm ở trên nền tảng TikTok thì chúng ta thấy là chúng ta có những cái luồng."},{"l":8,"p":"Phần 2","t":"Luồng thứ nhất là video của chính nhà bán chúng ta tự sản xuất. Luồng thứ hai là của những cái người họ làm offlate, họ gắn sản phẩm của chúng chúng ta. Và luồng thứ ba đến từ các cái thẻ sản phẩm đấy."},{"l":8,"p":"Phần 2","t":"Thế thì Jmax chính là một cái hoạt động tự động à cân nhắc những cái vị trí có thể là vị trí của chúng ta tự tản xuất, có thể là vị trí của các nhà booking, có thể là vị trí của sản phẩm để người ta chi tiêu ngân sách một cách tự động hóa, phân phối ngân sách một cách tự động hóa để làm sao mà tìm đến những cái vị trí hiệu quả nhất và tối ưu hóa những cái vị trí đó theo ngân sách để nó phát huy được toàn bộ cái năng lực của chiến dịch đó."},{"l":8,"p":"Phần 2","t":"Tiếp theo nữa đó là GMAX có thể tự động lấy video liên kết với những cái sản phẩm tương ứng cho các cái sản phẩm đã chọn trong chiến dịch. Miễn là video này được ủy quyền để chúng ta sử dụng quảng cáo. Các cái nguồn từ video có thể tự động lấy là tài khoản official của shop này."},{"l":8,"p":"Phần 2","t":"Các cái thản TikTok có sẵn trong trung tâm nhà bán sẽ tự xuất hiện khi mà các tài khoản TikTok này được ủy quyền trong trung tâm doanh nghiệp à của TikTok cửa hàng. Bài đăng Spark đó được ủy quyền trong thư viện sáng tạo từ tài khoản quảng cáo chính đang được chọn để chạy product, video từ nguồn ủy quyền hàng loạt từ những cái nội dung tiếp thị liên kết thì đây chính là những cái vị trí mà TikTok họ công bố."},{"l":8,"p":"Phần 2","t":"Tiếp theo nữa như trong hình các bạn đã nhìn thấy đó là trong product JVMX trong Product Jmax quảng cáo không chỉ xuất hiện ở một vị trí cố định mà có thể hiển thị trên nhiều vị trí khác nhau trong hệ sinh thái TikTok Shop. Có hai dạng hiển thị chính là thẻ sản phẩm và video có gắn link sản phẩm. Thứ nhất, thẻ sản phẩm thì chúng ta gọi là PSR, tức là quảng cáo hiển thị dưới dạng thẻ sản phẩm."},{"l":8,"p":"Phần 2","t":"Những thẻ sản phẩm này có thể xuất hiện trong
