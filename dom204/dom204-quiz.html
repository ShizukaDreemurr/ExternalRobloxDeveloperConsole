ang muốn nghiên cứu trong cái hoạt động nghiên cứu thị trường của các bạn."},{"l":6,"p":"Demo Kalodata","t":"Thì ở đây thìi thầy à ví dụ thì thầy có thể là nghiên cứu là ngành ngành đồ ăn vặt hoặc là các bạn à mở rộng hơn thì các bạn có thể nghiên cứu về ngành gia dụng hoặc là ngành mỹ phẩm vân vân thì tùy thuộc vào cái lĩnh vực mà chúng ta đang muốn nghiên cứu là gì thì các bạn sẽ tìm kiếm cái phần danh mục đấy ở trong cái phần ô này. Đấy sau khi mà các bạn bấm tìm kiếm xong thì nó sẽ hiển thị ra cho chúng ta một kết quả như thế này."},{"l":6,"p":"Demo Kalodata","t":"Thì ở đây là cái ngành đồ ăn vặt thì khi đó thì chúng ta sẽ bấm vào đây. Khi mà bấm vào đây thì nó sẽ hiển thị ra chúng ta một cái dashboard như thế này. Thì ở phần trên đầu tiên thì nó sẽ hiển thị ra những cái phần thời gian thì các bạn có thể lựa chọn những phần khoảng thời gian để mà chúng ta tiến hành những hoạt động nghiên cứu thị trường. Thì ở phần này thầy khuyên là chúng ta sẽ nên sử dụng những cái khoảng dữ liệu từ khoảng 30 ngày đổ lên."},{"l":6,"p":"Demo Kalodata","t":"Còn những cái khoảng thời gian là 7 ngày đến 1 ngày thì thực ra thì nó cũng không có quá nhiều cái phần ý nghĩa trong cái việc là chúng ta tiến hành cái hoạt động nghiên cứu thị trường. Thế thì đầu tiên thì thầy nghĩ là chúng ta sẽ nghiên cứu cái khoảng thời gian là 365 ngày. Nghĩa là trong khoảng 1 năm."},{"l":6,"p":"Demo Kalodata","t":"Thì ở đây chúng ta sẽ có nhiều cái phần số liệu nó đánh giá được là cái xu hướng của thị trường nó phát triển như thế nào. Được chưa? Thì đầu tiên các bạn bấm vào 365 ngày này thì nó sẽ hiển thị những cái phần số liệu tương ứng với khoảng thời gian mà các bạn lựa chọn."},{"l":6,"p":"Demo Kalodata","t":"Ở đây thì đầu tiên thì nó sẽ có một cái bảng số liệu. Cái bảng số liệu này đây là cái chỉ số cốt lõi trong cái lĩnh vực mà các bạn lựa chọn cũng như là cái biểu đồ doanh thu trong cái lĩnh vực các bạn đã lựa chọn rồi. Thì ở đây chúng ta sẽ có một số chỉ số mà các bạn cần quan tâm. Đầu tiên thì đ chốt để giúp cho một cái ảnh bìa có thể được gọi là tốt."},{"l":6,"p":"Phần 1","t":"Ờ cái tiêu chí đầu tiên chính là hình ảnh. À một cái ảnh bìa tốt thì là một cái ảnh bìa cần hình ảnh hóa được cái đặc điểm nổi bật của sản phẩm. Thứ hai là một cái ảnh bìa tốt thì cần tạo được cái ấn tượng cho khách hàng chỉ trong một giây."},{"l":6,"p":"Phần 1","t":"thôi. Và thứ ba thì đấy là cái trải nghiệm nhìn và đọc của khách hàng phải tốt. Thế thì ở trong ở dưới này thì chúng ta có một cái ví dụ đúng không?"},{"l":6,"p":"Phần 1","t":"Khi thầy search một cái từ khóa ở trên Shopee đấy là một cái từ khóa gọi là thanh treo rèm. Thế nó sẽ hiển thị ra năm cái sản phẩm ở bên dưới. Thế thì cái mà như các bạn nhìn thấy đúng không?"},{"l":6,"p":"Phần 1","t":"Cái mà chúng ta nhìn thấy đập ngay vào mắt chúng me chính là ảnh bìa. Đấy chúng ta sẽ hình dung được cái tầm quan trọng của nó như thế nào. Thế ở trong năm cái sản phẩm này thì theo các bạn thì đâu sẽ là một cái ảnh bìa mà tạo ra cái sự ấn tượng và khiến cho nó cho khách hàng có khả năng click vào nhất. Ờ ok. Ở đây chúng ta có thể nhìn thấy là nó nổi bật hơn một chút đúng không?"},{"l":6,"p":"Phần 1","t":"Thì chính là cái ảnh bìa cuối cùng đìa số 5 thì nó sẽ ờ phần nào là có cái sự ấn tượng hơn so với các các ảnh bìa của các sản phẩm còn lại. Thế thì chúng ta sẽ đi tìm hiểu là tại sao nó lại có thể là có khả năng ấn tượng hơn đối với khách hàng. Rồi như thầy vừa nói đúng không?"},{"l":6,"p":"Phần 1","t":"Thì cái tiêu chí đầu tiên của chúng ta đấy là một cái ảnh để tốt thì nó cần phải hình ảnh hóa được cái đặc điểm nổi bật của sản phẩm. Thế thì ở cái môi trường online này. Thế thì khách hàng thì sẽ không được cầm, không được sờ nắm gì vào cái sản phẩm cả."},{"l":6,"p":"Phần 1","t":"Thế cái mà khách hàng nhìn thấy ấ nó sẽ chỉ là cái phần media, sẽ chỉ là cái phần mô tả về cái sản phẩm thôi. Thế thì ảnh bìa thì nó là một cái phần hình ảnh đúng không? Thế thì nếu mà hành bìa mà chúng ta hình ảnh hóa được cái đặc điểm nổi bật của sản phẩm thế thì sẽ dễ dàng khiến khách hàng dễ hình dung về cái đặc điểm nổi bật của sản phẩm đấy hơn. Và khi mà khách hàng dễ hình dung hơn thì khách hàng sẽ ấn tượng hơn."},{"l":6,"p":"Phần 1","t":"Và khi ấn tượng hơn thì sẽ phần nào đấy thì sẽ gia tăng được cái phần trăm khách hàng có khả năng click vào cái sản phẩm đấy nhiều hơn đúng không? Thế thì ở cái phần này thì chúng ta có thể nhìn thấy là có hai cái ví dụ là đã hình ảnh hóa được cái đặc điểm nổi bật của sản phẩm. Ở cái sản phẩm này chính là một cái sản phẩm thanh treo rèm đúng không?"},{"l":6,"p":"Phần 1","t":"Thanh treo rèm này thì nó sẽ có một số đặc điểm nổi bật. Cái đặc điểm nổi bật đầu tiên thì đấy là cái thanh treo rèm này nó không cần khoan. Thế thì cái hình ảnh ảnh bìa này nó sẽ thể hiện bằng cách đấy là cho một cái người phụ nữ họ tự treo cái cái rèm này."},{"l":6,"p":"Phần 1","t":"Thế các bạn thấy thì cái sản phẩm phẩm này không cần khoan. Thế nên là người phụ nữ này thì rất là dễ để mà lắp đặt thôi. Thường là chúng ta hình dung là thường những cái công việc ví dụ lắp đặt thì thường là nam giới thì chúng ta sẽ thành thạo nhiều hơn đúng không?"},{"l":6,"p":"Phần 1","t":"Thế tuy nhiên cái sản phẩm này thì nữ giới cũng hoàn toàn lắp được thì nó sẽ thể hiện được cái việc đấy là cái sản phẩm này nó rất là dễ lắp đặt. Đó thì đấy là cái đầu tiên. Cái đặc điểm nổi bật của sản phẩm này nữa thì đấy là cái khả năng chịu lực của sản phẩm nó rất là tốt."},{"l":6,"p":"Phần 1","t":"Ờ thế thì ở đây thì các bạn có thể thấy là ngay trong hình ảnh này thì nó sẽ là một cái người con gái, một người phụ nữ hay là một người có thể đu chứ tiếp vào trên cái thanh rèm này luôn đúng không? Nó sẽ thể hiện được cái khả năng chịu lực của sản phẩm rất là tốt. Ở một người này khoảng 50 cân mà hoàn toàn có thể chịu được thì một cái rèm thì nó chỉ nặng khoảng 10 15 cân thì nó sẽ không là cái vấn đề gì cả đúng không?"},{"l":6,"p":"Phần 1","t":"Thế nên nó sẽ là hình ảnh hóa được cái đặc điểm nổi bật của sản phẩm. Rồi về cái tiêu chí thứ hai thì một cái ảnh bìa tốt thì nó cần phải tạo được cái ấn tượng cho khách hàng trong 1 giây thôi. Đó thế các bạn nhìn thấy đúng không?"},{"l":6,"p":"Phần 1","t":"Thì cái ở cái ảnh bìa thứ năm đấy các bạn nhìn thấy như thầy nói là một cái anh biến nổi thật nhất ấy thì khách hàng lướt một cái trang Shopee mà thấy rất là nhiều ảnh 20 sản phẩm khác nhau thì chỉ có những cái ảnh nổi bật và khác biệt thì mới khiến họ dừng lại thôi. Và ảnh thì nó sẽ cần sáng này, cần rõ này, cần cái điểm nhấn này đúng không? Và tạo cái sự khác biệt so với những cái shop còn lại."},{"l":6,"p":"Phần 1","t":"Đấy bạn nhìn thấy nó sẽ có cái sự khác biệt nhất định đúng không? Từ cái việc đấy là một người người ta đu lên trên thanh đấy nó cái sự bối cảnh rất là rõ ràng, tạo cái sự ấn tượng đúng không? Bên cạnh đấy thì cái biểu cảm của người nó cũng sẽ phần nào đấy nó cũng sẽ có có cái nhân tình hóa hơn so với những cái sản phẩm khác đúng không?"},{"l":6,"p":"Phần 1","t":"Đó thì cái ảnh đấy nó sẽ có cái sự ấn tượng hơn và nó tạo cái ấn tượng cho khách hàng. Chỉ cần khách hàng ấn tượng thôi thì chúng ta đã có một hơn cái phần trăm chiến thắng trong cái việc là khách hàng bấm vào sản phẩm của chúng ta rồi."},{"l":6,"p":"Phần 1","t":"Rồi và đến cái tiêu chí cuối cùng đấy là cái trải nghiệm nhìn và đọc của khách hàng phải tốt. Thì ở đây chúng ta sẽ có ba cái ví dụ đó là cái trải nghiệm nhìn và đọc của khách hàng hoàn toàn là không tốt. Ví dụ các bạn nhìn vào cái hình ảnh đầu tiên thì đấy là cái bối cảnh thì nó gần như nó không liên quan đến sản phẩm."},{"l":6,"p":"Phần 1","t":"Cái nền nó là vô nghĩa ở đây nó chỉ là một cái nền đen thôi. Thế ở đây thì nó rất là khó để hình dung cái sản phẩm này là cái gì đúng không? Đấy ví dụ như là đây là cái thanh treo rèm nhưng mà ví dụ thầy không nói cho các bạn đây là thanh treo rèm thì các bạn chắc cũng không biết đây là một cái thanh treo rèm đâu đúng không?"},{"l":6,"p":"Phần 1","t":"Nó chỉ là một cái thanh inox thôi. Chúng ta rất là khó hình dung là cái sản phẩm này là cái gì. Đó ở cái ví dụ thứ hai thì cái tex của nó thì rất là nhỏ đúng không?"},{"l":6,"p":"Phần 1","t":"Và nó rất rất nhiều chữ ở trên hình ảnh và gần như là chúng ta mua sắm ở trên Shopee hay là mua sắm ở trên các nền tảng thì gần như là chúng ta sẽ mua sắm ở trên cái thiết bị di động của chúng ta cái điện thoại của chúng ta là nhiều đấy. Nhưng mà chúng ta hình dung là cái điện thoại chúng ta nó cũng chỉ nhỏ như thế này thôi. Và cái chữ mà nó chi tiết mà nó nhiều như thế kia thì gần như là chúng ta sẽ không đọc được."},{"l":6,"p":"Phần 1","t":"Không đọc được thì nó sẽ là vô nghĩa rồi đúng không? Đó thì đấy là cái tiêu chí thứ hai. Và cái tiêu chí cuối cùng thì đấy là cái màu sắc ở trong cái hình ảnh thứ ba này thì nó rất là nhiều cái màu sắc khác nhau."},{"l":6,"p":"Phần 1","t":"Nó tạo cái cảm giác là rất là rối mắt và nó cái cảm giác về cái thị giác cái nó không tốt. Đó. Thế thì các bạn lưu ý là một cái ảnh bìa tốt thì nó sẽ chỉ nên tối đa là ba cái màu thôi. Ưu tiên những cái tông nó nhẹ và sạch và nó dễ nhìn."},{"l":6,"p":"Phần 2","t":"Rồi sau khi mà chúng ta tối ưu cái ảnh bìa xong thì chúng ta sẽ tiếp tục tối ưu những cái hình ảnh bên trong của sản phẩm. Thế thì ảnh ở trên à một cái sản phẩm trên Shopee thì như trước thầy cóòn nói đúng không? Nó sẽ bao gồm chín hình ảnh."},{"l":6,"p":"Phần 2","t":"Chúng ta tối ưu được một cái ảnh bìa rồi thì chúng ta sẽ phải tối ưu những cái ảnh ở bên trong nữa đúng không? Thế ở đây thì sẽ có một số cái lưu ý khi mà các bạn đăng những cái hình ảnh lên trên Shopee. Đầu tiên thì đấy là ảnh thì chúng ta sẽ sử dụng ảnh vuông với tỉ lệ là 1 chia 1."},{"l":6,"p":"Phần 2","t":"Kích thước thì nó sẽ tối nó sẽ khoảng là 500 nhân 500 pixel và code thì nó có thể là 1000 đến 1000 và hiện tại thì Shopee nó có update thêm một cái tỉ lệ khung hình mới cho cái ảnh sản phẩm ở trên Shopee thì đấy là hình ảnh 34 thì các bạn cũng có thể áp dụng thử cái loại tỉ lệ hình ảnh này cho một số cái sản phẩm mà nó cần nhiều cái diện tích ví dụ như là sản phẩm thời trang chẳng hạn ví dụ có người mẫu mặc đứng lên thì nhìn cái hình ảnh 3 ch4 thì nó sẽ tạo ra cái cảm giác nó hài hòa hơn."},{"l":6,"p":"Phần 2","t":"Thứ hai thì ảnh thì không nên copy nên tự chụp và chỉnh sửa và trong ảnh thì đặc biệt là không nên để số điện thoại, website và địa chỉ. Đạo ảnh. Đây là một cái lỗi mà rất là nhiều những cái shop ở trên Shopee mắc phải."},{"l":6,"p":"Phần 2","t":"Thì các bạn lưu ý là chúng ta sẽ không để bất cứ những thông tin liên lạc nào vào trên ảnh. Được chưa? Đây là một cái lỗi vi phạm."},{"l":6,"p":"Phần 2","t":"Và nếu mà chúng ta bị quét thì có thể là cái shop của chúng ta nó sẽ gặp một số những cái ờ phạt cũng như là sẽ bị khóa vân vân."},{"l":6,"p":"Phần 2","t":"Thứ tư thì ảnh thì chúng ta nên để logo vào ảnh để bảo vệ cái bản quyền của bức ảnh. Khuyến khích đăng đầy đủ ảnh và video của lên sản phẩm và ảnh thì không nên để cái chữ Trung Quốc ở dòng đó. Được chưa?"},{"l":6,"p":"Phần 2","t":"Thì đấy là một số cái lưu ý của Shopee họ. nhắc nhở chúng ta trong việc là chúng ta đăng hình ảnh lên trên Shopee. Thế đế ngoài những cái nhắc nhở này thì chúng ta cần phải tối ưu làm sao để cái ảnh này nó có cái khả năng thuyết phục khách hàng tốt hơn đúng không?"},{"l":6,"p":"Phần 2","t":"Ảnh thì nó là một trong những cái yếu tố để khách hàng nhìn vào, khách hàng hiểu cái sản phẩm của chúng ta và khách hàng có hiểu hay không đúng không? Và hiểu được những cái đặc điểm nổi bật cũng như là cái sự tốt của hay là cái sự đẹp của sản phẩm chúng ta thì khách hàng mới đưa ra quyết định mua. Thế làm sao để chúng ta chỉ trong có mấy cái hình ảnh đấy thôi giúp khách hàng hiểu được tất cả những cái gì mà chúng ta muốn chuyên đạt đúng không?"},{"l":6,"p":"Phần 2","t":"Thì ở đây thì trong những cái hình ảnh đấy, trong chính hình ảnh đấy thì chúng ta phải xây dựng được một cái cấu trúc hình ảnh nó ảnh này thì nó gồm nội dung gì, ảnh kia nó gồm nội dung gì đúng không? Thế thì một cái cấu trúc nên có của ảnh sản phẩm đấy là chúng ta sẽ gồm năm cái loại. Đầu tiên đấy là ảnh tổng quan về sản phẩm."},{"l":6,"p":"Phần 2","t":"Thứ hai đấy là ảnh mô tả lợi ích và tính năng chính của sản phẩm. Thứ ba là ảnh so sánh và thể hiện cái USP của sản phẩm. USP thì là viết tắt của UIC selling point."},{"l":6,"p":"Phần 2","t":"Nghĩa là cái điểm đặc biệt của sản phẩm so với những cái sản phẩm khác ở trên thị trường. Ờ ảnh thứ tư đấy là ảnh thể hiện cái ứng dụng thực tế của sản phẩm và cuối cùng đấy là cái loại ảnh thể hiện cái sự cam kết và dịch vụ sau bán hàng cũng như là quá tặng để mà khuyến khích khách hàng dễ dàng đế ra quyết định mùa hơn. Đấy các bạn có thể nhìn vào cái phần bên phải của slide đúng không?"},{"l":6,"p":"Phần 2","t":"Thì đấy là một cái sản phẩm đăng ở trên Shopee thì thầy nghĩ là đây là một cái sản phẩm mà họ tối ưu cái phần hình ảnh rất là tốt. Đó thế thì chúng ta sẽ cùng đi tìm hiểu những cái phần mà họ đã tối ưu như thế nào được đánh giá là tốt. Rồi đầu tiên thì nó sẽ có những cái ảnh mô tả cái lợi ích và tính năng của sản phẩm."},{"l":6,"p":"Phần 2","t":"Đây các bạn có thể nhìn thấy cái phần slide bên tay trái đúng không? Nó sẽ thể hiện những cái tính năng của sản phẩm. Ví dụ như là cái tính năng hẹn giờ này, tính năng nhắc nhở thông minh này, cái tính năng giúp tập trung hiệu quả này, đúng không?"},{"l":6,"p":"Phần 2","t":"Rồi an toàn khi nhìn trực diện này. Đó. Thế ở đây là một cái sản phẩm là một cái đèn học."},{"l":6,"p":"Phần 2","t":"Thế nhưng mà cái đèn học này thì nó sẽ tối hưu hơn các đèn học khác ở đâu? Thế nó sẽ chính được thể hiện bằng những hình ảnh này. Thì các bạn có thể thấy là nó thể hiện một cách rất là trực quan và chúng ta có thể nhìn thấy ngay lập tức sau khi mà nhìn hình ảnh này luôn đúng không?"},{"l":6,"p":"Phần 2","t":"Ờ loại ảnh thứ hai thì đấy là ảnh so sánh và thể hiện cái USB của sản phẩm, nghĩa là cái điểm độc đáo của sản phẩm hơn so với các sản phẩm khác. Đó các bạn có thể nhìn thấy là họ so sánh một cái đèn học thường với cái đèn học của họ đúng không? Thì đèn học thường thì cái công suất thì nó chỉ từ 5 đến 7 7 W thôi rồi nó chiếu sáng thì rất là hẹp."},{"l":6,"p":"Phần 2","t":"Ánh sáng nó mờ và yếu gây chói mỏi mắt vân vân. Tiêu thụ điện thì rất là nhiều. Còn cái đèn học của của cái shop này thì cái công suất nó lớn hơn, phủ sáng nó rộng hơn, ánh sáng thì rất là tự nhiên, dịu mắt, chống cận đúng không?"},{"l":6,"p":"Phần 2","t":"Rồi tiết kiệm điện năng đó nó thể hiện được cái điểm đặc biệt của sản phẩm chúng ta so với cái sản phẩm khác thì nó sẽ tạo cho khách hàng cái cảm giác là muốn ngũ hơn đúng không? Rồi sẽ có những cái hình ảnh thể hiện cái ứng dụng thực tế của sản phẩm. Đó, khi mà cái đèn này được để ở trên bàn học thì nó sẽ nhìn như thế nào, cái khoảng chiếu sáng của nó như thế nào, ánh sáng nó có dịu hay không đúng không?"},{"l":6,"p":"Phần 2","t":"Các bạn có thể nhìn thấy đấy là cái ảnh ảnh thể hiện cái ứng dụng thực tế của sản phẩm. Rồi sẽ có những cái ảnh cam kết về dịch vụ sau bán với quà tặng. Đấy nó sẽ có những cái chính sách độc quyền đúng không?"},{"l":6,"p":"Phần 2","t":"Dùng thử miễn phí 30 ngày bảo hành 12 tháng. Khi mà mua hàng ở trên mạng đúng không? Thường là sẽ khách hàng sẽ có một cái tâm lý là lo sợ sản phẩm nó có được như ý muốn hay không, rồi bảo hành đồ trả như thế nào đúng không?"},{"l":6,"p":"Phần 2","t":"Thì chúng ta phải loại bỏ toàn bộ những cái thắc mắc, những cái nỗi lo trong lòng của khách hàng bằng cái việc là chúng ta cam kết, bằng cái việc là chúng ta đưa ra những cái chính sách, những cái chế độ hậu mãi sau bán đúng không? Để khách hàng yên tâm đưa ra quyết định mua nhanh và dễ dàng hơn. Sau khi mà chúng ta tối ưu về cái ảnh của sản phẩm xong thì chúng ta sẽ đến cái phần tiếp theo đấy là cái mô tả của sản phẩm đúng không? Mô tả của sản phẩm thì nó sẽ nằm ở bên dưới cái phần ảnh của sản phẩm."},{"l":6,"p":"Phần 2","t":"Đấy thì mô tả ở đây thì cũng sẽ có một số cái lưu ý giúp các bạn tối ưu cái phần mô tả tốt hơn. Đầu tiên thì mô tả thì chúng ta sẽ mô tả từ ba cho đến năm dòng cái thông tin quan trọng nhất về sản phẩm."},{"l":6,"p":"Phần 2","t":"Và chúng ta sẽ cần viết cái nội nội dung với cái hình thức là phân đoạn chúng ta tránh cái việc là chúng ta viết liền từ đầu đến cuối chỉ duy nhất một cái đoạn thôi thì khách hàng sẽ rất là khó để nắm bắt được cái nội dung chính là chúng ta muốn truyền tải là gì đúng không nhìn thấy cả một cái đoạn lăn dài vậy thì rất là khó để mà chúng ta đọc hết được chúng ta cần phân đoạn ra mỗi đoạn thì chúng ta sẽ có một ý chính và chúng ta sẽ thể hiện nó bằng cái hình thức là phân đoạn thứ ba thì là chúng ta sẽ không đưa những cái thông tin số điện thoại địa chỉ hoặc là website bằng mô tả sản phẩm thì cái này cũng sẽ là cái phần lưu ý ngoài cái việc hình ảnh thì cái phần mô tả các bạn cũng không được để những phần thông tin vào đây thì đấy chính là cái phần quy định của Shopee rồi mà chúng ta cần phải nắm được."},{"l":6,"p":"Phần 2","t":"Ở bên tay phải này thì các bạn có thể nhìn thấy là một cái phần mô tả thì cũng đã được tối ưu thì họ cũng viết theo hình thức là phân đoạn đúng không?"},{"l":6,"p":"Phần 2","t":"Mỗi đoạn thì sẽ có một cái ý chính đó. Chúng ta nhìn thì nó sẽ không bị quá là ờ mỏi mắt đúng không? Ở một cái đoạn quá là dài."},{"l":6,"p":"Phần 2","t":"Đó thì ví dụ như cái đoạn đầu tiên thì chúng ta nói về cái lợi của sản phẩm này đúng không? Rồi nói về cách sử dụng này, rồi quy cách đồng gói này, rồi cam kết của shop này. Đó thì chúng ta có thể hình dung được."},{"l":6,"p":"Phần 2","t":"về cái sản phẩm này nó tốt hơn. Đó thì đấy là về cái phần mô tả. Rồi bên cạnh đấy thì chúng ta cũng có thể đưa ờ vào cái phần mô tả này một số hashtag đó từ 3 cho 5 hashtag là những cái từ mà liên quan nhất đến cái sản phẩm này."},{"l":6,"p":"Phần 2","t":"Đó các bạn có thể thấy là ở cái đây cũng sẽ là một cái ví dụ ờ về một số cái shop ở Shopee họ đưa những cái hashtag vào để phần nào đấy sẽ giúp cho Shopee nó sẽ nhanh và dễ hiểu được cái sản phẩm của các bạn nó thuộc cái loại sản phẩm gì. Thì đấy thì họ có thể là phân phối cái sản phẩm các bạn tới đúng cái tệch khách hàng hơn. Ờ vừa nãy thì chúng ta cũng nhìn thấy cái phần mô tả của sản phẩm nó có rất là nhiều chữ đúng không?"},{"l":6,"p":"Phần 2","t":"Thì thực ra là ờ chúng ta vẫn cần tối ưu. Thế tuy nhiên thì theo cái hành vi khách hàng hiện nay thì chúng ta cũng có thể thấy là cái việc mà đọc rất là nhiều cái phần tex như vậy thì khách hàng thì rất là lười. Khách hàng thì các bạn hiểu là càng ngày thì sẽ càng lười thôi."},{"l":6,"p":"Phần 2","t":"Và chúng ta làm sao để khách hàng cảm thấy tiện lợi nhất, cảm thấy là chỉ cần bỏ ra ít công sức nhất vẫn có thể hiểu được cái sản phẩm thì là chúng ta cũng đã chiến thắng rồi. Thế là ở cái phần mô tả này thì thì nó cũng đang chuyển dịch dần là cái phần mô tả thì sẽ sử dụng cái ảnh nhiều hơn là sử dụng chữ. Đó."},{"l":6,"p":"Phần 2","t":"Thế nên là ở trong cái phần sản phẩm này nhưng mà thực ra là đó thế thì các bạn có thể thấy là sẽ đang có rất là nhiều brand đang theo cái xu hướng đấy là cái phần mô tả nó sẽ thuần cái phần ảnh nhiều hơn là phần chữ."},{"l":6,"p":"Phần 2","t":"Đấy thì nếu mà các bạn có khả năng số ưu thì chúng ta cũng sẽ làm sao đấy với cái tư duy đấy là khiến khách hàng chỉ cần bỏ ra ít công sức nhất và họ vẫn có thể hoàn toàn hiểu được cái đặc điểm cái điểm tối của sản phẩm chúng ta so với các sản phẩm khác thì đấy là thành công. Được chưa? Rồi đến cái phần tiếp theo trong cái cái quá trình mà chúng ta đăng sản phẩm lên trên Shopee thì đây là một số những cái lỗi khi mà chúng ta đăng sản phẩm và đã được liệt kê lại."},{"l":6,"p":"Phần 2","t":"Thì ở đây thầy sẽ nói qua cho các bạn về những cái lỗi này để các bạn có thể là lưu ý và tránh gặp phải nhá. Lỗi đầu tiên là lỗi tăng giá bán bất hợp lý trước khuyến mãi. Ở đây thì sẽ có một số cách để các bạn có thể tránh vi phạm cái lỗi này."},{"l":6,"p":"Phần 2","t":"Đầu tiên thì các bạn có thể điều chỉnh cái giá khuyến mãi. Chứ đừng điều chỉnh cái giá góc của cái sản phẩm đấy. Được chưa?"},{"l":6,"p":"Phần 2","t":"Ở đây thì để các bạn dễ hình dung hơn thì ví dụ như cái chiếc váy của bạn mà giá gốc là 100.000đ này các bạn khuyến mãi 10% thì cái giá bán là 90.000đ đúng không?"},{"l":6,"p":"Phần 2","t":"Thì khi mà ví dụ các bạn có một cái vấn đề gì đấy nhà cung cấp về tăng giá chẳng hạn thì shop thì các bạn cũng cần tăng giá thế. Tuy nhiên thì shop các bạn thì sẽ giảm cái khuyến mãi xuống còn 5%. Nghĩa là chúng ta vẫn giữ nguyên cái mức giá gốc là 100.000đ nhưng mà chúng ta giảm cái giá khuyến mãi xuống."},{"l":6,"p":"Phần 2","t":"Thế thì cái giá bán này nó vẫn là 95.000 nghĩa nó vẫn tăng lên. Thế thì Tuy nhiên đây là chúng ta giảm cái khuyến mãi khi chúng ta không giảm là gốc được chưa? Thì chúng ta sẽ không bị dính cái lỗi."},{"l":6,"p":"Phần 2","t":"Đấy tức là cái lỗi tăng giá bán hấp vẫn hợp lý. Cái cách thành thứ hai thì đấy là các bạn có thể tăng cái giá gốc của sản phẩm lên. Thì nếu shop mà có cái văn bạc chứng từ chính thức thông báo cái việc tăng giá sản phẩm từ nhà cung cấp thì shop sẽ cần gửi cho Shopee."},{"l":6,"p":"Phần 2","t":"Thì khi đấy thì chúng ta có thể tiến hành là chúng ta tăng cái già gốc này lên mà chúng ta vẫn không bị cái lỗi vi phạm này. Thứ ba là chúng ta chỉ bán ra gốc và không tham gia cái chương trình dưới mãi."},{"l":6,"p":"Phần 2","t":"Đó thế thì vì Ví dụ chiếc váy là 100.000đ mà không tham gia bất cứ cái chương trình mãi nào thì khi mà nhà cung cấp tăng giá thì shop cũng cần tăng giá. Khi đấy thì các bạn tăng lên thì khi không tham gia chương trình thứ mãi thì chúng ta cũng sẽ không bị tính được cái lỗi vi phạm này. Và cuối cùng là nếu mà bất cả tháng thì chúng ta có thể điều chỉnh giá góc ít nhất là trước 7 ngày."},{"l":6,"p":"Phần 2","t":"Thì nếu mà shop chúng ta tăng cái giá gốc và sau 7 ngày mới tham gia chương trình ký đến mãi thì chúng ta vẫn được tính là chúng ta không bị mắc cái lỗi này. Được chưa? Bên cạnh cái lỗi tăng giá sản phẩm bất hợp lý thì chúng ta sẽ có ba cái nhóm vi phạm nữa thì các bạn cũng có thể là chúng ta sẽ nắm được những cái lý do vi phạm này và chúng ta tránh những cái lý do đấy nhá. Đầu tiên thì cái nhóm vi phạm đầu tiên là nhóm về sản phẩm cấm và tin quảng cáo."},{"l":6,"p":"Phần 2","t":"Thì ở đây thì nếu mà chúng ta có những cái sản phẩm cấm này, có những tin quảng cáo hoặc là thông tin gian lận này, những cái sản phẩm chuyển đổi nội dung này hoặc là giảng giá sa lệch này thì đây đều là những cái lý do khiến chúng ta bị đánh cái lỗi đấy là lỗi sản phẩm cấm hoặc là tin quảng cáo. Lỗi thứ hai là lỗi sản phẩm giả nhái và kinh doanh có điều kiện. kiện thì ở đây sẽ có một số lý do ví dụ như là chúng ta kinh doanh hàng giả hàng nhái, ờ hàng vi phạm quyền phân phối hoặc là ngành hàng kinh doanh có điều kiện thì chúng ta cũng đây là những cái lý do khiến chúng ta bị mắc cái lỗi đấy là sản phẩm giải nhái và kinh doanh có điều kiện."},{"l":6,"p":"Phần 2","t":"Lỗi thứ ba thì đấy là lỗi spam và dàn lận. Thì ví dụ như các bạn sử dụng những cái sản phẩm trùng lặp này, giá ảo này hoặc là spam từ khóa gây nhiễu thông tin này thì đây là những cái lý do khiến các bạn bị mắc cái lỗi là spam ra lận. Thì ở đây chúng ta sẽ nắm được những cái lý do và chúng ta sẽ tránh những phần này được nhá."},{"l":6,"p":"Phần 2","t":"Rồi bên cạnh đó thì Shopee cũng sẽ cho chúng ta một số những cái lưu ý khi mà đăng sản phẩm ở một số ngành hàng. Thì ở đây họ ví dụ cho chúng ta bốn ngành hàng. Đầu tiên là mỹ phẩm, thứ hai là nhà cửa đời sống, thứ ba là ngành hàng đồng hồ và cuối cùng là thực phẩm chức năng, vou chờ, dịch vụ hoặc là nhà sách online."},{"l":6,"p":"Phần 2","t":"Thế thì đối với ngành mỹ phẩm thì các bạn cần đầy đủ những cái giấy tờ chứng minh nguồn gốc xuất xứ. Hình ảnh sản phẩm thì phải rõ ràng, mô tả sản phẩm thì phải đầy đủ cái nguồn gốc xuất thứ. Đó, ngành nhà cười đời sống thì cái mô tả sản phẩm thì phải có nguồn gốc xuất thứ và phải có cái hạt sử dụng ở ngành hàng đồng hồ thì mô tả sản phẩm thì phải có cái kích thước mặt này, kích thước dây này, tính năng chóng nước này hay là cái chính sách bảo hành."},{"l":6,"p":"Phần 2","t":"Còn đối với cái ngành hàng cuối cùng thì chúng ta cũng phải cầ cung cấp cái giấy tờ chứng minh là shop có quyền kinh doanh những cái sản phẩm này."},{"l":6,"p":"Phần 2","t":"Đó thì đấy là một số những cái lưu ý thêm giúp chúng ta đảm bảo được cái việc đang sản phẩm nó sẽ diễn ra tốt hơn. Rồi chúng ta sẽ chuyển đến cái phần tiếp theo của nội dung bài học thì đấy là việc sehingting sản phẩm. Thế thì như các bạn có biết đúng không khi mà kinh doanh ở trên các sàn thương mại điện tử ấy thì cái vi Việc là sản phẩm đấy nó có khả năng bán được hàng hay không thì nó sẽ dựa vào rất là nhiều các yếu tố khác nhau đúng không?"},{"l":6,"p":"Phần 2","t":"Và một trong những yếu tố quan trọng đấy là cái sản phẩm đấy họ có cái lượt đánh giá tốt những cái người mua trước các bạn. Kể cả khi mà các bạn mua hàng thì cũng thế thôi đúng không? Chúng ta mua một cái áo, chúng ta mua một cái quần thì thường là chúng ta cũng sẽ bấm vào xem cái phần đánh giá của khách hàng trước và chúng ta xem là cái sản phẩm này nó có thực sự tốt hay không, nó có thực sự như quảng cáo hay không đúng không? Thế là cái việc mà một cái sản phẩm khi mà chúng ta vừa mới đăng lên ấy nó chưa có lượt bán."},{"l":6,"p":"Phần 2","t":"chưa có đánh giá thì đấy cũng sẽ là một cái rào cả để mà khách hàng có thể là ít tin tưởng sản phẩm hơn, ít đưa ra cái quyết định mua nó dễ dàng hơn đúng không? Thế nên là đấy chính là cái việc mà làm sao chúng ta cần đấy là sitting sản phẩm thì sitting và sản phẩm ở đây sẽ là một cách nào đấy đúng không? Chúng ta sẽ ở cái thời gian mới đăng sản phẩm chúng ta sẽ khiến sản phẩm có thêm một chút cái lượt đánh giá này, liệt bán này để sản phẩm nó có cái nhìn tốt hơn đối với khách hàng đúng không?"},{"l":6,"p":"Phần 2","t":"Khách hàng nhìn nó tốt hơn, khách hàng có một số những cái niềm tin hơn về sản phẩm. Rồi đi vào phần khái niệm vai trò thì sản phẩm thì nó đây là một cái hoạt động tạo các đơn hàng và đánh giá ban đầu cho sản phẩm nhằm xây dựng cái độ tin cậy và
